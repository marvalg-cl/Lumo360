th?rows.map(r=>`<div class="line-item"><div><b>${esc(r.productName)}</b><small>${r.qty} ${esc(r.unit)}</small></div><span class="badge ${r.route==='fabricacion'?'mfg':r.route==='compra'?'buy':''}">${r.route==='fabricacion'?'FABRICACIÓN':r.route==='compra'?'COMPRA CALZADA':'RUTA PENDIENTE'}</span><span class="badge">${esc(r.status||'pendiente')}</span></div>`).join(''):'<div class="empty">Aún no existe un expediente de cumplimiento.</div>'}</section><aside class="panel"><h3 class="section-title">Historial de la línea</h3><div class="timeline">${(d.history||[]).slice().reverse().map(e=>`<div class="event"><span class="dot"></span><div><b>${esc(state.stations.find(s=>s.id===e.stage)?.label||e.stage)}</b><br><small>${dateTime(e.at)} · ${esc(e.note||'')}</small></div></div>`).join('')}</div></aside></div><div class="doc-links">${q?`<button class="btn" onclick="openQuote('${id}')">Cotización ${esc(q.folio)} · Neto ${money(q.subtotal)}</button>`:''}${o?`<button class="btn" onclick="openOrder('${id}')">Pedido ${esc(o.folio)}</button>`:''}${rows.length?`<button class="btn petrol" onclick="openFulfillment('${id}')">Abrir cumplimiento</button>`:''}</div></div>`)}
function openNeed(id){const d=state.deals.find(x=>x.id===id);modal(`<div class="modal-head"><h2>Levantar necesidad · ${esc(companyName(d.companyId))}</h2><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="grid2"><div class="field"><label>Necesidad / alcance</label><textarea id="needText" placeholder="Qué necesita el cliente, cantidades, medidas, destino, plazo..."></textarea></div><div class="field"><label>Notas comerciales</label><textarea id="needNotes"></textarea></div></div><div class="notice" style="margin:12px 0">El objetivo es salir de CONTACTAR con información suficiente para cotizar. La venta sigue siendo bajo pedido.</div><button class="btn primary" onclick="saveNeed('${id}')">Guardar necesidad y pasar a COTIZAR</button></div>`)}

function productPickerItems(selectedId='',query=''){
 const q=normalizeSearch(query||'').trim();
 const items=state.products.slice().sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es',{sensitivity:'base'}))
   .filter(p=>!q||normalizeSearch([p.nombre,p.linea,p.familia,p.subfamilia,p.tipoProducto,p.sku].join(' ')).includes(q))
   .slice(0,80);
 return items.map(p=>`<button type="button" class="product-picker-item" onclick="selectQuoteProduct('${p.id}')"><b>${esc(p.nombre)}</b><small>${esc(p.linea||'')} · ${esc(p.familia||'')} ${p.subfamilia?'· '+esc(p.subfamilia):''} · ${esc(p.unidad||'UN')} · ${money(p.precioVenta||0)}</small></button>`).join('')||'<div class="empty">No se encontraron productos.</div>';
}
function quotePickerRow(it,i){const p=state.products.find(x=>x.id===it.productId);const label=p?.nombre||it.productName||'';return `<div class="product-picker"><input data-q="pLabel" data-i="${i}" value="${esc(label)}" placeholder="Escribe para buscar producto…" autocomplete="off" onfocus="showQuoteProductPicker(${i})" oninput="quoteProductInput(${i},this.value)"><input type="hidden" data-q="p" data-i="${i}" value="${esc(it.productId||'')}"><div id="qPicker${i}" class="product-picker-list">${productPickerItems(it.productId,'')}</div></div>`}
function companyPrimaryContact(companyId){
 const c=state.companies.find(x=>x.id===companyId)||{};
 const contacts=state.contacts.filter(x=>(x.companyId||x.empresaId)===companyId);
 return contacts.find(x=>x.id===c.contactoPrincipalId)||contacts[0]||null;
}
function companyContactText(companyId){
 const c=companyPrimaryContact(companyId); if(!c)return '';
 return c.nombre||c.name||'';
}
function companyContactEmail(companyId){
 const c=companyPrimaryContact(companyId);const co=state.companies.find(x=>x.id===companyId)||{};
 return c?.correo||c?.email||co.correo||co.email||'';
}
function companyContactPhone(companyId){
 const c=companyPrimaryContact(companyId);const co=state.companies.find(x=>x.id===companyId)||{};
 return c?.celular||c?.telefono||c?.whatsapp||co.telefono||co.phone||co.whatsapp||'';
}
function companyAddress(companyId){
 const c=state.companies.find(x=>x.id===companyId)||{};
 return [c.direccion,c.comuna||c.ciudad,c.region].filter(Boolean).join(' · ');
}
function companyObras(companyId){
 return state.obras.filter(o=>String(o.companyId||o.empresaId||'')===String(companyId||''))
   .slice().sort((a,b)=>String(a.nombre||a.name||'').localeCompare(String(b.nombre||b.name||''),'es',{sensitivity:'base'}));
}
function quoteClientDetails(companyId){
 const c=state.companies.find(x=>String(x.id)===String(companyId))||{};
 const contact=companyPrimaryContact(companyId);
 const obras=companyObras(companyId);
 const address=[c.direccion,c.comuna||c.ciudad,c.region].filter(Boolean).join(' · ');
 return {company:c,contact,contactName:contact?.nombre||contact?.name||'',cargo:contact?.cargo||'',email:contact?.correo||contact?.email||c.correo||c.email||'',phone:contact?.celular||contact?.telefono||contact?.whatsapp||c.telefono||c.phone||c.whatsapp||'',address,obras};
}
function quoteObraOptions(companyId,selected=''){
 return companyObras(companyId).map(o=>{
   const name=o.nombre||o.name||'Obra';
   const addr=[o.direccion,o.comuna,o.ciudad].filter(Boolean).join(' · ');
   return `<option value="${esc(name)}">${esc(addr||name)}</option>`;
 }).join('');
}
function clientPickerItems(selectedId='',query=''){
 const q=String(query||'').trim().toLocaleLowerCase('es');
 return state.companies.slice().sort((a,b)=>companyName(a.id).localeCompare(companyName(b.id),'es')).filter(c=>{
   const d=quoteClientDetails(c.id),hay=[companyName(c.id),c.rut,c.comuna,c.ciudad,c.nombreFantasia,c.giro,c.direccion,d.contactName,d.email,d.phone].join(' ');

function fillQuoteClientFields(cid,force=true){
 const d=state.deals.find(x=>x.id===window.currentQuoteDealId),info=quoteClientDetails(cid);if(!d)return;
 d.companyId=cid;
 const vals={contact:info.contactName||'',address:info.address||'',email:info.email||'',phone:info.phone||'',rut:info.company?.rut||'',giro:info.company?.giro||''};
 if(force||!String($('#qContact')?.value||'').trim()) $('#qContact').value=vals.contact;
 if(force||!String($('#qClientAddress')?.value||'').trim()) $('#qClientAddress').value=vals.address;
 if(force||!String($('#qClientEmail')?.value||'').trim()) $('#qClientEmail').value=vals.email;
 if(force||!String($('#qClientPhone')?.value||'').trim()) $('#qClientPhone').value=vals.phone;
 if($('#qClientRUT'))$('#qClientRUT').value=vals.rut;
 if($('#qClientGiro'))$('#qClientGiro').value=vals.giro;if($('#qClientCargo'))$('#qClientCargo').value=info.cargo||'';
 const dl=$('#qObrasList');if(dl)dl.innerHTML=quoteObraOptions(cid);
 const obraValue=String($('#qObra')?.value||'').trim();
 if(force&&!obraValue){
   if(info.obras.length===1){
     const o=info.obras[0];
     $('#qObra').value=o.nombre||o.name||[o.direccion,o.comuna,o.ciudad].filter(Boolean).join(' · ')||vals.address;
   }else if(!info.obras.length){
     $('#qObra').value=vals.address;
   }
 }
}
function selectQuoteClient(cid){
 const c=state.companies.find(x=>String(x.id)===String(cid));if(!c)return;
 const hidden=$('#qClient'),label=$('#qClientLabel');
 if(hidden)hidden.value=c.id;
 if(label)label.value=companyName(c.id);
 $('#qClientPicker')?.classList.remove('show');
 fillQuoteClientFields(c.id,true);
 const d=state.deals.find(x=>x.id===window.currentQuoteDealId);
 if(d){
   d.companyId=c.id;
   d.contact=$('#qContact')?.value.trim()||companyContactText(c.id);
   d.clientAddress=$('#qClientAddress')?.value.trim()||companyAddress(c.id);
   d.clientEmail=$('#qClientEmail')?.value.trim()||companyContactEmail(c.id);
   d.clientPhone=$('#qClientPhone')?.value.trim()||companyContactPhone(c.id);
   d.obra=$('#qObra')?.value.trim()||companyAddress(c.id);
   save();
 }
 toast('Cliente seleccionado · datos comerciales completados');
}

function openReceiveLine(productionId){const r=state.production.find(x=>x.id===productionId);if(!r||r.route!=='compra'){toast('Línea de compra no encontrada');return}const po=state.purchaseOrders.find(x=>x.id===r.purchaseOrderId),item=po?.items?.find(x=>x.productionId===productionId),ordered=Number(item?.orderedQty||r.qty||0),received=Number(item?.receivedQty||0);modal(`<div class="modal-head"><h2>Recepcionar · ${esc(r.productName)}</h2><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="grid2"><div class="panel"><small>Pedido</small><b style="display:block;font-size:17px">${ordered} ${esc(r.unit)}</b><small>Recibido</small><b style="display:block;font-size:17px;color:var(--petrol)">${received} ${esc(r.unit)}</b><small>Pendiente</small><b style="display:block;font-size:17px;color:var(--orange)">${Math.max(0,ordered-received)} ${esc(r.unit)}</b></div><div class="field"><label>Cantidad recibida ahora</label><input id="recvQty" type="number" min="0.01" max="${Math.max(0,ordered-received)}" step="any" value="${Math.max(0,ordered-received)}"></div></div><div class="notice" style="margin-top:12px">Puedes recepcionar por partes. La operación no avanzará a entrega hasta completar las cantidades requeridas.</div><button class="btn primary" style="margin-top:12px" onclick="registerReceipt('${productionId}')">Registrar recepción</button></div>`)}
function registerReceipt(productionId){const r=state.production.find(x=>x.id===productionId),po=state.purchaseOrders.find(x=>x.id===r?.purchaseOrderId),item=po?.items?.find(x=>x.productionId===productionId);if(!r||!item)return;const pending=Math.max(0,Number(item.orderedQty||r.qty)-Number(item.receivedQty||0)),qty=Number($('#recvQty')?.value||0);if(qty<=0||qty>pending){toast('Cantidad de recepción inválida');return}item.receivedQty=(Number(item.receivedQty)||0)+qty;r.receivedQty=item.receivedQty;r.status=item.receivedQty>=Number(item.orderedQty||r.qty)?'recibido':'recepción parcial';r.updatedAt=new Date().toISOString();const d=state.deals.find(x=>x.id===r.dealId);if(d)d.history.push({at:r.updatedAt,stage:'cumplir',note:'Recepción '+qty+' '+r.unit+' de '+r.productName+(r.receivedQty>=Number(r.qty)?' · completa':' · parcial')});save();closeModal();openFulfillment(r.dealId);toast(r.receivedQty>=Number(r.qty)?'Recepción completa registrada':'Recepción parcial registrada')}

function normalizeSearch(v){return String(v||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function smartMatches(items,query,label,detail){
 const q=normalizeSearch(query||'').trim();
 const arr=Array.isArray(items)?items.slice():[];
 const score=(x)=>{
   const a=normalizeSearch(label?.(x)||'');
   const b=normalizeSearch(detail?.(x)||'');
   if(!q)return 0;
   if(a===q)return 100;
   if(a.startsWith(q))return 80;
   if(a.includes(q))return 60;
   const hay=(a+' '+b).trim();
   if(hay.includes(q))return 40;
   const tokens=q.split(/\s+/).filter(Boolean);
   return tokens.length&&tokens.every(t=>hay.includes(t))?20:-1;
 };
 return arr.map((x,i)=>({x,i,s:score(x)})).filter(o=>o.s>=0)
   .sort((a,b)=>b.s-a.s||String(label?.(a.x)||'').localeCompare(String(label?.(b.x)||''),'es',{sensitivity:'base'})||a.i-b.i)
   .map(o=>o.x);
}

function saveContact(id){let c=id?state.contacts.find(x=>x.id===id):{id:uid('ct'),estado:'activo'};if(!c)return;const before=id?JSON.parse(JSON.stringify(c)):null;c.nombre=$('#ctNombre').value.trim();c.name=c.nombre;c.companyId=$('#ctCompany').value;c.empresaId=c.companyId;c.cargo=$('#ctCargo').value.trim();c.area=$('#ctArea').value.trim();c.departamento=c.area;c.rolCompra=$('#ctRol').value.trim();c.estado=$('#ctEstado').value;c.correo=$('#ctCorreo').value.trim();c.email=c.correo;c.telefono=$('#ctTelefono').value.trim();c.phone=c.telefono;c.whatsapp=$('#ctWhatsapp').value.trim();c.canalPreferido=$('#ctCanal').value;c.zona=$('#ctZona').value.trim();c.direccion=$('#ctDireccion').value.trim();c.tipo=$('#ctTipo').value;c.roles=$('#ctRoles').value.trim();c.notas=$('#ctNotas').value.trim();if(!id)state.contacts.push(c);if(c.companyId){const co=state.companies.find(x=>x.id===c.companyId);if(co&&!co.contactoPrincipalId)co.contactoPrincipalId=c.id}auditChange(id?'EDITAR CONTACTO':'CREAR CONTACTO',c.id,before,c);save();closeModal();render()}


const LUMOBRAL_MASTER_FAMILIES=['Maderas','Perfiles','Paneles','Cubiertas','Tableros','Revestimientos','Aislación','Tuberías','Albañilería'];

function productModal(id){const p=id?state.products.find(x=>x.id===id):{};const margin=Number(p.margenPct??(p.precioVenta>0?((p.precioVenta-p.costo)/p.precioVenta)*100:0));const famOptions=LUMOBRAL_MASTER_FAMILIES.map(x=>`<option ${String(p.familia||'')===x?'selected':''}>${esc(x)}</option>`).join('');modal(`<div class="modal-head"><div><h2>${id?'Editar':'Nuevo'} producto</h2><span>Maestro comercial LUMOBRAL</span></div><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="master-ficha"><div class="field full"><label>Nombre comercial</label><input id="pName" value="${esc(p.nombre||'')}" placeholder="Nombre completo del producto"></div><div class="field"><label>Familia del máster</label><select id="pFamily"><option value="">Seleccionar familia</option>${famOptions}</select></div><div class="field"><label>Línea</label><input id="pLine" value="${esc(p.linea||p.categoria||'')}" placeholder="Línea / categoría"></div><div class="field"><label>Subfamilia</label><input id="pSubfamily" value="${esc(p.subfamilia||'')}" placeholder="Subfamilia"></div><div class="field"><label>Tipo / especificación</label><input id="pType" value="${esc(p.tipoProducto||'')}" placeholder="Tipo, modelo o especificación"></div><div class="field"><label>Unidad</label><input id="pUnit" value="${esc(p.unidad||'UN')}" placeholder="UN, kg, m, m², ml…"></div><div class="field"><label>Costo neto</label><input id="pCost" type="number" min="0" value="${p.costo||0}" oninput="syncProductEconomics('cost')"></div><div class="field"><label>Margen %</label><input id="pMargin" type="number" min="0" step="0.1" value="${margin.toFixed(1)}" oninput="syncProductEconomics('margin')"></div><div class="field"><label>Precio venta neto</label><input id="pPrice" type="number" min="0" step="1" value="${p.precioVenta||0}" oninput="syncProductEconomics('price')"></div><div class="field full"><label>Descripción técnica</label><textarea id="pDesc" placeholder="Qué es, composición, características principales…">${esc(p.descripcion||'')}</textarea></div><div class="field"><label>Aplicaciones / usos</label><textarea id="pUses" placeholder="Usos, aplicaciones y destino…">${esc(p.usos||'')}</textarea></div><div class="field"><label>Dimensiones / espesores</label><textarea id="pDims" placeholder="Medidas, espesores, largos, densidades…">${esc(p.especificaciones||'')}</textarea></div><div class="field"><label>Normas / referencias</label><textarea id="pNorms" placeholder="Normas, certificaciones o referencias técnicas…">${esc(p.normas||'')}</textarea></div><div class="field"><label>Almacenamiento / transporte</label><textarea id="pStorage" placeholder="Condiciones de almacenamiento y transporte…">${esc(p.almacenamiento||'')}</textarea></div><div class="field"><label>Presentación / bulto</label><input id="pPack" value="${esc(p.presentacion||'')}" placeholder="Cantidad por bulto, pallet, rollo…"></div><div class="field"><label>Peso</label><input id="pWeight" value="${esc(p.peso||'')}" placeholder="Peso unitario o referencia"></div><div class="field full"><label>Observaciones comerciales</label><textarea id="pNotes" placeholder="Información adicional para cotizar y atender al cliente…">${esc(p.observaciones||'')}</textarea></div></div><div class="notice" style="margin-top:12px"><b>Margen y precio son bidireccionales.</b> Puedes ingresar el margen y Lumo360 calculará el precio, o ingresar el precio y calculará el margen sobre el precio de venta.</div><div class="card-actions" style="margin-top:12px"><button class="btn primary" onclick="saveProduct('${id||''}')">Guardar producto</button><button class="btn" onclick="showProductFicha('${id||''}')">Vista de ficha</button></div></div>`)}
function showProductFicha(id){const p=state.products.find(x=>x.id===id);if(!p){toast('Guarda el producto primero para generar su ficha');return}modal(`<div class="modal-head"><div><h2>Ficha comercial · ${esc(p.nombre)}</h2><span>${esc(p.familia||p.linea||'Producto')}</span></div><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="grid2"><div class="panel"><div class="eyebrow">IDENTIFICACIÓN</div><p><b>Familia:</b> ${esc(p.familia||'—')}</p><p><b>Subfamilia:</b> ${esc(p.subfamilia||'—')}</p><p><b>Tipo:</b> ${esc(p.tipoProducto||'—')}</p><p><b>Unidad:</b> ${esc(p.unidad||'UN')}</p></div><div class="panel"><div class="eyebrow">ECONOMÍA</div><p><b>Costo neto:</b> ${money(p.costo)}</p><p><b>Margen:</b> ${Number(p.margenPct||0).toFixed(1)}%</p><p><b>Precio neto:</b> ${money(p.precioVenta)}</p></div></div><div class="panel" style="margin-top:12px"><div class="eyebrow">INFORMACIÓN TÉCNICA</div><p><b>Qué es:</b> ${esc(p.descripcion||'—')}</p><p><b>Usos:</b> ${esc(p.usos||'—')}</p><p><b>Especificaciones:</b> ${esc(p.especificaciones||'—')}</p><p><b>Normas:</b> ${esc(p.normas||'—')}</p><p><b>Almacenamiento:</b> ${esc(p.almacenamiento||'—')}</p><p><b>Presentación:</b> ${esc(p.presentacion||'—')}</p><p><b>Peso:</b> ${esc(p.peso||'—')}</p><p><b>Observaciones:</b> ${esc(p.observaciones||'—')}</p></div></div>`)}

function syncProductEconomics(source){const cost=Number($('#pCost')?.value||0),margin=Number($('#pMargin')?.value||0),price=Number($('#pPrice')?.value||0);if(source==='margin'){const m=Math.min(99.99,Math.max(0,margin));if($('#pPrice'))$('#pPrice').value=cost>0?Math.round(cost/(1-m/100)):0}else if(source==='price'){if($('#pMargin'))$('#pMargin').value=price>0?Math.max(0,((price-cost)/price)*100).toFixed(1):'0.0'}else if(source==='cost'){if($('#pMargin')?.value && Number($('#pMargin').value)>0){const m=Number($('#pMargin').value);if($('#pPrice'))$('#pPrice').value=cost>0?Math.round(cost/(1-m/100)):0}else if(price>0&&$('#pMargin'))$('#pMargin').value=Math.max(0,((price-cost)/price)*100).toFixed(1)}}
function saveProduct(id){
 let p=id?state.products.find(x=>x.id===id):{id:uid('prd')};
 p.nombre=$('#pName').value.trim();p.linea=$('#pLine').value.trim();p.categoria=p.linea;p.familia=$('#pFamily').value.trim();p.subfamilia=$('#pSubfamily').value.trim();p.tipoProducto=$('#pType').value.trim();p.unidad=$('#pUnit').value.trim()||'UN';
 p.costo=Math.max(0,Number($('#pCost').value||0));p.precioVenta=Math.max(0,Number($('#pPrice').value||0));p.margenPct=p.precioVenta>0?Math.max(0,((p.precioVenta-p.costo)/p.precioVenta)*100):0;
 p.descripcion=$('#pDesc')?.value.trim()||'';p.usos=$('#pUses')?.value.trim()||'';p.especificaciones=$('#pDims')?.value.trim()||'';p.normas=$('#pNorms')?.value.trim()||'';p.almacenamiento=$('#pStorage')?.value.trim()||'';p.presentacion=$('#pPack')?.value.trim()||'';p.peso=$('#pWeight')?.value.trim()||'';p.observaciones=$('#pNotes')?.value.trim()||'';
 p.sku=id?canonicalSku(p.sku):nextProductSku(p);delete p.rutaAbastecimiento;
 if(!id)state.products.push(p);state.auditLog.push({id:uid('aud'),at:new Date().toISOString(),action:id?'EDITAR PRODUCTO':'CREAR PRODUCTO',recordId:p.id});save();closeModal();render();
}
function smartPickerOpen(id){const input=$('#'+id+'Input'),list=$('#'+id+'List');if(!input||!list)return;const registry=window.__smartPickers?.[id];if(!registry)return;const matches=smartMatches(registry.items,input.value,registry.label,registry.detail).slice(0,30);list.innerHTML=matches.map(x=>`<button type="button" class="smart-picker-item" onclick="smartPickerSelect('${id}','${esc(x.id)}')"><b>${esc(registry.label(x))}</b><small>${esc(registry.detail?registry.detail(x):'')}</small></button>`).join('')||'<div class="empty">Sin coincidencias</div>';list.hidden=false}
function smartPickerSelect(id,value){const r=window.__smartPickers?.[id],x=r?.items.find(i=>i.id===value);if(!x)return;$('#'+id).value=x.id;$('#'+id+'Input').value=r.label(x);$('#'+id+'List').hidden=true;if(r.onSelect)r.onSelect(x)}
function smartPickerRegister(id,items,label,detail,onSelect){window.__smartPickers=window.__smartPickers||{};window.__smartPickers[id]={items,label,detail,onSelect}}

function showContactFicha(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;const companyId=c.companyId||c.empresaId;const company=companyName(companyId);const deals=state.deals.filter(d=>d.companyId===companyId&&(d.contact===c.nombre||d.contactId===id||!d.contactId));const quotes=state.quotes.filter(q=>deals.some(d=>d.id===q.dealId));const orders=(state.lineOrders||[]).filter(o=>deals.some(d=>d.id===o.dealId));modal(`<div class="modal-head"><div><h2>Ficha contacto · ${esc(c.nombre||c.name||'Contacto')}</h2><span>${esc(company)}</span></div><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body entity-ficha"><div class="ficha-hero"><div><h2>${esc(c.nombre||c.name||'Contacto')}</h2><div>${esc(c.cargo||'Sin cargo')} · ${esc(c.estado||'activo')}</div></div><button class="btn" onclick="closeModal();editContact('${id}')">Editar contacto</button></div><div class="ficha-sections"><section class="ficha-section"><h4>Contacto</h4><div class="ficha-row"><span>Nombre</span><b>${esc(c.nombre||c.name||'—')}</b></div><div class="ficha-row"><span>Cargo / área</span><b>${esc([c.cargo,c.area||c.departamento].filter(Boolean).join(' · ')||'—')}</b></div><div class="ficha-row"><span>Rol de compra</span><b>${esc(c.rolCompra||c.rol||'—')}</b></div><div class="ficha-row"><span>Correo</span><b>${esc(c.correo||c.email||'—')}</b></div><div class="ficha-row"><span>Teléfono</span><b>${esc(c.telefono||c.phone||'—')}</b></div><div class="ficha-row"><span>WhatsApp</span><b>${esc(c.whatsapp||'—')}</b></div><div class="ficha-row"><span>Canal preferido</span><b>${esc(c.canalPreferido||'—')}</b></div><div class="ficha-row"><span>Zona / cobertura</span><b>${esc(c.zona||'—')}</b></div></section><section class="ficha-section"><h4>Empresa</h4><div class="ficha-row"><span>Cliente</span><b>${esc(company)}</b></div><div class="ficha-row"><span>RUT</span><b>${esc(state.companies.find(x=>x.id===companyId)?.rut||'—')}</b></div><div class="ficha-row"><span>Dirección</span><b function renderCompanies(){const arr=sortEs(state.companies,x=>companyName(x.id));const active=arr.filter(x=>(x.estado||'activo')!=='inactivo').length;$('#view').innerHTML=`<div class="hero"><div><div class="eyebrow">CENTRO CRM</div><h1>Clientes</h1><p>Maestro comercial con búsqueda integral, ficha y trazabilidad.</p></div><button class="btn primary" onclick="newCompany()">＋ Nuevo cliente</button></div><div class="module-kpis"><div class="kpi-mini"><b>${arr.length}</b><span>Clientes registrados</span></div><div class="kpi-mini"><b>${active}</b><span>Activos</span></div><div class="kpi-mini"><b>${state.contacts.filter(x=>x.companyId||x.empresaId).length}</b><span>Contactos vinculados</span></div><div class="kpi-mini"><b>${state.deals.filter(x=>x.companyId).length}</b><span>Oportunidades con cliente</span></div></div><div class="toolbar"><div class="search"><input id="companySearch" placeholder="Buscar razón social, fantasía, RUT, giro, comuna, correo, teléfono…" oninput="filterTable('companySearch','companyTable')"></div></div><div class="panel table-wrap"><table class="data" id="companyTable"><thead><tr><th>Cliente</th><th>RUT</th><th>Ubicación</th><th>Giro / clasificación</th><th>Contacto</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${arr.map(c=>`<tr data-open-type="company" data-open="${c.id}" title="Abrir ficha"><td><b>${esc(companyName(c.id))}</b>${c.nombreFantasia?`<div class="master-note">${esc(c.nombreFantasia)}</div>`:''}</td><td>${esc(c.rut||'—')}</td><td>${esc([c.comuna,c.ciudad].filter(Boolean).join(' · ')||'—')}</td><td>${esc([c.giro,c.clasificacion].filter(Boolean).join(' · ')||'—')}</td><td>${esc(c.correo||c.telefono||c.whatsapp||'—')}</td><td><span class="badge">${esc(c.estado||'activo')}</span></td><td><div class="table-actions"><button class="btn" onclick="showCompanyFicha('${c.id}')">Ficha</button><button class="btn" onclick="editCompany('${c.id}')">Editar</button><button class="icon-btn danger" title="Eliminar cliente" aria-label="Eliminar cliente" onclick="deleteCompany('${c.id}')">🗑</button></div></td></tr>`).join('')||`<tr><td colspan="7">${empty('No hay clientes registrados.')}</td></tr>`}</tbody></table></div>`;handleImmediateRows()}
function renderSmartEntities(kind){const q=normalizeSearch($('#'+(kind==='companies'?'companySearch':kind==='contacts'?'contactSearch':kind==='obras'?'obraSearch':'supplierSearch'))?.value||'');let arr=[];if(kind==='companies')arr=smartMatches(state.companies,q,c=>companyName(c.id),c=>[c.razonSocial,c.nombreFantasia,c.rut,c.comuna,c.ciudad,c.region,c.pais,c.giro,c.clasificacion,c.ejecutivo,c.correo,c.telefono,c.whatsapp,c.sitioWeb,c.condicionPago,c.listaPrecio,c.notas].join(' '));if(kind==='contacts')arr=smartMatches(state.contacts,q,c=>c.nombre||c.name||'',c=>[companyName(c.companyId||c.empresaId),c.cargo,c.area,c.departamento,c.rolCompra,c.estado,c.telefono,c.correo,c.whatsapp,c.canalPreferido,c.zona,c.direccion,c.tipo,c.roles,c.notas].join(' '));if(kind==='obras')arr=smartMatches(state.obras,q,c=>c.nombre||c.name||'',c=>[companyName(c.companyId),c.direccion,c.comuna,c.responsable,c.ciudad,c.region,c.estado,c.notas,c.observaciones].join(' '));if(kind==='suppliers')arr=smartMatches(state.suppliers,q,c=>c.nombre||'',c=>[c.nombreFantasia,c.rut,c.giro,c.direccion,c.comuna,c.ciudad,c.region,c.correo,c.correoPago,c.ejecutivoNombre,c.jefaturaNombre,c.condicionPago,c.banco,c.numeroCuenta,c.productosEspecialidad,c.notas].join(' '));const table=kind==='companies'?'companyTable':kind==='contacts'?'contactTable':kind==='obras'?'obraTable':'supplierTable';filterTable(q?null:null,table);}
function renderContacts(){const arr=sortEs(state.contacts,x=>x.nombre||x.name||'');$('#view').innerHTML=`<div class="hero"><div><div class="eyebrow">CENTRO CRM</div><h1>Contactos</h1><p>Directorio de personas vinculadas a clientes, obras y oportunidades.</p></div><button class="btn primary" onclick="newContact()">＋ Nuevo contacto</button></div><div class="toolbar"><div class="search"><input id="contactSearch" placeholder="Buscar nombre, empresa, cargo, área, teléfono, correo, WhatsApp…" oninput="filterTable('contactSearch','contactTable')"></div></div><div class="panel table-wrap"><table class="data" id="contactTable"><thead><tr><th>Contacto</th><th>Empresa / cliente</th><th>Cargo / área</th><th>Rol de compra</th><th>Correo</th><th>Teléfono / WhatsApp</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${arr.map(c=>`<tr data-open-type="contact" data-open="${c.id}" title="Abrir ficha"><td><b>${esc(c.nombre||c.name||'Contacto')}</b><div class="master-note">${esc(c.tipo||'Contacto')}</div></td><td>${esc(companyName(c.companyId||c.empresaId))}</td><td>${esc([c.cargo,c.area||c.departamento].filter(Boolean).join(' · ')||'—')}</td><td>${esc(c.rolCompra||c.rol||'—')}</td><td>${esc(c.correo||c.email||'—')}</td><td>${esc([c.telefono||c.phone,c.whatsapp].filter(Boolean).join(' · ')||'—')}</td><td><span class="badge">${esc(c.estado||'activo')}</span></td><td><div class="table-actions"><button class="btn" onclick="showContactFicha('${c.id}')">Ficha</button><button class="btn" onclick="editContact('${c.id}')">Editar</button><button class="icon-btn danger" title="Eliminar contacto" aria-label="Eliminar contacto" onclick="deleteContact('${c.id}')">🗑</button></div></td></tr>`).join('')||`<tr><td colspan="8">${empty('No hay contactos registrados.')}</td></tr>`}</tbody></table></div>`;handleImmediateRows()}
function renderObras(){const arr=sortEs(state.obras,x=>x.nombre||x.name||'');$('#view').innerHTML=`<div class="hero"><div><div class="eyebrow">CENTRO DE PROYECTOS</div><h1>Obras</h1><p>Maestro de destinos y proyectos asociados a clientes.</p></div><button class="btn primary" onclick="newObra()">＋ Nueva obra</button></div><div class="toolbar"><div class="search"><input id="obraSearch" placeholder="Buscar obra, cliente, dirección, comuna, responsable…" oninput="filterTable('obraSearch','obraTable')"></div></div><div class="panel table-wrap"><table class="data" id="obraTable"><thead><tr><th>Obra</th><th>Cliente</th><th>Ubicación</th><th>Responsable</th><th>Estado</th><th>Actividad</th><th>Acciones</th></tr></thead><tbody>${arr.map(o=>{const deals=state.deals.filter(d=>d.companyId===o.companyId&&(d.obraId===o.id||d.obra===o.nombre));const orders=state.lineOrders.filter(x=>deals.some(d=>d.id===x.dealId));return `<tr data-open-type="obra" data-open="${o.id}" title="Abrir ficha"><td><b>${esc(o.nombre||o.name||'Obra')}</b><div class="master-note">${esc(o.tipo||'Proyecto / destino')}</div></td><td>${esc(companyName(o.companyId))}</td><td>${esc([o.direccion,o.comuna,o.ciudad].filter(Boolean).join(' · ')||'—')}</td><td>${esc(o.responsable||'—')}</td><td><span class="badge">${esc(o.estado||'activa')}</span></td><td>${deals.length} op. · ${orders.length} ped.</td><td><div class="table-actions"><button class="btn" onclick="showObraFicha('${o.id}')">Ficha</button><button class="btn" onclick="editObra('${o.id}')">Editar</button><button class="icon-btn danger" title="Eliminar obra" aria-label="Eliminar obra" onclick="deleteObra('${o.id}')">🗑</button></div></td></tr>`}).join('')||`<tr><td colspan="7">${empty('No hay obras registradas.')}</td></tr>`}</tbody></table></div>`;handleImmediateRows()}
function renderProducts(){const arr=state.products.slice().sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));$('#view').innerHTML=`<div class="hero"><div><div class="eyebrow">MAESTRO COMERCIAL LUMOBRAL</div><h1>Productos</h1><p>Maestro único para cotizar. La estructura conserva línea, familia, subfamilia y tipo del máster comercial.</p></div><button class="btn primary" onclick="productModal()">＋ Nuevo producto</button></div><div class="toolbar"><div class="search"><input id="productSearch" placeholder="Buscar producto, línea, familia, subfamilia o tipo" oninput="filterTable('productSearch','productTable')"></div></div><div class="panel table-wrap product-master-table"><table class="data" id="productTable"><thead><tr><th>Producto</th><th>Clasificación del máster</th><th>Unidad</th><th>Costo</th><th>Margen</th><th>Precio neto</th><th>Acciones</th></tr></thead><tbody>${arr.map(p=>`<tr data-open-type="product" data-open="${p.id}" title="Abrir ficha"><td><b>${esc(p.nombre)}</b><div class="master-note">${esc(displaySku(p.sku||''))}</div></td><td><div class="master-path"><span>${esc(p.linea||p.categoria||'')}</span><span>${esc(p.familia||'')}</span>${p.subfamilia?`<span>${esc(p.subfamilia)}</span>`:''}${p.tipoProducto&&p.tipoProducto!==p.subfamilia?`<span>${esc(p.tipoProducto)}</span>`:''}</div></td><td>${esc(p.unidad||'UN')}</td><td>${money(p.costo)}</td><td>${Number(p.margenPct||0).toFixed(1)}%</td><td>${money(p.precioVenta)}</td><td><div class="table-actions"><button class="btn" onclick="productModal('${p.id}')">Editar</button><button class="btn" onclick="showProductFicha('${p.id}')">Ficha</button><button class="icon-btn danger" title="Eliminar producto" aria-label="Eliminar producto" onclick="deleteProduct('${p.id}')">🗑</button></div></td></tr>`).join('')||`<tr><td colspan="7">${empty('No hay productos registrados.')}</td></tr>`}</tbody></table></div>`;handleImmediateRows()}
function renderSuppliers(){const arr=sortEs((state.suppliers||[]).filter(Boolean),x=>x?.nombre||x?.razonSocial||x?.nombreFantasia||'');$('#view').innerHTML=`<div class="hero"><div><div class="eyebrow">ABASTECIMIENTO</div><h1>Proveedores</h1><p>Maestro integral de proveedores, contactos, condiciones comerciales, despacho y pagos.</p></div><button class="btn primary" onclick="newSupplierV26()">＋ Nuevo proveedor</button></div><div class="toolbar"><div class="search"><input id="supplierSearch" placeholder="Buscar proveedor, fantasía, RUT, giro, contacto, correo, condición…" oninput="filterTable('supplierSearch','supplierTable')"></div></div><div class="panel table-wrap"><table class="data" id="supplierTable"><thead><tr><th>Proveedor</th><th>RUT / giro</th><th>Ubicación</th><th>Responsables</th><th>Condiciones</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${arr.map(s=>{const ventas=supplierContact(s,s.contactoPrincipalId);return `<tr data-open-type="supplier" data-open="${s.id}" title="Abrir ficha"><td><b>${esc(s.nombre||'Proveedor')}</b>${s.nombreFantasia?`<div class="master-note">${esc(s.nombreFantasia)}</div>`:''}</td><td>${esc(s.rut||'—')}<div class="master-note">${esc(s.giro||'—')}</div></td><td>${esc([s.comuna,s.ciudad,s.region].filter(Boolean).join(' · ')||'—')}</td><td>${esc(ventas?.nombre||s.ejecutivoNombre||'—')}<div class="master-note">${esc(s.jefaturaNombre||'Sin jefatura')}</div></td><td>${esc(s.condicionPago||'—')} · ${Number(s.diasPlazoPago||0)} días</td><td><span class="badge">${esc(s.estado||'activo')}</span></td><td><div class="table-actions"><button class="btn" onclick="showSupplierFicha('${s.id}')">Ficha</button><button class="btn" onclick="editSupplierV26('${s.id}')">Editar</button><button class="icon-btn danger" title="Eliminar proveedor" aria-label="Eliminar proveedor" onclick="deleteSupplier('${s.id}')">🗑</button></div></td></tr>`}).join('')||`<tr><td colspan="7">${empty('No hay proveedores registrados.')}</td></tr>`}</tbody></table></div>`;handleImmediateRows()}

function supplierModalV26(id){const s=id?state.suppliers.find(x=>x.id===id):{};if(id&&!s)return;const contacts=state.contacts||[];const opts=(selected='')=>contacts.map(c=>`<option value="${esc(c.id)}" ${String(selected)===String(c.id)?'selected':''}>${esc(c.nombre||c.name||'Contacto')} · ${esc(companyName(c.companyId||c.empresaId))}</option>`).join('');modal(`<div class="modal-head"><div><h2>${id?'Editar':'Nuevo'} proveedor</h2><span>Maestro integral de abastecimiento</span></div><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="master-ficha"><div class="field"><label>Razón social</label><input id="sName" value="${esc(s.nombre||'')}"></div><div class="field"><label>Nombre fantasía</label><input id="sFantasia" value="${esc(s.nombreFantasia||'')}"></div><div class="field"><label>RUT</label><input id="sRut" value="${esc(s.rut||'')}"></div><div class="field"><label>Giro</label><input id="sGiro" value="${esc(s.giro||'')}"></div><div class="field"><label>Dirección</label><input id="sDir" value="${esc(s.direccion||'')}"></div><div class="field"><label>Comuna</label><input id="sComuna" value="${esc(s.comuna||'')}"></div><div class="field"><label>Ciudad</label><input id="sCiudad" value="${esc(s.ciudad||'')}"></div><div class="field"><label>Región</label><input id="sRegion" value="${esc(s.region||'')}"></div><div class="field"><label>Teléfono</label><input id="sTel" value="${esc(s.telefono||'')}"></div><div class="field"><label>Correo</label><input id="sMail" value="${esc(s.correo||'')}"></div><div class="field"><label>Sitio web</label><input id="sWeb" value="${esc(s.sitioWeb||'')}"></div><div class="field"><label>Estado</label><select id="sEstado"><option value="activo" ${s.estado!=='inactivo'?'selected':''}>Activo</option><option value="inactivo" ${s.estado==='inactivo'?'selected':''}>Inactivo</option><option value="bloqueado" ${s.estado==='bloqueado'?'selected':''}>Bloqueado</option></select></div><div class="field"><label>Ejecutivo / ventas</label><input id="sEjecutivo" value="${esc(s.ejecutivoNombre||'')}"></div><div class="field"><label>Jefatura</label><input id="sJefatura" value="${esc(s.jefaturaNombre||'')}"></div><div class="field"><label>Correo jefatura</label><input id="sJefaturaMail" value="${esc(s.jefaturaCorreo||'')}"></div><div class="field"><label>Contacto principal</label><select id="sPrincipal"><option value="">Sin definir</option>${opts(s.contactoPrincipalId)}</select></div><div class="field"><label>Contacto cobranza / pagos</label><select id="sCobranza"><option value="">Sin definir</option>${opts(s.contactoCobranzaId)}</select></div><div class="field"><label>Contacto facturación</label><select id="sFacturacion"><option value="">Sin definir</option>${opts(s.contactoFacturacionId)}</select></div><div class="field"><label>Contacto despacho</label><select id="sDespacho"><option value="">Sin definir</option>${opts(s.contactoDespachoId)}</select></div><div class="field"><label>Banco</label><select id="sBanco"><option value="">Seleccionar</option><option ${s.banco==='Banco de Chile'?'selected':''}>Banco de Chile</option><option ${s.banco==='Santander'?'selected':''}>Santander</option><option ${s.banco==='BCI'?'selected':''}>BCI</option><option ${s.banco==='Scotiabank'?'selected':''}>Scotiabank</option><option ${s.banco==='BancoEstado'?'selected':''}>BancoEstado</option><option>Otro</option></select></div><div class="field"><label>Otro banco</label><input id="sBancoOtro" value="${esc(s.bancoOtro||'')}"></div><div class="field"><label>Tipo de cuenta</label><input id="sTipoCuenta" value="${esc(s.tipoCuenta||'')}"></div><div class="field"><label>Número de cuenta</label><input id="sCuenta" value="${esc(s.numeroCuenta||'')}"></div><div class="field"><label>Titular cuenta</label><input id="sTitular" value="${esc(s.titularCuenta||'')}"></div><div class="field"><label>RUT titular</label><input id="sRutTitular" value="${esc(s.rutTitular||'')}"></div><div class="field"><label>Correo de p oUrl2')">Cargar archivo</button></div><div class="field"><label>Nombre del logotipo secundario</label><input id="cfgLogoLabel2" value="${esc(s.logoLabel2||'')}" placeholder="Opcional"></div></div><div class="logo-preview"><img src="${esc(s.logoUrl||DEFAULT_BRAND_LOGO)}" onerror="this.src=DEFAULT_BRAND_LOGO"><span>El principal se utiliza en la aplicación y en los PDF.</span></div><h3 class="section-title" style="margin-top:18px">Transferencias</h3><div class="grid2"><div class="field"><label>Banco</label><input id="cfgBank" value="${esc(s.bancoTransferencia||'')}"></div><div class="field"><label>Tipo de cuenta</label><input id="cfgType" value="${esc(s.tipoCuentaTransferencia||'')}"></div><div class="field"><label>Número de cuenta</label><input id="cfgAccount" value="${esc(s.numeroCuentaTransferencia||'')}"></div><div class="field"><label>Titular</label><input id="cfgHolder" value="${esc(s.titularCuentaTransferencia||s.razonSocial||'')}"></div><div class="field"><label>RUT titular</label><input id="cfgHolderRut" value="${esc(s.rutTitularTransferencia||s.rut||'')}"></div><div class="field"><label>Correo comprobante</label><input id="cfgPayMail" value="${esc(s.correoPagoTransferencia||s.correo||'')}"></div></div><button class="btn primary" onclick="saveConfig()">Guardar configuración</button></section><section class="panel"><h3 class="section-title">Continuidad, históricos y respaldo</h3><p>Base local: <b>${storageMode==='indexeddb'?'IndexedDB':'modo compatibilidad'}</b></p><p>Último respaldo: <b>${s.lastBackupAt?dateTime(s.lastBackupAt):'No registrado'}</b></p><p>PDF archivados localmente: <b>${(state.pdfArchive||[]).length}</b></p><div class="entity-actions compact-actions config-actions"><button class="btn" onclick="importLegacyMasterFile()">Importar maestro / históricos</button><button class="btn" onclick="exportJSON()">Exportar maestro</button></div><div class="field" style="margin-top:10px"><label>Google OAuth Client ID</label><input id="cfgDriveClient" value="${e function pickLogo(targetId){const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/webp,image/svg+xml';inp.onchange=async()=>{const f=inp.files?.[0];if(!f)return;try{const url=await blobToDataUrl(f);const el=$('#'+targetId);if(el)el.value=url;toast('Logotipo cargado · guarda la configuración')}catch(e){toast('No se pudo cargar el logotipo')}};inp.click()}
function buildOperationalExceptions(){
 const out=[];const push=(p,t,d,a)=>out.push({p,t,d,a});const validCompanyIds=new Set((state.companies||[]).map(c=>String(c.id))),validProductIds=new Set((state.products||[]).map(p=>String(p.id)));
 (state.deals||[]).filter(d=>d.status!=='perdido').forEach(d=>{const stage=stageForDeal(d),q=quoteForDeal(d.id),rows=fulfillmentForDeal(d.id);if(!d.companyId||!validCompanyIds.has(String(d.companyId)))push('ALTA','Oportunidad sin cliente',dealLabel(d),'clientes');if(stage==='cotizar'&&!q)push('ALTA','Cotización pendiente',`${companyName(d.companyId)} · oportunidad sin cotización`,'cotizaciones');if(q&&(q.items||[]).some(i=>!validProductIds.has(String(i.productId))))push('ALTA','Producto inexistente en cotización',q.folio||d.id,'productos');if(stage==='confirmar'&&(!q||q.status!=='aceptada'))push('ALTA','Pedido pendiente de confirmación',`${companyName(d.companyId)} · ${q?.folio||'sin cotización'}`,'cotizaciones');if(stage==='abastecer'&&rows.some(r=>!r.route))push('ALTA','Línea sin ruta',`${q?.folio||d.id} · definir compra o fabricación`,'abastecimiento');if(stage==='abastecer'&&rows.some(r=>r.route==='compra'&&!r.providerId))push('MEDIA','Compra sin proveedor',q?.folio||d.id,'proveedores');if(stage==='cumplir'&&rows.some(r=>r.route==='compra'&&!r.purchaseOrderId))push('MEDIA','Compra sin OC',q?.folio||d.id,'abastecimiento');if(stage==='entregar'&&rows.some(r=>!['listo','recibido','fabricado','completo'].includes(r.status)))push('ALTA','Entrega bloqueada',`${companyName(d.companyId)} · hay líneas no listas`,'linea');if(stage==='cerrar'){const f=(state.facturas||[]).find(x=>x.dealId===d.id);if(!f)push('MEDIA','Cierre sin facturación',companyName(d.companyId),'finanzas');else if(f.estado!=='pagada')push('MEDIA','Cobranza pendiente',`${f.folio||'Factura'} · ${companyName(d.companyId)}`,'finanzas');}});
 (state.products||[]).forEach(p=>{if(!String(p.nombre||'').trim())push('MEDIA','Producto sin nombre',p.id,'productos');if(Number(p.costo||0)<0||Number(p.precioVenta||0)<0)push('ALTA','Producto con valor inválido',p.nombre||p.id,'productos');if(Number(p.precioVenta||0)>0&&Number(p.costo||0)>Number(p.precioVenta||0))push('MEDIA','Margen negativo',p.nombre||p.id,'productos');});
 (state.companies||[]).forEach(c=>{if(!String(c.rut||'').trim())push('MEDIA','Cliente sin RUT',companyName(c.id),'clientes');});
 (state.quotes||[]).forEach(q=>{if(!q.dealId||!state.deals.some(d=>d.id===q.dealId))push('ALTA','Cotización huérfana',q.folio||q.id,'cotizaciones');if(!(q.items||[]).length)push('MEDIA','Cotización sin líneas',q.folio||q.id,'cotizaciones');});return out;
}
function downloadTextFile(filename,text,type='application/json'){
 const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
}

 const payload=localBackupPayload(),stamp=new Date().toISOString().replace(/[:.]/g,'-'),name=`Lumo360-backup-${stamp}.json`;
 const token=state.settings?.driveAccessToken;
 if(!token){downloadTextFile(name,payload);state.settings.lastBackupAt=new Date().toISOString();persistNow();toast('Respaldo local descargado');return}
 try{
   const boundary='lumo360_'+Math.random().toString(36).slice(2);

function auditFunctionSurface(){
 const html=document.documentElement.outerHTML;
 const defs=new Set(Array.from(html.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g),m=>m[1]));
 const missing=[];
 for(const m of html.matchAll(/onclick="([^"]+)"/g)){
   for(const f of m[1].matchAll(/\b([A-Za-z_$][\w$]*)\s*\(/g)){
     const n=f[1];if(['confirm','prompt','setTimeout','nav','reload','stopPropagation'].includes(n))continue;if(!defs.has(n))missing.push(n)
   }
 }
 return [...new Set(missing)];
}

 normalizeArchivedPdfNames();
 const views=['control','reinvention','linea','cotizaciones','pedidos','abastecimiento','clientes','contactos','obras','productos','proveedores','comparador','inventario','documentos','finanzas','config'];
 const renderMap={control:'renderControl360',reinvention:'renderReinvention360',linea:'renderLine',cotizaciones:'renderQuotes',pedidos:'renderPedidos',abastecimiento:'renderAbastecimiento',clientes:'renderCompanies',contactos:'renderContacts',obras:'renderObras',productos:'renderProducts',proveedores:'renderSuppliers',comparador:'renderRFQ',inventario:'renderInventory',documentos:'renderDocs',finanzas:'renderFinance',config:'renderConfig'};
 views.forEach(v=>{if(typeof window[renderMap[v]]!=='function')issues.push('Módulo sin cargador: '+v)});
 if(typeof smartMatches!=='function')issues.push('Buscador integral no disponible');
 if(typeof buildQuotePdf!=='function')issues.push('Generador PDF no disponible');
 ['supplierName','openFulfillment','openLineComparison','openOrder','showObraFicha','showSupplierFicha','deleteComparison','renderFinance'].forEach(fn=>{if(typeof window[fn]!=='function')issues.push('Dependencia crítica ausente: '+fn)});
 if(typeof quoteClientInput!=='function'||typeof quoteProductInput!=='function')issues.push('Buscadores del cotizador incompletos');
 const validCompanyIds=new Set(state.companies.map(c=>String(c.id)));
 const validProductIds=new Set(state.products.map(p=>String(p.id)));
 const seenSkus=new Set();
 state.products.forEach(p=>{
   p.sku=canonicalSku(p.sku);
   if(p.sku&&seenSkus.has(p.sku))issues.push('SKU duplicado: '+p.sku);
   if(p.sku)seenSkus.add(p.sku);
   const c=Number(p.costo)||0,pr=Number(p.precioVenta)||0;
   if(c<0||pr<0)issues.push('Valor negativo en producto: '+(p.nombre||p.id));
   p.margenPct=pr>0?Math.max(0,((pr-c)/pr)*100):0;
 });
 state.deals.forEach(d=>{
   if(d.companyId&&!validCompanyIds.has(String(d.companyId)))issues.push('Oportunidad sin cliente válido: '+(d.id||''));
 });
 state.quotes.forEach(q=>{
   const d=state.deals.find(x=>x.id===q.dealId);
   if(!d)issues.push('Cotización huérfana: '+(q.folio||q.id));
   if((q.items||[]).some(i=>i.productId&&!validProductIds.has(String(i.productId))))issues.push('Producto inexistente en '+(q.folio||q.id));
   delete q.discount;
 });
 state.settings.enterpriseVersion='V123-PRODUCCION';
 return issues;
}
