/* LUMO360 PREMIUM v2 · responsive hardening: no overlapping cards, buttons or tables */
.card,.kpi,.quick,.tablewrap,.sheet,.quote-card,.metric,.row{min-width:0;max-width:100%;}
.actions{min-width:0;max-width:100%;align-items:center;}
.actions .btn{flex:0 1 auto;min-width:0;white-space:nowrap;}
.quote-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;}
.quote-card-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;min-width:0;}
.quote-card-main{min-width:0;flex:1;}
.quote-card-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quote-card-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:11px;margin-top:5px;}
.quote-card-total{font-size:20px;font-weight:900;white-space:nowrap;}
.quote-card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid #ECEEEF;}
.quote-card-actions .btn{height:36px;font-size:11px;padding:0 10px;}
.quote-primary-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;}
.quote-primary-actions .btn{min-width:0;}
.action-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;}
.action-menu .btn{width:100%;text-align:left;justify-content:flex-start;height:44px;}
.sheet .actions{flex-wrap:wrap;}
.sheet .actions .btn{max-width:100%;}
@media(max-width:900px){
  .content{padding:14px 12px calc(100px + env(safe-area-inset-bottom));overflow-x:hidden;}
  .page-head{display:block;margin-bottom:14px;}
  .page-head .actions{display:flex;margin-top:12px;}
  .page-head .actions .btn{flex:1 1 140px;}
  .cards,.quickgrid,.grid2,.grid3{grid-template-columns:1fr;}
  .cards{gap:9px;}
  .card{padding:14px;border-radius:15px;}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table{min-width:680px;}
  .searchbar{position:relative;display:flex;flex-wrap:wrap;}
  .searchbar input{min-width:0;flex:1 1 220px;}
  .searchbar .btn{flex:0 0 auto;}
  .quote-card-top{display:block;}
  .quote-card-total{margin-top:10px;}
  .quote-card-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .quote-card-actions .btn{width:100%;overflow:hidden;text-overflow:ellipsis;}
  .quote-primary-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .quote-primary-actions .btn{width:100%;}
  .metric-row{gap:7px;}
  .metric{overflow:hidden;}
  .metric b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .formgrid{gap:10px;}
  .quote-line{grid-template-columns:minmax(0,1fr) 64px 100px 38px;gap:6px;}
  .quote-line .line-total{display:none;}
  .quote-line .btn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sheet{width:100%;max-height:94vh;border-radius:20px 20px 0 0;padding:14px;overflow-x:hidden;}
  .sheet.large{width:100%;}
  .sheet-head{top:-14px;}
  .sheet-head h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .overlay{align-items:flex-end;}
  .action-menu{grid-template-columns:1fr;}
}
@media(max-width:420px){
  .top{padding:0 9px;gap:6px;}

  h1{font-size:24px;}

function canonicalCategoryCode(category){
 const map={'ACEROS':'ACE','AISLACION':'AIS','ALBANILERIA':'ALB','CEMENTOS Y ARIDOS':'CEM','CUBIERTAS Y CIERRES':'CUB','FIJACIONES':'FIJ','IMPERMEABILIZACION':'IMP','MADERAS':'MAD','METALCON':'MET','OTROS':'OTR','PERFILES ESTRUCTURALES':'PES','PERFILES LAMINADOS':'PEL','PLACAS Y REVESTIMIENTOS':'PLR','SANITARIO':'SAN','TUBEST':'TUB'};

 const w=c.replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean).filter(z=>!['DE','DEL','LA','LAS','LOS','Y','EN'].includes(z));
 return (w.map(z=>z[0]).join('').slice(0,3)||c.replace(/[^A-Z0-9]/g,'').slice(0,3)||'OTR').padEnd(3,'X').slice(0,3);
}
function canonicalFamilyCode(category,family,products){

 const counts={}; (products||[]).forEach(p=>{if(String(p.categoria||'').toUpperCase()!==c||String(p.familia||'').toUpperCase()!==f)return; const m=String(p.sku||'').replace(/^LB-/i,'').toUpperCase().match(/^[A-Z0-9]{3}-([A-Z0-9]{2})-\d{3}$/); if(m)counts[m[1]]=(counts[m[1]]||0)+1});

 const ks=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b)); if(ks[0])return ks[0];

 return (w.map(z=>z[0]).join('').slice(0,2)||f.replace(/[^A-Z0-9]/g,'').slice(0,2)||'OT').padEnd(2,'X').slice(0,2);

function nextProductSKU(category,family,excludeId=''){

function svgIcon(name){const p={eye:'<circle cx="12" cy="12" r="3"></circle><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12"></path>',pdf:'<path d="M6 2h8l4 4v16H6z"></path><path d="M14 2v5h5"></path><path d="M8 15h8M8 18h6"></path>',share:'<path d="M14 5l5 5-5 5"></path><path d="M19 10H8a5 5 0 0 0-5 5v4"></path>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13 6l4 4"></path>',check:'<path d="M20 6L9 17l-5-5"></path>',cart:'<path d="M3 4h2l2 11h10l3-8H6"></path><circle cx="9" cy="19" r="1.5"></circle><circle cx="18" cy="19" r="1.5"></circle>',more:'<circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle>',print:'<path d="M6 9V3h12v6"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v7H6z"></path>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path>',copy:'<rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>',truck:'<path d="M3 6h11v10H3z"></path><path d="M14 10h4l3 3v3h-7z"></path><circle cx="7" cy="18" r="2"></circle><circle cx="18" cy="18" r="2"></circle>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${p[name]||p.more}</svg>`}
function iconBtn(a,name,label,id='',type='',cls=''){return `<button class="icon-action ${cls}" data-action="${a}" data-id="${esc(id)}" data-type="${esc(type)}" title="${esc(label)}" aria-label="${esc(label)}">${svgIcon(name)}</button>`}
function quoteMore(id){const q=quoteData(id);if(!q)return;document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><h2>${esc(q.folio)} · Más acciones</h2><button class="iconbtn" data-action="closeModal">×</button></div><div class="compact-action-menu">${iconBtn('printQuote','print','Imprimir / Guardar PDF',id,'quote','menu-icon')} ${iconBtn('emailQuote','mail','Enviar por correo',id,'quote','menu-icon')} ${iconBtn('duplicateQuote','copy','Duplicar cotización',id,'quote','menu-icon')} ${q.estado!=='convertida_pedido'?iconBtn('acceptQuote','check','Aceptar cotización',id,'quote','menu-icon'):''}</div></div></div>`;wireModal()}
function searchInput(ph){return `<div class="searchbar live-search-toolbar"><div class="master-search-wrap" style="flex:1;position:relative"><input id="pageSearch" data-live-search="1" placeholder="${esc(ph)}" value="${esc(S.query)}" autocomplete="off" inputmode="search"><span class="search-mini">⌕</span></div><button class="btn" data-action="openGlobal">Buscar todo</button></div>`}
function views(){return {}}
views.home=()=>{
 const qs=D.quotes||[], os=D.orders||[], pos=D.purchases||[], rs=D.requests||[], inv=D.invoices||[], pays=D.payments||[];
 const accepted=qs.filter(q=>['aceptada','convertida_pedido'].includes(norm(q.estado)));
 const pendingOrders=os.filter(o=>o.estado!=='entregado');
 const pendingPO=pos.filter(p=>!['recibida','anulada'].includes(norm(p.estado)));
 const low=list('product').filter(p=>n(p.stock)<=n(p.stockMinimo)&&n(p.stockMinimo)>0);
 const outstanding=inv.reduce((s,i)=>s+Math.max(0,n(i.total)-n(i.paid)),0);
 const overdue=inv.filter(i=>n(i.dueAt)&&new Date(i.dueAt)<new Date()&&n(i.paid)<n(i.total));
 return pageHead('LUMO360','Centro de mando','La operación completa, resumida en una sola pantalla.',`<button class="btn signal" data-action="newQuote">＋ Nueva cotización</button>`)+
 `<div class="finance-grid">
 <button class="kpi metric-link" data-nav="quotes"><small>Cotizaciones abiertas</small><b>${qs.filter(q=>!['convertida_pedido','rechazada'].includes(norm(q.estado))).length}</b><span class="meta">${accepted.length} aceptadas</span></button>
 <button class="kpi metric-link" data-nav="orders"><small>Pedidos pendientes</small><b>${pendingOrders.length}</b><span class="meta">${os.length} en total</span></button>
 <button class="kpi metric-link" data-nav="inventory"><small>Alertas de stock</small><b>${low.length}</b><span class="meta">Revisar abastecimiento</span></button>
 <button class="kpi metric-link" data-nav="finance"><small>Por cobrar</small><b>${money(outstanding)}</b><span class="meta">${overdue.length} vencidas</span></button>
 </div>
 <div class="section report-grid">
  <div class="card"><div class="split"><div><div class="eyebrow">Operación</div><h2 style="margin:3px 0">Qué requiere atención</h2></div><span class="badge">Tiempo real local</span></div>
   <div class="alert-list">
    ${low.slice(0,5).map(p=>`<div class="alert-item"><i class="alert-dot"></i><div><b>Stock bajo · ${esc(p.nombre)}</b><div class="meta">${fmtNum(p.stock)} disponibles · mínimo ${fmtNum(p.stockMinimo)}</div></div></div>`).join('')}
    ${pendingOrders.slice(0,5).map(o=>`<div class="alert-item"><i class="alert-dot"></i><div><b>Pedido pendiente · ${esc(o.folio)}</b><div class="meta">${esc(companyName(o.companyId))} · ${esc((o.estado||'').replaceAll('_',' '))}</div></div></div>`).join('')}
    ${pendingPO.slice(0,4).map(p=>`<div class="alert-item"><i class="alert-dot"></i><div><b>Compra pendiente · ${esc(p.folio)}</b><div class="meta">${esc(supplierName(p.supplierId)||'Proveedor')} · ${money(p.total)}</div></div></div>`).join('')}
    ${overdue.slice(0,4).map(i=>`<div class="alert-item"><i class="alert-dot"></i><div><b>Cobranza vencida · ${esc(i.folio)}</b><div class="meta">${esc(companyName(i.companyId))} · pendiente ${money(Math.max(0,n(i.total)-n(i.paid)))}</div></div></div>`).join('')}
    ${!low.length&&!pendingOrders.length&&!pendingPO.length&&!overdue.length?'<div class="empty">No hay alertas críticas. La operación está al día.</div>':''}
   </div>
  </div>
  <div class="card"><div class="eyebrow">Flujo</div><h2 style="margin:3px 0 14px">Embudo operativo</h2>
   ${[['Cotizaciones',qs.length,'quotes'],['Aceptadas',accepted.length,'quotes'],['Pedidos',os.length,'orders'],['Compras',pos.length,'purchases'],['Solicitudes',rs.length,'requests'],['Facturación',inv.length,'finance']].map((x,i)=>`<button class="row" data-nav="${x[2]}" style="border:0;background:#fff;width:100%;text-align:left"><div class="avatar">${x[1]}</div><div class="row-main"><b>${x[0]}</b><div class="meta">Etapa ${i+1} del circuito</div></div><span>›</span></button>`).join('')}
  </div>
 </div>
 <div class="section card"><div class="split"><div><div class="eyebrow">Acciones rápidas</div><h2 style="margin:3px 0">Trabajar</h2></div></div><div class="finance-actions">${btn('newQuote','＋ Cotizar')}${btn('newPurchase','＋ Orden de compra')}${btn('newRequest','＋ Solicitar a proveedor')}${btn('inventoryMove','＋ Movimiento stock')}${btn('newInvoice','＋ Facturar')}</div></div>`
}

function masterMeta(type,x){
 if(type==='company')return [x.rut,x.comuna||x.ciudad,x.giro].filter(Boolean).join(' · ')||'Sin datos complementarios';
 if(type==='contact')return [x.cargo,companyName(x.companyId),x.email].filter(Boolean).join(' · ')||'Sin datos complementarios';
 if(type==='work')return [x.codigo,companyName(x.companyId),x.estado].filter(Boolean).join(' · ')||'Sin datos complementarios';
 if(type==='product')return [x.sku,x.marca,x.familia||x.linea,x.unidad||'UN'].filter(Boolean).join(' · ')||'Sin clasificación';
 if(type==='supplier')return [x.rut,x.codigo,x.giro].filter(Boolean).join(' · ')||'Sin datos complementarios';
 return '';
}
function masterSearchFields(type,x){return norm([fields(type,x),x.email,x.telefono,x.nombreFantasia,x.nombre,x.razonSocial,x.sku,x.codigoBarras,x.marca,x.familia,x.linea,x.subfamilia,x.tipoProducto,x.categoria].filter(Boolean).join(' '));}
function masterRow(type,x){
 const name=label(type,x)||'Sin nombre';
 let side='';
 if(type==='product'){
   const low=n(x.stockMinimo)>0&&n(x.stock)<=n(x.stockMinimo); side=`<div class="master-side"><b>${money(x.precioVenta||0)}</b><small class="${low?'product-stock-low':'product-stock-ok'}">Stock ${fmtNum(x.stock||0)}${n(x.stockMinimo)>0?' · mín. '+fmtNum(x.stockMinimo):''}</small></div>`;
 } else if(type==='company') side=`<div class="master-side"><b>${money((D.quotes||[]).filter(q=>q.companyId===x.id).reduce((s,q)=>s+n(q.total),0))}</b><small>cotizado</small></div>`;
 else if(type==='supplier') side=`<div class="master-side"><b>${(D.purchases||[]).filter(p=>p.supplierId===x.id).length}</b><small>OC</small></div>`;
 else side=`<div class="master-side"><small>${esc(x.estado||'')}</small></div>`;
 return `<div class="master-row" data-master-row data-search="${esc(masterSearchFields(type,x))}"><div class="master-avatar">${esc(initials(name))}</div><button type="button" class="master-main" style="border:0;background:transparent;padding:0;text-align:left;min-width:0" data-action="detail" data-id="${esc(x.id)}" data-type="${esc(type)}"><b>${esc(name)}</b><div class="meta">${esc(masterMeta(type,x))}</div></button>${side}<div class="master-actions">${iconBtn('detail','eye','Abrir ficha',x.id,type)}${iconBtn('editEntity','edit','Editar',x.id,type)}</div></div>`;
}
function entityPage(type,k,h,desc,create){
 const arr=list(type), labelPlural=type==='product'?'productos':type==='company'?'clientes':type==='supplier'?'proveedores':type==='contact'?'contactos':'obras';
 return pageHead(k,h,desc,`<button class="btn signal" data-action="${create}">＋ Nuevo</button>`)+
 `<div class="master-toolbar"><div class="master-search-wrap"><input id="masterSearch" placeholder="Buscar ${labelPlural} por nombre, SKU, código, marca…" autocomplete="off"><span class="search-mini">⌕</span></div><span class="master-count" id="masterCount">${arr.length} registros</span></div>`+
 (type==='product'?`<div class="master-filterbar"><button class="active" data-master-filter="all">Todos</button><button data-master-filter="stock">Con stock</button><button data-master-filter="low">Stock bajo</button><button data-master-filter="zero">Sin stock</button></div>`:'')+
 `<div class="master-section-head"><h3>${esc(arr.length)} ${labelPlural}</h3><span class="badge">A–Z</span></div><div class="master-list" id="masterList">${arr.map(x=>masterRow(type,x)).join('')||'<div class="master-empty">No hay registros.</div>'}</div>`;
}
function wireMasterSearch(){
 const input=document.getElementById('masterSearch'),listEl=document.getElementById('masterList'),count=document.getElementById('masterCount'); if(!input||!listEl)return;
 const rows=[...listEl.querySelectorAll('[data-master-row]')]; let mode='all';
 const apply=()=>{const q=norm(input.value);let shown=0;rows.forEach(r=>{const okQ=!q||r.dataset.search.includes(q);const productMode=!r.dataset.search?'all':mode;let okM=true;if(document.querySelector('[data-master-filter]')){const txt=r.innerText||'';if(mode==='stock')okM=/Stock\s+(?!0(?:[\s·]|$))/.test(txt);if(mode==='zero')okM=/Stock\s+0(?:[\s·]|$)/.test(txt);if(mode==='low')okM=/Stock bajo|mín\./.test(txt)}const ok=okQ&&okM;r.style.display=ok?'grid':'none';if(ok)shown++});if(count)count.textContent=`${shown} de ${rows.length} registros`};
 input.oninput=apply;
 document.querySelectorAll('[data-master-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-master-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.masterFilter;apply()});
}

ass="doc-note"><b>Nuevo formato</b><div class="meta">Logo LUMOBRAL, acento naranja internacional, gris señal, bloques informativos y mejor jerarquía visual.</div></div></div></div><div class="section"><div class="compact-list">${qs.map(quoteCard).join('')||'<div class="empty">No hay cotizaciones todavía.</div>'}</div></div>`};

views.finance=()=>{const inv=D.invoices||[],pays=D.payments||[],orders=D.orders||[];const total=inv.reduce((s,i)=>s+n(i.total),0),paid=inv.reduce((s,i)=>s+n(i.paid),0),due=Math.max(0,total-paid),over=inv.filter(i=>n(i.dueAt)&&new Date(i.dueAt)<new Date()&&n(i.paid)<n(i.total));return pageHead('FINANZAS','Cuentas por cobrar','Facturación interna, pagos parciales, vencimientos y trazabilidad por pedido.',`<button class="btn signal" data-action="newInvoice">＋ Nueva factura</button>`)+`<div class="finance-grid"><div class="kpi"><small>Facturado</small><b>${money(total)}</b></div><div class="kpi"><small>Pagado</small><b>${money(paid)}</b></div><div class="kpi"><small>Por cobrar</small><b>${money(due)}</b></div><div class="kpi"><small>Vencido</small><b>${money(over.reduce((s,i)=>s+Math.max(0,n(i.total)-n(i.paid)),0))}</b></div></div><div class="section card"><div class="split"><h3>Documentos de cobro</h3><span class="badge">${inv.length} documentos</span></div><div class="finance-list">${inv.map(i=>{const rem=Math.max(0,n(i.total)-n(i.paid)),pct=i.total?Math.min(100,i.paid/i.total*100):0;return `<div class="finance-row"><div><b>${esc(i.folio)}</b><div class="meta">${esc(companyName(i.companyId))} · ${esc(i.orderFolio||'Sin pedido')}</div></div><div class="finance-secondary"><div class="mini-progress"><i style="width:${pct}%"></i></div><div class="inline-note">${money(i.paid)} pagado de ${money(i.total)}</div></div><div class="amount ${rem>0&&i.dueAt&&new Date(i.dueAt)<new Date()?'overdue':''}">${money(rem)}</div><div class="finance-actions">${rem>0?iconBtn('payInvoice','check','Registrar pago',i.id):''}${iconBtn('detail','eye','Ver factura',i.id,'invoice')}</div></div>`}).join('')||'<div class="empty">Aún no hay facturas. Puedes generarlas desde un pedido.</div>'}</div></div><div class="section card"><h3>Últimos pagos</h3>${pays.slice().reverse().slice(0,12).map(x=>`<div class="row"><div class="row-main"><b>${esc(x.folio||'Pago')}</b><div class="meta">${esc(x.invoiceFolio views.control=()=>{const qs=D.quotes||[],os=D.orders||[],ps=D.purchases||[],rs=D.requests||[],low=list('product').filter(p=>n(p.stock)<=n(p.stockMinimo)&&n(p.stockMinimo)>0), inv=D.invoices||[];return pageHead('GESTIÓN','Control de gestión','Una lectura rápida de riesgos, cuellos de botella y cumplimiento operativo.')+`<div class="finance-grid"><div class="kpi"><small>Conversión cotizaciones</small><b>${qs.length?Math.round(qs.filter(q=>['aceptada','convertida_pedido'].includes(norm(q.estado))).length/qs.length*100):0}%</b></div><div class="kpi"><small>Pedidos abiertos</small><b>${os.filter(o=>o.estado!=='entregado').length}</b></div><div class="kpi"><small>Compras abiertas</small><b>${ps.filter(p=>!['recibida','anulada'].includes(norm(p.estado))).length}</b></div><div class="kpi"><small>Solicitudes en proceso</small><b>${rs.filter(r=>!['cerrada','adjudicada'].includes(norm(r.estado))).length}</b></div></div><div class="section report-grid"><div class="card"><h3>Riesgos operativos</h3><div class="alert-list">${low.slice(0,8).map(p=>`<div class="alert-item"><i class="alert-dot"></i><div><b>Stock bajo: ${esc(p.nombre)}</b><div class="meta">${fmtNum(p.stock)} / mínimo ${fmtNum(p.stockMinimo)}</div></div></div>`).join('')||'<div class="empty">Sin alertas de stock.</div>'}</div></div><div class="card"><h3>Seguimiento</h3>${[['Cotizaciones sin aceptar',qs.filter(q=>!['aceptada','convertida_pedido','rechazada'].includes(norm(q.estado))).length],['Pedidos no entregados',os.filter(o=>o.estado!=='entregado').length],['OC pendientes',ps.filter(p=>!['recibida','anulada'].includes(norm(p.estado))).length],['Cobros pendientes',inv.filter(i=>n(i.paid)<n(i.total)).length]].map(x=>`<div class="row"><div class="row-main"><b>${x[0]}</b></div><span class="badge ${x[1]?'amber':'green'}">${x[1]}</span></div>`).join('')}</div></div>`};
views.reports=()=>{const qs=D.quotes||[],os=D.orders||[],items={};qs.forEach(q=>(q.items||[]).forEach(i=>{const k=i.productId||i.sku||i.nombre;items[k]=items[k]||{name:i.nombre||productName(i.productId),qty:0,value:0};items[k].qty+=n(i.cantidad);items[k].value+=n(i.cantidad)*n(i.precioUnit)}));const top=Object.values(items).sort((a,b)=>b.value-a.value).slice(0,10);const sales=os.reduce((s,o)=>s+n(o.total),0),won=qs.filter(q=>['aceptada','convertida_pedido'].includes(norm(q.estado))).reduce((s,q)=>s+n(q.total),0);return pageHead('GESTIÓN','Reportes','Indicadores comerciales, productos y operación. Los cálculos se generan desde los documentos guardados localmente.',`<button class="btn" data-action="export">↓ Exportar datos</button>`)+`<div class="finance-grid"><div class="kpi"><small>Ventas en pedidos</small><b>${money(sales)}</b></div><div class="kpi"><small>Valor ganado</small><b>${money(won)}</b></div><div class="kpi"><small>Pedidos</small><b>${os.length}</b></div><div class="kpi"><small>Productos vendidos</small><b>${Object.keys(items).length}</b></div></div><div class="section report-grid"><div class="card"><h3>Productos por valor</h3><div class="bar-list">${top.map(x=>{const max=top[0]?.value||1;return `<div class="bar-item"><b>${esc(x.name)}</b><div class="mini-progress"><i style="width:${Math.round(x.value/max*100)}%"></i></div><span class="amount">${money(x.value)}</span></div>`}).join('')||'<div class="empty">Sin datos comerciales.</div>'}</div></div><div class="card"><h3>Resumen del embudo</h3>${[['Cotizaciones',qs.length],['Ganadas',qs.filter(q=>['aceptada','convertida_pedido'].includes(norm(q.estado))).length],['Pedidos',os.length],['Entregados',os.filter(o=>o.estado==='entregado').length]].map(x=>`<div class="row"><div class="row-main"><b>${x[0]}</b></div><span class="badge">${x[1]}</span></div>`).join('')}</div></div>`};
views.inventory=()=>{const ps=list('product'),q=norm(S.query),a=q?ps.filter(p=>fields('product',p).toLowerCase().includes(q)):ps;const low=a.filter(p=>n(p.stock)<=n(p.stockMinimo)&&n(p.stockMinimo)>0);return pageHead('OPERACIÓN','Inventario','Stock, mínimos y movimientos trazables en un solo lugar.',`<button class="btn signal" data-action="inventoryMove">＋ Movimiento</button>`)+searchInput('Buscar SKU, producto, marca, familia…')+`<div class="cards"><div class="kpi"><small>Productos</small><b>${a.length}</b></div><div class="kpi"><small>Stock bajo</small><b>${low.length}</b></div><div class="kpi"><small>Movimientos</small><b>${(D.stockMoves||[]).length}</b></div><div class="kpi"><small>Unidades</small><b>${a.reduce((s,p)=>s+n(p.stock),0).toLocaleString('es-CL')}</b></div></div><div class="section card"><div class="split"><h3>Existencias</h3><span class="badge">A–Z</span></div><div class="tablewrap"><table class="table"><thead><tr><th>SKU</th><th>Producto</th><th>Unidad</th><th>Stock</th><th>Mínimo</th><th>Precio</th></tr></thead><tbody>${a.map(p=>`<tr><td>${esc(p.sku||'—')}</td><td><b>${esc(p.nombre)}</b></td><td>${esc(p.unidad||'UN')}</td><td><b>${n(p.stock)}</b></td><td>${n(p.stockMinimo)}</td><td>${money(p.precioVenta)}</td></tr>`).join('')}</tbody></table></div></div><div class="section card"><h3>Últimos movimientos</h3>${(D.stockMoves||[]).slice().reverse().slice(0,10).map(m=>{const p=D.products.find(x=>x.id===m.productId);return `<div class="row"><div class="avatar">${esc(initials(p?.nombre||'ST'))}</div><div class="row-main"><b>${esc(p?.nombre||'Producto')}</b><div class="meta">${esc(m.tipo)} · ${m.delta>0?'+':''}${n(m.delta)} · ${esc(m.referencia||m.motivo||'Sin referencia')}</div></div><span class="badge ${m.delta>=0?'green':'red'}">${n(m.after)}</span></div>`}).join('')||'<div class="empty">Aún no hay movimientos.</div>'}</div>`}
function listPage(type,k,h,desc,create){let arr=type==='order'?list('order'):type==='purchase'?(D.purchases||[]).slice().sort((a,b)=>norm(a.folio||a.id).localeCompare(norm(b.folio||b.id),'es',{numeric:true})):type==='request'?(D.requests||[]).slice().sort((a,b)=>norm(a.folio||a.id).localeCompare(norm(b.folio||b.id),'es',{numeric:true})):type==='document'?(D.documents||[]).slice():[];const q=norm(S.query);if(q)arr=arr.filter(x=>norm(JSON.stringify(x)).includes(q));return pageHead(k,h,desc,`<button class="btn signal" data-action="${create}">＋ Nuevo</button>`)+searchInput('Buscar por folio, cliente, proveedor, estado…')+`<div class="card"><div class="list">${arr.map(x=>{let nm=type==='order'?companyName(x.companyId):type==='purchase'?supplierName(x.supplierId):type==='request'?((x.supplierIds||[]).map(supplierName).filter(Boolean).join(' · ')||'Varios proveedores'):x.folio||x.nombre||'Documento';return `<button class="row" style="border:0;background:#fff;width:100%;text-align:left" data-action="detail" data-id="${esc(x.id)}" data-type="${type}"><div class="avatar">${initials(x.folio||nm)}</div><div class="row-main"><b>${esc(x.folio||x.nombre||'Documento')}</b><div class="meta">${esc(nm)} · ${money(x.total||0)}</div></div>${statusBadge(x.estado||x.status)}</button>`}).join('')||'<div class="empty">Sin registros.</div>'}</div></div>`}

function companyName(id){return label('company',D.companies.find(x=>x.id===id)||{})||'Sin cliente'} function workName(id){return label('work',D.works.find(x=>x.id===id)||{})} function supplierName(id){return label('supplier',D.suppliers.find(x=>x.id===id)||{})||'Sin proveedor'}
function openGlobalSearch(){const q=norm(S.query);const groups=[['Clientes','company',list('company')],['Contactos','contact',list('contact')],['Obras','work',list('work')],['Productos','product',list('product')],['Proveedores','supplier',list('supplier')],['Cotizaciones','quote',list('quote')],['Pedidos','order',list('order')],['Órdenes de compra','purchase',(D.purchases||[]).slice().sort((a,b)=>norm(a.folio||a.id).localeCompare(norm(b.folio||b.id),'es',{numeric:true}))],['Solicitudes','request',(D.requests||[]).slice().sort((a,b)=>norm(a.folio||a.id).localeCompare(norm(b.folio||b.id),'es',{numeric:true}))],['Facturas','invoice',(D.invoices||[]).slice().sort((a,b)=>norm(a.folio||a.id).localeCompare(norm(b.folio||b.id),'es',{numeric:true}))]];const searchHay=(type,x)=>norm(type==='purchase'?[x.folio,x.supplierId?supplierName(x.supplierId):'',x.estado,JSON.stringify(x.items||[])].join(' '):type==='request'?[x.folio,(x.supplierIds||[]).map(supplierName).join(' '),x.estado,JSON.stringify(x.items||[])].join(' '):type==='invoice'?[x.folio,x.companyId?companyName(x.companyId):'',x.orderFolio,x.estado].join(' '):fields(type,x));let html='';for(const g of groups){const a=q?g[2].filter(x=>searchHay(g[1],x).includes(q)):g[2];if(!a.length)continue;html+=`<div class="result-group">${g[0]} · ${a.length}</div>`;html+=a.slice(0,80).map(x=>{const name=label(g[1],x),meta=searchHay(g[1],x).split(' ').slice(1,7).join(' · ');return `<button class="result" data-action="detail" data-id="${esc(x.id)}" data-type="${g[1]}"><div class="avatar">${initials(name)}</div><div><b>${esc(name)}</b><span>${esc(meta||'')}</span></div></button>`}).join('')}document.getElementById('modalRoot').innerHTML=`<div class="search-full"><div class="search-full-head"><input id="globalSearchFull" value="${esc(S.query)}" placeholder="Buscar en LUMO360…" autocomplete="off"><button class="iconbtn" data-action="closeModal" aria-label="Cerrar">×</button></div><div class="search-results">${html||'<div class="empty-state">Sin coincidencias. Prueba con nombre, folio, SKU, RUT, proveedor o estado.</div>'}</div></div>`;const i=document.getElementById('globalSearchFull');i?.focus();i?.setSelectionRange(i.value.length,i.value.length);if(i)i.oninput=()=>{S.query=i.value;openGlobalSearch()}}
function openPicker(type,title,cb){S.picker={type,title,cb};const a=list(type);document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><h2>${esc(title)}</h2><button class="iconbtn" data-action="closeModal">×</button></div><div class="picker-search"><input id="pickerSearch" placeholder="Escribe para filtrar…"></div><div id="pickerList" class="picker-list">${pickerRows(a,type)}</div></div></div>`;const i=document.getElementById('pickerSearch');i.oninput=()=>{const q=norm(i.value);document.getElementById('pickerList').innerHTML=pickerRows(a.filter(x=>norm(fields(type,x)).includes(q)),type)};i.focus()}

function requestOffer(id){const r=(D.requests||[]).find(x=>x.id===id);if(!r)return;rfqEnsureShape(r);const sups=rfqSelectedSuppliers(r);const body=`<div class="notice"><b>Registrar oferta recibida.</b> La oferta queda asociada a la solicitud, proveedor y producto. El sistema exige indicar si el precio es <b>Neto</b> o <b>Bruto / IVA incluido</b> para evitar comparaciones incorrectas.</div><div class="formgrid"><div class="field"><label>Proveedor</label><select id="rq-off-supplier">${sups.map(s=>`<option value="${esc(s.id)}">${esc(s.nombre)}</option>`).join('')}</select></div><div class="field"><label>Producto</label><select id="rq-off-item">${(r.items||[]).map((x,i)=>`<option value="${i}">${esc(x.sku||'MANUAL')} · ${esc(x.nombre)}</option>`).join('')}</select></div><div class="field"><label>Precio unitario</label><input id="rq-off-price" type="number" min="0" step="1"></div><div class="field"><label>Base</label><select id="rq-off-base"><option value="neto">Neto</option><option value="bruto">Bruto / IVA incluido</option></select></div><div class="field"><label>Stock / disponibilidad</label><input id="rq-off-stock" placeholder="Ej. 20 unidades / inmediato"></div><div class="field"><label>Plazo</label><input id="rq-off-lead" placeholder="Ej. 2 días"></div><div class="field"><label>Condición de pago</label><input id="rq-off-pay" placeholder="30 días / contado"></div><div class="field full"><label>Observaciones</label><textarea id="rq-off-notes" rows="3"></textarea></div></div>`;openModal(`Registrar oferta · ${esc(r.folio)}`,body,'<button class="btn" data-close>Cancelar</button><button class="btn signal" id="rq-off-save">Guardar oferta</button>');document.getElementById('rq-off-save').onclick=()=>{const idx=+val('rq-off-item'),it=r.items[idx],price=n(val('rq-off-price'));if(!it||price<=0)return toast('Indica producto y precio.');const base=val('rq-off-base');const sid=val('rq-off-supplier');const o={id:uid('off'),supplierId:sid,itemIndex:idx,productId:it.productId||null, function compareRequest(id){const r=(D.requests||[]).find(x=>x.id===id);if(!r)return;rfqEnsureShape(r);const rate=(n(D.settings?.ivaRate)||19)/100;const blocks=(r.items||[]).map((it,idx)=>{const os=r.offers.filter(o=>o.itemIndex===idx);const ranked=os.slice().sort((a,b)=>n(a.precioNeto||a.precio)-n(b.precioNeto||b.precio));return `<div class="rfq-offer-card ${ranked.length?'rfq-best':''}"><b>${esc(it.nombre)}</b><div class="mini">${fmtNum(it.cantidad)} ${esc(it.unidad||'UN')} · ${esc(it.sku||'')}</div>${ranked.length?ranked.map((o,k)=>`<div class="row"><div class="row-main"><b>${k===0?'★ ':''}${esc(supplierName(o.supplierId))}</b><div class="meta">${money(o.precio)} ${o.base==='bruto'?'Bruto':'Neto'} · comparable ${money(o.precioNeto||Math.round(o.precio/(o.base==='bruto'?1+rate:1)))} · ${esc(o.stock||'sin stock informado')} · ${esc(o.plazo||'sin plazo')}</div></div></div>`).join(''):'<div class="empty">Sin ofertas.</div>'}</div>`}).join('');openModal(`Comparador · ${esc(r.folio)}`,`<div class="notice">Los precios Bruto se normalizan a Neto usando el IVA configurado. La recomendación inicial es el menor costo neto; puedes considerar stock, plazo y pago antes de adjudicar.</div><div class="rfq-offer-grid">${blocks}</div>`,'<button class="btn" data-close>Cerrar</button><button class="btn signal" id="rq-create-po">Crear OC con mejor oferta</button>');document.getElementById('rq-create-po').onclick=()=>{const picks=[];(r.items||[]).forEach((it,idx)=>{const best=r.offers.filter(o=>o.itemIndex===idx).sort((a,b)=>n(a.precioNeto||a.precio)-n(b.precioNeto||b.precio))[0];if(best)picks.push({productId:it.productId||null,sku:it.sku||'',nombre:it.nombre,unidad:it.unidad||'UN',cantidad:n(it.cantidad)||1,precio:n(best.precioNeto||best.precio),supplierId:best.supplierId,sourceOfferId:best.id})});if(!picks.length)return toast('No hay ofertas para generar una OC.');const groups={};picks.forEach(x=>(groups[x.supplierId]??=[]).push(x));closeModal();Object.keys(groups).length===1?openPOFromRequest(r,Object.keys(groups)[0],groups[Object.keys(groups)[0]]):openModal('Seleccionar proveedor para OC',Object.keys(groups).map(sid=>`<div class="rfq-offer-card"><b>${esc(supplierName(sid))}</b><div class="mini">${groups[sid].length} línea(s)</div><button class="btn signal" data-rq-po-supplier="${esc(sid)}">Crear OC con este proveedor</button></div>`).join(''),'<button class="btn" data-close>Cancelar</button>');document.querySelectorAll('[data-rq-po-supplier]').forEach(b=>b.onclick=()=>{const sid=b.dataset.rqPoSupplier;closeModal();openPOFromRequest(r,sid,groups[sid])})}}
function openPOFromRequest(r,supplierId,items){openModal('Preparar orden de compra',`<div class="notice"><b>Origen:</b> ${esc(r.folio)} · ${esc(supplierName(supplierId))}</div>${rowsTable(['SKU','Producto','Cantidad','Costo neto','Subtotal'],items.map(x=>`<tr><td>${esc(x.sku)}</td><td>${esc(x.nombre)}</td><td>${fmtNum(x.cantidad)}</td><td>${money(x.precio)}</td><td>${money(x.cantidad*x.precio)}</td></tr>`).join(''))}<div class="field"><label>Notas</label><textarea id="rq-po-notes">Origen SOL ${esc(r.folio)}</textarea></div>`,'<button class="btn" data-close>Cancelar</button><button class="btn signal" id="rq-po-save">Crear OC</button>');document.getElementById('rq-po-save').onclick=()=>{const folio=(D.settings?.folioPrefijoOC||'OC')+'-'+String(D.nextOCFolio||1).padStart(5,'0');const total=items.reduce((a,x)=>a+x.cantidad*x.precio,0);D.nextOCFolio=n(D.nextOCFolio||1)+1;D.purchases=D.purchases||[];D.purchases.push({id:uid('oc'),folio,fecha:new Date().toISOString(),estado:'pendiente',supplierId,items:clone(items),total,notas:val('rq-po-notes'),sourceRequestId:r.id,sourceRequestFolio:r.folio,receivedItems:[]});r.estado='adjudicada';r.adjudicadaAt=new Date().toISOString();r.historial.push({fecha:new Date().toISOString(),estado:r.estado,evento:`OC ${folio} creada`});save();closeModal();S.view='purchases';render();toast(`${folio} creada desde ${r.folio}`)}}
function calculateOrderNeed(orderId){const o=(D.orders||[]).find(x=>x.id===orderId);if(!o)return null;const items=(o.items||[]).map(i=>{const p=D.products.find(x=>x.id===i.productId);const stock=n(p?.stock);const qty=n(i.cantidad);const need=Math.max(0,qty-stock);return {...i,stockActual:stock,necesidad:need}}).filter(i=>i.necesidad>0);return {id:'need'+orderId,orderId,folio:o.folio,items:items.map(i=>({...i,cantidad:i.necesidad}))}}

 else if(type==='work'){const c=D.companies.find(c=>c.id===x.companyId),qs=D.quotes.filter(q=>q.workId===id),os=D.orders.filter(o=>o.workId===id);body=detailHead(type,x,`<div class="metric-row"><div class="metric"><small>Cliente</small><b>${esc(c?.razonSocial||'—')}</b></div><div class="metric"><small>Estado</small><b>${esc(x.estado||'—')}</b></div><div class="metric"><small>Cotizaciones</small><b>${qs.length}</b></div><div class="metric"><small>Pedidos</small><b>${os.length}</b></div></div><div class="section grid2"><div class="card"><h3>Ficha de obra</h3><p><b>${esc(x.nombre||'')}</b></p><p class="meta">Código: ${esc(x.codigo||'—')}</p><p class="meta">${esc(x.direccion||'')} ${esc(x.comuna||'')}</p><p class="meta">${esc(x.estado||'')}</p></div><div class="card"><h3>Acciones</h3>${btn('newQuote','＋ Cotizar esta obra')}</div></div><div class="section card"><h3>Actividad comercial</h3>${qs.slice().sort((a,b)=>norm(a.folio).localeCompare(norm(b.folio),'es',{numeric:true})).reverse().map(q=>`<div class="row"><div class="row-main"><b>${esc(q.folio)}</b><div class="meta">${money(q.total)} · ${esc(q.estado||'')}</div></div></div>`).join('')||'<div class="empty">Sin cotizaciones.</div>'}</div>`)}
 else if(type==='supplier'){const pos=(D.purchases||[]).filter(p=>p.supplierId===id),rs=(D.requests||[]).filter(r=>r.supplierId===id);body=detailHead(type,x,`<div class="metric-row"><div class="metric"><small>Órdenes de compra</small><b>${pos.length}</b></div><div class="metric"><small>Solicitudes</small><b>${rs.length}</b></div><div class="metric"><small>Comprado</small><b>${money(pos.reduce((s,p)=>s+n(p.total),0))}</b></div><div class="metric"><small>Estado</small><b>${esc(x.estado||'activo')}</b></div></div><div class="detail-tabs">${btn('newPurchase','＋ Nueva OC')}${btn('newRequest','＋ Nueva solicitud')}</div><div class="section grid2"><div class="card"><h3>Datos del proveedor</h3><p><b>${esc(x.razonSocial||x.nombre||'')}</b></p><p class="meta">RUT: ${esc(x.rut||'—')} · Código: ${esc(x.codigo||'—')}</p><p class="meta">${esc(x.email||'')} · ${esc(x.telefono||'')}</p></div><div class="card"><h3>Últimas compras</h3>${pos.slice().reverse().slice(0,8).map(p=>`<div class="row"><div class="row-main"><b>${esc(p.folio)}</b><div class="meta">${money(p.total)} · ${esc(p.estado||'')}</div></div></div>`).join('')||'<div class="empty">Sin órdenes.</div>'}</div></div>`)}
 else if(type==='quote'){body=quoteDetail(x)} else if(type==='invoice'){body=invoiceDetail(x)} else if(type==='order'){body=orderDetail(x)} else if(type==='purchase'){body=purchaseDetail(x)} else if(type==='request'){body=requestDetail(x)} else {body=detailHead(type,x,`<div class="card"><h3>Datos</h3><p class="meta">${esc(fields(type,x))}</p></div>`)}
 document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="sheet large"><div class="handle"></div><div class="sheet-head"><h2>${esc(label(type,x))}</h2><button class="iconbtn" data-action="closeModal">×</button></div>${body}</div></div>`;wireModal();}
function detailHead(type,x,rest){return `<div class="detail-head"><div class="detail-avatar">${initials(label(type,x))}</div><div><div class="eyebrow">Ficha 360°</div><h2 style="margin:3px 0">${esc(label(type,x))}</h2><p class="sub">${esc(fields(type,x).split(' ').slice(1,8).join(' · '))}</p></div></div><div class="section">${rest}</div>`}
function quoteDetail(q){const lines=q.items||[];return `<div class="metric-row"><div class="metric"><small>Estado</small><b>${esc(q.estado||'borrador')}</b></div><div class="metric"><small>Neto</small><b>${money(q.neto||q.subtotal||0)}</b></div><div class="metric"><small>IVA</small><b>${money(q.iva||0)}</b></div><div class="metric"><small>Total</small><b>${money(q.total)}</b></div></div><div class="op-actions">${iconBtn('pdfQuote','pdf','PDF',q.id)}${iconBtn('printQuote','print','Imprimir / Guardar PDF',q.id)}${iconBtn('shareQuote','share','Compartir',q.id)}${iconBtn('emailQuote','mail','Correo',q.id)}${iconBtn('duplicateQuote','copy','Duplicar',q.id)}${iconBtn('editQuote','edit','Editar',q.id)}${q.estado!=='convertida_pedido'?iconBtn('acceptQuote','check','Aceptar',q.id,'quote','signal'):''}${q.estado!=='convertida_pedido'?iconBtn('convertQuote','cart','Crear pedido',q.id):''}</div><div class="section card"><div class="split"><div><h3>${esc(companyName(q.companyId))}</h3><div class="meta">${esc(workName(q.workId)||'Sin obra')} · Validez ${n(q.validezDias)||15} días · Pago ${esc(q.condicionPago||'Contado')}</div></div>${statusBadge(q.estado)}</div><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th style="min-width:280px">Producto / SKU</th><th>Cant.</th><th>Precio unit.</th><th>Total</th></tr></thead><tbody>${lines.map(i=>`<tr><td><b>${esc(i.nombre||productName(i.productId))}</b><div class="meta">${esc(i.sku||D.products.find(p=>p.id===i.productId)?.sku||'')}</div></td><td>${n(i.cantidad)}</td><td>${money(i.precioUnit)}</td><td>${money(n(i.cantidad)*n(i.precioUnit))}</td></tr>`).join('')||'<tr><td colspan="4">Sin líneas</td></tr>'}</tbody></table></div><div class="quote-total" style="margin-top:13px">${money(q.total)}</div>${q.notas?`<div class="box" style="margin-top:14px;padding:12px;background:#F6F7F7;border-radius:12px"><b>Notas</b><div class="meta" style="white-space:pre-wrap;margin-top:6px">${esc(q.notas)}</div></div>`:''}</div>`}
function productName(id){return label('product',D.products.find(x=>x.id===id)||{})}
function wireModal(){/* data-action is handled once by the global delegated click listener in boot(). */}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function wireQuoteSmartPickers(){const setup=(inputId,resultsId,hiddenId,type)=>{const input=document.getElementById(inputId),results=document.getElementById(resultsId),hidden=document.getElementById(hiddenId);if(!input||!results||!hidden)return;const source=()=>list(type);const place=()=>{if(!results.classList.contains('open'))return;const r=input.getBoundingClientRect(),gap=6,maxH=Math.max(120,Math.min(340,window.innerHeight-r.bottom-gap-12));results.style.left=`${Math.max(8,r.left)}px`;results.style.top=`${Math.min(window.innerHeight-maxH-8,r.bottom+gap)}px`;results.style.width=`${Math.min(r.width,window.innerWidth-16)}px`;results.style.maxHeight=`${maxH}px`};const paint=()=>{const q=norm(input.value),data=source().filter(x=>!q||norm(fields(type,x)).includes(q)).slice(0,120);results.innerHTML=data.length?data.map(x=>{const meta=type==='company'?[x.rut,x.telefono,x.email,x.comuna].filter(Boolean).join(' · '):[x.direccion,x.comuna,companyName(x.companyId)].filter(Boolean).join(' · ');return `<button type="button" class="smart-pick-result" data-smart-select="${esc(x.id)}"><span class="picker-letter">${esc(initials(label(type,x)).slice(0,1))}</span><span class="pick-copy"><b>${esc(label(type,x))}</b><small>${esc(meta||fields(type,x))}</small></span></button>`}).join(''):'<div class="empty-state" style="padding:18px">Sin coincidencias.</div>';results.classList.add('open');requestAnimationFrame(place)};input.addEventListener('focus',paint);input.addEventListener('input',()=>{hidden.value='';paint()});input.addEventListener('keydown',e=>{if(e.key==='Escape'){results.classList.remove('open');return}if(e.key==='ArrowDown'){const first=results.querySelector('.smart-pick-result');if(first){e.preventDefault();first.focus()}}});results.addEventListener('click',e=>{const b=e.target.closest('[data-smart-select]');if(!b)return;const x=source().find(v=>v.id===b.dataset.smartSelect);if(!x)return;hidden.value=x.id;input.value=label(type,x);results.classList.remove('open');input.dispatchEvent(new Event('change',{bubbles:true}))});const reposition=()=>place();window.addEventListener('resize',reposition,{passive:true});window.addEventListener('scroll',reposition,{passive:true,capture:true})};setup('quoteCompanySearch','quoteCompanyResults','quoteCompanyId','company');setup('quoteWorkSearch','quoteWorkResults','quoteWorkId','work')}
function openForm(kind,context={}){
 let title='Nuevo registro',html=''; const data=context?.existing||context||{};
 if(kind==='company')html=formCompany(data);if(kind==='contact')html=formContact(data);if(kind==='work')html=formWork(data);if(kind==='product')html=formProduct(data);if(kind==='supplier')html=formSupplier(data);if(kind==='quote')html=formQuote(context);if(kind==='purchase')html=formPurchase(context);if(kind==='request')html=formRequest(context);
 document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="sheet large"><div class="handle"></div><div class="sheet-head"><h2>${titleFor(kind)}</h2><button class="iconbtn" data-action="closeModal">×</button></div>${html}</div></div>`;wireModal();wireForms(kind,context);if(kind==='quote')wireQuoteSmartPickers()
}
function titleFor(k){return ({company:'Nuevo cliente',contact:'Nuevo contacto',work:'Nueva obra',product:'Nuevo producto',supplier:'Nuevo proveedor',quote:'Nueva cotización',purchase:'Nueva orden de compra',request:'Nueva solicitud a proveedor'}[k]||'Nuevo registro')}
function input(name,labelText,value='',type='text',extra=''){return `<div class="field"><label>${esc(labelText)}</label><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function formCompany(c){return `<form id="entityForm" class="formgrid">${input('razonSocial','Razón social',c.razonSocial||'')}${input('rut','RUT',c.rut||'')}${input('nombreFantasia','Nombre fantasía',c.nombreFantasia||'')}${input('giro','Giro',c.giro||'')}${input('telefono','Teléfono',c.telefono||'')}${input('email','Email',c.email||'')}${input('direccion','Dirección',c.direccion||'')}${input('comuna','Comuna',c.comuna||'')}<div class="actions" style="grid-column:1/-1"><button class="btn signal" type="submit">Guardar cliente</button></div></form>`}
function formContact(c){return `<form id="entityForm" class="formgrid">${input('nombre','Nombre',c.nombre||'')}${input('apellido','Apellido',c.apellido||'')}${input('cargo','Cargo',c.cargo||'')}${input('telefono','Teléfono',c.telefono||'')}${input('email','Email',c.email||'')}${input('companyId','ID cliente',c.companyId||'')}<div class="actions" style="grid-column:1/-1"><button class="btn signal" type="submit">Guardar contacto</button></div></form>`}
function formWork(c){return `<form id="entityForm" class="formgrid">${input('nombre','Nombre obra',c.nombre||'')}${input('codigo','Código',c.codigo||'')}${input('companyId','ID cliente',c.companyId||'')} ${input('estado','Estado',c.estado||'prospecto')}${input('direccion','Dirección',c.direccion||'')}${input('comuna','Comuna',c.comuna||'')}<div class="actions" style="grid-column:1/-1"><button class="btn signal" type="submit">Guardar obra</button></div></form>`}
function formProduct(p){const cat=p.categoria||p.linea||'';const fam=p.familia||p.subfamilia||p.tipoProducto||'';const preview=p.sku||'';return `<form id="entityForm" class="formgrid product-form"><div class="field"><label>Producto</label><input name="nombre" required value="${esc(p.nombre||'')}" placeholder="Nombre comercial"></div><div class="field sku-field"><label>SKU automático</label><input name="sku" value="${esc(preview)}" readonly aria-readonly="true" placeholder="Se genera al completar categoría y familia"><small class="field-help">Formato único: XXX-XX-123</small></div><div class="field"><label>Categoría</label><input name="categoria" required list="productCategories" value="${esc(cat)}" placeholder="Ej. CEMENTOS Y ARIDOS"><datalist id="productCategories">${[...new Set((D.products||[]).map(x=>x.categoria).filter(Boolean))].sort((a,b)=>norm(a).localeCompare(norm(b),'es')).map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></div><div class="field"><label>Familia</label><input name="familia" required list="productFamilies" value="${esc(fam)}" placeholder="Ej. CEMENTOS"><datalist id="productFamilies">${[...new Set((D.products||[]).map(x=>x.familia).filter(Boolean))].sort((a,b)=>norm(a).localeCompare(norm(b),'es')).map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></div>${input('codigoBarras','Código de barras',p.codigoBarras||'')}${input('marca','Marca',p.marca||'')}${input('subfamilia','Subfamilia / tipo',p.subfamilia||p.tipoProducto||'')}${input('unidad','Unidad',p.unidad||'UN')}${input('costo','Costo',p.costo||0,'number','min=0 step=.01')}${input('precioVenta','Precio venta',p.precioVenta||0,'number','min=0 step=.01')}${input('stock','Stock',p.stock||0,'number','min=0 step=.01')}${input('stockMinimo','Stock mínimo',p.stockMinimo||0,'number','min=0 step=.01')}<div class="field" style="grid-column:1/-1"><label>Notas</label><textarea name="notas" rows="3">${esc(p.notas||'')}</textarea></div><div class="actions" style="grid-column:1/-1"><button class="btn" type="button" data-action="closeModal">Cancelar</button><button class="btn signal" type="submit">Guardar producto</button></div></form>`}
function formSupplier(p){return `<form id="entityForm" class="formgrid">${input('nombre','Proveedor',p.nombre||'')}${input('codigo','Código',p.codigo||'')}${input('rut','RUT',p.rut||'')}${input('giro','Giro',p.giro||'')}${input('telefono','Teléfono',p.telefono||'')}${input('email','Email',p.email||'')}<div class="actions" style="grid-column:1/-1"><button class="btn signal" type="submit">Guardar proveedor</button></div></form>`}
function formQuote(ctx){const d=S.quoteDraft||{companyId:ctx.companyId||'',workId:ctx.workId||'',items:[],validezDias:n(D.settings?.validezCotizacionDefault)||15,condicionPago:D.settings?.condicionPagoDefault||'Contado',notas:''};return `<form id="quoteForm" class="quote-document"><div class="quote-head-fields"><div class="field"><label>Cliente</label><div class="smart-pick-wrap"><input class="smart-pick-input" id="quoteCompanySearch" autocomplete="off" value="${esc(d.companyId?companyName(d.companyId):'')}" placeholder="Escribe nombre o RUT…"><span class="smart-pick-icon">⌕</span><div class="smart-pick-results" id="quoteCompanyResults"></div></div><input type="hidden" name="companyId" id="quoteCompanyId" value="${esc(d.companyId||'')}"></div><div class="field"><label>Obra</label><div class="smart-pick-wrap"><input class="smart-pick-input" id="quoteWorkSearch" autocomplete="off" value="${esc(d.workId?workName(d.workId):'')}" placeholder="Escribe nombre de obra…"><span class="smart-pick-icon">⌕</span><div class="smart-pick-results" id="quoteWorkResults"></div></div><input type="hidden" name="workId" id="quoteWorkId" value="${esc(d.workId||'')}"></div><div class="field"><label>Validez</label><input name="validezDias" type="number" min="1" value="${n(d.validezDias)||15}"></div><div class="field"><label>Pago</label><input name="condicionPago" value="${esc(d.condicionPago||'Contado')}"></div></div><div class="quote-lines-head"><div><div class="eyebrow">Detalle comercial</div><h3>Productos</h3></div><button type="button" class="btn small signal" id="addLine">＋ Agregar</button></div><div id="quoteLines">${quoteLines(d.items||[])}</div><div class="quote-summary"><div><span>Subtotal</span><b id="quoteSubtotal">${money((d.items||[]).reduce((s,i)=>s+n(i.cantidad)*n(i.precioUnit),0))}</b></div><div><span>IVA ${n(D.settings?.ivaRate)||19}%</span><b id="quoteIva">${money(Math.round((d.items||[]).reduce((s,i)=>s+n(i.cantidad)*n(i.precioUnit),0)*(n(D.settings?.ivaRate)||19)/100))}</b></div><div class="quote-grand"><span>Total</span><b id="quoteTotal">${money((d.items||[]).reduce((s,i)=>s+n(i.cantidad)*n(i.precioUnit),0)*(1+(n(D.settings?.ivaRate)||19)/100))}</b></div></div><div class="field quote-notes"><label>Notas / condiciones</label><textarea name="notas" rows="4" placeholder="Despacho, vigencia, condiciones comerciales, observaciones…">${esc(d.notas||'')}</textarea></div><div class="quote-form-footer"><button class="btn" type="button" data-action="closeModal">Cancelar</button><button class="btn signal quote-save" type="submit">Guardar cotización</button></div></form>`}
function quoteLines(items){return items.map((i,idx)=>{const p=D.products.find(x=>x.id===i.productId)||{};const has=!!(i.productId&&((i.sku||p.sku)));return `<div class="quote-line-clean" data-line="${idx}"><button type="button" class="product-pick-clean" data-linepick="${idx}"><span class="prod-avatar">${esc(initials(i.nombre||p.nombre||'P'))}</span><span class="prod-copy"><b>${esc(i.nombre||'Buscar producto')}</b><small>${esc([i.sku||p.sku,i.marca||p.marca,i.unidad||p.unidad].filter(Boolean).join(' · ')||'Buscar en catálogo')}</small></span><span class="pick-arrow">⌕</span></button><div class="line-field-clean"><label>Cantidad</label><input data-qty="${idx}" type="number" min="1" step="0.01" value="${n(i.cantidad)||1}"></div><div class="line-field-clean"><label>Precio unitario</label><input data-price="${idx}" type="number" min="0" step="1" value="${n(i.precioUnit)||0}"></div><div class="line-total-clean"><small>Total</small><b>${money(n(i.cantidad)*n(i.precioUnit))}</b></div><button type="button" class="line-delete" data-linedel="${idx}" aria-label="Eliminar producto">×</button>${!has?'<div class="line-warning">Selecciona un producto del catálogo para continuar.</div>':''}</div>`}).join('')||'<div class="quote-empty">Agrega el primer producto para comenzar.</div>'}
function purchaseLines(items){return items.map((i,idx)=>{const p=D.products.find(x=>x.id===i.productId)||{};return `<div class="quote-line" data-purchase-line="${idx}"><button type="button" class="btn product-pick" data-purchase-pick="${idx}"><span class="prod-avatar">${esc(initials(i.nombre||p.nombre||'Producto'))}</span><span class="prod-copy"><b>${esc(i.nombre||p.nombre||'Seleccionar producto')}</b><small>${esc([p.sku,p.marca,p.unidad].filter(Boolean).join(' · ')||'Buscar en catálogo')}</small></span></button><div class="line-field"><label>Cantidad</label><input data-pqty="${idx}" type="number" min="1" value="${n(i.cantidad)||1}" aria-label="Cantidad"></div><div class="line-field"><label>Costo unitario</label><input data-pprice="${idx}" type="number" min="0" value="${n(i.precioUnit)||n(p.costo)||0}" aria-label="Costo unitario"></div><div class="line-total"><small>Total</small><b>${money(n(i.cantidad)*n(i.precioUnit||p.costo))}</b></div><button type="button" class="iconbtn" data-pdel="${idx}">×</button></div>`}).join('')||'<div class="empty">Agrega los productos que necesitas comprar.</div>'}
function formRequest(c){return `<div class="notice"><b>Las solicitudes se gestionan como RFQ.</b><br>Usa la matriz para asignar cada producto a uno o varios proveedores y luego registrar/comparar ofertas.</div><div class="actions"><button type="button" class="btn signal" id="openRfqComposerNow">＋ Abrir solicitud de cotización</button></div>`}

function receivedByItem(p){const out={};(p.receivedLines||[]).forEach(l=>{const k=l.productId||l.sku||l.nombre;out[k]=(out[k]||0)+n(l.qty)});if(!p.receivedLines&&Array.isArray(p.receivedItems)&&p.receivedItems.length){const total=p.receivedItems.reduce((s,x)=>s+n(x.qty),0);const first=(p.items||[])[0];if(first)out[first.productId||first.sku||first.nombre]=total;}return out}
function receivePurchaseModal(id){const p=(D.purchases||[]).find(x=>x.id===id);if(!p)return;const rec=receivedByItem(p);const rows=(p.items||[]).map((i,idx)=>{const k=i.productId||i.sku||i.nombre,r=n(rec[k]),pending=Math.max(0,n(i.cantidad)-r);return `<div class="receive-grid rowr"><div class="receive-product"><b>${esc(i.nombre||productName(i.productId))}</b><small>${esc([i.sku,i.unidad].filter(Boolean).join(' · '))} · solicitado ${fmtNum(i.cantidad)}</small></div><div><b>${fmtNum(r)}</b><small class="meta">recibido</small></div><div><input type="number" min="0" max="${pending}" step="0.01" value="0" data-receive-qty="${idx}" aria-label="Cantidad recibida"></div><div><span class="${pending?'stock-alert':'stock-ok'}">${pending?`pend. ${fmtNum(pending)}`:'completo'}</span></div></div>`}).join('');openModal(`Recepción · ${esc(p.folio)}`,`<div class="notice">Registra solamente lo que llegó en esta recepción. Puedes recibir parcialmente; el stock se actualiza solo por la cantidad efectivamente recibida.</div><div class="receive-grid head"><div>Producto</div><div>Acumulado</div><div>Esta recepción</div><div>Pendiente</div></div><div id="receiveRows">${rows||empty('La OC no tiene productos.')}</div><div class="field section"><label>Observación de recepción</label><textarea id="receiveNote" rows="3" placeholder="Bodega, guía, diferencias, daños, etc."></textarea></div>`,`<button class="btn" data-close>Cancelar</button><button class="btn signal" id="confirmReceive">Registrar recepción</button>`);document.getElementById('confirmReceive').onclick=()=>{const lines=[];document.querySelectorAll('[data-receive-qty]').forEach(el=>{const qty=n(el.value);if(qty>0){const i=p.items[+el.dataset.receiveQty];lines.push({productId:i.productId,sku:i.sku,nombre:i.nombre,qty,createdAt:new Date().toISOString()})}});if(!lines.length)return toast('Ingresa al menos una cantidad recibida.');for(const l of lines){const item=(p.items||[]).find(i=>(i.productId&&i.productId===l.productId)||(i.sku&&i.sku===l.sku)||(i.nombre&&i.nombre===l.nombre));const already=n(receivedByItem(p)[l.productId||l.sku||l.nombre]);if(item&&already+l.qty>n(item.cantidad))return toast(`La recepción supera lo pendiente de ${item.nombre||'producto'}.`)}p.receivedLines=p.receivedLines||[];p.receivedLines.push(...lines);p.receivedItems=p.receivedItems||[];p.receivedItems.push({qty:lines.reduce((s,l)=>s+n(l.qty),0),createdAt:new Date().toISOString(),note:document.getElementById('receiveNote')?.value||''});for(const l of lines){const pr=D.products.find(x=>x.id===l.productId);if(pr){const before=n(pr.stock);pr.stock=before+n(l.qty);D.stockMoves=D.stockMoves||[];D.stockMoves.push({id:'mv'+Date.now()+Math.random(),productId:pr.id,tipo:'entrada',cantidad:n(l.qty),delta:n(l.qty),before,after:pr.stock,motivo:'Recepción OC',referencia:p.folio,createdAt:new Date().toISOString()})}}const r2=receivedByItem(p);const complete=(p.items||[]).every(i=>n(r2[i.productId||i.sku||i.nombre])>=n(i.cantidad));p.estado=complete?'recibida':'recepcion_parcial';p.lastReceiptAt=new Date().toISOString();save();closeModal();render();toast(complete?`OC ${p.folio}: recepción completa`:`OC ${p.folio}: recepción parcial registrada`)};wireModal()}
function dispatchOrderModal(id){const o=D.orders.find(x=>x.id===id);if(!o)return;const rows=(o.items||[]).map((i,idx)=>{const pending=Math.max(0,n(i.cantidad)-n(i.despachado));return `<div class="dispatch-grid" style="padding:9px 0;border-bottom:1px solid #ECEEEF"><div><b>${esc(i.nombre||productName(i.productId))}</b><div class="meta">Solicitado ${fmtNum(i.cantidad)} · ya despachado ${fmtNum(i.despachado||0)}</div></div><div><input type="number" min="0" max="${pending}" step="0.01" value="${pending}" data-dispatch-qty="${idx}"></div><div><small class="${pending?'stock-alert':'stock-ok'}">pend. ${fmtNum(pending)}</small></div></div>`}).join('');openModal(`Despacho · ${esc(o.folio)}`,`<div class="notice">Se descontará del inventario únicamente la cantidad que confirmes como despachada. Si no existe stock suficiente, el sistema no permitirá completar esa línea.</div><div class="dispatch-grid" style="font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase"><div>Producto</div><div>Cant. despacho</div><div>Control</div></div>${rows}`,`<button class="btn" data-close>Cancelar</button><button class="btn signal" id="confirmDispatch">Confirmar despacho</button>`);document.getElementById('confirmDispatch').onclick=()=>{const lines=[];document.querySelectorAll('[data-dispatch-qty]').forEach(el=>{const qty=n(el.value);if(qty>0){const i=o.items[+el.dataset.dispatchQty];lines.push({item:i,qty})}});if(!lines.length)return toast('Ingresa cantidades de despacho.');for(const l of lines){const pr=D.products.find(x=>x.id===l.item.productId);if(!pr)return toast(`Producto sin ficha: ${l.item.nombre||'línea'}`);if(n(pr.stock)<l.qty)return toast(`Stock insuficiente para ${l.item.nombre||pr.nombre}. Disponible: ${fmtNum(pr.stock)}.`)}o.dispatches=o.dispatches||[];const stamp=new Date().toISOString();for(const l of lines){l.item.despachado=n(l.item.despachado)+l.qty;const pr=D.products.find(x=>x.id===l.item.productId);const before=n(pr.stock);pr.stock=before-l.qty;D.stockMove function deliverOrderModal(id){const o=D.orders.find(x=>x.id===id);if(!o)return;const rows=(o.items||[]).map((i,idx)=>{const pending=Math.max(0,n(i.despachado)-n(i.entregado));return `<div class="dispatch-grid" style="padding:9px 0;border-bottom:1px solid #ECEEEF"><div><b>${esc(i.nombre||productName(i.productId))}</b><div class="meta">Despachado ${fmtNum(i.despachado||0)} · entregado ${fmtNum(i.entregado||0)}</div></div><div><input type="number" min="0" max="${pending}" step="0.01" value="${pending}" data-deliver-qty="${idx}"></div><div><small class="${pending?'stock-alert':'stock-ok'}">pend. ${fmtNum(pending)}</small></div></div>`}).join('');openModal(`Entrega · ${esc(o.folio)}`,`<div class="notice">Registra la cantidad efectivamente recibida por el cliente. Puedes entregar parcialmente y completar el pedido después.</div><div class="dispatch-grid" style="font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase"><div>Producto</div><div>Cant. entrega</div><div>Control</div></div>${rows}`,`<button class="btn" data-close>Cancelar</button><button class="btn signal" id="confirmDelivery">Confirmar entrega</button>`);document.getElementById('confirmDelivery').onclick=()=>{let any=false;(document.querySelectorAll('[data-deliver-qty]')||[]).forEach(el=>{const qty=n(el.value);if(qty<=0)return;any=true;const i=o.items[+el.dataset.deliverQty];i.entregado=n(i.entregado)+qty});if(!any)return toast('Ingresa cantidades entregadas.');const complete=(o.items||[]).every(i=>n(i.entregado)>=n(i.cantidad));o.estado=complete?'entregado':'enviado';o.lastDeliveryAt=new Date().toISOString();o.deliveries=o.deliveries||[];o.deliveries.push({createdAt:o.lastDeliveryAt});save();closeModal();render();toast(complete?`Pedido ${o.folio} entregado`:`Entrega parcial de ${o.folio} registrada`)};wireModal()}
function inventoryMove(){openModal('Movimiento de inventario',`<form id="inventoryMoveForm" class="formgrid"><div class="field" style="grid-column:1/-1"><label>Producto</label><button type="button" class="btn" id="pickInventoryProduct">Seleccionar producto</button><input type="hidden" name="productId"></div>${input('tipo','Tipo','entrada')}${input('cantidad','Cantidad',1,'number','min=0.01 step=0.01')}${input('motivo','Motivo','Ajuste de inventario')}<div class="field"><label>Referencia</label><input name="referencia" placeholder="OC, guía, inventario…"></div></form>`,`<button class="btn" data-close>Cancelar</button><button class="btn signal" id="saveInventoryMove">Registrar movimiento</button>`);document.getElementById('pickInventoryProduct').onclick=()=>openPicker('product','Seleccionar producto',id=>{const f=document.getElementById('inventoryMoveForm');f.querySelector('[name=productId]').value=id;document.getElementById('pickInventoryProduct').textContent=productName(id);});document.getElementById('saveInventoryMove').onclick=()=>{const f=document.getElementById('inventoryMoveForm'),o=Object.fromEntries(new FormData(f).entries()),p=D.products.find(x=>x.id===o.productId);if(!p)return toast('Selecciona un producto.');const qty=n(o.cantidad);if(qty<=0)return toast('La cantidad debe ser mayor a 0.');let delta=o.tipo==='salida'?-qty:o.tipo==='ajuste'?qty:qty;if(o.tipo==='ajuste')delta=qty-n(p.stock);if(n(p.stock)+delta<0)return toast('El stock no puede quedar negativo.');const before=n(p.stock);p.stock=before+delta;D.stockMoves=D.stockMoves||[];D.stockMoves.push({id:'mv'+Date.now(),productId:p.id,tipo:o.tipo,cantidad:qty,delta,before,after:p.stock,motivo:o.motivo,referencia:o.referencia,createdAt:new Date().toISOString()});save();closeModal();render();toast('Movimiento registrado')};wireModal()}

      rel=`<div class="section-title"><h3>Historial</h3></div><div class="clean-list">${qs.slice(-6).reverse().map(q=>opRow('C',q.folio,companyName(q.companyId),money0(q.total),iconBtn('detail','eye','Ver',q.id,'quote'),q.estado)).join('')}${pos.slice(-6).reverse().map(p=>opRow('OC',p.folio,supplierName(p.supplierId)||'Proveedor',money0(p.total),iconBtn('detail','eye','Ver',p.id,'purchase'),p.estado)).join('')}${moves.slice(0,10).map(m=>opRow(m.delta>=0?'↑':'↓',m.tipo,`${m.referencia||m.motivo||''} · ${new Date(m.createdAt||Date.now()).toLocaleDateString('es-CL')}`,`${m.delta>0?'+':''}${fmtNum(m.delta)}`,'',m.delta>=0?'recibida':'pendiente')).join('')||'<div class="empty-state">Sin movimientos.</div>'}</div>`;
    } else if(type==='supplier'){
      const pos=arr('purchases').filter(p=>p.supplierId===id).sort(qsort),rs=arr('requests').filter(r=>(r.supplierIds||[]).includes(id)).sort(qsort),sp=pos.reduce((s,p)=>s+n(p.total),0); stats=`<div class="metric-strip"><div class="metric"><small>OC</small><b>${pos.length}</b></div><div class="metric"><small>Solicitudes</small><b>${rs.length}</b></div><div class="metric"><small>Comprado</small><b>${money(sp)}</b></div><div class="metric"><small>Última OC</small><b>${pos.at(-1)?.folio||'—'}</b></div></div>`; actions=`${iconBtn('newRequest','more','Solicitar cotización',id,'supplier','primary')}${iconBtn('newPurchase','cart','Nueva OC',id,'supplier')}${iconBtn('editEntity','edit','Editar proveedor',id,'supplier')}`; rel=`<div class="section-title"><h3>Actividad de abastecimiento</h3></div><div class="clean-list">${rs.slice(-8).reverse().map(r=>opRow('RFQ',r.folio,`${(r.items||[]).length} productos`,`${(r.offers||[]).length} ofertas`,iconBtn('detail','eye','Ver',r.id,'request'),r.estado)).join('')}${pos.slice(-8).reverse().map(p=>opRow('OC',p.folio,'Orden de compra',money0(p.total),iconBtn('detail','eye','Ver',p.id,'purchase'),p.estado)).join('')||'<div class="empty-state">Sin actividad.</div>'}</div>`;
    } else if(type==='contact'){
      const c=by('companies',x.companyId); stats=`<div class="metric-strip"><div class="metric"><small>Empresa</small><b>${esc(c?.razonSocial||'—')}</b></div><div class="metric"><small>Cargo</small><b>${esc(x.cargo||'—')}</b></div><div class="metric"><small>Email</small><b>${esc(x.email||'—')}</b></div><div class="metric"><small>Teléfono</small><b>${esc(x.telefono||'—')}</b></div></div>`; actions=`${c?iconBtn('newQuote','cart','Cotizar',c.id,'company','primary'):''}${iconBtn('editEntity','edit','Editar contacto',id,'contact')}`; rel=`<div class="section-title"><h3>Datos</h3></div><div class="clean-list">${opRow('C',x.nombre,`${x.apellido||''} · ${x.cargo||''}`,'', '', '')}${opRow('@',x.email||'Sin email',x.telefono||'','', '', '')}</div>`;
    } else if(type==='work'){
      const qs=arr('quotes').filter(q=>q.workId===id).sort(qsort),os=arr('orders').filter(o=>o.workId===id).sort(qsort),c=by('companies',x.companyId); const total=os.reduce((s,o)=>s+n(o.total),0); stats=`<div class="metric-strip"><div class="metric"><small>Cliente</small><b>${esc(c?.razonSocial||'—')}</b></div><div class="metric"><small>Cotizaciones</small><b>${qs.length}</b></div><div class="metric"><small>Pedidos</small><b>${os.length}</b></div><div class="metric"><small>Vendido</small><b>${money(total)}</b></div></div>`; actions=`${iconBtn('newQuote','cart','Cotizar obra',id,'work','primary')}${iconBtn('editEntity','edit','Editar obra',id,'work')}`; rel=`<div class="section-title"><h3>Actividad de obra</h3></div><div class="clean-list">${qs.slice(-8).reverse().map(q=>opRow('C',q.folio,'Cotización',money0(q.total),iconBtn('detail','eye','Ver',q.id,'quote'),q.estado)).join('')}${os.slice(-8).reverse().map(o=>opRow('P',o.folio,'Pedido',money0(o.total),iconBtn('detail','eye','Ver',o.id,'order'),o.estado)).join('')||'<div class="empty-state">Sin actividad.</div>'}</div>`;
    }
    const titleText=label(type,x); document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="sheet large"><div class="handle"></div><div class="sheet-head"><h2>${esc(titleText)}</h2><button class="iconbtn" data-action="closeModal">×</button></div><div class="detail-head"><div class="detail-avatar">${esc(initials(titleText))}</div><div><div class="eyebrow">Ficha 360°</div><h2 style="margin:3px 0">${esc(titleText)}</h2><p class="sub">${esc(masterMeta(type,x))}</p></div></div><div class="action-row section">${actions}</div>${stats}${rel}</div></div>`;wireModal();
  };
  function openMore(id,type){
    const acts=[]; if(type==='quote')acts.push(iconBtn('printQuote','print','Imprimir / Guardar PDF',id,'quote'),iconBtn('emailQuote','mail','Correo',id,'quote'),iconBtn('duplicateQuote','copy','Duplicar',id,'quote')); if(type==='order')acts.push(iconBtn('invoiceFromOrder','pdf','Facturar pedido',id,'order')); if(type==='purchase')acts.push(iconBtn('receivePurchase','check','Registrar recepción',id,'purchase')); if(type==='request')acts.push(iconBtn('requestOffer','check','Registrar oferta',id,'request'),iconBtn('compareRequest','more','Comparar',id,'request')); openModal(`Más acciones · ${esc(id)}`,`<div class="action-row" style="padding:10px 0">${acts.join('')||'<div class="empty-state">Sin acciones adicionales.</div>'}</div>`,`<button class="btn" data-close>Cerrar</button>`);wireModal();
  }
  function awardOffer(id,itemIndex,offerIndex){const r=by('requests',id);if(!r)return;rfqEnsureShape(r);const offer=r.offers?.[offerIndex];if(!offer)return; r.awards=r.awards||{}; r.awards[itemIndex]={supplierId:offer.supplierId,offerIndex}; r.estado='adjudicada'; r.historial.push({fecha:new Date().toISOString(),evento:`Línea ${itemIndex+1} adjudicada a ${supplierName(offer.supplierId)}`}); save(); compareRequest(id); toast('Adjudicación registrada');}
  function createPOFromAward(id){const r=by('requests',id);if(!r)return;rfqEnsureShape(r);const awards=r.awards||{};const grouped={};Object.keys(awards).forEach(k=>{const o=r.offers?.[awards[k].offerIndex];if(!o)return;grouped[o.supplierId]??=[];const item=r.items[+k];grouped[o.supplierId].push({...item,precioUnit:n(o.precioNeto||o.precio||0),supplierId:o.supplierId});});const entries=Object.entries(grouped);if(!entries.length)return toast('Adjudica al menos una línea antes de crear OC.');let created=[];for(const [supplierId,items] of entries){const folio=(D.settings?.folioPrefijoOC||'OC')+'-'+String(n(D.nextOCFolio||1)).padStart(5,'0');D.nextOCFolio=n(D.nextOCFolio||1)+1;const subtotal=items.reduce((s,i)=>s+n(i.cantidad)*n(i.precioUnit),0),iva=subtotal*n(D.settings?.ivaRate||19)/100;const p={id:'po'+Date.now()+Math.random(),folio,supplierId,items:clone(items),subtotal,iva,total:subtotal+iva,estado:'pendiente',requestId:r.id,referencia:r.referencia||'',createdAt:new Date().toISOString()};D.purchases.push(p);created.push(folio)}r.poIds=created.map(f=>D.purchases.find(p=>p.folio===f)?.id).filter(Boolean);r.historial.push({fecha:new Date().toISOString(),evento:`OC creadas: ${created.join(', ')}`});save();closeModal();S.view='purchases';render();toast(`OC creadas: ${created.join(', ')}`)}
  compareRequest=function(id){
    const r=by('requests',id); if(!r)return;
    rfqEnsureShape(r);
    const sups=rfqSelectedSuppliers(r), offers=r.offers||[];
    const rows=(r.items||[]).map((it,idx)=>{
      const cells=sups.map(s=>{
        const oi=offers.findIndex(o=>o.itemIndex===idx&&o.supplierId===s.id);
        const o=oi>=0?offers[oi]:null;
        if(!o)return '<td>—</td>';
        const act=iconBtn('awardOffer','check','Adjudicar',id,'request|'+idx+'|'+oi);
        return '<td class="compare-best"><b>'+money(o.precioNeto||o.precio||0)+'</b><div class="meta">'+esc(o.base||'Neto')+' · '+esc(o.plazo||'—')+'</div>'+act+'</td>';
      }).join('');
      return '<tr><td><b>'+esc(lineName(it))+'</b><div class="meta">'+esc(it.sku||'')+' · '+fmtNum(it.cantidad)+' '+esc(it.unidad||'UN')+'</div></td>'+cells+'</tr>';
    }).join('');
    return openModal('Comparar ofertas · '+esc(r.folio),'<div class="notice">Selecciona la mejor oferta por línea. Puedes adjudicar distintas líneas a distintos proveedores.</div><div class="compare-grid"><table class="table dense-table"><thead><tr><th>Producto</th>'+sups.map(s=>'<th>'+esc(s.nombre)+'</th>').join('')+'</tr></thead><tbody>'+ (rows||'<tr><td>Sin productos</td></tr>') +'</tbody></table></div>','<button class="btn" data-close>Cerrar</button><button class="btn signal" data-action="createPOFromAward" data-id="'+esc(id)+'">Crear OC desde adjudicación</button>');
  };
  const oldOpenRfq=openRfqComposer;
  // wrap action dispatcher for new operations
  act=function(a,id,type){
    if(a==='openMore'){openMore(id,type);return}
    if(a==='awardOffer'){const parts=String(type||'').split('|');return awardOffer(id,+parts[1],+parts[2])}
    if(a==='createPOFromAward'){createPOFromAward(id);return}
    return oldAct(a,id,type)
  };
  // Make new-order button useful without breaking traceability: show accepted quotes as source choices.
  newOrder=function(){const qs=arr('quotes').filter(q=>['aceptada','convertida_pedido'].includes(norm(q.estado))&&q.estado!=='convertida_pedido').sort(qsort);openModal('Nuevo pedido',`<div class="notice">Para conservar trazabilidad, elige una cotización aceptada.</div><div class="clean-list">${qs.map(q=>`<button class="clean-row" data-action="convertQuote" data-id="${esc(q.id)}" data-type="quote" style="border:0;width:100%;text-align:left"><div class="doc-icon">C</div><div class="row-main"><b>${esc(q.folio)}</b><div class="meta">${esc(companyName(q.companyId))} · ${money0(q.total)}</div></div>${badge2(q.estado)}<span>›</span></button>`).join('')||'<div class="empty-state">No hay cotizaciones aceptadas disponibles.</div>'}</div>`,`<button class="btn" data-close>Cerrar</button>`);wireModal()};
  // Extend settings with operational defaults if absent.
  const oldSettings=views.settings; views.settings=()=>oldSettings().replace('</form>',`<div class="settings-card"><h3>Sincronización y nube</h3><p class="sub">Base local en IndexedDB y sincronización opcional entre celular, PC y otros dispositivos mediante Google Drive.</p><div class="sync-status"><span class="sync-dot ${driveCfg().connected?'ok':'warn'}"></span><b>${esc(driveStatus())}</b>${driveCfg().lastSyncAt?`<span class="meta">Última sincronización: ${new Date(driveCfg().lastSyncAt).toLocaleString('es-CL')}</span>`:''}</div><div class="formgrid" style="margin-top:12px">${input('driveClientId','Google OAuth Client ID',D.settings?.drive?.clientId||'')}</div><div class="actions" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${btn('driveConnect','Conectar Google Drive')}${btn('syncNow','Sincronizar ahora')}${driveCfg().connected?btn('driveDisconnect','Desconectar'):''}</div><p class="meta" style="margin-top:10px">El archivo maestro se guarda en Mi Drive / LUMO360 / LUMO360_SYNC.json. El navegador sigue funcionando sin conexión y sincroniza cuando vuelve a estar online.</p></div><div class="settings-card"><h3>Operación avanzada</h3><p class="sub">Parámetros para abastecimiento, despacho y cobranza.</p><div class="formgrid">`+input('stockReservaPct','Reserva de stock (%)',D.settings?.stockReservaPct??0,'number','min=0 max=100 step=.01')+input('diasVencimientoAviso','Aviso antes de vencimiento (días)',D.settings?.diasVencimientoAviso??5,'number','min=0')+input('despachoParcialPermitido','Permitir despacho parcial',D.settings?.despachoParcialPermitido!==false?'Sí':'No')+input('recepcionParcialPermitida','Permitir recepción parcial',D.settings?.recepcionParcialPermitida!==false?'Sí':'No')+`</div></div></form>`);
  // saveSettings wrapper for new string/number settings
  const prevAct=act; act=function(a,id,type){if(a==='driveConnect'){driveConnect();return}if(a==='syncNow'){syncNow();return}if(a==='driveDisconnect'){driveDisconnect();return}if(a==='saveSettings'){const f=document.getElementById('settingsForm');if(f){const o=Object.fromEntries(new FormData(f).entries());['stockReservaPct','diasVencimientoAviso'].forEach(k=>{if(k in o)o[k]=n(o[k])});if('despachoParcialPermitido' in o)o.despachoParcialPermitido=o.despachoParcialPermitido==='Sí';if('recepcionParcialPermitida' in o)o.recepcionParcialPermitida=o.recepcionParcialPermitida==='Sí';Object.assign(D.settings,o);D.settings.drive=D.settings.drive||{};D.settings.drive.clientId=String(o.driveClientId||D.settings.drive.clientId||'').trim();save();render();toast('Configuración guardada');return}}return prevAct(a,id,type)};
})();

boot();
</script></body></html>
