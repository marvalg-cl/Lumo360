function openFulfillment(id){const d=state.deals.find(x=>x.id===id),rows=fulfillmentForDeal(id);if(!d)return;const ready=rows.filter(r=>['recibido','fabricado','listo','completo'].includes(r.status)).length;modal(`<div class="modal-head"><h2>Expediente de cumplimiento · ${esc(companyName(d.companyId))}</h2><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="ful-head"><div><b>${esc(orderForDeal(id)?.folio||'Pedido')}</b><span>${rows.length} líneas · ${ready}/${rows.length} listas</span></div><div class="ful-actions"><button class="btn petrol" onclick="startFulfillment('${id}')">Iniciar ejecución</button><button class="btn" onclick="createPurchaseOrders('${id}')">Emitir OC de compras</button></div></div><div class="notice">Toda línea debe tener una ruta: <b>COMPRA CALZADA A PROVEEDOR</b> o <b>FABRICACIÓN</b>. La venta no avanza a entrega hasta que las líneas estén recibidas/fabricadas.</div><div class="ful-list">${rows.map(r=>`<div class="ful-row"><div class="ful-main"><div class="ful-name"><b>${esc(r.productName)}</b><span>${r.qty} ${esc(r.unit)}</span></div><div class="route"><button class="route-btn ${r.route==='compra'?'selected':''}" onclick="setRoute('${r.id}','compra')"><b>Compra calzada</b><small>Proveedor → solicitud → OC → recepción</small></button><button class="route-btn ${r.route==='fabricacion'?'selected':''}" onclick="setRoute('${r.id}','fabricacion')"><b>Fabricación</b><small>Programar → fabricar → control</small></button></div>${r.route==='compra'?`<div class="field"><label>Proveedor</label><select onchange="setProvider('${r.id}',this.value)"><option value="">Seleccionar proveedor</option>${state.suppliers.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es')).map(s=>`<option value="${s.id}" ${s.id===r.providerId?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select></div><div class="card-actions"><button class="btn gold" onclick="openLineComparison('${r.id}')">⚖ Comparar proveedo function openReceiveLine(productionId){const r=state.production.find(x=>x.id===productionId);if(!r||r.route!=='compra'){toast('Línea de compra no encontrada');return}const po=state.purchaseOrders.find(x=>x.id===r.purchaseOrderId),item=po?.items?.find(x=>x.productionId===productionId),ordered=Number(item?.orderedQty||r.qty||0),received=Number(item?.receivedQty||0);modal(`<div class="modal-head"><h2>Recepcionar · ${esc(r.productName)}</h2><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="grid2"><div class="panel"><small>Pedido</small><b style="display:block;font-size:17px">${ordered} ${esc(r.unit)}</b><small>Recibido</small><b style="display:block;font-size:17px;color:var(--petrol)">${received} ${esc(r.unit)}</b><small>Pendiente</small><b style="display:block;font-size:17px;color:var(--orange)">${Math.max(0,ordered-received)} ${esc(r.unit)}</b></div><div class="field"><label>Cantidad recibida ahora</label><input id="recvQty" type="number" min="0.01" max="${Math.max(0,ordered-received)}" step="any" value="${Math.max(0,ordered-received)}"></div></div><div class="notice" style="margin-top:12px">Puedes recepcionar por partes. La operación no avanzará a entrega hasta completar las cantidades requeridas.</div><button class="btn primary" style="margin-top:12px" onclick="registerReceipt('${productionId}')">Registrar recepción</button></div>`)}

function normalizeSearch(v){return String(v||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function smartMatches(items,query,label,detail){
 const q=normalizeSearch(query||'').trim();
 const arr=Array.isArray(items)?items.slice():[];
 const score=(x)=>{
   const a=normalizeSearch(label?.(x)||'');
   const b=normalizeSearch(detail?.(x)||'');
   if(!q)return 0;
   if(a===q)return 100;
   if(a.startsWith(q))return 80;
   if(a.includes(q))return 60;
   const hay=(a+' '+b).trim();
   if(hay.includes(q))return 40;
   const tokens=q.split(/\s+/).filter(Boolean);
   return tokens.length&&tokens.every(t=>hay.includes(t))?20:-1;
 };
 return arr.map((x,i)=>({x,i,s:score(x)})).filter(o=>o.s>=0)
   .sort((a,b)=>b.s-a.s||String(label?.(a.x)||'').localeCompare(String(label?.(b.x)||''),'es',{sensitivity:'base'})||a.i-b.i)
   .map(o=>o.x);
}

function contactModal(c){c=c||{};const companies=state.companies.slice().sort((a,b)=>companyName(a.id).localeCompare(companyName(b.id),'es'));const companyId=c.companyId||c.empresaId||'';modal(`<div class="modal-head"><div><h2>${c.id?'Editar':'Nuevo'} contacto</h2><span>Ficha de persona y relación comercial</span></div><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="section-title">Identificación</div><div class="grid2"><div class="field"><label>Nombre completo *</label><input id="ctNombre" value="${esc(c.nombre||c.name||'')}"></div><div class="field"><label>Empresa / cliente</label><select id="ctCompany"><option value="">Sin empresa</option>${companies.map(x=>`<option value="${x.id}" ${x.id===companyId?'selected':''}>${esc(companyName(x.id))} · ${esc(x.rut||'')}</option>`).join('')}</select></div><div class="field"><label>Cargo</label><input id="ctCargo" value="${esc(c.cargo||'')}"></div><div class="field"><label>Área / departamento</label><input id="ctArea" value="${esc(c.area||c.departamento||'')}"></div><div class="field"><label>Rol en la compra</label><input id="ctRol" value="${esc(c.rolCompra||c.rol||'')}" placeholder="Comprador, administrador, técnico, pago…"></div><div class="field"><label>Estado</label><select id="ctEstado"><option value="activo" ${c.estado==='activo'||!c.estado?'selected':''}>Activo</option><option value="inactivo" ${c.estado==='inactivo'?'selected':''}>Inactivo</option></select></div></div><div class="section-title">Comunicación</div><div class="grid2"><div class="field"><label>Correo</label><input id="ctCorreo" type="email" value="${esc(c.correo||c.email||'')}"></div><div class="field"><label>Teléfono</label><input id="ctTelefono" value="${esc(c.telefono||c.phone||'')}"></div><div class="field"><label>WhatsApp</label><input id="ctWhatsapp" value="${esc(c.whatsapp||'')}"></div><div class="field"><label>Canal preferido</label><select id="ctCanal"><option value="">Sin definir</option>${['WhatsApp','Correo','Teléfono','Portal','Presencial'].map(x=>`<option ${c.canalPreferido===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Zona / cobertura</label><input id="ctZona" value="${esc(c.zona||'')}"></div><div class="field"><label>Dirección de contacto</label><input id="ctDireccion" value="${esc(c.direccion||'')}"></div></div><div class="section-title">Relación y seguimiento</div><div class="grid2"><div class="field"><label>Tipo de contacto</label><select id="ctTipo"><option value="cliente" ${c.tipo==='cliente'||!c.tipo?'selected':''}>Cliente</option><option value="proveedor" ${c.tipo==='proveedor'?'selected':''}>Proveedor</option><option value="interno" ${c.tipo==='interno'?'selected':''}>Interno</option><option value="otro" ${c.tipo==='otro'?'selected':''}>Otro</option></select></div><div class="field"><label>Roles adicionales</label><input id="ctRoles" value="${esc(c.roles||'')}" placeholder="Ventas, cobranza, despacho…"></div><div class="field full"><label>Notas</label><textarea id="ctNotas">${esc(c.notas||'')}</textarea></div></div><div class="card-actions"><button class="btn primary" onclick="saveContact('${c.id||''}')">Guardar contacto</button><button class="btn" onclick="closeModal()">Cancelar</button></div></div>`)}
function saveContact(id){let c=id?state.contacts.find(x=>x.id===id):{id:uid('ct'),estado:'activo'};if(!c)return;const before=id?JSON.parse(JSON.stringify(c)):null;c.nombre=$('#ctNombre').value.trim();c.name=c.nombre;c.companyId=$('#ctCompany').value;c.empresaId=c.companyId;c.cargo=$('#ctCargo').value.trim();c.area=$('#ctArea').value.trim();c.departamento=c.area;c.rolCompra=$('#ctRol').value.trim();c.estado=$('#ctEstado').value;c.correo=$('#ctCorreo').value.trim();c.email=c.correo;c.telefono=$('#ctTelefono').value.trim();c.phone=c.telefono;c.whatsapp=$('#ctWhatsapp').value.trim();c.canalPreferido=$('#ctCanal').value;c.zona=$('#ctZona').value.trim();c.direccion=$('#ctDireccion').value.trim();c.tipo=$('#ctTipo').value;c.roles=$('#ctRoles').value.trim();c.notas=$('#ctNotas').value.trim();if(!id)state.contacts.push(c);if(c.companyId){const co=state.companies.find(x=>x.id===c.companyId);if(co&&!co.contactoPrincipalId)co.contactoPrincipalId=c.id}auditChange(id?'EDITAR CONTACTO':'CREAR CONTACTO',c.id,before,c);save();closeModal();render()}

const MASTER_FAMILIES=['Maderas','Perfiles','Paneles','Cubiertas','Tableros','Revestimientos','Aislación','Tuberías','Albañilería'];

function productModal(id){const p=id?state.products.find(x=>x.id===id):{};const margin=Number(p.margenPct??(p.precioVenta>0?((p.precioVenta-p.costo)/p.precioVenta)*100:0));const famOptions=MASTER_FAMILIES.map(x=>`<option ${String(p.familia||'')===x?'selected':''}>${esc(x)}</option>`).join('');modal(`<div class="modal-head"><div><h2>${id?'Editar':'Nuevo'} producto</h2><span>Maestro comercial LUMOBRAL</span></div><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="master-ficha"><div class="field full"><label>Nombre comercial</label><input id="pName" value="${esc(p.nombre||'')}" placeholder="Nombre completo del producto"></div><div class="field"><label>Familia del máster</label><select id="pFamily"><option value="">Seleccionar familia</option>${famOptions}</select></div><div class="field"><label>Línea</label><input id="pLine" value="${esc(p.linea||p.categoria||'')}" placeholder="Línea / categoría"></div><div class="field"><label>Subfamilia</label><input id="pSubfamily" value="${esc(p.subfamilia||'')}" placeholder="Subfamilia"></div><div class="field"><label>Tipo / especificación</label><input id="pType" value="${esc(p.tipoProducto||'')}" placeholder="Tipo, modelo o especificación"></div><div class="field"><label>Unidad</label><input id="pUnit" value="${esc(p.unidad||'UN')}" placeholder="UN, kg, m, m², ml…"></div><div class="field"><label>Costo neto</label><input id="pCost" type="number" min="0" value="${p.costo||0}" oninput="syncProductEconomics('cost')"></div><div class="field"><label>Margen %</label><input id="pMargin" type="number" min="0" step="0.1" value="${margin.toFixed(1)}" oninput="syncProductEconomics('margin')"></div><div class="field"><label>Precio venta neto</label><input id="pPrice" type="number" min="0" step="1" value="${p.precioVenta||0}" oninput="syncProductEconomics('price')"></div><div class="field full"><label>Descripción técnica</label><textarea id="pDesc" placeholder="Qué es, composición, características principales…">${esc(p.descripcion||'')}</textarea></div><div class="field"><label>Aplicaciones / usos</label><textarea id="pUses" placeholder="Usos, aplicaciones y destino…">${esc(p.usos||'')}</textarea></div><div class="field"><label>Dimensiones / espesores</label><textarea id="pDims" placeholder="Medidas, espesores, largos, densidades…">${esc(p.especificaciones||'')}</textarea></div><div class="field"><label>Normas / referencias</label><textarea id="pNorms" placeholder="Normas, certificaciones o referencias técnicas…">${esc(p.normas||'')}</textarea></div><div class="field"><label>Almacenamiento / transporte</label><textarea id="pStorage" placeholder="Condiciones de almacenamiento y transporte…">${esc(p.almacenamiento||'')}</textarea></div><div class="field"><label>Presentación / bulto</label><input id="pPack" value="${esc(p.presentacion||'')}" placeholder="Cantidad por bulto, pallet, rollo…"></div><div class="field"><label>Peso</label><input id="pWeight" value="${esc(p.peso||'')}" placeholder="Peso unitario o referencia"></div><div class="field full"><label>Observaciones comerciales</label><textarea id="pNotes" placeholder="Información adicional para cotizar y atender al cliente…">${esc(p.observaciones||'')}</textarea></div></div><div class="notice" style="margin-top:12px"><b>Margen y precio son bidireccionales.</b> Puedes ingresar el margen y Lumo360 calculará el precio, o ingresar el precio y calculará el margen sobre el precio de venta.</div><div class="card-actions" style="margin-top:12px"><button class="btn primary" onclick="saveProduct('${id||''}')">Guardar producto</button><button class="btn" onclick="showProductFicha('${id||''}')">Vista de ficha</button></div></div>`)}
function showProductFicha(id){const p=state.products.find(x=>x.id===id);if(!p){toast('Guarda el producto primero para generar su ficha');return}modal(`<div class="modal-head"><div><h2>Ficha comercial · ${esc(p.nombre)}</h2><span>${esc(p.familia||p.linea||'Producto')}</span></div><button class="ghost" onclick="closeModal()">×</button></div><div class="modal-body"><div class="grid2"><div class="panel"><div class="eyebrow">IDENTIFICACIÓN</div><p><b>Familia:</b> ${esc(p.familia||'—')}</p><p><b>Subfamilia:</b> ${esc(p.subfamilia||'—')}</p><p><b>Tipo:</b> ${esc(p.tipoProducto||'—')}</p><p><b>Unidad:</b> ${esc(p.unidad||'UN')}</p></div><div class="panel"><div class="eyebrow">ECONOMÍA</div><p><b>Costo neto:</b> ${money(p.costo)}</p><p><b>Margen:</b> ${Number(p.margenPct||0).toFixed(1)}%</p><p><b>Precio neto:</b> ${money(p.precioVenta)}</p></div></div><div class="panel" style="margin-top:12px"><div class="eyebrow">INFORMACIÓN TÉCNICA</div><p><b>Qué es:</b> ${esc(p.descripcion||'—')}</p><p><b>Usos:</b> ${esc(p.usos||'—')}</p><p><b>Especificaciones:</b> ${esc(p.especificaciones||'—')}</p><p><b>Normas:</b> ${esc(p.normas||'—')}</p><p><b>Almacenamiento:</b> ${esc(p.almacenamiento||'—')}</p><p><b>Presentación:</b> ${esc(p.presentacion||'—')}</p><p><b>Peso:</b> ${esc(p.peso||'—')}</p><p><b>Observaciones:</b> ${esc(p.observaciones||'—')}</p></div></div>`)}

function syncProductEconomics(source){const cost=Number($('#pCost')?.value||0),margin=Number($('#pMargin')?.value||0),price=Number($('#pPrice')?.value||0);if(source==='margin'){const m=Math.min(99.99,Math.max(0,margin));if($('#pPrice'))$('#pPrice').value=cost>0?Math.round(cost/(1-m/100)):0}else if(source==='price'){if($('#pMargin'))$('#pMargin').value=price>0?Math.max(0,((price-cost)/price)*100).toFixed(1):'0.0'}else if(source==='cost'){if($('#pMargin')?.value && Number($('#pMargin').value)>0){const m=Number($('#pMargin').value);if($('#pPrice'))$('#pPrice').value=cost>0?Math.round(cost/(1-m/100)):0}else if(price>0&&$('#pMargin'))$('#pMargin').value=Math.max(0,((price-cost)/price)*100).toFixed(1)}}
function saveProduct(id){
 let p=id?state.products.find(x=>x.id===id):{id:uid('prd')};
 p.nombre=$('#pName').value.trim();p.linea=$('#pLine').value.trim();p.categoria=p.linea;p.familia=$('#pFamily').value.trim();p.subfamilia=$('#pSubfamily').value.trim();p.tipoProducto=$('#pType').value.trim();p.unidad=$('#pUnit').value.trim()||'UN';
 p.costo=Math.max(0,Number($('#pCost').value||0));p.precioVenta=Math.max(0,Number($('#pPrice').value||0));p.margenPct=p.precioVenta>0?Math.max(0,((p.precioVenta-p.costo)/p.precioVenta)*100):0;
 p.descripcion=$('#pDesc')?.value.trim()||'';p.usos=$('#pUses')?.value.trim()||'';p.especificaciones=$('#pDims')?.value.trim()||'';p.normas=$('#pNorms')?.value.trim()||'';p.almacenamiento=$('#pStorage')?.value.trim()||'';p.presentacion=$('#pPack')?.value.trim()||'';p.peso=$('#pWeight')?.value.trim()||'';p.observaciones=$('#pNotes')?.value.trim()||'';
 p.sku=id?canonicalSku(p.sku):nextProductSku(p);delete p.rutaAbastecimiento;
 if(!id)state.products.push(p);state.auditLog.push({id:uid('aud'),at:new Date().toISOString(),action:id?'EDITAR PRODUCTO':'CREAR PRODUCTO',recordId:p.id});save();closeModal();render();
}
function smartPickerOpen(id){const input=$('#'+id+'Input'),list=$('#'+id+'List');if(!input||!list)return;const registry=window.__smartPickers?.[id];if(!registry)return;const matches=smartMatches(registry.items,input.value,registry.label,registry.detail).slice(0,30);list.innerHTML=matches.map(x=>`<button type="button" class="smart-picker-item" onclick="smartPickerSelect('${id}','${esc(x.id)}')"><b>${esc(registry.label(x))}</b><small>${esc(registry.detail?registry.detail(x):'')}</small></button>`).join('')||'<div class="empty">Sin coincidencias</div>';list.hidden=false}
function smartPickerSelect(id,value){const r=window.__smartPickers?.[id],x=r?.items.find(i=>i.id===value);if(!x)return;$('#'+id).value=x.id;$('#'+id+'Input').value=r.label(x);$('#'+id+'List').hidden=true;if(r.onSelect)r.onSelect(x)}
function smartPickerRegister(id,items,label,detail,onSelect){window.__smartPickers=window.__smartPickers||{};window.__smartPickers[id]={items,label,detail,onSelect}}

function deleteComparison(id){const c=(state.comparisons||[]).find(x=>x.id===id);if(!c)return;const linked=(state.rfqs||[]).filter(x=>x.comparisonId===id).length+(state.purchaseOrders||[]).filter(x=>x.comparisonId===id).length;if(linked&&!confirm(`La comparación ${c.folio||''} está vinculada a ${linked} registro(s) de abastecimiento. ¿Eliminar igualmente?`))return;if(!confirm(`Eliminar la comparación ${c.folio||'seleccionada'}? Esta acción no elimina pedidos ni órdenes de compra.`))return;const before=JSON.parse(JSON.stringify(c));state.comparisons=(state.comparisons||[]).filter(x=>x.id!==id);state.auditLog=state.auditLog||[];auditChange('ELIMINAR COMPARACIÓN',id,before,null);save();closeModal();render();toast('Comparación eliminada')}
function deleteCompany(id){const c=state.companies.find(x=>x.id===id);if(!c)return;const name=companyName(id);if(!confirm(`Eliminar el cliente ${name}? Se quitarán sus contactos y obras, pero se conservarán cotizaciones, pedidos y documentos históricos.`))return;const before=JSON.parse(JSON.stringify(c));state.companies=state.companies.filter(x=>x.id!==id);state.contacts=state.contacts.filter(x=>(x.companyId||x.empresaId)!==id);state.obras=state.obras.filter(x=>x.companyId!==id);state.deals.forEach(d=>{if(d.companyId===id){d.companyId='';d.companyNameSnapshot=name}});state.auditLog=state.auditLog||[];auditChange('ELIMINAR CLIENTE',id,before,null);save();render();toast('Cliente eliminado')}
function deleteContact(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;if(!confirm(`Eliminar el contacto ${c.nombre||c.name||''}?`))return;const before=JSON.parse(JSON.stringify(c));state.contacts=state.contacts.filter(x=>x.id!==id);state.deals.forEach(d=>{if(d.contactId===id)d.contactId='';});state.auditLog=state.auditLog||[];auditChange('ELIMINAR CONTACTO',id,before,null);save();render();toast('Contacto eliminado')}
function deleteObra(id){const o=state.obras.find(x=>x.id===id);if(!o)return;const linked=state.deals.filter(d=>d.obraId===id).length;if(linked&&!confirm(`La obra tiene ${linked} oportunidad(es) vinculada(s). Se eliminará la obra pero se conservará el historial comercial. ¿Continuar?`))return;if(!confirm(`Eliminar la obra ${o.nombre||o.name||''}?`))return;const before=JSON.parse(JSON.stringify(o));state.obras=state.obras.filter(x=>x.id!==id);state.deals.forEach(d=>{if(d.obraId===id)d.obraId='';});state.auditLog=state.auditLog||[];auditChange('ELIMINAR OBRA',id,before,null);save();render();toast('Obra eliminada')}
function deleteProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;const used=state.quotes.reduce((n,q)=>n+(q.items||[]).filter(i=>i.productId===id).length,0);if(used&&!confirm(`El producto ${p.nombre||''} aparece en ${used} línea(s) históricas de cotizaciones. Se eliminará del maestro, conservando las líneas históricas. ¿Continuar?`))return;if(!confirm(`Eliminar el producto ${p.nombre||''}?`))return;const before=JSON.parse(JSON.stringify(p));state.products=state.products.filter(x=>x.id!==id);state.auditLog=state.auditLog||[];auditChange('ELIMINAR PRODUCTO',id,before,null);save();render();toast('Producto eliminado')}

function buildOperationalExceptions(){
 const out=[];const push=(p,t,d,a)=>out.push({p,t,d,a});const validCompanyIds=new Set((state.companies||[]).map(c=>String(c.id))),validProductIds=new Set((state.products||[]).map(p=>String(p.id)));
 (state.deals||[]).filter(d=>d.status!=='perdido').forEach(d=>{const stage=stageForDeal(d),q=quoteForDeal(d.id),rows=fulfillmentForDeal(d.id);if(!d.companyId||!validCompanyIds.has(String(d.companyId)))push('ALTA','Oportunidad sin cliente',dealLabel(d),'clientes');if(stage==='cotizar'&&!q)push('ALTA','Cotización pendiente',`${companyName(d.companyId)} · oportunidad sin cotización`,'cotizaciones');if(q&&(q.items||[]).some(i=>!validProductIds.has(String(i.productId))))push('ALTA','Producto inexistente en cotización',q.folio||d.id,'productos');if(stage==='confirmar'&&(!q||q.status!=='aceptada'))push('ALTA','Pedido pendiente de confirmación',`${companyName(d.companyId)} · ${q?.folio||'sin cotización'}`,'cotizaciones');if(stage==='abastecer'&&rows.some(r=>!r.route))push('ALTA','Línea sin ruta',`${q?.folio||d.id} · definir compra o fabricación`,'abastecimiento');if(stage==='abastecer'&&rows.some(r=>r.route==='compra'&&!r.providerId))push('MEDIA','Compra sin proveedor',q?.folio||d.id,'proveedores');if(stage==='cumplir'&&rows.some(r=>r.route==='compra'&&!r.purchaseOrderId))push('MEDIA','Compra sin OC',q?.folio||d.id,'abastecimiento');if(stage==='entregar'&&rows.some(r=>!['listo','recibido','fabricado','completo'].includes(r.status)))push('ALTA','Entrega bloqueada',`${companyName(d.companyId)} · hay líneas no listas`,'linea');if(stage==='cerrar'){const f=(state.facturas||[]).find(x=>x.dealId===d.id);if(!f)push('MEDIA','Cierre sin facturación',companyName(d.companyId),'finanzas');else if(f.estado!=='pagada')push('MEDIA','Cobranza pendiente',`${f.folio||'Factura'} · ${companyName(d.companyId)}`,'finanzas');}});
 (state.products||[]).forEach(p=>{if(!String(p.nombre||'').trim())push('MEDIA','Producto sin nombre',p.id,'productos');if(Number(p.costo||0)<0||Number(p.precioVenta||0)<0)push('ALTA','Producto con valor inválido',p.nombre||p.id,'productos');if(Number(p.precioVenta||0)>0&&Number(p.costo||0)>Number(p.precioVenta||0))push('MEDIA','Margen negativo',p.nombre||p.id,'productos');});
 (state.companies||[]).forEach(c=>{if(!String(c.rut||'').trim())push('MEDIA','Cliente sin RUT',companyName(c.id),'clientes');});
 (state.quotes||[]).forEach(q=>{if(!q.dealId||!state.deals.some(d=>d.id===q.dealId))push('ALTA','Cotización huérfana',q.folio||q.id,'cotizaciones');if(!(q.items||[]).length)push('MEDIA','Cotización sin líneas',q.folio||q.id,'cotizaciones');});return out;
}
function downloadTextFile(filename,text,type='application/json'){
 const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
}
function localBackupPayload(){
 return JSON.stringify({app:'Lumo360',version:'-TRANSVERSAL-AUDIT',createdAt:new Date().toISOString(),state},null,2);
}
function auditFunctionSurface(){
 const html=document.documentElement.outerHTML;
 const defs=new Set(Array.from(html.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g),m=>m[1]));
 const missing=[];
 for(const m of html.matchAll(/onclick="([^"]+)"/g)){
   for(const f of m[1].matchAll(/\b([A-Za-z_$][\w$]*)\s*\(/g)){
     const n=f[1];if(['confirm','prompt','setTimeout','nav','reload','stopPropagation'].includes(n))continue;if(!defs.has(n))missing.push(n)
   }
 }
 return [...new Set(missing)];
}
function normalizeArchivedPdfNames(){
 let changed=0;
 (state.pdfArchive||[]).forEach(a=>{const q=state.quotes.find(x=>x.id===a.quoteId);if(!q)return;const d=state.deals.find(x=>x.id===q.dealId);const c=d?state.companies.find(x=>x.id===d.companyId):null;const expected=quotePdfFileName(q.dealId);if(a.filename!==expected){a.filename=expected;changed++}});
 return changed;
}
function regressionAudit(){
 normalize();sanitizeAllSkus();
 const issues=[];
 const missingFns=auditFunctionSurface();
 if(missingFns.length)issues.push('Funciones llamadas pero no definidas: '+missingFns.join(', '));
 normalizeArchivedPdfNames();
 const views=['control','linea','cotizaciones','pedidos','abastecimiento','clientes','contactos','obras','productos','proveedores','comparador','inventario','documentos','finanzas','config'];
 const renderMap={control:'renderControl360',linea:'renderLine',cotizaciones:'renderQuotes',pedidos:'renderPedidos',abastecimiento:'renderAbastecimiento',clientes:'renderCompanies',contactos:'renderContacts',obras:'renderObras',productos:'renderProducts',proveedores:'renderSuppliers',comparador:'renderRFQ',inventario:'renderInventory',documentos:'renderDocs',finanzas:'renderFinance',config:'renderConfig'};
 views.forEach(v=>{if(typeof window[renderMap[v]]!=='function')issues.push('Módulo sin cargador: '+v)});
 if(typeof smartMatches!=='function')issues.push('Buscador integral no disponible');
 if(typeof buildQuotePdf!=='function')issues.push('Generador PDF no disponible');
 ['supplierName','openFulfillment','openLineComparison','openOrder','showObraFicha','showSupplierFicha','deleteComparison','renderFinance'].forEach(fn=>{if(typeof window[fn]!=='function')issues.push('Dependencia crítica ausente: '+fn)});
 if(typeof quoteClientInput!=='function'||typeof quoteProductInput!=='function')issues.push('Buscadores del cotizador incompletos');
 const validCompanyIds=new Set(state.companies.map(c=>String(c.id)));
 const validProductIds=new Set(state.products.map(p=>String(p.id)));
 const seenSkus=new Set();
 state.products.forEach(p=>{
   p.sku=canonicalSku(p.sku);
   if(p.sku&&seenSkus.has(p.sku))issues.push('SKU duplicado: '+p.sku);
   if(p.sku)seenSkus.add(p.sku);
   const c=Number(p.costo)||0,pr=Number(p.precioVenta)||0;
   if(c<0||pr<0)issues.push('Valor negativo en producto: '+(p.nombre||p.id));
   p.margenPct=pr>0?Math.max(0,((pr-c)/pr)*100):0;
 });
 state.deals.forEach(d=>{
   if(d.companyId&&!validCompanyIds.has(String(d.companyId)))issues.push('Oportunidad sin cliente válido: '+(d.id||''));
 });
 state.quotes.forEach(q=>{
   const d=state.deals.find(x=>x.id===q.dealId);
   if(!d)issues.push('Cotización huérfana: '+(q.folio||q.id));
   if((q.items||[]).some(i=>i.productId&&!validProductIds.has(String(i.productId))))issues.push('Producto inexistente en '+(q.folio||q.id));
   delete q.discount;
 });
 
 return issues;
}

function runFullOperationalAudit(){
 const regression=regressionAudit();const operational=buildOperationalExceptions();const e=[...regression,...operational];state.settings.lastAuditAt=new Date().toISOString();state.settings.lastAuditCount=e.length;state.auditLog=state.auditLog||[];state.auditLog.push({id:uid('aud'),at:new Date().toISOString(),action:'AUDITORIA TRANSVERSAL',recordId:'LUMO360'});persistNow();render();toast(e.length?`Auditoría terminada: ${e.length} excepciones operativas.`:'Auditoría terminada: sin excepciones críticas.');
}
function renderControl360(){
 const deals=state.deals||[],quotes=state.quotes||[],orders=state.lineOrders||[],prod=state.production||[],sup=state.suppliers||[],inv=state.facturas||[],
   prospect=deals.filter(d=>stageForDeal(d)==='prospectar').length,
   cotizar=deals.filter(d=>stageForDeal(d)==='cotizar').length,
   confirmar=deals.filter(d=>stageForDeal(d)==='confirmar').length,
   abastecer=deals.filter(d=>stageForDeal(d)==='cumplir').length,
   entregar=deals.filter(d=>stageForDeal(d)==='entregar').length,
   cerradas=deals.filter(d=>stageForDeal(d)==='cerrar').length,
   qPending=quotes.filter(q=>q.status==='borrador'||q.status==='enviada').length,
   purchasePending=prod.filter(x=>x.status!=='completo').length,
   alerts=[];
 deals.filter(d=>stageForDeal(d)==='cotizar'&&!quoteForDeal(d.id)).slice(0,12).forEach(d=>alerts.push({type:'VENTA',text:`${dealLabel(d)} está lista para cotizar pero no tiene cotización.`}));
 quotes.filter(q=>(q.status==='borrador'||q.status==='enviada')&&!(q.items||[]).length).slice(0,12).forEach(q=>alerts.push({type:'COTIZACIÓN',text:`${q.folio||'Cotización'} no contiene líneas.`}));
 orders.filter(o=>!prod.some(p=>p.dealId===o.dealId)).slice(0,12).forEach(o=>alerts.push({type:'ABASTECIMIENTO',text:`${o.folio||'Pedido'} no tiene líneas de abastecimiento.`}));
 prod.filter(p=>p.status!=='completo'&&!p.providerId&&p.route==='compra').slice(0,12).forEach(p=>alerts.push({type:'COMPRA',text:`${p.productName||productName(p.productId)} requiere proveedor.`}));
 $('#view').innerHTML=`<div class="hero"><div><div class="eyebrow">LUMO360 · –</div><h1>Centro de Control 360°</h1><p>La operación completa de LUMOBRAL en una sola línea: prospectar → cotizar → confirmar → abastecer → comprar/fabricar → entregar → cobrar.</p></div><button class="btn primary" onclick="openNewDeal()">＋ Nueva oportunidad</button></div>
 <div class="control-flow"><div class="control-stage"><b>01</b><span>PROSPECTAR</span><strong>${prospect}</strong></div><div class="control-stage"><b>02</b><span>COTIZAR</span><strong>${cotizar}</strong></div><div class="control-stage"><b>03</b><span>CONFIRMAR</span><strong>${confirmar}</strong></div><div class="control-stage"><b>04</b><span>ABASTECER</span><strong>${abastecer}</strong></div><div class="control-stage"><b>05</b><span>COMPRAR / FABRICAR</span><strong>${purchasePending}</strong></div><div class="control-stage"><b>06</b><span>ENTREGAR</span><strong>${entregar}</strong></div><div class="control-stage"><b>07</b><span>COBRAR / CERRAR</span><strong>${inv.filter(x=>x.estado!=='pagada').length}</strong></div></div>
 <div class="module-kpis"><div class="kpi-mini"><b>${deals.length}</b><span>Oportunidades</span></div><div class="kpi-mini"><b>${quotes.length}</b><span>Cotizaciones</span></div><div class="kpi-mini"><b>${qPending}</b><span>Cotizaciones abiertas</span></div><div class="kpi-mini"><b>${orders.length}</b><span>Pedidos</span></div><div class="kpi-mini"><b>${purchasePending}</b><span>Líneas por abastecer</span></div><div class="kpi-mini"><b>${sup.length}</b><span>Proveedores</span></div></div>
 <div class="control-grid"><section class="panel"><div class="section-head"><div><h3 class="section-title">Alertas de continuidad</h3><p class="muted">Lo que puede detener una venta antes de entregar.</p></div><span class="badge ${alerts.length?'danger':''}">${alerts.length}</span></div>${alerts.map(a=>`<div class="control-alert"><b>${esc(a.type)}</b><span>${esc(a.text)}</span></div>`).join('')||'<div class="empty">No se detectan bloqueos básicos en la línea.</div>'}</section><section class="panel"><h3 class="section-title">Accesos de operación</h3><div class="control-actions"><button class="btn" onclick="nav('clientes')">Clientes</button><button class="btn" onclick="nav('contactos')">Contactos</button><button class="btn" onclick="nav('obras')">Obras</button><button class="btn" onclick="nav('cotizaciones')">Cotizaciones</button><button class="btn" onclick="nav('productos')">Productos</button><button class="btn" onclick="nav('proveedores')">Proveedores</button><button class="btn" onclick="nav('comparador')">Comparador</button><button class="btn" onclick="nav('documentos')">Documentos</button><button class="btn" onclick="nav('finanzas')">Finanzas</button><button class="btn" onclick="nav('config')">Configuración</button></div></section></div>
 <section class="panel"><div class="section-head"><div><h3 class="section-title">Excepciones operativas</h3><p class="muted">El sistema busca bloqueos que impedirían cotizar, comprar, fabricar, entregar o cobrar.</p></div><button class="btn" onclick="runFullOperationalAudit()">Auditar ahora</button></div>${(()=>{const ex=buildOperationalExceptions().slice(0,16);return ex.length?`<div class="exception-list">${ex.map(x=>`<button class="exception-row" onclick="nav('${x.a}')"><span class="badge ${x.p==='ALTA'?'danger':'gold'}">${x.p}</span><b>${esc(x.t)}</b><span>${esc(x.d)}</span><em>→</em></button>`).join('')}</div>`:'<div class="empty">No se detectan excepciones críticas en los datos actuales.</div>'})()}</section>
 <section class="panel"><div class="section-head"><div><h3 class="section-title">Fases implementadas</h3><p class="muted">No son módulos aislados: son estaciones de la misma operación.</p></div><span class="badge">–</span></div><div class="phase-grid">${[['','Datos maestros','clientes · contactos · obras'],['','Prospección','oportunidad y seguimiento'],['','Cotización','productos · margen · IVA · PDF'],['','Pedido','confirmación comercial'],['','Abastecimiento','necesidades por línea'],['','Comparador','Neto/Bruto · flete · plazo'],['','Compra / fabricación','ruta de cumplimiento'],['','Entrega','documentos y trazabilidad'],['','Cobranza','facturación · CxC · CxP'],['','Gobierno','configuración · respaldo · continuidad']].map(p=>`<article class="phase-card"><b>${p[0]}</b><strong>${p[1]}</strong><span>${p[2]}</span></article>`).join('')}</div></section>`;
}

window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&state)try{localPut()}catch(e){}});
boot();setTimeout(registerPwaServiceWorker,800);
