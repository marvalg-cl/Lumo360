<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E274A">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="Lumo360">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumo360">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lumo360</title>
<style>
/* ============================================================
   Lumo360 · hoja de estilos única
   Orden: tokens → base → layout → componentes → vistas.
   Cada regla se define una sola vez; no hay capas de corrección.
   ============================================================ */

/* ---------- 1. Tokens ---------- */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F7F9FD; --surface-3:#EDF2F9;
  --ink:#0F1E36; --ink-2:#44546F; --ink-3:#66758E;
  --line:#E1E8F2; --line-2:#CBD6E6;
  --brand:#0E274A; --brand-2:#1B3F73; --brand-soft:#E6EDF8; --on-brand:#FFFFFF;
  --accent:#F28C28; --accent-2:#D9730D; --on-accent:#1B1204;
  --ok:#128A52; --ok-bg:#E2F5EA; --warn:#9A6209; --warn-bg:#FDF1D8;
  --bad:#C03232; --bad-bg:#FBE4E4; --info:#245FA8; --info-bg:#E3EEFB;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(15,30,54,.06),0 4px 14px rgba(15,30,54,.05);
  --shadow-2:0 10px 34px rgba(15,30,54,.16);
  --ring:0 0 0 3px rgba(36,95,168,.28);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-w:252px; --bar-h:58px; --tab-h:66px; --gap:16px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#08121F; --surface:#0F1D31; --surface-2:#132440; --surface-3:#183052;
  --ink:#EAF0FA; --ink-2:#B3C1D8; --ink-3:#8C9CB6;
  --line:#1E3454; --line-2:#2A4570;
  --brand:#7FA8E8; --brand-2:#9DBDF0; --brand-soft:#16294A; --on-brand:#08121F;
  --ok:#4CC58A; --ok-bg:#12331F; --warn:#E8B656; --warn-bg:#3A2D10;
  --bad:#F08080; --bad-bg:#3A1A1A; --info:#7FB2F0; --info-bg:#12294A;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 10px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}

/* ---------- 2. Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100dvh}
h1,h2,h3,h4,p{margin:0}
h1{font-size:22px;line-height:1.2;font-weight:750;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
svg{display:block}
[hidden]{display:none}
:focus-visible{outline:none;box-shadow:var(--ring)}
::selection{background:var(--brand-soft)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.right{text-align:right}
.strong{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 3. Estructura ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100dvh}
.nav{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--brand);color:#DCE7F8;overflow-y:auto}
:root[data-theme=dark] .nav{background:var(--surface);border-right:1px solid var(--line);color:var(--ink-2)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#F7A042);display:grid;place-items:center;color:#2A1604;font-weight:800;font-size:18px;flex:none}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.01em;color:#fff}
:root[data-theme=dark] .brand-name{color:var(--ink)}
.brand-sub{font-size:12px;opacity:.7}
.nav-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.55;padding:14px 10px 4px}
.nav-link{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:var(--r-md);color:inherit;text-decoration:none;font-weight:600;font-size:14.5px}
.nav-link:hover{background:rgba(255,255,255,.08)}
.nav-link[aria-current=page]{background:rgba(255,255,255,.14);color:#fff}
:root[data-theme=dark] .nav-link:hover{background:var(--surface-2)}
:root[data-theme=dark] .nav-link[aria-current=page]{background:var(--brand-soft);color:var(--ink)}
.nav-link .ico{width:20px;height:20px;flex:none}
.nav-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;opacity:.6}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:var(--bar-h);padding:0 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-title{font-size:17px;font-weight:750;flex:1;min-width:0}
.bar .bar-menu{display:none}
.page{width:100%;max-width:1240px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:var(--gap);flex:1}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--ink-3);margin-top:3px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:none}
.bar .bar-cta{display:inline-flex}

/* ---------- 4. Componentes ---------- */
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);font-weight:650;font-size:14.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.accent:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn.icon{width:40px;padding:0}
.btn.icon.sm{width:34px}
.btn.block{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card-head h2{font-size:16px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.cluster{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:var(--gap)}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--gap);align-items:start}

.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.kpi-label{font-size:12.5px;font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:26px;font-weight:780;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-note{font-size:13px;color:var(--ink-3)}
.kpi.is-bad .kpi-value{color:var(--bad)}
.kpi.is-ok .kpi-value{color:var(--ok)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 13px;border:1px solid var(--line-2);border-radius:var(--r-pill);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none}

.badge{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--info-bg);color:var(--info)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:13px;font-weight:650;color:var(--ink-2)}
.input{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);color:var(--ink)}
.input::placeholder{color:var(--ink-3)}
.input:focus{outline:none;border-color:var(--info);box-shadow:var(--ring)}
textarea.input{min-height:84px;resize:vertical}
.input[aria-invalid=true]{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--ink-3)}
.error{font-size:12.5px;color:var(--bad)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .wide{grid-column:1/-1}

.search{display:flex;align-items:center;gap:9px;min-height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);color:var(--ink-3);flex:1;min-width:180px}
.search:focus-within{border-color:var(--info);box-shadow:var(--ring)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.combo{position:relative}
.combo-list{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);max-height:min(320px,48dvh);overflow-y:auto;padding:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow-2)}
.combo-opt{display:flex;flex-direction:column;gap:1px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer}
.combo-opt[aria-selected=true],.combo-opt:hover{background:var(--brand-soft)}
.combo-opt small{color:var(--ink-3);font-size:12.5px}
.combo-empty{padding:12px;color:var(--ink-3);font-size:14px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.list>.row:first-child{border-top:0}
a.row:hover,.row.is-link:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row>.btn,.row>.row-amount,.row>.row-side{flex:none}
.avatar{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:750}
.row-title{font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row-amount{font-weight:750;font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty .ico{width:34px;height:34px;opacity:.6}
.empty h3{color:var(--ink)}

.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 84px 64px 112px 76px 112px 40px;gap:8px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
.line .total{font-weight:750;text-align:right;padding-bottom:10px}
.totals{display:flex;flex-direction:column;gap:9px}
.totals-row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.totals-row.big{padding-top:10px;border-top:1px solid var(--line);font-size:20px;font-weight:800}
.totals-row.internal{color:var(--ink-3);font-size:13px}

.seg{display:inline-flex;padding:3px;border-radius:var(--r-md);background:var(--surface-3)}
.seg{flex-wrap:wrap}
.seg label{position:relative;display:inline-flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg label span{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:calc(var(--r-md) - 3px);font-weight:650;font-size:14px;color:var(--ink-2)}
.seg label:has(input:checked) span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg label:has(input:focus-visible) span{box-shadow:var(--ring)}
.seg button{min-height:34px;padding:0 14px;border:0;border-radius:calc(var(--r-md) - 3px);background:transparent;font-weight:650;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-pill);background:var(--surface-3);font-size:13px;font-weight:650;color:var(--ink-3)}
.step.is-done{background:var(--ok-bg);color:var(--ok)}
.step.is-now{background:var(--brand);color:var(--on-brand)}

.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-line{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:10px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.bar-fill{height:100%;border-radius:inherit;background:var(--brand-2)}

/* ---------- Capas flotantes ---------- */
.scrim{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,18,31,.55)}
.sheet{width:min(560px,100%);max-height:min(88dvh,820px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-2);overflow:hidden}
.sheet.wide{width:min(760px,100%)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.toasts{position:fixed;z-index:120;left:50%;bottom:calc(var(--tab-h) + 18px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow-2)}
.lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:var(--bg)}
.lock-box{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lock-box .input{text-align:center;font-size:24px;letter-spacing:.4em}

.print-only{display:none}

/* ---------- 5. Adaptación ---------- */
.sumbar{display:none}
/* ---- Abastecimiento y finanzas ---- */
.sol-item{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
.sol-head{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:10px;align-items:end}
.sol-offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.offer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);cursor:pointer}
.offer .offer-name{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offer .input{grid-column:1/-1}
.offer.is-best{border-color:var(--ok)}
.offer.is-picked{background:var(--brand-soft);border-color:var(--brand)}
.sup-list{border-top:1px solid var(--line)}
.sup{display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sup:last-child{border-bottom:0}
.sup-info{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sup .cluster{margin-top:4px}
.offer-hint{grid-column:1/-1;min-height:1em}
.plan{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--ok);border-radius:var(--r-md);background:var(--ok-bg)}
.plan .label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ok)}
.table-wrap{overflow-x:auto;margin:-4px}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.cmp th[scope=row]{font-weight:650;min-width:130px}
.cmp th small,.cmp td small{display:block;font-weight:500;color:var(--ink-3)}
.cmp .num{text-align:right;white-space:nowrap}
.cmp td.is-best{color:var(--ok);font-weight:750}
.cmp td.is-picked{background:var(--brand-soft)}
.cmp tfoot th,.cmp tfoot td{color:var(--ink-2)}
.cmp tr.total th,.cmp tr.total td{color:var(--ink);font-weight:780;border-bottom:0}
.card-head.flush{padding:0}
.row-amount.neg{color:var(--bad)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-3)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.d1{background:var(--brand-2)}.d2{background:var(--ok)}.d3{background:var(--accent)}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.month{display:flex;flex-direction:column;align-items:center;gap:6px}
.mbars{display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%;height:160px;border-bottom:1px solid var(--line-2)}
.mb{flex:1;max-width:22px;min-height:2px;border-radius:5px 5px 0 0}
.mlabel{font-size:12px;color:var(--ink-3);text-transform:capitalize}

@media (max-width:1100px){
  .split{grid-template-columns:minmax(0,1fr)}
  .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  :root{--gap:14px}
  .app{display:block}
  .nav{position:fixed;z-index:70;inset:0 auto 0 0;width:min(300px,84vw);height:100dvh;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow-2)}
  .app[data-nav=open] .nav{transform:none}
  .bar{padding:0 14px}
  .bar .bar-menu{display:inline-flex}
  .bar .bar-cta{display:none}
  .sumbar{position:sticky;bottom:calc(var(--tab-h) + 10px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-2)}
  .page{padding:14px 14px calc(var(--tab-h) + 24px)}
  h1{font-size:20px}
  .tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;height:var(--tab-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:650;color:var(--ink-3);text-decoration:none;background:none;border:0}

(() => {

/* ============================================================
   01 · Utilidades: plantillas seguras, formatos chilenos, fechas, íconos

/* ---- Plantillas HTML con escape automático ---- */

const part = v => v instanceof Safe ? v.s : Array.isArray(v) ? v.map(part).join('') : v === false || v == null ? '' : esc(v);

const mount = (el, safe) => { el.innerHTML = safe instanceof Safe ? safe.s : String(safe); };

/* ---- Íconos (trazo, 24x24) ---- */
const ICON_PATHS = {

};
const icon = (name, cls = '') => raw(`<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_PATHS[name] || ICON_PATHS.doc}"/></svg>`);

/* ---- Identificadores y copias ---- */
const uid = (p = '') => p + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 12) : Math.random().toString(36).slice(2, 14));
const clone = v => JSON.parse(JSON.stringify(v));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---- Números y dinero (CLP) ---- */
const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/\./g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const dec = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const round = n => Math.round(n);
const nf = new Intl.NumberFormat('es-CL');
const money = n => '$' + nf.format(round(n));
const pct = n => (Math.round(n * 10) / 10).toLocaleString('es-CL') + ' %';
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);

/* ---- Fechas (siempre texto ISO AAAA-MM-DD, hora local) ---- */
const pad2 = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => isoDate(new Date());
const parseDate = s => { const [y, m, d] = String(s || '').split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
const addDays = (s, n) => { const d = parseDate(s) || new Date(); d.setDate(d.getDate() + n); return isoDate(d); };
const diffDays = (a, b) => Math.round((parseDate(a) - parseDate(b)) / 864e5);
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fdate = s => { const d = parseDate(s); return d ? `${pad2(d.getDate())}-${pad2(d.getMonth() + 1)}-${d.getFullYear()}` : '—'; };
const fdateLong = s => { const d = parseDate(s); return d ? `${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}` : '—'; };
const monthKey = s => String(s || '').slice(0, 7);

/* ---- RUT chileno ---- */
const rutClean = v => String(v || '').replace(/[^0-9kK]/g, '').toUpperCase();
const rutDV = body => { let s = 0, m = 2; for (let i = body.length - 1; i >= 0; i--) { s += Number(body[i]) * m; m = m === 7 ? 2 : m + 1; } const r = 11 - (s % 11); return r === 11 ? '0' : r === 10 ? 'K' : String(r); };
const rutFormat = v => { const c = rutClean(v); if (c.length < 2) return c; const body = c.slice(0, -1); return body.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + c.slice(-1); };
const rutValid = v => { const c = rutClean(v); return c.length >= 2 && /^\d+$/.test(c.slice(0, -1)) && rutDV(c.slice(0, -1)) === c.slice(-1); };

/* ---- Teléfonos y mensajería ---- */
const phoneDigits = v => String(v || '').replace(/\D/g, '');
const phoneFormat = v => { let d = phoneDigits(v); if (d.startsWith('56')) d = d.slice(2); if (!d) return ''; return '+56 ' + d.replace(/^(\d)(\d{4})(\d{0,4}).*/, (m, a, b, c) => c ? `${a} ${b} ${c}` : `${a} ${b}`); };
const waNumber = v => { let d = phoneDigits(v); if (d.length === 9 && d[0] === '9') d = '56' + d; else if (d.length === 8) d = '569' + d; return d.length >= 11 ? d : ''; };
const waLink = (phone, text) => `https://wa.me/${waNumber(phone)}?text=${encodeURIComponent(text)}`;
const mailLink = (to, subject, body) => `mailto:${encodeURIComponent(to || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

/* ---- Texto ---- */
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const byName = (a, b) => String(a).localeCompare(String(b), 'es', { sensitivity: 'base', numeric: true });
const plural = (n, one, many) => `${nf.format(n)} ${n === 1 ? one : many}`;
const initials = s => String(s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

/* ---- Descargas ---- */
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); };
const readFileText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f); });
const readFileDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f); });


/* ============================================================
   02 · Datos: esquema, persistencia en IndexedDB y reglas de negocio
   ============================================================ */

const SCHEMA = 2;
const COLLECTIONS = ['clientes', 'contactos', 'proveedores', 'productos', 'cotizaciones', 'pedidos', 'documentos', 'solicitudes', 'compras', 'movimientos'];

const defaultData = () => ({
  schema: SCHEMA,
  settings: {
    empresa: { razonSocial: 'Comercial y Constructora Lumobral SpA', nombreCorto: 'Lumobral', rut: '78.205.813-4', giro: 'Comercial y Constructora', direccion: 'Mz H, Lote 5, Villa Cordillera', comuna: 'Curicó', correo: 'lumobral@gmail.com', telefono: '', whatsapp: '+56 9 3630 9424', web: '', instagram: '@lumobralconstruye' },
    banco: { banco: 'Banco de Chile', tipo: 'Cuenta Vista', numero: '', titular: 'Comercial y Constructora Lumobral SpA', rut: '78.205.813-4', correo: 'lumobral@gmail.com' },
    ventas: { iva: 19, validezDias: 7, plazoPagoDias: 30, condiciones: 'Precios en pesos chilenos. Despacho y descarga según acuerdo. Valores sujetos a disponibilidad de stock al momento de confirmar.' },
    folios: { cot: 'COT', ped: 'PED', fac: 'FAC', bol: 'BOL', sol: 'SOL', oc: 'OC' },
    ui: { tema: 'auto', logo: '' },
    pinHash: '', pinSalt: '', pinMinutos: 5,
  },
  counters: { cot: 0, ped: 0, fac: 0, bol: 0, sol: 0, oc: 0 },
  clientes: [], contactos: [], proveedores: [], productos: [], cotizaciones: [], pedidos: [], documentos: [], solicitudes: [], compras: [], movimientos: [],
});

/* ---- Persistencia ---- */
const IDB_NAME = 'lumo360', IDB_STORE = 'kv', IDB_KEY = 'db', LS_KEY = 'lumo360-db';
const idb = {
  open: () => new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  get: async () => { const db = await idb.open(); return new Promise((res, rej) => { const q = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(IDB_KEY); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  put: async value => { const db = await idb.open(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).put(value, IDB_KEY); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
};

const Store = (() => {
  let data = defaultData();
  const subs = new Set();
  let dirty = false, saving = Promise.resolve(), lastSaved = 0;

  const merge = (base, over) => {
    for (const k of Object.keys(over || {})) {
      if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], over[k]);
      else base[k] = over[k];
    }
    return base;
  };
  const adopt = obj => { data = merge(defaultData(), obj || {}); COLLECTIONS.forEach(c => { if (!Array.isArray(data[c])) data[c] = []; }); };

  const persist = () => {
    dirty = false;
    const snapshot = clone(data);
    saving = saving.then(async () => {
      try { await idb.put(snapshot); lastSaved = Date.now(); }
      catch (e) { try { localStorage.setItem(LS_KEY, JSON.stringify(snapshot)); lastSaved = Date.now(); } catch (_) { toast('No se pudo guardar en este navegador', 'bad'); } }
    });
    return saving;
  };
  const schedule = debounce(persist, 350);

  return {
    get data() { return data; },
    get lastSaved() { return lastSaved; },
    async load() {
      let stored = null;
      try { stored = await idb.get(); } catch (_) { /* sin IndexedDB */ }
      if (!stored) { try { stored = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (_) { stored = null; } }
      adopt(stored);
    },
    commit() { dirty = true; schedule(); subs.forEach(f => f()); },
    flush() { return dirty ? persist() : saving; },
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    replace(obj) { adopt(obj); this.commit(); },
    reset() { adopt(null); this.commit(); },
  };
})();

const D = () => Store.data;
const S = () => Store.data.settings;
addEventListener('pagehide', () => Store.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flush(); });

/* ---- Acceso a colecciones ---- */
const find = (coll, id) => D()[coll].find(x => x.id === id);
const upsert = (coll, obj) => { const list = D()[coll]; const i = list.findIndex(x => x.id === obj.id); if (i >= 0) list[i] = obj; else list.push(obj); Store.commit(); return obj; };
const remove = (coll, id) => { D()[coll] = D()[coll].filter(x => x.id !== id); Store.commit(); };
const nextFolio = kind => { const d = D(); d.counters[kind] = (d.counters[kind] || 0) + 1; return `${S().folios[kind]}-${String(d.counters[kind]).padStart(4, '0')}`; };
const peekFolio = kind => `${S().folios[kind]}-${String((D().counters[kind] || 0) + 1).padStart(4, '0')}`;

/* ---- Reglas de negocio: cotizaciones ---- */
const lineNet = l => round(num(l.cant) * num(l.precio) * (1 - num(l.dscto) / 100));
const lineCost = l => round(num(l.cant) * num(l.costo));
const totals = (lines, ivaRate = S().ventas.iva) => {
  const neto = sum(lines, lineNet), iva = round(neto * ivaRate / 100), costo = sum(lines, lineCost);
  return { neto, iva, total: neto + iva, costo, margen: neto - costo, margenPct: neto ? (neto - costo) / neto * 100 : 0 };
};
const QUOTE_STATES = { borrador: 'Borrador', enviada: 'Enviada', aceptada: 'Aceptada', rechazada: 'Rechazada', vencida: 'Vencida' };
const quoteState = q => (q.estado === 'enviada' && q.vence && q.vence < today()) ? 'vencida' : q.estado;
const quoteDaysLeft = q => q.vence ? diffDays(q.vence, today()) : null;
const newQuote = () => ({
  id: uid('q'), folio: '', fecha: today(), vence: addDays(today(), S().ventas.validezDias), clienteId: '', contactoId: '', obra: '',
  estado: 'borrador', lineas: [], notas: '', condiciones: S().ventas.condiciones, ivaRate: S().ventas.iva, historial: [],
});
const newLine = prod => ({ id: uid('l'), productoId: prod?.id || '', sku: prod?.sku || '', nombre: prod?.nombre || '', cant: 1, unidad: prod?.unidad || 'UN', precio: prod?.precio || 0, dscto: 0, costo: prod?.costo || 0 });

/* ---- Reglas de negocio: documentos de venta y cobranza ---- */
const docPaid = d => sum(d.pagos || [], p => p.monto);
const docBalance = d => d.anulado ? 0 : Math.max(0, d.total - docPaid(d));
const docState = d => d.anulado ? 'anulada' : docBalance(d) <= 0 ? 'pagada' : (d.vence && d.vence < today()) ? 'vencida' : docPaid(d) > 0 ? 'parcial' : 'pendiente';
const DOC_STATES = { pendiente: 'Pendiente', parcial: 'Abonada', vencida: 'Vencida', pagada: 'Pagada', anulada: 'Anulada' };
const docDaysOverdue = d => d.vence ? Math.max(0, diffDays(today(), d.vence)) : 0;
const clientBalance = id => sum(D().documentos.filter(d => d.clienteId === id), docBalance);

const ORDER_STATES = { pendiente: 'Pendiente', preparacion: 'En preparación', despachado: 'Despachado', entregado: 'Entregado', anulado: 'Anulado' };
const ORDER_FLOW = ['pendiente', 'preparacion', 'despachado', 'entregado'];

/* ---- Reglas de negocio: abastecimiento e inventario ---- */
const PO_STATES = { borrador: 'Borrador', enviada: 'Enviada', recibida: 'Recibida', anulada: 'Anulada' };
const poTotals = o => totals(o.lineas.map(l => ({ ...l, precio: l.costo, dscto: 0 })), o.ivaRate);
const stockOf = id => sum(D().movimientos.filter(m => m.productoId === id), m => m.cant);

/* ---- Textos de apoyo ---- */
const clientName = id => find('clientes', id)?.nombre || 'Sin cliente';
const contactLabel = c => [c.nombre, c.cargo].filter(Boolean).join(' · ');
const primaryContact = clienteId => { const cs = D().contactos.filter(c => c.entidad === 'cliente' && c.entidadId === clienteId); return cs.find(c => c.principal) || cs[0]; };
const logChange = (obj, estado) => { (obj.historial ||= []).push({ fecha: new Date().toISOString(), estado }); };


/* ============================================================
   03 · Interfaz: acciones, avisos, hojas modales, selector predictivo, router
   ============================================================ */

/* ---- Acciones por atributo (sin handlers en línea) ----
   data-act="nombre"     → clic
   data-input="nombre"   → evento input
   data-change="nombre"  → evento change                       */
const actions = {}, inputs = {}, changes = {};
const on = (map, name, fn) => { if (map[name]) throw new Error('Acción duplicada: ' + name); map[name] = fn; };
const act = (name, fn) => on(actions, name, fn);
const onInput = (name, fn) => on(inputs, name, fn);
const onChange = (name, fn) => on(changes, name, fn);

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')) ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('input', ev => { const el = ev.target.closest('[data-input]'); if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, ev); });
document.addEventListener('change', ev => { const el = ev.target.closest('[data-change]'); if (el && changes[el.dataset.change]) changes[el.dataset.change](el, ev); });

/* ---- Avisos ---- */
function toast(msg, kind = '') {
  const host = $('#toasts'); if (!host) return;
  host.replaceChildren();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  host.appendChild(t); setTimeout(() => t.remove(), 2800);
}

/* ---- Hojas modales (en móvil suben desde abajo) ---- */
const sheetStack = [];
function openSheet({ title, body, foot = '', wide = false, onClose }) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="btn ghost icon sm" data-sheet-close aria-label="Cerrar">${icon('close')}</button></div>
    <div class="sheet-body">${part(body)}</div>${foot ? `<div class="sheet-foot">${part(foot)}</div>` : ''}</div>`;
  const handle = { el: scrim, body: $('.sheet-body', scrim), close(result) { if (!scrim.isConnected) return; scrim.remove(); sheetStack.pop(); onClose?.(result); } };
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) handle.close(); });
  scrim.addEventListener('click', e => { if (e.target.closest('[data-sheet-close]')) handle.close(); });
  document.body.appendChild(scrim); sheetStack.push(handle);
  const first = $('input,textarea,button.primary', handle.body); first?.focus();
  return handle;
}
const closeSheets = () => { while (sheetStack.length) sheetStack[sheetStack.length - 1].close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) sheetStack[sheetStack.length - 1].close(); });

function confirmBox({ title, text, ok = 'Confirmar', danger = false }) {
  return new Promise(res => {
    const h = openSheet({
      title, body: html`<p>${text}</p>`,
      foot: html`<button class="btn" data-sheet-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-confirm>${ok}</button>`,
      onClose: r => res(r === true),
    });
    $('[data-confirm]', h.el).addEventListener('click', () => h.close(true));
  });
}

/* ---- Formulario en hoja: devuelve los valores o null ---- */
function formSheet({ title, fields, values = {}, ok = 'Guardar', wide = false, validate }) {
  return new Promise(res => {
    const body = html`<form class="form-grid" novalidate>${fields.map(f => fieldHtml(f, values[f.name]))}</form>`;
    const h = openSheet({ title, body, wide, foot: html`<button class="btn" data-sheet-close>Cancelar</button><button class="btn primary" data-save>${ok}</button>`, onClose: r => res(r || null) });
    const form = $('form', h.el);
    const read = () => Object.fromEntries(fields.map(f => [f.name, f.type === 'check' ? form.elements[f.name].checked : (form.elements[f.name]?.value ?? '').trim()]));
    form.addEventListener('input', e => {
      const f = fields.find(x => x.name === e.target.name);
      if (f?.format) e.target.value = f.format(e.target.value);
      e.target.removeAttribute('aria-invalid');
    });
    const save = () => {
      const v = read(); const err = validate?.(v);
      if (err) { toast(err.msg); const el = form.elements[err.field]; el?.setAttribute('aria-invalid', 'true'); el?.focus(); return; }
      h.close(v);
    };
    form.addEventListener('submit', e => { e.preventDefault(); save(); });
    $('[data-save]', h.el).addEventListener('click', save);
  });
}
function fieldHtml(f, value) {
  const v = value ?? f.default ?? '';
  const cls = f.wide ? 'field wide' : 'field';
  if (f.type === 'textarea') return html`<div class="${cls}"><label for="f-${f.name}">${f.label}</label><textarea class="input" id="f-${f.name}" name="${f.name}" rows="3" placeholder="${f.placeholder || ''}">${v}</textarea></div>`;
  if (f.type === 'choice') return html`<div class="${cls}"><span class="label">${f.label}</span><div class="seg" role="radiogroup">${f.options.map(([val, lab]) => html`<label><input type="radio" name="${f.name}" value="${val}" ${String(val) === String(v || f.options[0][0]) ? 'checked' : ''}><span>${lab}</span></label>`)}</div></div>`;
  if (f.type === 'check') return html`<div class="${cls}"><label class="cluster"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}> ${f.label}</label></div>`;
  return html`<div class="${cls}"><label for="f-${f.name}">${f.label}</label><input class="input" id="f-${f.name}" name="${f.name}" type="${f.type || 'text'}" inputmode="${f.inputmode || ''}" autocomplete="off" value="${f.format ? f.format(v) : v}" placeholder="${f.placeholder || ''}"></div>`;
}

/* ---- Selector predictivo (reemplaza a los <select>) ----
   comboHtml({id,label,text,value,placeholder}) y registerCombo(id,{source,onPick,create}) */
const combos = {};
const registerCombo = (id, cfg) => { combos[id] = cfg; };
const comboHtml = ({ id, label = '', text = '', value = '', placeholder = '', cls = '' }) =>
  html`<div class="field combo ${cls}">${label ? html`<label for="cb-${id}">${label}</label>` : ''}<input class="input" id="cb-${id}" data-combo="${id}" data-value="${value}" value="${text}" placeholder="${placeholder}" autocomplete="off" role="combobox" aria-expanded="false"></div>`;

let openCombo = null;
function closeCombo() { if (openCombo) { openCombo.list.remove(); openCombo.input.setAttribute('aria-expanded', 'false'); openCombo = null; } }
function showCombo(input) {
  const cfg = combos[input.dataset.combo]; if (!cfg) return;
  const q = norm(input.dataset.typed === '1' ? input.value : '');
  let items = cfg.source(q).slice(0, 60);
  closeCombo();
  const list = document.createElement('div'); list.className = 'combo-list'; list.setAttribute('role', 'listbox');
  const paint = () => {
    list.innerHTML = items.map((it, i) => `<div class="combo-opt" role="option" data-i="${i}" aria-selected="${i === (openCombo?.idx ?? 0)}"><span>${esc(it.label)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div>`).join('') +
      (cfg.create ? `<div class="combo-opt" role="option" data-create="1"><span>＋ ${esc(cfg.createLabel || 'Crear nuevo')}${q ? ` «${esc(input.value)}»` : ''}</span></div>` : '') +
      (!items.length && !cfg.create ? '<div class="combo-empty">Sin resultados</div>' : '');
  };
  input.parentElement.appendChild(list); input.setAttribute('aria-expanded', 'true');
  openCombo = { input, list, items, idx: 0, paint, cfg };
  paint();
}
function pickCombo(item) {
  const c = openCombo; if (!c) return;
  c.input.value = item.label; c.input.dataset.value = item.value; c.input.dataset.typed = '0';
  closeCombo(); c.cfg.onPick?.(item, c.input);
}
document.addEventListener('focusin', e => { if (e.target.matches('[data-combo]')) { e.target.dataset.typed = '0'; showCombo(e.target); e.target.select?.(); } });
document.addEventListener('input', e => { if (e.target.matches('[data-combo]')) { e.target.dataset.typed = '1'; e.target.dataset.value = ''; showCombo(e.target); combos[e.target.dataset.combo].onType?.(e.target.value, e.target); } });
document.addEventListener('keydown', e => {
  if (!openCombo || !e.target.matches('[data-combo]')) return;
  const c = openCombo, n = c.items.length + (c.cfg.create ? 1 : 0);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); c.idx = (c.idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % Math.max(n, 1); c.paint(); c.list.children[c.idx]?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { e.preventDefault(); if (c.idx < c.items.length) pickCombo(c.items[c.idx]); else if (c.cfg.create) { const t = e.target.value; closeCombo(); c.cfg.create(t, e.target); } }
  else if (e.key === 'Escape') { e.stopPropagation(); closeCombo(); }
});
document.addEventListener('mousedown', e => {
  if (!openCombo) return;
  const opt = e.target.closest('.combo-opt');
  if (opt && openCombo.list.contains(opt)) {
    e.preventDefault();
    if (opt.dataset.create) { const t = openCombo.input.value, c = openCombo; closeCombo(); c.cfg.create(t, c.input); } else pickCombo(openCombo.items[Number(opt.dataset.i)]);
  } else if (!e.target.closest('.combo')) closeCombo();
});

/* ---- Router por hash ---- */
const views = [];
const defineView = v => views.push(v);
const go = path => { if (location.hash === '#' + path) App.render(); else location.hash = '#' + path; };
const parseRoute = () => {
  const path = (location.hash.replace(/^#/, '') || '/inicio').split('?')[0];
  for (const v of views) {
    const names = [], rx = new RegExp('^' + v.path.replace(/:([a-z]+)/g, (_, n) => { names.push(n); return '([^/]+)'; }) + '$');
    const m = path.match(rx);
    if (m) return { view: v, params: Object.fromEntries(names.map((n, i) => [n, decodeURIComponent(m[i + 1])])) };
  }
  return { view: views.find(v => v.path === '/inicio'), params: {} };
};


/* ============================================================
   04 · PDF vectorial propio (texto seleccionable, sin librerías)
   Fuentes estándar Helvetica / Helvetica-Bold, codificación WinAnsi.
   ============================================================ */

const PDF_W = 595.28, PDF_H = 841.89;
const WIN1252 = { '€': 0x80, '‚': 0x82, 'ƒ': 0x83, '„': 0x84, '…': 0x85, '†': 0x86, '‡': 0x87, 'ˆ': 0x88, '‰': 0x89, 'Š': 0x8A, '‹': 0x8B, 'Œ': 0x8C, 'Ž': 0x8E, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '•': 0x95, '–': 0x96, '—': 0x97, '˜': 0x98, '™': 0x99, 'š': 0x9A, '›': 0x9B, 'œ': 0x9C, 'ž': 0x9E, 'Ÿ': 0x9F };
const pdfBytes = s => { let out = ''; for (const ch of String(s)) { const c = ch.codePointAt(0); out += String.fromCharCode(c < 256 && !(c >= 0x80 && c <= 0x9F) ? c : (WIN1252[ch] ?? 63)); } return out; };
const pdfStr = s => '(' + pdfBytes(s).replace(/[\\()]/g, m => '\\' + m).replace(/\r/g, '') + ')';
const pdfNum = n => (Math.round(n * 100) / 100).toString();
const hexRgb = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); const v = m ? parseInt(m[1], 16) : 0; return [(v >> 16) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255]; };

const measureCtx = document.createElement('canvas').getContext('2d');
const textWidth = (s, size, bold) => { measureCtx.font = `${bold ? '700' : '400'} 100px Helvetica, Arial, "Liberation Sans", sans-serif`; return measureCtx.measureText(pdfBytes(s)).width * size / 100; };

class Pdf {
  constructor() { this.pages = []; this.images = []; this.cur = null; }
  addPage() { this.cur = []; this.pages.push(this.cur); return this; }
  op(s) { this.cur.push(s); }
  fill(c) { const [r, g, b] = hexRgb(c); return `${pdfNum(r)} ${pdfNum(g)} ${pdfNum(b)} rg`; }
  stroke(c) { const [r, g, b] = hexRgb(c); return `${pdfNum(r)} ${pdfNum(g)} ${pdfNum(b)} RG`; }
  wrap(str, width, size, bold = false) {
    const lines = [];
    for (const para of String(str ?? '').split(/\r?\n/)) {
      let line = '';
      for (const word of para.split(/\s+/).filter(Boolean)) {
        let w = word;
        while (textWidth(w, size, bold) > width) { let k = w.length; while (k > 1 && textWidth(w.slice(0, k), size, bold) > width) k--; if (line) { lines.push(line); line = ''; } lines.push(w.slice(0, k)); w = w.slice(k); }
        const test = line ? line + ' ' + w : w;
        if (textWidth(test, size, bold) <= width) line = test; else { if (line) lines.push(line); line = w; }
      }
      lines.push(line);
    }
    return lines;
  }
  /* y = línea base medida desde el borde superior */
  text(str, x, y, { size = 10, bold = false, color = '#0F1E36', align = 'left', width = 0 } = {}) {
    str = String(str ?? ''); if (!str) return;
    const w = textWidth(str, size, bold);
    const px = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
    this.op(`BT ${this.fill(color)} /${bold ? 'F2' : 'F1'} ${pdfNum(size)} Tf ${pdfNum(px)} ${pdfNum(PDF_H - y)} Td ${pdfStr(str)} Tj ET`);
  }
  paragraph(str, x, y, width, { size = 10, bold = false, color = '#0F1E36', lead } = {}) {
    const lines = this.wrap(str, width, size, bold), l = lead || size * 1.3;
    lines.forEach((ln, i) => this.text(ln, x, y + i * l, { size, bold, color }));
    return lines.length * l;
  }
  rect(x, y, w, h, { fill, stroke, lineWidth = .8, r = 0 } = {}) {
    const X = x, Y = PDF_H - y - h;
    let p;
    if (r > 0) {
      const k = r * .5523, n = pdfNum;
      p = `${n(X + r)} ${n(Y)} m ${n(X + w - r)} ${n(Y)} l ${n(X + w - r + k)} ${n(Y)} ${n(X + w)} ${n(Y + r - k)} ${n(X + w)} ${n(Y + r)} c ` +
          `${n(X + w)} ${n(Y + h - r)} l ${n(X + w)} ${n(Y + h - r + k)} ${n(X + w - r + k)} ${n(Y + h)} ${n(X + w - r)} ${n(Y + h)} c ` +
          `${n(X + r)} ${n(Y + h)} l ${n(X + r - k)} ${n(Y + h)} ${n(X)} ${n(Y + h - r + k)} ${n(X)} ${n(Y + h - r)} c ` +
          `${n(X)} ${n(Y + r)} l ${n(X)} ${n(Y + r - k)} ${n(X + r - k)} ${n(Y)} ${n(X + r)} ${n(Y)} c h`;
    }
    else p = `${pdfNum(X)} ${pdfNum(Y)} ${pdfNum(w)} ${pdfNum(h)} re`;
    this.op(`${fill ? this.fill(fill) : ''} ${stroke ? this.stroke(stroke) + ' ' + pdfNum(lineWidth) + ' w' : ''} ${p} ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`);
  }
  line(x1, y1, x2, y2, { color = '#CBD6E6', width = .7 } = {}) { this.op(`${this.stroke(color)} ${pdfNum(width)} w ${pdfNum(x1)} ${pdfNum(PDF_H - y1)} m ${pdfNum(x2)} ${pdfNum(PDF_H - y2)} l S`); }
  image(img, x, y, w, h) { let i = this.images.indexOf(img); if (i < 0) { this.images.push(img); i = this.images.length - 1; } this.op(`q ${pdfNum(w)} 0 0 ${pdfNum(h)} ${pdfNum(x)} ${pdfNum(PDF_H - y - h)} cm /Im${i} Do Q`); }

  blob() {
    const parts = [], offsets = []; let pos = 0;
    const put = s => { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; parts.push(b); pos += b.length; };
    const putBin = b => { parts.push(b); pos += b.length; };
    const n = this.pages.length, imgBase = 5 + n * 2;
    const obj = (id, body) => { offsets[id] = pos; put(`${id} 0 obj\n${body}\nendobj\n`); };
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${this.pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] /Count ${n} >>`);
    obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const xo = this.images.map((_, i) => `/Im${i} ${imgBase + i} 0 R`).join(' ');
    this.pages.forEach((ops, i) => {
      const stream = ops.join('\n');
      obj(5 + i * 2, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PDF_W} ${PDF_H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xo} >> >> /Contents ${6 + i * 2} 0 R >>`);
      obj(6 + i * 2, `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    });
    this.images.forEach((im, i) => {
      offsets[imgBase + i] = pos;
      put(`${imgBase + i} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`);
      putBin(im.data); put('\nendstream\nendobj\n');
    });
    const total = imgBase + this.images.length, xref = pos;
    put(`xref\n0 ${total}\n0000000000 65535 f \n`);
    for (let i = 1; i < total; i++) put(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
    put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(parts, { type: 'application/pdf' });
  }
}

/* Logo → JPEG sobre fondo blanco, para incrustarlo en el PDF */
let logoCache = { src: null, img: null };
async function pdfLogo() {
  const src = S().ui.logo; if (!src) return null;
  if (logoCache.src === src) return logoCache.img;
  const img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  let out = null;
  if (img) {
    const k = Math.min(1, 480 / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    const b64 = c.toDataURL('image/jpeg', .92).split(',')[1], bin = atob(b64), data = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
    out = { data, w, h };
  }
  logoCache = { src, img: out }; return out;
}

/* ---- Documento comercial genérico ----
   spec: { titulo, folio, meta:[[etiqueta,valor]], cliente:{...}, lineas, totales, notas, condiciones, pagos, estadoTexto } */
async function renderDocPdf(spec) {
  const E = S().empresa, B = S().banco, brand = '#0E274A', soft = '#EEF2F8', ink = '#0F1E36', gray = '#5B6B86';
  const pdf = new Pdf(), logo = await pdfLogo();
  const M = 40, W = PDF_W - M * 2;
  const allCols = [{ k: 'sku', t: 'Código', w: 64 }, { k: 'nombre', t: 'Descripción', w: 0 }, { k: 'cant', t: 'Cant.', w: 40, a: 'right' }, { k: 'unidad', t: 'Un.', w: 32 }, { k: 'precio', t: 'P. unitario', w: 68, a: 'right' }, { k: 'dscto', t: 'Dscto.', w: 38, a: 'right' }, { k: 'total', t: 'Total', w: 72, a: 'right' }];
  const cols = spec.sinPrecios ? allCols.filter(c => ['sku', 'nombre', 'cant', 'unidad'].includes(c.k)) : allCols;
  cols[1].w = W - sum(cols, c => c.w);
  const FOOT = PDF_H - 64;

  const header = () => {
    pdf.addPage();
    let y = M, x = M;
    if (logo) { const h = 46, w = Math.min(120, logo.w * h / logo.h); pdf.image(logo, M, y, w, w * logo.h / logo.w > h ? h : w * logo.h / logo.w); x = M + w + 12; }
    pdf.text(E.razonSocial, x, y + 12, { size: 13, bold: true, color: brand });
    [[E.giro, E.rut && 'RUT ' + E.rut].filter(Boolean).join(' · '), [E.direccion, E.comuna].filter(Boolean).join(', '), [E.correo, E.whatsapp].filter(Boolean).join(' · ')].filter(Boolean)
      .forEach((t, i) => pdf.text(t, x, y + 26 + i * 11.5, { size: 8.6, color: gray }));
    const bx = PDF_W - M - 190;
    pdf.rect(bx, y - 2, 190, 78, { fill: soft, r: 10 });
    pdf.text(spec.titulo.toUpperCase(), bx + 14, y + 17, { size: 9.5, bold: true, color: gray });
    pdf.text(spec.folio, bx + 14, y + 38, { size: 18, bold: true, color: brand });
    spec.meta.forEach(([k, v], i) => { pdf.text(k, bx + 14, y + 55 + i * 11, { size: 8.4, color: gray }); pdf.text(v, bx + 176, y + 55 + i * 11, { size: 8.4, bold: true, align: 'right' }); });
    return y + 92;
  };
  const tableHead = y => {
    pdf.rect(M, y, W, 22, { fill: brand, r: 5 });
    let x = M; cols.forEach(c => { pdf.text(c.t, c.a === 'right' ? x + c.w - 6 : x + 6, y + 14.5, { size: 8.6, bold: true, color: '#FFFFFF', align: c.a === 'right' ? 'right' : 'left' }); x += c.w; });
    return y + 22;
  };

  let y = header();
  /* Cliente */
  const cl = spec.cliente, rows = [[spec.parte || 'Cliente', cl.nombre], ['RUT', cl.rut], ['Dirección', [cl.direccion, cl.comuna].filter(Boolean).join(', ')], ['Contacto', cl.contacto], ['Obra / proyecto', cl.obra]].filter(r => r[1]);
  const boxH = 16 + rows.length * 13.5;
  pdf.rect(M, y, W, boxH, { stroke: '#CBD6E6', r: 8 });
  rows.forEach(([k, v], i) => { pdf.text(k, M + 12, y + 17 + i * 13.5, { size: 8.6, color: gray }); pdf.text(v, M + 104, y + 17 + i * 13.5, { size: 9.4, bold: i === 0 }); });
  y += boxH + 14;

  /* Tabla */
  y = tableHead(y);
  spec.lineas.forEach((l, idx) => {
    const desc = pdf.wrap(l.nombre, cols[1].w - 12, 9), rh = Math.max(20, desc.length * 11.5 + 9);
    if (y + rh > FOOT - 120) { y = header(); y = tableHead(y); }
    if (idx % 2) pdf.rect(M, y, W, rh, { fill: '#F7F9FD' });
    let x = M; const base = y + 13.5;
    const cell = { sku: l.sku, cant: nf.format(l.cant), unidad: l.unidad, precio: money(l.precio), dscto: l.dscto ? pct(l.dscto) : '', total: money(lineNet(l)) };
    cols.forEach(c => {
      if (c.k === 'nombre') desc.forEach((d, i) => pdf.text(d, x + 6, base + i * 11.5, { size: 9 }));
      else pdf.text(cell[c.k], c.a === 'right' ? x + c.w - 6 : x + 6, base, { size: c.k === 'sku' ? 8 : 9, align: c.a === 'right' ? 'right' : 'left', bold: c.k === 'total', color: c.k === 'sku' ? gray : ink });
      x += c.w;
    });
    y += rh;
  });
  pdf.line(M, y, M + W, y, { color: '#CBD6E6' });
  y += 14;

  /* Totales */
  const t = spec.totales, tw = spec.sinPrecios ? 0 : 210, tx = PDF_W - M - tw;
  const need = spec.sinPrecios ? 60 : 74 + (spec.pagos?.length ? 30 + spec.pagos.length * 12 : 0);
  if (y + need > FOOT) { y = header(); }
  const trow = (k, v, big) => { pdf.text(k, tx + 12, y + (big ? 6 : 0), { size: big ? 11 : 9.6, bold: big, color: big ? brand : gray }); pdf.text(v, tx + tw - 12, y + (big ? 6 : 0), { size: big ? 14 : 9.6, bold: true, align: 'right', color: big ? brand : ink }); y += big ? 22 : 15; };
  const topY = y;
  if (!spec.sinPrecios) {
    pdf.rect(tx, y - 12, tw, 84, { fill: soft, r: 10 }); y += 4;
    trow('Neto', money(t.neto)); trow(`IVA ${spec.ivaRate} %`, money(t.iva)); y += 4; trow('TOTAL', money(t.total), true);
  }

  /* Notas, condiciones y transferencia (columna izquierda) */
  let ly = topY + 8; const lw = W - tw - (tw ? 24 : 0);
  const block = (title, text) => { if (!text) return; pdf.text(title, M, ly, { size: 9, bold: true, color: brand }); ly += 11; ly += pdf.paragraph(text, M, ly, lw, { size: 8.6, color: gray, lead: 11 }) + 8; };
  block('Observaciones', spec.notas);
  block('Condiciones comerciales', spec.condiciones);
  if (spec.transferencia) block('Datos de transferencia', [B.banco && `${B.banco} · ${B.tipo}`, B.numero && `N° ${B.numero}`, B.titular, B.rut && `RUT ${B.rut}`, B.correo].filter(Boolean).join('\n'));
  y = Math.max(y, ly);

  if (spec.pagos?.length) {
    y += 6; pdf.text('Pagos registrados', M, y, { size: 9, bold: true, color: brand }); y += 13;
    spec.pagos.forEach(p => { pdf.text(`${fdate(p.fecha)} · ${p.medio || 'Pago'}${p.ref ? ' · ' + p.ref : ''}`, M, y, { size: 8.8, color: gray }); pdf.text(money(p.monto), M + 230, y, { size: 8.8, bold: true, align: 'right' }); y += 12; });
  }

  /* Pie con numeración */
  const n = pdf.pages.length;
  pdf.pages.forEach((ops, i) => {
    pdf.cur = ops;
    pdf.line(M, PDF_H - 46, PDF_W - M, PDF_H - 46, { color: '#DCE4F0' });
    pdf.text([E.razonSocial, E.rut && 'RUT ' + E.rut, E.correo].filter(Boolean).join(' · '), M, PDF_H - 32, { size: 8, color: gray });
    pdf.text(`Página ${i + 1} de ${n}`, PDF_W - M, PDF_H - 32, { size: 8, color: gray, align: 'right' });
  });
  return pdf.blob();
}

/* Comparte un PDF por WhatsApp: hoja nativa del teléfono o, si no existe, descarga + enlace wa.me.
   Devuelve true si el envío se inició. */
async function sharePdf({ blob, name, text, phone }) {
  const file = new File([blob], name, { type: 'application/pdf' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], text }); return true; } catch (_) { return false; } }
  download(blob, name); window.open(waLink(phone, text), '_blank', 'noopener'); toast('PDF descargado: adjúntalo en WhatsApp');
  return true;
}

/* ---- Lectura de cualquier archivo de respaldo admitido ---- */
async function parseBackup(text) {
  let obj = JSON.parse(text);
  if (obj && obj.encrypted) obj = await decryptBackup(obj);
  if (!obj) return null;
  if (obj.schema === SCHEMA && Array.isArray(obj.clientes)) return { kind: 'Lumo360', db: obj, summary: `${plural(obj.clientes.length, 'cliente', 'clientes')}, ${plural(obj.contactos.length, 'contacto', 'contactos')}, ${plural(obj.productos.length, 'producto', 'productos')}, ${plural(obj.proveedores.length, 'proveedor', 'proveedores')} y ${plural(obj.cotizaciones.length, 'cotización', 'cotizaciones')}` };
  throw new Error('El archivo no es un respaldo de Lumo360 v3.');
}

const backupPayload = () => { const p = clone(D()); delete p.settings.pinHash; delete p.settings.pinSalt; return p; };
const noteBackup = () => localStorage.setItem('lumo360-last-backup', String(Date.now()));
function exportBackup() {
  download(new Blob([JSON.stringify(backupPayload())], { type: 'application/json' }), `Lumo360_respaldo_${today()}.json`);
  noteBackup(); toast('Respaldo descargado');
}

/* ---- Respaldo cifrado (AES-GCM con contraseña) ---- */
const SECURE = !!(window.crypto && crypto.subtle);
const b64 = u => { let t = ''; for (let i = 0; i < u.length; i += 8192) t += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const aesKey = async (pass, salt, iter) => crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']), { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

function askPassword(title, repeat) {
  return new Promise(res => {
    const h = openSheet({
      title, body: html`<form class="stack" id="pw-form"><div class="field"><label for="pw1">Contraseña</label><input class="input" id="pw1" type="password" autocomplete="off" required ${repeat ? raw('minlength="6"') : ''}></div>
        ${repeat ? html`<div class="field"><label for="pw2">Repite la contraseña</label><input class="input" id="pw2" type="password" autocomplete="off" required></div><p class="hint">Guárdala bien: sin ella el respaldo no se puede abrir.</p>` : ''}</form>`,
      foot: html`<button class="btn" data-sheet-close>Cancelar</button><button class="btn primary" id="pw-ok">Aceptar</button>`, onClose: r => res(r ?? null),
    });
    const submit = () => { const a = $('#pw1', h.el).value; if (repeat && a !== $('#pw2', h.el).value) return toast('Las contraseñas no coinciden'); if (!a || (repeat && a.length < 6)) return toast('Contraseña muy corta'); h.close(a); };
    $('#pw-form', h.el).addEventListener('submit', e => { e.preventDefault(); submit(); });
    $('#pw-ok', h.el).addEventListener('click', submit);
  });
}
/* Devuelve el respaldo ya cifrado, como texto JSON listo para guardar */
async function sealBackup(pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(pass, salt, iter), new TextEncoder().encode(JSON.stringify(backupPayload()))));
  return JSON.stringify({ app: 'lumo360', encrypted: true, kdf: 'PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), data: b64(ct) });
}
async function exportEncrypted() {
  if (!SECURE) return toast('El respaldo cifrado requiere abrir la app desde HTTPS');
  const pass = await askPassword('Respaldo cifrado', true); if (pass === null) return;
  download(new Blob([await sealBackup(pass)], { type: 'application/json' }), `Lumo360_respaldo_${today()}.cifrado.json`);
  noteBackup(); toast('Respaldo cifrado descargado');
}
async function decryptBackup(x) {
  if (!SECURE) throw new Error('Para abrir un respaldo cifrado usa la app desde HTTPS.');
  const pass = await askPassword('Respaldo cifrado', false); if (pass === null) return null;
  try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(x.iv) }, await aesKey(pass, unb64(x.salt), x.iter), unb64(x.data)))); }
  catch (_) { throw new Error('Contraseña incorrecta o archivo dañado.'); }
}

async function importBackupText(text) {
  try {
    const res = await parseBackup(text); if (!res) return;
    const ok = await confirmBox({ title: 'Importar respaldo', danger: true, ok: 'Reemplazar datos', text: `Se detectó un respaldo ${res.kind}: ${res.summary}. Esto reemplaza todos los datos actuales de este dispositivo.` });
    if (!ok) return;
    const keep = { pinHash: D().settings.pinHash, pinSalt: D().settings.pinSalt, pinMinutos: D().settings.pinMinutos };
    Store.replace(res.db); Object.assign(S(), keep); Store.commit();
    toast('Respaldo importado'); App.render();
  } catch (e) { toast(e.message || 'No se pudo importar'); }
}
const importBackupFile = async file => importBackupText(await readFileText(file));

/* ---- Bloqueo con PIN (protege la pantalla de este dispositivo) ---- */
const pinBits = async (pin, salt) => b64(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(salt), iterations: 150000, hash: 'SHA-256' }, await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']), 256)));
const Lock = (() => {
  let timer = null, on = false, fails = 0, until = 0, hiddenAt = 0;
  const cfg = () => S().pinHash ? { minutos: S().pinMinutos || 5 } : null;
  const arm = () => { clearTimeout(timer); if (cfg() && !on) timer = setTimeout(show, cfg().minutos * 60000); };
  function show() {
    if (on || !cfg()) return; on = true; closeSheets();
    const el = document.createElement('div'); el.className = 'lock'; el.id = 'lock';
    el.innerHTML = `<form class="lock-box"><div class="brand-mark">L</div><h2>Lumo360 bloqueado</h2><p class="muted">Ingresa tu PIN para continuar.</p><input class="input" id="lock-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN"><p class="error" id="lock-msg"></p><button class="btn primary block">Desbloquear</button></form>`;
    document.body.appendChild(el); $('#lock-pin').focus();
    $('form', el).addEventListener('submit', async e => {
      e.preventDefault(); const wait = Math.ceil((until - Date.now()) / 1000);
      if (wait > 0) { $('#lock-msg').textContent = `Espera ${wait} s para reintentar.`; return; }
      if (await pinBits($('#lock-pin').value, S().pinSalt) === S().pinHash) { on = false; fails = 0; el.remove(); arm(); return; }
      fails++; $('#lock-pin').value = ''; $('#lock-msg').textContent = 'PIN incorrecto.'; if (fails >= 3) until = Date.now() + Math.min(30, 2 ** (fails - 2)) * 1000;
    });
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, arm, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!cfg() || on) return; if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt >= cfg().minutos * 60000) show(); });
  return {
    show, arm, active: () => !!cfg(),
    async set(pin, minutos) { const salt = b64(crypto.getRandomValues(new Uint8Array(16))); Object.assign(S(), { pinSalt: salt, pinHash: await pinBits(pin, salt), pinMinutos: minutos }); Store.commit(); arm(); },
    clear() { Object.assign(S(), { pinHash: '', pinSalt: '' }); Store.commit(); clearTimeout(timer); },
  };
})();

function attention() {
  const items = [], t = today();
  D().cotizaciones.forEach(q => {
    const st = quoteState(q);
    if (st === 'enviada') {
      const left = quoteDaysLeft(q), age = diffDays(t, q.fecha);
      if (left !== null && left <= 2) items.push({ kind: 'warn', ico: 'clock', t: `${q.folio} vence ${left <= 0 ? 'hoy' : left === 1 ? 'mañana' : 'en 2 días'}`, s: `${clientName(q.clienteId)} · ${money(totals(q.lineas, q.ivaRate).total)}`, to: `/cotizaciones/${q.id}`, w: left });
      else if (age >= 3) items.push({ kind: 'info', ico: 'send', t: `Seguir ${q.folio}: sin respuesta hace ${age} días`, s: clientName(q.clienteId), to: `/cotizaciones/${q.id}`, w: 20 - age });
    }
  });
  D().documentos.filter(d => docState(d) === 'vencida').forEach(d => items.push({ kind: 'bad', ico: 'alert', t: `${d.tipo === 'factura' ? 'Factura' : 'Boleta'} ${d.folio} vencida hace ${docDaysOverdue(d)} días`, s: `${clientName(d.clienteId)} · saldo ${money(docBalance(d))}`, to: '/cobranza', w: -docDaysOverdue(d) }));
  D().pedidos.filter(p => p.estado === 'pendiente').forEach(p => items.push({ kind: 'warn', ico: 'truck', t: `Pedido ${p.folio} pendiente de preparar`, s: clientName(p.clienteId), to: `/pedidos/${p.id}`, w: 5 }));
  lowStock().forEach(p => items.push({ kind: 'warn', ico: 'box', t: `Poco stock: ${p.nombre}`, s: `Quedan ${nf.format(stockOf(p.id))} ${p.unidad} (mínimo ${nf.format(p.stockMin)})`, to: '/inventario', w: 4 }));
  D().compras.filter(o => o.estado === 'enviada' && o.entrega && o.entrega < t).forEach(o => items.push({ kind: 'bad', ico: 'truck', t: `Compra ${o.folio} atrasada`, s: `${supplierName(o.proveedorId)} · esperada el ${fdate(o.entrega)}`, to: `/compras/${o.id}`, w: -3 }));
  return items.sort((a, b) => a.w - b.w).slice(0, 8);
}

        </section>
        <section class="card"><div class="card-head"><h2>Últimas cotizaciones</h2><a class="btn ghost sm" href="#/cotizaciones">Ver todas</a></div>
          ${recent.length ? html`<div class="list">${recent.map(quoteRow)}</div>` : emptyState('doc', 'Aún no hay cotizaciones', 'Crea la primera con el botón naranja.', html`<button class="btn accent" data-act="quote.new">${icon('plus')} Nueva cotización</button>`)}
        </section>
      </div>`;
  },
});


/* ============================================================
   11 · Cotizaciones: lista, editor con autoguardado, PDF y envío
   ============================================================ */

const quoteTotal = q => totals(q.lineas, q.ivaRate).total;
const quoteRow = q => {
  const st = quoteState(q), left = quoteDaysLeft(q);
  const when = st === 'enviada' && left !== null ? (left <= 0 ? 'vence hoy' : `vence en ${plural(left, 'día', 'días')}`) : fdate(q.fecha);
  return html`<a class="row" href="#/cotizaciones/${q.id}"><div class="row-main"><span class="row-title">${q.folio} · ${clientName(q.clienteId)}</span><span class="row-sub">${q.obra ? q.obra + ' · ' : ''}${when}</span></div><div class="row-side"><span class="row-amount">${money(quoteTotal(q))}</span>${badge(QUOTE_STATES[st], QUOTE_KIND[st])}</div></a>`;
};

/* ---------- Lista ---------- */
const ql = { q: '', estado: 'todas' };
const quoteListHtml = () => {
  const t = norm(ql.q);
  const list = D().cotizaciones.filter(q => (ql.estado === 'todas' || quoteState(q) === ql.estado) && (!t || norm(`${q.folio} ${clientName(q.clienteId)} ${q.obra}`).includes(t)))
    .sort((a, b) => String(b.folio).localeCompare(String(a.folio), 'es', { numeric: true }));
  return list.length ? html`<div class="list">${list.slice(0, 200).map(quoteRow)}</div>${list.length > 200 ? html`<p class="muted small card-pad">Mostrando 200 de ${nf.format(list.length)}. Usa el buscador para acotar.</p>` : ''}`
    : emptyState('doc', D().cotizaciones.length ? 'Sin resultados' : 'Aún no hay cotizaciones', D().cotizaciones.length ? 'Prueba con otro filtro o búsqueda.' : 'Crea la primera cotización para tu cliente.', D().cotizaciones.length ? '' : html`<button class="btn accent" data-act="quote.new">${icon('plus')} Nueva cotización</button>`);
};
defineView({
  path: '/cotizaciones', title: 'Cotizaciones', live: true,
  render() {
    const counts = Object.fromEntries(Object.keys(QUOTE_STATES).map(k => [k, D().cotizaciones.filter(q => quoteState(q) === k).length]));
    return html`${pageHead('Cotizaciones', `${nf.format(D().cotizaciones.length)} en total`, html`<button class="btn accent" data-act="quote.new">${icon('plus')} Nueva</button>`)}
      <div class="toolbar">${searchBox('ql.q', ql.q, 'Buscar por folio, cliente u obra')}</div>
      ${chips([['todas', 'Todas'], ...Object.entries(QUOTE_STATES).map(([k, l]) => [k, `${l} · ${counts[k]}`])], ql.estado, 'ql.estado')}
      <section class="card" id="qlist">${quoteListHtml()}</section>`;
  },
});
onInput('ql.q', el => { ql.q = el.value; mount($('#qlist'), quoteListHtml()); });
act('ql.estado', el => { ql.estado = el.dataset.v; $$('[data-act="ql.estado"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); mount($('#qlist'), quoteListHtml()); });

/* ---------- Editor ---------- */
let ed = { q: null, stored: false };
let presetClient = '';
const isLocked = q => ['aceptada', 'rechazada'].includes(q.estado);

function edTouch() {
  const q = ed.q;
  if (!ed.stored) { q.folio = nextFolio('cot'); ed.stored = true; logChange(q, 'borrador'); $('#ed-folio').textContent = q.folio; history.replaceState(null, '', '#/cotizaciones/' + q.id); }
  q.actualizado = new Date().toISOString();
  upsert('cotizaciones', q);
  edPaint();
}
function edPaint() {
  const q = ed.q, t = totals(q.lineas, q.ivaRate), set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('t-neto', money(t.neto)); set('t-iva', money(t.iva)); set('t-total', money(t.total)); set('t-sum', money(t.total));
  set('t-margen', `${money(t.margen)} · ${pct(t.margenPct)}`);
  q.lineas.forEach(l => set('lt-' + l.id, money(lineNet(l))));
  set('t-count', plural(q.lineas.length, 'producto', 'productos'));
  const has = q.lineas.length > 0, box = document.getElementById('actions');
  if (box && ed.has !== has) { ed.has = has; mount(box, actionsHtml(q)); }
}

function contactSource(q) { return t => D().contactos.filter(c => c.entidad === 'cliente' && c.entidadId === q.clienteId && (!t || norm(c.nombre + c.cargo).includes(t))).map(c => ({ value: c.id, label: c.nombre, sub: [c.cargo, c.celular].filter(Boolean).join(' · ') })); }

function clientCardHtml() {
  const q = ed.q, ro = isLocked(q), c = find('clientes', q.clienteId), ct = find('contactos', q.contactoId);
  registerCombo('q-cliente', {
    source: t => D().clientes.filter(x => x.activo !== false && (!t || norm(x.nombre + ' ' + x.rut).includes(t))).sort((a, b) => byName(a.nombre, b.nombre)).map(x => ({ value: x.id, label: x.nombre, sub: x.rut })),
    onPick: it => { q.clienteId = it.value; q.contactoId = primaryContact(it.value)?.id || ''; edTouch(); mount($('#card-cliente'), clientCardHtml()); },
    create: t => newClient(t).then(n => { if (n) { q.clienteId = n.id; q.contactoId = ''; edTouch(); mount($('#card-cliente'), clientCardHtml()); } }), createLabel: 'Crear cliente',
  });
  registerCombo('q-contacto', {
    source: contactSource(q), onPick: it => { q.contactoId = it.value; edTouch(); },
    create: t => newContact({ entidad: 'cliente', entidadId: q.clienteId }, t).then(n => { if (n) { q.contactoId = n.id; edTouch(); mount($('#card-cliente'), clientCardHtml()); } }), createLabel: 'Agregar contacto',
  });
  return html`
    <div class="card-head"><h2>Cliente</h2></div>
    <div class="card-pad form-grid">
      <div class="wide">${comboHtml({ id: 'q-cliente', label: 'Cliente', text: c?.nombre || '', value: q.clienteId, placeholder: 'Busca por nombre o RUT…' })}</div>
      ${c ? html`<dl class="kv wide"><dt>RUT</dt><dd>${c.rut || '—'}</dd><dt>Dirección</dt><dd>${[c.direccion, c.comuna].filter(Boolean).join(', ') || '—'}</dd><dt>Saldo pendiente</dt><dd>${money(clientBalance(c.id))}</dd></dl>` : ''}
      ${q.clienteId ? comboHtml({ id: 'q-contacto', label: 'Contacto', text: ct?.nombre || '', value: q.contactoId, placeholder: 'Selecciona o agrega…' }) : ''}
      <div class="field"><label for="q-obra">Obra / proyecto</label><input class="input" id="q-obra" data-input="q.obra" value="${q.obra}" placeholder="Opcional" ${ro ? 'disabled' : ''}></div>
      <div class="field"><label for="q-fecha">Fecha</label><input class="input" id="q-fecha" type="date" data-change="q.fecha" value="${q.fecha}" ${ro ? 'disabled' : ''}></div>
      <div class="field"><label for="q-vence">Válida hasta</label><input class="input" id="q-vence" type="date" data-change="q.vence" value="${q.vence}" ${ro ? 'disabled' : ''}></div>
    </div>`;
}

function lineHtml(l, ro) {
  registerCombo('lp-' + l.id, {
    source: t => D().productos.filter(p => p.activo !== false && (!t || norm(`${p.sku} ${p.nombre} ${p.categoria}`).includes(t))).sort((a, b) => byName(a.nombre, b.nombre)).map(p => ({ value: p.id, label: p.nombre, sub: `${p.sku} · ${p.precio ? money(p.precio) : 'sin precio'}` })),
    onPick: it => {
      const p = find('productos', it.value); if (!p) return;
      Object.assign(l, { productoId: p.id, sku: p.sku, nombre: p.nombre, unidad: p.unidad, costo: p.costo }); if (p.precio) l.precio = p.precio;
      const row = document.querySelector(`[data-line="${l.id}"]`);
      row.querySelector('[data-input="line.unidad"]').value = l.unidad; row.querySelector('[data-input="line.precio"]').value = l.precio;
      edTouch();
    },
    onType: text => { l.nombre = text; l.productoId = ''; edTouch(); },
  });
  const dis = ro ? 'disabled' : '';
  return html`<div class="line" data-line="${l.id}">
    <div class="f-prod">${comboHtml({ id: 'lp-' + l.id, label: 'Producto o descripción', text: l.nombre, value: l.productoId, placeholder: 'Busca por nombre o SKU, o escribe libre…' })}</div>
    <div class="field f-qty"><label>Cant.</label><input class="input" inputmode="decimal" data-input="line.cant" value="${l.cant}" ${dis}></div>
    <div class="field f-unit"><label>Un.</label><input class="input" data-input="line.unidad" value="${l.unidad}" ${dis}></div>
    <div class="field f-price"><label>Precio neto</label><input class="input" inputmode="decimal" data-input="line.precio" value="${l.precio}" ${dis}></div>
    <div class="field f-disc"><label>Dscto %</label><input class="input" inputmode="decimal" data-input="line.dscto" value="${l.dscto || ''}" placeholder="0" ${dis}></div>
    <div class="total" id="lt-${l.id}">${money(lineNet(l))}</div>
    <button class="btn ghost icon f-del" data-act="line.del" aria-label="Quitar" ${dis}>${icon('trash')}</button></div>`;
}
const linesHtml = () => ed.q.lineas.length ? html`<div class="lines">${ed.q.lineas.map(l => lineHtml(l, isLocked(ed.q)))}</div>` : html`<div class="empty">${icon('box')}<p>Aún no hay productos en esta cotización.</p></div>`;

function stepsHtml(q) {
  const st = quoteState(q), flow = [['borrador', 'Borrador'], ['enviada', 'Enviada'], ['aceptada', 'Aceptada']], idx = flow.findIndex(f => f[0] === st);
  if (st === 'rechazada' || st === 'vencida') return html`<div class="steps">${badge(QUOTE_STATES[st], QUOTE_KIND[st])}</div>`;
  return html`<div class="steps">${flow.map(([k, l], i) => html`<span class="step ${i < idx ? 'is-done' : i === idx ? 'is-now' : ''}">${l}</span>`)}</div>`;
}
function actionsHtml(q) {
  const st = quoteState(q), none = !q.lineas.length;
  const send = html`<button class="btn" data-act="q.pdf" ${none ? 'disabled' : ''}>${icon('pdf')} PDF</button><button class="btn" data-act="q.wa" ${none ? 'disabled' : ''}>${icon('phone')} WhatsApp</button><button class="btn" data-act="q.mail" ${none ? 'disabled' : ''}>${icon('mail')} Correo</button>`;
  const flow = st === 'borrador' ? html`<button class="btn primary block" data-act="q.state" data-to="enviada" ${none ? 'disabled' : ''}>${icon('send')} Marcar como enviada</button>`
    : (st === 'enviada' || st === 'vencida') ? html`<button class="btn accent block" data-act="q.state" data-to="aceptada">${icon('check')} Aceptada por el cliente</button><div class="cluster"><button class="btn" data-act="q.state" data-to="rechazada">Rechazada</button>${st === 'vencida' ? html`<button class="btn" data-act="q.reopen">Reabrir</button>` : ''}</div>`
    : st === 'aceptada' ? (q.pedidoId ? html`<a class="btn primary block" href="#/pedidos/${q.pedidoId}">${icon('truck')} Ver pedido</a>` : html`<button class="btn accent block" data-act="q.order">${icon('truck')} Crear pedido</button>`)
    : html`<button class="btn block" data-act="q.reopen">Reabrir como borrador</button>`;
  return html`${flow}<div class="cluster">${send}</div><div class="cluster"><button class="btn ghost sm" data-act="q.dup">${icon('copy')} Duplicar</button>${ed.stored && !q.pedidoId ? html`<button class="btn ghost sm danger" data-act="q.del">${icon('trash')} Eliminar</button>` : ''}</div>`;
}

defineView({
  path: '/cotizaciones/:id', nav: '/cotizaciones',
  title: p => p.id === 'nuevo' ? 'Nueva cotización' : (find('cotizaciones', p.id)?.folio || 'Cotización'),
  render({ id }) {
    if (id === 'nuevo') { ed = { q: newQuote(), stored: false }; if (presetClient) { ed.q.clienteId = presetClient; ed.q.contactoId = primaryContact(presetClient)?.id || ''; presetClient = ''; } }
    else { const q = find('cotizaciones', id); if (!q) return emptyState('doc', 'Cotización no encontrada', 'Puede que haya sido eliminada.', html`<a class="btn" href="#/cotizaciones">Volver</a>`); if (ed.q?.id !== id) ed = { q, stored: true }; else ed.q = q; }
    const q = ed.q, ro = isLocked(q), t = totals(q.lineas, q.ivaRate);

      <div class="page-head"><div><a class="btn ghost sm" href="#/cotizaciones">${icon('back')} Cotizaciones</a>
        <h1><span id="ed-folio">${q.folio || 'Nueva cotización'}</span> ${q.estado !== 'borrador' ? badge(QUOTE_STATES[quoteState(q)], QUOTE_KIND[quoteState(q)]) : ''}</h1>
        <p>Se guarda automáticamente.</p></div></div>
      ${ro ? html`<div class="card card-pad"><strong>Cotización ${QUOTE_STATES[q.estado].toLowerCase()}.</strong> <span class="muted">Está cerrada para evitar cambios. Reábrela si necesitas modificarla.</span></div>` : ''}
      <div class="split">

          <section class="card" id="card-cliente">${clientCardHtml()}</section>

            <div class="card-pad" id="lines">${linesHtml()}</div></section>
          <section class="card"><div class="card-head"><h2>Notas y condiciones</h2></div><div class="card-pad form-grid">
            <div class="field wide"><label for="q-notas">Observaciones para el cliente</label><textarea class="input" id="q-notas" data-input="q.notas" ${ro ? 'disabled' : ''}>${q.notas}</textarea></div>
            <div class="field wide"><label for="q-cond">Condiciones comerciales</label><textarea class="input" id="q-cond" data-input="q.cond" ${ro ? 'disabled' : ''}>${q.condiciones}</textarea></div></div></section>
        </div>
