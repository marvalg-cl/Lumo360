            <div class="totals"><div class="totals-row"><span>Neto</span><span id="t-neto">${money(t.neto)}</span></div><div class="totals-row"><span>IVA ${q.ivaRate} %</span><span id="t-iva">${money(t.iva)}</span></div><div class="totals-row big"><span>Total</span><span id="t-total">${money(t.total)}</span></div>
            <div class="totals-row internal"><span>Margen interno</span><span id="t-margen">${money(t.margen)} · ${pct(t.margenPct)}</span></div></div></section>
          <section class="card card-pad stack" id="actions">${actionsHtml(q)}</section>
        </aside>
      </div>
      <div class="sumbar"><div><div class="tiny muted">Total con IVA</div><strong class="num" id="t-sum">${money(t.total)}</strong></div><button class="btn accent" data-act="q.share">${icon('send')} Enviar</button></div>`;
  },
});

/* ---- Entradas del editor ---- */
act('quote.new', () => go('/cotizaciones/nuevo'));
onInput('q.obra', el => { ed.q.obra = el.value; edTouch(); });
onInput('q.notas', el => { ed.q.notas = el.value; edTouch(); });
onInput('q.cond', el => { ed.q.condiciones = el.value; edTouch(); });
onChange('q.fecha', el => { ed.q.fecha = el.value || today(); ed.q.vence = addDays(ed.q.fecha, S().ventas.validezDias); $('#q-vence').value = ed.q.vence; edTouch(); });
onChange('q.vence', el => { ed.q.vence = el.value; edTouch(); });
const lineOf = el => ed.q.lineas.find(l => l.id === el.closest('[data-line]').dataset.line);
onInput('line.cant', el => { lineOf(el).cant = dec(el.value); edTouch(); });
onInput('line.unidad', el => { lineOf(el).unidad = el.value; edTouch(); });
onInput('line.precio', el => { lineOf(el).precio = dec(el.value); edTouch(); });
onInput('line.dscto', el => { lineOf(el).dscto = Math.min(100, Math.max(0, dec(el.value))); edTouch(); });
act('line.add', () => {
  const l = newLine(); ed.q.lineas.push(l); edTouch();
  mount($('#lines'), linesHtml()); $(`[data-line="${l.id}"] [data-combo]`).focus();
});
act('line.del', el => { const l = lineOf(el); ed.q.lineas = ed.q.lineas.filter(x => x !== l); edTouch(); mount($('#lines'), linesHtml()); mount($('#actions'), actionsHtml(ed.q)); });

/* ---- Estados ---- */
act('q.state', async el => {
  const q = ed.q, to = el.dataset.to;
  if (to === 'enviada' && !q.clienteId) return toast('Selecciona un cliente antes de enviar');
  q.estado = to; logChange(q, to); edTouch(); toast(`Cotización ${QUOTE_STATES[to].toLowerCase()}`); App.render();
});
act('q.reopen', () => { const q = ed.q; q.estado = 'borrador'; q.vence = addDays(today(), S().ventas.validezDias); logChange(q, 'borrador'); edTouch(); App.render(); });
act('q.dup', () => {
  const c = clone(ed.q); Object.assign(c, { id: uid('q'), folio: nextFolio('cot'), fecha: today(), vence: addDays(today(), S().ventas.validezDias), estado: 'borrador', pedidoId: '', historial: [] });
  c.lineas.forEach(l => { l.id = uid('l'); }); logChange(c, 'borrador'); upsert('cotizaciones', c); toast('Cotización duplicada'); go('/cotizaciones/' + c.id);
});
act('q.del', async () => { if (await confirmBox({ title: 'Eliminar cotización', text: `Se eliminará ${ed.q.folio}. Esta acción no se puede deshacer.`, ok: 'Eliminar', danger: true })) { remove('cotizaciones', ed.q.id); toast('Cotización eliminada'); go('/cotizaciones'); } });

/* ---- Documento y envío ---- */
function quoteSpec(q) {
  const c = find('clientes', q.clienteId) || {}, ct = find('contactos', q.contactoId);
  return { titulo: 'Cotización', folio: q.folio, meta: [['Fecha', fdate(q.fecha)], ['Válida hasta', fdate(q.vence)], ['Moneda', 'Peso chileno']], ivaRate: q.ivaRate, cliente: { nombre: c.nombre || 'Sin cliente', rut: c.rut, direccion: c.direccion, comuna: c.comuna, contacto: ct?.nombre, obra: q.obra }, lineas: q.lineas, totales: totals(q.lineas, q.ivaRate), notas: q.notas, condiciones: q.condiciones, transferencia: true };
}
const quoteMessage = q => {
  const ct = find('contactos', q.contactoId), t = totals(q.lineas, q.ivaRate), name = (ct?.nombre || '').split(/\s+/)[0];
  return `Hola${name ? ' ' + name : ''}, te envío la cotización ${q.folio} de ${S().empresa.nombreCorto || S().empresa.razonSocial}.\nTotal: ${money(t.total)} (IVA incluido).\nVálida hasta el ${fdateLong(q.vence)}.\nQuedo atento a tus comentarios.`;
};
const quotePhone = q => find('contactos', q.contactoId)?.celular || find('clientes', q.clienteId)?.telefono || '';
async function quotePdf(q) { return { blob: await renderDocPdf(quoteSpec(q)), name: `${q.folio}.pdf` }; }
async function markSent(q) { if (q.estado === 'borrador') { q.estado = 'enviada'; logChange(q, 'enviada'); edTouch(); App.render(); } }

act('q.pdf', async () => { const { blob, name } = await quotePdf(ed.q); download(blob, name); toast('PDF descargado'); });
act('q.wa', async () => { const q = ed.q, { blob, name } = await quotePdf(q); if (await sharePdf({ blob, name, text: quoteMessage(q), phone: quotePhone(q) })) markSent(q); });
act('q.mail', async () => {
  const q = ed.q, { blob, name } = await quotePdf(q), ct = find('contactos', q.contactoId);
  download(blob, name); location.href = mailLink(ct?.correo || '', `Cotización ${q.folio} · ${S().empresa.nombreCorto}`, quoteMessage(q) + '\n\n(Adjunta el PDF descargado)'); toast('PDF descargado: adjúntalo al correo'); markSent(q);
});
act('q.share', () => {
  const q = ed.q; if (!q.lineas.length) return toast('Agrega al menos un producto');
  const h = openSheet({ title: 'Enviar cotización', body: html`<div class="stack"><button class="btn block" data-act="q.wa" data-sheet-close>${icon('phone')} WhatsApp</button><button class="btn block" data-act="q.mail" data-sheet-close>${icon('mail')} Correo</button><button class="btn block" data-act="q.pdf" data-sheet-close>${icon('pdf')} Solo descargar PDF</button></div>` });
});


/* ============================================================
   12 · Pedidos: de la cotización aceptada a la entrega y el documento de cobro
   ============================================================ */

const orderTotal = p => totals(p.lineas, p.ivaRate).total;

const pickFile = accept => new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); });
async function shrinkLogo(file) {
  const src = await readFileDataURL(file), img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
  const k = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9);
}

/* ============================================================
   16 · Inventario: existencias calculadas desde movimientos (kardex)
   ============================================================ */

const MOV_TYPES = { recepcion: 'Recepción de compra', despacho: 'Despacho a cliente', ajuste: 'Ajuste manual' };
const addMove = (productoId, cant, tipo, ref = '', nota = '') => { D().movimientos.push({ id: uid('m'), fecha: today(), productoId, cant, tipo, ref, nota }); Store.commit(); };

/* Los despachos descuentan existencias; anular un pedido despachado las devuelve */
function postDispatch(p) {
  if (D().movimientos.some(m => m.tipo === 'despacho' && m.ref === p.id)) return;
  p.lineas.filter(l => l.productoId && find('productos', l.productoId)).forEach(l => addMove(l.productoId, -num(l.cant), 'despacho', p.id, p.folio));
}
function undoDispatch(p) { if (D().movimientos.some(m => m.tipo === 'despacho' && m.ref === p.id)) { D().movimientos = D().movimientos.filter(m => !(m.tipo === 'despacho' && m.ref === p.id)); Store.commit(); } }

const stockState = p => { const s = stockOf(p.id); return s <= 0 ? 'sin' : (p.stockMin && s <= p.stockMin) ? 'bajo' : 'ok'; };
const lowStock = () => D().productos.filter(p => p.stockMin > 0 && stockOf(p.id) <= p.stockMin);

const invUi = { q: '', f: 'todos' };
const stockRow = p => {
  const s = stockOf(p.id), st = stockState(p);
  return html`<div class="row"><div class="row-main"><span class="row-title">${p.nombre}</span><span class="row-sub">${[p.sku, p.stockMin ? 'mínimo ' + nf.format(p.stockMin) : ''].filter(Boolean).join(' · ')}</span></div>
    <div class="row-side"><span class="row-amount">${nf.format(s)} ${p.unidad}</span>${st === 'bajo' ? badge('Bajo mínimo', 'warn') : st === 'sin' ? badge('Sin stock', 'bad') : ''}</div>
    <button class="btn ghost icon sm" data-act="stock.adjust" data-id="${p.id}" aria-label="Ajustar existencias">${icon('edit')}</button><button class="btn ghost icon sm" data-act="stock.kardex" data-id="${p.id}" aria-label="Ver movimientos">${icon('list')}</button></div>`;
};
const stockListHtml = () => {
  const t = norm(invUi.q), list = D().productos.filter(p => (invUi.f === 'todos' || (invUi.f === 'bajo' ? stockState(p) === 'bajo' : stockState(p) === 'sin')) && (!t || norm(`${p.nombre} ${p.sku}`).includes(t))).sort((a, b) => byName(a.nombre, b.nombre));
  return list.length ? html`<div class="list">${list.slice(0, 400).map(stockRow)}</div>` : emptyState('box', D().productos.length ? 'Sin resultados' : 'Aún no hay productos', D().productos.length ? 'Prueba con otro filtro.' : 'Crea productos para controlar sus existencias.', D().productos.length ? '' : html`<a class="btn primary" href="#/productos">Ir a productos</a>`);
};
defineView({
  path: '/inventario', title: 'Inventario', live: true,
  render() {
    const value = sum(D().productos, p => Math.max(0, stockOf(p.id)) * num(p.costo));
    return html`${pageHead('Inventario', 'Las existencias suben al recibir compras y bajan al despachar pedidos')}
      <div class="grid cols-3">${kpi('Productos', nf.format(D().productos.length))}${kpi('Bajo mínimo', nf.format(lowStock().length), lowStock().length ? 'Conviene reponer' : 'Todo en orden', lowStock().length ? 'is-bad' : 'is-ok')}${kpi('Valor al costo', money(value))}</div>
      <div class="toolbar">${searchBox('invUi.q', invUi.q, 'Buscar producto o código')}</div>
      ${chips([['todos', 'Todos'], ['bajo', 'Bajo mínimo'], ['sin', 'Sin stock']], invUi.f, 'invUi.f')}
      <section class="card" id="ivlist">${stockListHtml()}</section>`;
  },
});
onInput('invUi.q', el => { invUi.q = el.value; mount($('#ivlist'), stockListHtml()); });
act('invUi.f', el => { invUi.f = el.dataset.v; $$('[data-act="invUi.f"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); mount($('#ivlist'), stockListHtml()); });

act('stock.adjust', async el => {
  const p = find('productos', el.dataset.id), cur = stockOf(p.id);
  const v = await formSheet({ title: `Ajustar «${p.nombre}»`, ok: 'Guardar ajuste', fields: [{ name: 'nuevo', label: `Existencias reales (hoy ${nf.format(cur)} ${p.unidad})`, inputmode: 'decimal', default: String(cur), wide: true }, { name: 'nota', label: 'Motivo (opcional)', placeholder: 'Conteo físico, merma…', wide: true }], validate: x => x.nuevo === '' || isNaN(dec(x.nuevo)) ? { field: 'nuevo', msg: 'Ingresa una cantidad' } : null });

const poLocked = o => ['recibida', 'anulada'].includes(o.estado);
function poLineHtml(l, ro) {
  registerCombo('pol-' + l.id, {
    source: t => D().productos.filter(p => !t || norm(`${p.sku} ${p.nombre} ${p.categoria}`).includes(t)).sort((a, b) => byName(a.nombre, b.nombre)).map(p => ({ value: p.id, label: p.nombre, sub: `${p.sku} · costo ${money(p.costo)}` })),

        <section class="card card-pad totals"><div class="totals-row"><span>Neto</span><span id="po-neto">${money(t.neto)}</span></div><div class="totals-row"><span>IVA ${o.ivaRate} %</span><span id="po-iva">${money(t.iva)}</span></div><div class="totals-row big"><span>Total</span><span id="po-total">${money(t.total)}</span></div></section>
        <section class="card card-pad stack" id="po-actions">${poActions(o)}</section>

});
const poLineOf = el => poOf().lineas.find(l => l.id === el.closest('[data-line]').dataset.line);

onInput('po.unidad', el => { poLineOf(el).unidad = el.value; poSave(); });
onInput('po.costo', el => { poLineOf(el).costo = dec(el.value); poSave(); });
onInput('po.notas', el => { poOf().notas = el.value; poSave(); });
onChange('po.entrega', el => { poOf().entrega = el.value; poSave(); });
act('po.line.add', () => { const o = poOf(), l = poLine(); o.lineas.push(l); upsert('compras', o); mount($('#po-lines'), poLinesHtml(o)); mount($('#po-actions'), poActions(o)); $(`[data-line="${l.id}"] [data-combo]`).focus(); });
act('po.line.del', el => { const o = poOf(); o.lineas = o.lineas.filter(l => l !== poLineOf(el)); upsert('compras', o); mount($('#po-lines'), poLinesHtml(o)); mount($('#po-actions'), poActions(o)); poPaint(o); });
act('po.state', el => { const o = poOf(); o.estado = el.dataset.to; logChange(o, o.estado); upsert('compras', o); toast('Orden marcada como ' + PO_STATES[o.estado].toLowerCase()); App.render(); });
act('po.receive', async () => {
  const o = poOf(); if (!await confirmBox({ title: 'Registrar recepción', text: 'Las cantidades de esta orden se sumarán al inventario y el costo de cada producto se actualizará.', ok: 'Registrar recepción' })) return;
  o.lineas.forEach(l => { const falta = num(l.cant) - num(l.recibido); const p = find('productos', l.productoId); if (p && falta) { addMove(p.id, falta, 'recepcion', o.id, o.folio); if (l.costo) { p.costo = l.costo; upsert('productos', p); } } l.recibido = num(l.cant); });
  o.estado = 'recibida'; logChange(o, 'recibida'); upsert('compras', o); toast('Recepción registrada'); App.render();
});
act('po.cancel', async () => {
  const o = poOf(); if (!await confirmBox({ title: 'Anular orden', text: o.estado === 'recibida' ? 'Las existencias recibidas se descontarán del inventario.' : 'La orden quedará anulada.', ok: 'Anular', danger: true })) return;

});

/* ============================================================
   18 · Solicitudes de compra: pedir cotización, comparar y generar órdenes
   Flujo: solicitud (qué falta) → pedir precios a proveedores → comparar → elegir → órdenes de compra
   ============================================================ */

const SOL_STATES = { abierta: 'Abierta', cerrada: 'Con órdenes generadas' };
const solItem = (prod, cant = 1) => ({ id: uid('i'), productoId: prod?.id || '', nombre: prod?.nombre || '', unidad: prod?.unidad || 'UN', cant, precios: {}, elegido: '' });
const solOf = () => find('solicitudes', App.current.params.id);
const validItems = s => s.items.filter(i => i.nombre && num(i.cant) > 0);
const bestSupplier = (it, ids) => ids.filter(id => num(it.precios[id]) > 0).sort((a, b) => it.precios[a] - it.precios[b])[0] || '';
const COND_EMPTY = { plazo: '', despacho: '', pago: '', validez: '' };
const condOf = (s, pid) => s.condiciones[pid] || COND_EMPTY;

function newSolicitud(extra = {}) {
  const s = { id: uid('s'), folio: nextFolio('sol'), fecha: today(), limite: addDays(today(), 3), estado: 'abierta', pedidoId: '', notas: '', proveedores: [], consultas: {}, condiciones: {}, items: [], compras: [], ...extra };
  return upsert('solicitudes', s);
}
act('o.solicit', () => {
  const p = orderOf(), s = newSolicitud({ pedidoId: p.id, notas: `Para el pedido ${p.folio} · ${clientName(p.clienteId)}`, items: p.lineas.map(l => ({ ...solItem(find('productos', l.productoId), num(l.cant)), nombre: l.nombre, unidad: l.unidad })) });
  toast(`Solicitud ${s.folio} creada`); go('/solicitudes/' + s.id);
});
act('sol.new', () => { const s = newSolicitud(); go('/solicitudes/' + s.id); });

/* ---------- Historial de precios (se deduce de las solicitudes anteriores) ---------- */
function priceHistory(it, s) {
  const out = [];
  D().solicitudes.filter(o => o.id !== s.id).forEach(o => o.items.forEach(x => {
    if ((it.productoId && x.productoId === it.productoId) || (!it.productoId && norm(x.nombre) === norm(it.nombre))) Object.entries(x.precios).forEach(([pid, precio]) => { if (num(precio) > 0) out.push({ pid, precio: num(precio), fecha: o.fecha }); });
  }));
  return out.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
}
function offerHint(it, pid, s) {
  const prev = priceHistory(it, s).find(h => h.pid === pid), cur = num(it.precios[pid]);
  if (!prev) return '';
  const d = cur ? (cur - prev.precio) / prev.precio * 100 : 0;
  return `Antes ${money(prev.precio)}${cur && Math.abs(d) >= 0.5 ? ` · ${d > 0 ? '▲' : '▼'} ${pct(Math.abs(d))}` : ''}`;
}
function historyLine(it, s) {
  const h = priceHistory(it, s); if (!h.length) return '';
  const best = h.reduce((a, b) => (b.precio < a.precio ? b : a));
  return `Último: ${money(h[0].precio)} (${supplierName(h[0].pid)}, ${fdate(h[0].fecha)}) · mejor histórico: ${money(best.precio)} (${supplierName(best.pid)})`;
}

/* ---------- Combinación más conveniente (incluye despacho) ---------- */
function purchasePlans(s) {
  const items = validItems(s).filter(i => s.proveedores.some(pid => num(i.precios[pid]) > 0)); if (!items.length) return [];
  const ship = pid => num(condOf(s, pid).despacho), plans = [];
  s.proveedores.forEach(pid => { if (items.every(i => num(i.precios[pid]) > 0)) plans.push({ label: `Todo con ${supplierName(pid)}`, picks: Object.fromEntries(items.map(i => [i.id, pid])), total: sum(items, i => round(num(i.cant) * i.precios[pid])) + ship(pid) }); });
  const picks = Object.fromEntries(items.map(i => [i.id, bestSupplier(i, s.proveedores)])), used = [...new Set(Object.values(picks))];
  if (used.length > 1) plans.push({ label: `Dividir: ${used.map(supplierName).join(' + ')}`, picks, total: sum(items, i => round(num(i.cant) * i.precios[picks[i.id]])) + sum(used, ship) });
  return plans.sort((a, b) => a.total - b.total);
}

/* ---------- Lista ---------- */
const sl = { f: 'abierta' };
const solListHtml = () => {
  const list = D().solicitudes.filter(s => sl.f === 'todas' || s.estado === sl.f).sort((a, b) => String(b.folio).localeCompare(String(a.folio), 'es', { numeric: true }));
  return list.length ? html`<div class="list">${list.map(s => html`<a class="row" href="#/solicitudes/${s.id}"><div class="row-main"><span class="row-title">${s.folio}${s.notas ? ' · ' + s.notas : ''}</span><span class="row-sub">${fdate(s.fecha)} · ${plural(s.items.length, 'producto', 'productos')} · ${nf.format(Object.keys(s.consultas).length)} de ${plural(s.proveedores.length, 'proveedor', 'proveedores')} consultados</span></div>${badge(SOL_STATES[s.estado], s.estado === 'abierta' ? 'info' : 'ok')}</a>`)}</div>` : emptyState('list', 'Sin solicitudes', 'Anota lo que necesitas comprar, pide cotización a tus proveedores y compara.', html`<button class="btn primary" data-act="sol.new">${icon('plus')} Nueva solicitud</button>`);
};
defineView({
  path: '/solicitudes', title: 'Solicitudes de compra', live: true,
  render() {
    return html`${pageHead('Solicitudes de compra', 'Pide cotización y compara precios antes de comprar', html`<button class="btn primary" data-act="sol.new">${icon('plus')} Nueva solicitud</button>`)}
      ${chips([['abierta', 'Abiertas'], ['cerrada', 'Con órdenes'], ['todas', 'Todas']], sl.f, 'sl.f')}<section class="card" id="sll">${solListHtml()}</section>`;
  },
});
act('sl.f', el => { sl.f = el.dataset.v; $$('[data-act="sl.f"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); mount($('#sll'), solListHtml()); });

/* ---------- Detalle ---------- */
function solItemHtml(s, it) {
  registerCombo('si-' + it.id, {
    source: t => D().productos.filter(p => !t || norm(`${p.sku} ${p.nombre}`).includes(t)).sort((a, b) => byName(a.nombre, b.nombre)).map(p => ({ value: p.id, label: p.nombre, sub: `${p.sku} · stock ${nf.format(stockOf(p.id))}` })),
    onPick: x => { const p = find('productos', x.value); Object.assign(it, { productoId: p.id, nombre: p.nombre, unidad: p.unidad }); solSave(); },
    onType: text => { it.nombre = text; it.productoId = ''; solSave(); },
  });
  const ro = s.estado === 'cerrada', best = bestSupplier(it, s.proveedores), hist = historyLine(it, s);
  return html`<div class="sol-item" data-item="${it.id}">
    <div class="sol-head"><div class="f-prod">${comboHtml({ id: 'si-' + it.id, label: 'Producto', text: it.nombre, value: it.productoId, placeholder: 'Busca o escribe libre…' })}</div>
      <div class="field"><label>Cantidad</label><input class="input" inputmode="decimal" data-input="si.cant" value="${it.cant}" ${ro ? 'disabled' : ''}></div>
      ${ro ? '' : html`<button class="btn ghost icon" data-act="si.del" aria-label="Quitar">${icon('trash')}</button>`}</div>
    ${hist ? html`<p class="muted small">${hist}</p>` : ''}
    ${s.proveedores.length ? html`<div class="sol-offers">${s.proveedores.map(pid => html`<label class="offer ${it.elegido === pid ? 'is-picked' : ''} ${best === pid ? 'is-best' : ''}"><input type="radio" name="el-${it.id}" value="${pid}" data-change="si.pick" ${it.elegido === pid ? 'checked' : ''} ${ro ? 'disabled' : ''}><span class="offer-name">${supplierName(pid)}${best === pid ? ' ★' : ''}</span><input class="input" inputmode="decimal" data-input="si.precio" data-pid="${pid}" value="${it.precios[pid] ?? ''}" placeholder="Precio neto unitario" ${ro ? 'disabled' : ''}><span class="offer-hint muted small" data-hint="${pid}">${offerHint(it, pid, s)}</span></label>`)}</div>` : html`<p class="muted small">Agrega proveedores para cargar sus precios.</p>`}
  </div>`;
}
const solItemsHtml = s => s.items.length ? html`<div class="stack">${s.items.map(it => solItemHtml(s, it))}</div>` : html`<div class="empty">${icon('box')}<p>Agrega los productos que necesitas comprar.</p></div>`;

const supplierRowHtml = (s, pid) => {
  const sp = find('proveedores', pid), c = condOf(s, pid), asked = s.consultas[pid], ro = s.estado === 'cerrada';
  const cond = [c.plazo && `entrega ${c.plazo} días`, c.despacho && `despacho ${money(num(c.despacho))}`, c.pago, c.validez && `válida ${c.validez} días`].filter(Boolean).join(' · ');
  return html`<div class="sup"><div class="sup-info"><span class="row-title">${supplierName(pid)}</span>${asked ? badge('Consultado ' + fdate(asked.fecha), 'info') : badge('Sin consultar')}</div><span class="row-sub">${cond || 'Sin condiciones registradas'}</span>
    ${ro ? '' : html`<div class="cluster"><button class="btn sm" data-act="sol.ask" data-id="${pid}">${icon('phone')} Pedir por WhatsApp</button><button class="btn sm" data-act="sol.ask.mail" data-id="${pid}">${icon('mail')} Correo</button><button class="btn ghost sm" data-act="sol.cond" data-id="${pid}">${icon('edit')} Condiciones</button><button class="btn ghost icon sm" data-act="sol.prov.del" data-id="${pid}" aria-label="Quitar proveedor">${icon('trash')}</button></div>`}</div>`;
};
const solProvsHtml = s => s.proveedores.length ? html`<div class="sup-list">${s.proveedores.map(pid => supplierRowHtml(s, pid))}</div>` : html`<p class="muted small">Agrega a los proveedores a quienes pedirás precio.</p>`;

/* Tabla comparativa: producto × proveedor */
function comparisonHtml(s) {
  const items = validItems(s); if (!items.length || !s.proveedores.length) return '';
  const tot = pid => { const priced = items.filter(i => num(i.precios[pid]) > 0); return { sum: sum(priced, i => round(num(i.cant) * i.precios[pid])), missing: items.length - priced.length }; };
  const cell = (it, pid) => { const v = num(it.precios[pid]); return html`<td class="num ${v && bestSupplier(it, s.proveedores) === pid ? 'is-best' : ''} ${it.elegido === pid ? 'is-picked' : ''}">${v ? money(v) : '—'}</td>`; };
  return html`<div class="table-wrap"><table class="cmp"><thead><tr><th>Producto</th>${s.proveedores.map(pid => html`<th class="num">${supplierName(pid)}</th>`)}</tr></thead>
    <tbody>${items.map(it => html`<tr><th scope="row">${it.nombre}<small>${nf.format(it.cant)} ${it.unidad}</small></th>${s.proveedores.map(pid => cell(it, pid))}</tr>`)}</tbody>
    <tfoot><tr><th scope="row">Entrega</th>${s.proveedores.map(pid => html`<td class="num">${condOf(s, pid).plazo ? condOf(s, pid).plazo + ' días' : '—'}</td>`)}</tr>
      <tr><th scope="row">Forma de pago</th>${s.proveedores.map(pid => html`<td class="num">${condOf(s, pid).pago || '—'}</td>`)}</tr>
      <tr><th scope="row">Despacho</th>${s.proveedores.map(pid => html`<td class="num">${num(condOf(s, pid).despacho) ? money(num(condOf(s, pid).despacho)) : '—'}</td>`)}</tr>
      <tr class="total"><th scope="row">Total si compras todo (neto)</th>${s.proveedores.map(pid => { const t = tot(pid); return html`<td class="num">${money(t.sum + num(condOf(s, pid).despacho))}${t.missing ? html`<small>faltan ${t.missing}</small>` : ''}</td>`; })}</tr></tfoot></table></div>`;
}
const solTotal = s => sum(s.items.filter(i => i.elegido), i => round(num(i.cant) * num(i.precios[i.elegido])));
function solSummary(s) {
  const picked = s.items.filter(i => i.elegido && num(i.precios[i.elegido]) > 0), ro = s.estado === 'cerrada', groups = [...new Set(picked.map(i => i.elegido))], plans = purchasePlans(s);
  return html`<dl class="kv"><dt>Productos</dt><dd>${s.items.length}</dd><dt>Proveedores consultados</dt><dd>${Object.keys(s.consultas).length} de ${s.proveedores.length}</dd><dt>Con proveedor elegido</dt><dd>${picked.length}</dd><dt>Compra elegida (neto)</dt><dd class="strong">${money(solTotal(s) + sum(groups, pid => num(condOf(s, pid).despacho)))}</dd></dl>
    ${ro ? html`<div class="list">${s.compras.map(id => find('compras', id)).filter(Boolean).map(poRow)}</div>` : html`
      ${plans.length ? html`<div class="plan"><span class="label">Más conveniente (con despacho)</span><strong>${plans[0].label}</strong><span class="num">${money(plans[0].total)} neto</span>${plans[1] ? html`<small class="muted">${plans[1].label}: ${money(plans[1].total)}</small>` : ''}<button class="btn sm" data-act="sol.plan">${icon('check')} Usar esta combinación</button></div>` : ''}
      <button class="btn accent block" data-act="sol.generate" ${picked.length ? '' : 'disabled'}>${icon('receipt')} Generar ${plural(groups.length, 'orden', 'órdenes')} de compra</button>`}`;
}
function solPaint() {
  const s = solOf(); if (!s) return;
  mount($('#sol-sum'), solSummary(s)); mount($('#sol-cmp'), comparisonHtml(s));
  $$('.sol-item').forEach(el => {
    const it = s.items.find(i => i.id === el.dataset.item), best = bestSupplier(it, s.proveedores);
    el.querySelectorAll('.offer').forEach(o => { const pid = o.querySelector('[data-pid]').dataset.pid; o.classList.toggle('is-best', best === pid); o.classList.toggle('is-picked', it.elegido === pid); o.querySelector('[data-hint]').textContent = offerHint(it, pid, s); });
  });
}
const solSave = () => { const s = solOf(); if (s) { upsert('solicitudes', s); solPaint(); } };

defineView({
  path: '/solicitudes/:id', nav: '/solicitudes', title: p => find('solicitudes', p.id)?.folio || 'Solicitud', live: false,
  render({ id }) {
    const s = find('solicitudes', id);
    if (!s) return emptyState('list', 'Solicitud no encontrada', 'Puede que haya sido eliminada.', html`<a class="btn" href="#/solicitudes">Volver</a>`);
    const ro = s.estado === 'cerrada', cmp = comparisonHtml(s);
    return html`<div class="page-head"><div><a class="btn ghost sm" href="#/solicitudes">${icon('back')} Solicitudes</a><h1>${s.folio} ${badge(SOL_STATES[s.estado], ro ? 'ok' : 'info')}</h1><p>${s.notas || 'Pide precios, compara y elige dónde comprar cada producto.'}</p></div>
        <div class="head-actions"><button class="btn ghost danger" data-act="sol.del">${icon('trash')} Eliminar</button></div></div>
      <div class="split"><div class="stack">
        <section class="card"><div class="card-head"><h2>Proveedores</h2>${ro ? '' : html`<button class="btn sm" data-act="sol.prov.add">${icon('plus')} Agregar</button>`}</div>
          <div class="card-pad form-grid"><div class="field"><label for="sol-lim">Pedir respuesta antes del</label><input class="input" id="sol-lim" type="date" data-change="sol.limite" value="${s.limite}" ${ro ? 'disabled' : ''}></div></div><div id="sol-provs">${solProvsHtml(s)}</div></section>
        <section class="card"><div class="card-head"><h2>Productos y precios</h2>${ro ? '' : html`<button class="btn sm primary" data-act="si.add">${icon('plus')} Agregar</button>`}</div><div class="card-pad" id="sol-items">${solItemsHtml(s)}</div></section>
        <section class="card"><div class="card-head"><h2>Comparativo</h2></div><div class="card-pad" id="sol-cmp">${cmp}</div></section>
      </div><aside class="stack"><section class="card card-pad stack" id="sol-sum">${solSummary(s)}</section></aside></div>`;
  },
});
const siOf = el => solOf().items.find(i => i.id === el.closest('[data-item]').dataset.item);
onInput('si.cant', el => { siOf(el).cant = dec(el.value); solSave(); });
onInput('si.precio', el => { siOf(el).precios[el.dataset.pid] = dec(el.value) || ''; solSave(); });
onChange('si.pick', el => { siOf(el).elegido = el.value; solSave(); });
onChange('sol.limite', el => { const s = solOf(); s.limite = el.value; upsert('solicitudes', s); });
act('si.add', () => { const s = solOf(), it = solItem(); s.items.push(it); upsert('solicitudes', s); mount($('#sol-items'), solItemsHtml(s)); solPaint(); $(`[data-item="${it.id}"] [data-combo]`).focus(); });
act('si.del', el => { const s = solOf(); s.items = s.items.filter(i => i !== siOf(el)); upsert('solicitudes', s); mount($('#sol-items'), solItemsHtml(s)); solPaint(); });
act('sol.prov.add', () => {
  const s = solOf();
  supplierPicker('Agregar proveedor', 'Agregar', id => {
    if (!s.proveedores.includes(id)) { s.proveedores.push(id); const last = D().solicitudes.filter(o => o.id !== s.id && o.condiciones?.[id]).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))[0]; if (last) s.condiciones[id] = { ...last.condiciones[id] }; }
    upsert('solicitudes', s); App.render();
  });
});
act('sol.prov.del', el => { const s = solOf(), id = el.dataset.id; s.proveedores = s.proveedores.filter(x => x !== id); delete s.consultas[id]; delete s.condiciones[id]; s.items.forEach(i => { delete i.precios[id]; if (i.elegido === id) i.elegido = ''; }); upsert('solicitudes', s); App.render(); });
act('sol.cond', async el => {
  const s = solOf(), id = el.dataset.id, c = condOf(s, id);
  const v = await formSheet({ title: `Condiciones · ${supplierName(id)}`, ok: 'Guardar', fields: [{ name: 'plazo', label: 'Plazo de entrega (días)', inputmode: 'numeric' }, { name: 'validez', label: 'Validez de la oferta (días)', inputmode: 'numeric' }, { name: 'despacho', label: 'Costo de despacho (neto)', inputmode: 'numeric' }, { name: 'pago', label: 'Forma de pago', placeholder: 'Contado, 30 días…' }], values: c });
  if (!v) return; s.condiciones[id] = v; upsert('solicitudes', s); mount($('#sol-provs'), solProvsHtml(s)); solPaint();
});

/* ---- Pedir cotización: PDF + WhatsApp / correo ---- */
function askSpec(s) {
  return { titulo: 'Solicitud de cotización', parte: 'Proveedor', folio: s.folio, sinPrecios: true, ivaRate: S().ventas.iva, meta: [['Fecha', fdate(s.fecha)], ['Responder antes de', s.limite ? fdate(s.limite) : 'Lo antes posible'], ['Moneda', 'Peso chileno']], cliente: { nombre: '' }, lineas: validItems(s).map(l => ({ ...l, sku: l.productoId ? find('productos', l.productoId)?.sku || '' : '', precio: 0, dscto: 0 })), notas: 'Por favor indique precio unitario neto, plazo de entrega, costo de despacho, forma de pago y validez de su oferta.', condiciones: '' };
}
const askText = (s, pid) => {
  const sp = find('proveedores', pid), name = (sp?.contacto || '').split(/\s+/)[0];
  return `Hola${name ? ' ' + name : ''}, te escribimos de ${S().empresa.nombreCorto}. ¿Nos puedes cotizar lo siguiente?\n${validItems(s).map(i => `• ${nf.format(i.cant)} ${i.unidad} ${i.nombre}`).join('\n')}\n\nNecesitamos precio neto unitario, plazo de entrega, despacho y forma de pago${s.limite ? `, idealmente antes del ${fdateLong(s.limite)}` : ''}. ¡Gracias!`;
};
async function askPdf(s, pid) {
  const spec = askSpec(s); spec.cliente = { nombre: supplierName(pid), rut: find('proveedores', pid)?.rut, contacto: find('proveedores', pid)?.contacto };
  return { blob: await renderDocPdf(spec), name: `${s.folio}_${norm(supplierName(pid)).replace(/\W+/g, '-')}.pdf` };
}
function markAsked(s, pid) { s.consultas[pid] = { fecha: today() }; upsert('solicitudes', s); mount($('#sol-provs'), solProvsHtml(s)); solPaint(); }
act('sol.ask', async el => {
  const s = solOf(), pid = el.dataset.id; if (!validItems(s).length) return toast('Agrega productos con cantidad');
  const { blob, name } = await askPdf(s, pid);
  if (await sharePdf({ blob, name, text: askText(s, pid), phone: find('proveedores', pid)?.telefono || '' })) markAsked(s, pid);
});
act('sol.ask.mail', async el => {
  const s = solOf(), pid = el.dataset.id; if (!validItems(s).length) return toast('Agrega productos con cantidad');
  const { blob, name } = await askPdf(s, pid); download(blob, name);
  location.href = mailLink(find('proveedores', pid)?.correo || '', `Solicitud de cotización ${s.folio} · ${S().empresa.nombreCorto}`, askText(s, pid) + '\n\n(Adjunta el PDF descargado)'); toast('PDF descargado: adjúntalo al correo'); markAsked(s, pid);
});

/* ---- Elegir y generar ---- */
act('sol.plan', () => { const s = solOf(), plan = purchasePlans(s)[0]; if (!plan) return; s.items.forEach(i => { if (plan.picks[i.id]) i.elegido = plan.picks[i.id]; }); upsert('solicitudes', s); mount($('#sol-items'), solItemsHtml(s)); solPaint(); toast('Combinación aplicada'); });
act('sol.generate', async () => {
  const s = solOf(), picked = s.items.filter(i => i.elegido && num(i.precios[i.elegido]) > 0), groups = [...new Set(picked.map(i => i.elegido))];
  if (!await confirmBox({ title: 'Generar órdenes de compra', text: `Se crearán ${plural(groups.length, 'orden', 'órdenes')} (${groups.map(supplierName).join(', ')}) en estado borrador. Podrás revisarlas antes de enviarlas.`, ok: 'Generar' })) return;
  s.compras = groups.map(pid => {
    const c = condOf(s, pid), lineas = picked.filter(i => i.elegido === pid).map(i => ({ ...poLine(find('productos', i.productoId), num(i.cant)), nombre: i.nombre, unidad: i.unidad, costo: num(i.precios[pid]) }));
    if (num(c.despacho) > 0) lineas.push({ ...poLine(null, 1), nombre: 'Despacho', unidad: 'UN', costo: num(c.despacho) });
    return createPurchase(pid, lineas, { solicitudId: s.id, entrega: c.plazo ? addDays(today(), num(c.plazo)) : '', notas: [c.pago && `Forma de pago: ${c.pago}.`, c.validez && `Oferta válida ${c.validez} días.`].filter(Boolean).join(' ') }).id;
  });
  s.estado = 'cerrada'; upsert('solicitudes', s); toast('Órdenes generadas'); App.render();
});
act('sol.del', async () => { const s = solOf(); if (await confirmBox({ title: 'Eliminar solicitud', text: `Se eliminará ${s.folio}. Las órdenes ya generadas no se tocan.`, ok: 'Eliminar', danger: true })) { remove('solicitudes', s.id); go('/solicitudes'); } });


/* ============================================================
   19 · Finanzas: ventas, cobros, compras y margen por mes
   ============================================================ */

const FIN_MONTHS = 6;
const monthLabel = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('es-CL', { month: 'short', year: '2-digit' }).replace('.', ''); };
const lastMonths = n => { const out = [], d = new Date(); d.setDate(1); for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`); } return out; };

function financeByMonth() {
  const keys = lastMonths(FIN_MONTHS), row = Object.fromEntries(keys.map(k => [k, { k, facturado: 0, cobrado: 0, compras: 0, margen: 0 }]));
  D().documentos.filter(d => !d.anulado).forEach(d => { const r = row[monthKey(d.fecha)]; if (r) r.facturado += d.total; (d.pagos || []).forEach(p => { const q = row[monthKey(p.fecha)]; if (q) q.cobrado += p.monto; }); });
  D().compras.filter(o => o.estado === 'recibida').forEach(o => { const r = row[monthKey(o.fecha)]; if (r) r.compras += poTotals(o).total; });
  D().pedidos.filter(p => p.estado !== 'anulado').forEach(p => { const r = row[monthKey(p.fecha)]; if (r) r.margen += totals(p.lineas, p.ivaRate).margen; });
  return keys.map(k => row[k]);
}

defineView({
  path: '/finanzas', title: 'Finanzas', live: true,
  render() {
    const rows = financeByMonth(), cur = rows[rows.length - 1], max = Math.max(1, ...rows.flatMap(r => [r.facturado, r.cobrado, r.compras]));
    const open = D().documentos.filter(d => !d.anulado), receivable = sum(open, docBalance);
    const payable = sum(D().compras.filter(o => ['enviada', 'borrador'].includes(o.estado)), o => poTotals(o).total);
    const byClient = Object.entries(open.reduce((a, d) => (a[d.clienteId] = (a[d.clienteId] || 0) + d.total, a), {})).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const topMax = Math.max(1, ...byClient.map(x => x[1]));
    return html`${pageHead('Finanzas', 'Últimos 6 meses')}
      <div class="grid cols-4">${kpi('Facturado este mes', money(cur.facturado))}${kpi('Cobrado este mes', money(cur.cobrado), '', 'is-ok')}${kpi('Por cobrar', money(receivable), 'Facturas y boletas abiertas')}${kpi('Compras por recibir', money(payable), 'Órdenes abiertas')}</div>
      <section class="card card-pad stack"><h2>Evolución mensual</h2>
        <div class="legend"><span><i class="dot d1"></i> Facturado</span><span><i class="dot d2"></i> Cobrado</span><span><i class="dot d3"></i> Compras recibidas</span></div>
        <div class="months">${rows.map(r => html`<div class="month"><div class="mbars" role="img" aria-label="${monthLabel(r.k)}: facturado ${money(r.facturado)}, cobrado ${money(r.cobrado)}, compras ${money(r.compras)}"><span class="mb d1" style="height:${Math.round(r.facturado / max * 100)}%"></span><span class="mb d2" style="height:${Math.round(r.cobrado / max * 100)}%"></span><span class="mb d3" style="height:${Math.round(r.compras / max * 100)}%"></span></div><span class="mlabel">${monthLabel(r.k)}</span></div>`)}</div></section>
      <div class="grid cols-2">
        <section class="card"><div class="card-head"><h2>Detalle por mes</h2></div><div class="list">${[...rows].reverse().map(r => html`<div class="row"><div class="row-main"><span class="row-title">${monthLabel(r.k)}</span><span class="row-sub">Facturado ${money(r.facturado)} · cobrado ${money(r.cobrado)} · compras ${money(r.compras)}</span></div><div class="row-side"><span class="row-amount">${money(r.margen)}</span><span class="muted small">margen de pedidos</span></div></div>`)}</div></section>
        <section class="card card-pad stack"><h2>Clientes con más facturación</h2>${byClient.length ? html`<div class="bar-chart">${byClient.map(([id, v]) => html`<div class="bar-line"><span class="truncate">${clientName(id)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v / topMax * 100)}%"></div></div><span class="num right">${money(v)}</span></div>`)}</div>` : html`<p class="muted">Aún no hay documentos emitidos.</p>`}</section>
      </div>`;
  },
});


/* ============================================================
   20 · Respaldo en Google Drive (carpeta privada de la app: drive.appdata)
   La app solo ve su propio archivo; no puede leer ni modificar el resto del Drive.
   ============================================================ */

const DRIVE_CLIENT_ID = '420386614178-j4jcd174go5mrh451grfeltnt8cjkscj.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE = 'Lumo360_respaldo.json';
const DRIVE_API = 'https://www.googleapis.com/drive/v3/files', DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';

const Drive = (() => {
  let token = '', until = 0;
  const loadGoogle = () => window.google?.accounts?.oauth2 ? Promise.resolve() : new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = ok; s.onerror = () => bad(new Error('No se pudo cargar Google. Revisa tu conexión.')); document.head.appendChild(s);
  });
  const auth = async () => {
    if (token && Date.now() < until) return token;
    await loadGoogle();
    return new Promise((ok, bad) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE,
        callback: r => {
          if (r.error) return bad(new Error(r.error === 'access_denied' ? 'Cancelaste el permiso de Google.' : `Google rechazó la conexión (${r.error}).`));
          token = r.access_token; until = Date.now() + (num(r.expires_in) - 60) * 1000; localStorage.setItem('lumo360-drive', '1'); ok(token);
        },
        error_callback: e => bad(new Error(e?.type === 'popup_closed' ? 'Cerraste la ventana de Google.' : 'No se pudo abrir Google: permite las ventanas emergentes e inténtalo otra vez.')),
      });
      client.requestAccessToken({ prompt: localStorage.getItem('lumo360-drive') ? '' : 'consent' });
    });
  };
  const call = async (url, opts = {}) => {
    const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + await auth(), ...(opts.headers || {}) } });
    if (r.status === 401) { token = ''; throw new Error('La sesión de Google venció. Inténtalo otra vez.'); }
    if (!r.ok) throw new Error(`Google Drive respondió con error ${r.status}.`);
    return r;
  };
  const find = async () => (await (await call(`${DRIVE_API}?spaces=appDataFolder&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)&q=${encodeURIComponent(`name='${DRIVE_FILE}'`)}`)).json()).files[0] || null;
  return {
    connected: () => !!localStorage.getItem('lumo360-drive'),
    find,
    async save(text) {
      const cur = await find();
      if (cur) return call(`${DRIVE_UPLOAD}/${cur.id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: text });
      const edge = 'lumo360' + uid();
      return call(`${DRIVE_UPLOAD}?uploadType=multipart`, { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${edge}` }, body: `--${edge}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE, parents: ['appDataFolder'] })}\r\n--${edge}\r\nContent-Type: application/json\r\n\r\n${text}\r\n--${edge}--`, });
    },
    async load() { const cur = await find(); return cur ? (await call(`${DRIVE_API}/${cur.id}?alt=media`)).text() : null; },
    disconnect() { if (token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(token, () => {}); token = ''; until = 0; localStorage.removeItem('lumo360-drive'); localStorage.removeItem('lumo360-last-drive'); },
  };
})();

const driveBusy = async (label, fn) => { toast(label); try { await fn(); } catch (e) { toast(e.message || 'No se pudo completar con Google Drive'); } };
const driveStamp = () => { const t = localStorage.getItem('lumo360-last-drive'); return t ? new Date(Number(t)).toLocaleString('es-CL', { dateStyle: 'medium', timeStyle: 'short' }) : ''; };
const driveStatusHtml = () => Drive.connected() ? html`<span class="badge ok">Conectado</span> <span class="muted small">${driveStamp() ? 'Último respaldo en Drive: ' + driveStamp() : 'Aún no has respaldado en Drive.'}</span>` : html`<span class="muted small">Sin conectar. Se pedirá tu permiso de Google la primera vez.</span>`;

act('drive.save', () => driveBusy('Conectando con Google…', async () => {
  await Drive.save(JSON.stringify(backupPayload())); noteBackup(); localStorage.setItem('lumo360-last-drive', String(Date.now())); toast('Respaldo guardado en Drive'); mount($('#drive-status'), driveStatusHtml());
}));
act('drive.save.enc', async () => {
  if (!SECURE) return toast('El respaldo cifrado requiere abrir la app desde HTTPS');
  const pass = await askPassword('Respaldo cifrado en Drive', true); if (pass === null) return;
  driveBusy('Conectando con Google…', async () => { await Drive.save(await sealBackup(pass)); noteBackup(); localStorage.setItem('lumo360-last-drive', String(Date.now())); toast('Respaldo cifrado guardado en Drive'); mount($('#drive-status'), driveStatusHtml()); });
});
act('drive.restore', () => driveBusy('Buscando tu respaldo en Drive…', async () => {
  const text = await Drive.load(); if (text === null) return toast('No hay ningún respaldo en tu Drive todavía');
  await importBackupText(text);
}));
act('drive.off', async () => { if (await confirmBox({ title: 'Desconectar Google Drive', text: 'La app dejará de tener acceso. Tu respaldo seguirá guardado en Drive.', ok: 'Desconectar', danger: true })) { Drive.disconnect(); mount($('#drive-status'), driveStatusHtml()); mount($('#drive-actions'), driveActionsHtml()); toast('Drive desconectado'); } });
const driveActionsHtml = () => html`<button class="btn primary" data-act="drive.save">${icon('upload')} Respaldar en Drive</button><button class="btn" data-act="drive.save.enc">${icon('lock')} Respaldo cifrado</button><button class="btn" data-act="drive.restore">${icon('download')} Restaurar desde Drive</button>${Drive.connected() ? html`<button class="btn ghost" data-act="drive.off">Desconectar</button>` : ''}`;

   99 · Arranque
   ============================================================ */

(async function boot() {
  await Store.load();
  applyTheme();
  App.shell();
  App.render();
  Store.subscribe(() => App.refresh());
  if (Lock.active()) Lock.show();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

})();
</script>
