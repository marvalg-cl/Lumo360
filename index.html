*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

const IDB_NAME='lumo360-idb-backup',IDB_STORE='snapshots',IDB_KEY='data';
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB no soportado'));const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{req.result.createObjectStore(IDB_STORE)};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function idbSaveBackup(data){idbOpen().then(db=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put({data:data,ts:Date.now()},IDB_KEY)}).catch(()=>{})}
function idbLoadBackup(){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly'),req=tx.objectStore(IDB_STORE).get(IDB_KEY);req.onsuccess=()=>res(req.result||null);req.onerror=()=>rej(req.error)})).catch(()=>null)}

function svgDonutChart(segments,size=160){
 const total=segments.reduce((s,x)=>s+Math.max(0,x.value),0);
 if(!total)return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#ECE7DC" stroke-width="14"/></svg>`;
 const r=40,cx=50,cy=50,circ=2*Math.PI*r;
 let offset=0,arcs='';
 segments.filter(x=>x.value>0).forEach(seg=>{
  const frac=seg.value/total,len=frac*circ;
  arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="14" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  offset+=len;
 });
 return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${arcs}<circle cx="50" cy="50" r="30" fill="#fff"/></svg>`;
}
function svgLineChart(points,opts={}){
 const w=opts.width||520,h=opts.height||160,pad=28;
 if(!points.length)return `<svg width="${w}" height="${h}"></svg>`;
 const max=Math.max(1,...points.map(p=>p.value)),min=0;
 const stepX=(w-pad*2)/Math.max(1,points.length-1);
 const y=v=>h-pad-((v-min)/(max-min||1))*(h-pad*2);
 const coords=points.map((p,i)=>[pad+i*stepX,y(p.value)]);
 const path=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
 const area=path+` L${coords[coords.length-1][0].toFixed(1)} ${h-pad} L${coords[0][0].toFixed(1)} ${h-pad} Z`;
 const dots=coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.4" fill="var(--orange)"><title>${esc(points[i].label)}: ${money(points[i].value)}</title></circle>`).join('');
 const labels=points.map((p,i)=>`<text x="${coords[i][0].toFixed(1)}" y="${h-8}" font-size="9" fill="var(--muted)" text-anchor="middle">${esc(p.label)}</text>`).join('');
 return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><path d="${area}" fill="rgba(255,90,0,.12)"/><path d="${path}" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function buildMonthlySales(quotes,months=6){
 const now=new Date(),out=[];
 for(let i=months-1;i>=0;i--){
  const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const label=d.toLocaleDateString('es-CL',{month:'short'}).replace('.','');
  const total=quotes.filter(q=>{
   if(!['aceptada','convertida_pedido'].includes(q.estado)||!q.fecha)return false;
   const qd=new Date(q.fecha);
   return qd.getFullYear()===d.getFullYear()&&qd.getMonth()===d.getMonth();
  }).reduce((s,q)=>s+num(q.total),0);
  out.push({label,value:total});
 }
 return out;
}

function wireGlobalSearch(){

/* ===== LUMO360: sincronización real con Google Drive (API oficial, Google Identity Services) =====
   Requiere que el usuario configure su propio "Client ID" de Google Cloud (gratuito) en
   Configuración → Sincronización. El token de acceso vive solo en memoria de la sesión (no se guarda
   permanentemente por seguridad); al recargar la página hay que reconectar con un clic. */
let gDriveToken=null,gDriveFileId=null,gDriveSyncing=false;
function driveClientId(){return DATA.settings?.googleClientId||'';}
function driveIsConnected(){return !!gDriveToken;}
function connectDrive(){
 const cid=driveClientId().trim();
 if(!cid)return toast('Primero pega tu Client ID de Google en Configuración → Sincronización.');
 if(!window.google?.accounts?.oauth2)return toast('Google Identity Services no cargó todavía. Espera un segundo e intenta de nuevo (necesitas internet).');
 try{
  const client=google.accounts.oauth2.initTokenClient({
   client_id:cid,
   scope:'https://www.googleapis.com/auth/drive.file',
   callback:(resp)=>{
    if(resp.error){toast('No se pudo conectar con Google Drive: '+resp.error);return;}
    gDriveToken=resp.access_token;
    toast('Google Drive conectado. Sincronizando...');
    driveSyncNow().then(()=>render());
   }
  });
  client.requestAccessToken();
 }catch(e){console.error(e);toast('No se pudo iniciar la conexión con Google. Revisa el Client ID.');}
}
function disconnectDrive(){gDriveToken=null;gDriveFileId=null;toast('Google Drive desconectado en este dispositivo.');render();}
async function driveFindFile(){
 const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='lumo360-data.json' and trashed=false")}&fields=files(id,modifiedTime)`,{headers:{Authorization:`Bearer ${gDriveToken}`}});
 if(!res.ok)throw new Error('drive_find_failed');
 const data=await res.json();
 return data.files?.[0]||null;
}
async function driveSyncNow(){
 if(!gDriveToken||gDriveSyncing)return;
 gDriveSyncing=true;
 try{
  const existing=await driveFindFile();
  const content=JSON.stringify(DATA);
  if(existing){
   gDriveFileId=existing.id;
   await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{Authorization:`Bearer ${gDriveToken}`,'Content-Type':'application/json'},body:content});
  }else{
   const metadata={name:'lumo360-data.json',mimeType:'application/json'};
   const form=new FormData();
   form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
   form.append('file',new Blob([content],{type:'application/json'}));
   const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:`Bearer ${gDriveToken}`},body:form});
   const data=await res.json();
   gDriveFileId=data.id;
  }
  DATA.settings.driveLastSync=new Date().toISOString();
 }catch(e){console.error(e);toast('No se pudo sincronizar con Google Drive (token vencido, reconecta).');gDriveToken=null;}
 finally{gDriveSyncing=false;}
}
async function driveLoadLatest(){
 if(!gDriveToken)return null;
 try{
  const existing=await driveFindFile();
  if(!existing)return null;
  const res=await fetch(`https://www.googleapis.com/drive/v3/files/${existing.id}?alt=media`,{headers:{Authorization:`Bearer ${gDriveToken}`}});
  if(!res.ok)return null;
  return await res.json();
 }catch(e){return null;}
}
async function driveRestoreFromCloud(){
 if(!driveIsConnected())return toast('Conecta Google Drive primero.');
 const remote=await driveLoadLatest();
 if(!remote)return toast('No se encontró un respaldo en tu Google Drive.');
 if(!confirm('Esto reemplazará los datos de este dispositivo con la última versión guardada en Google Drive. ¿Continuar?'))return;
 DATA=normalize(remote);save();render();toast('Datos restaurados desde Google Drive.');
}
let __driveSyncTimer=null;
function driveScheduleSync(){
 if(!driveIsConnected())return;
 clearTimeout(__driveSyncTimer);
 __driveSyncTimer=setTimeout(()=>driveSyncNow(),1500);
}

/* ===== LUMO360: utilidades RUT chileno (algoritmo módulo 11 estándar) ===== */
function limpiarRut(rutRaw){return String(rutRaw||'').replace(/[^0-9kK]/g,'').toUpperCase();}
function validarRut(rutRaw){
 const rut=limpiarRut(rutRaw);
 if(rut.length<2)return false;
 const cuerpo=rut.slice(0,-1),dv=rut.slice(-1);
 if(!/^\d+$/.test(cuerpo))return false;
 let suma=0,multiplo=2;
 for(let i=cuerpo.length-1;i>=0;i--){suma+=parseInt(cuerpo[i],10)*multiplo;multiplo=multiplo===7?2:multiplo+1;}
 const resto=11-(suma%11);
 const dvEsperado=resto===11?'0':resto===10?'K':String(resto);
 return dv===dvEsperado;
}
function formatearRut(rutRaw){
 const rut=limpiarRut(rutRaw);
 if(rut.length<2)return rutRaw||'';
 const cuerpo=rut.slice(0,-1),dv=rut.slice(-1);
 let out='';
 for(let i=cuerpo.length-1,c=0;i>=0;i--,c++){out=cuerpo[i]+out;if(c%3===2&&i!==0)out='.'+out;}
 return out+'-'+dv;
}
function wireRutInput(inputId){
 const el=document.getElementById(inputId);
 if(!el)return;
 const hint=document.createElement('div');
 hint.className='rut-hint mini';
 el.insertAdjacentElement('afterend',hint);
 const check=()=>{
  const v=el.value.trim();
  if(!v){hint.textContent='';hint.className='rut-hint mini';return;}
  if(validarRut(v)){hint.textContent='RUT válido';hint.className='rut-hint mini rut-ok';}
  else{hint.textContent='RUT inválido — verifica el dígito verificador';hint.className='rut-hint mini rut-bad';}
 };
 el.addEventListener('input',check);
 el.addEventListener('blur',()=>{if(validarRut(el.value))el.value=formatearRut(el.value);check();});
 check();
}

function skuDisplay(v){const raw=String(v??'').trim();return raw.replace(/^LB-/i,'')||'SIN SKU'}
function productIdentity(sku,name,opts={}){const k=skuDisplay(sku);return `<div class="product-identity"><b class="product-sku">${esc(k)}</b><span class="product-name">${esc(name||'')}</span>${opts.meta?`<small class="product-meta">${esc(opts.meta)}</small>`:''}</div>`}
function num(v){if(v===null||v===undefined||v==='')return 0;let s=String(v).trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(',')){s=s.replace(',','.')}const n=Number(s);return Number.isFinite(n)?n:0}
function money(v){return '$ '+Math.round(num(v)).toLocaleString('es-CL')}
function fmtNum(v){return num(v).toLocaleString('es-CL',{maximumFractionDigits:2})}
function date(v){return v?new Date(v).toLocaleDateString('es-CL'):''}
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(d){const x=clone(d||{}); const arr=['companies','contacts','obras','deals','products','quotes','activities','suppliers','rfqs','pedidos','purchaseOrders','purchaseNeeds','facturas','boletas','guiasDespacho','inboxSolicitudes','auditLog'];arr.forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]}); x.settings=x.settings||{}; x.settings.ivaRate=num(x.settings.ivaRate)||19; x.nextFolio=num(x.nextFolio)||1; x.nextRfqFolio=num(x.nextRfqFolio)||1; x.nextPedidoFolio=num(x.nextPedidoFolio)||1; x.nextPoFolio=num(x.nextPoFolio)||1; x.purchaseNeeds=Array.isArray(x.purchaseNeeds)?x.purchaseNeeds:[]; x.nextFacturaFolio=num(x.nextFacturaFolio)||1; x.nextBoletaFolio=num(x.nextBoletaFolio)||1; x.nextGuiaFolio=num(x.nextGuiaFolio)||1; x.nextNcFolio=num(x.nextNcFolio)||1; return x}
function loadData(){try{let raw=localStorage.getItem(STORAGE);if(!raw)raw=localStorage.getItem('lumo360-v3-data');if(raw){const d=normalize(JSON.parse(raw));if(!d.products.length&&SEED.products.length)d.products=clone(SEED.products);if(!d.companies.length&&SEED.companies.length)d.companies=clone(SEED.companies);if(!Array.isArray(d.quotes))d.quotes=[];return d}}catch(e){console.warn('STORE inválido, se recuperará la base inicial',e)}return normalize(SEED)}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(DATA));idbSaveBackup(DATA);driveScheduleSync();return true}catch(e){console.error(e);toast('No se pudieron guardar los datos localmente. Exporta un respaldo JSON.');return false}}
function resetData(){if(!confirm('Esto reemplazará los datos actuales por la base inicial. ¿Continuar?'))return;localStorage.removeItem(STORAGE);DATA=normalize(SEED);state.view='dashboard';render();toast('Base inicial restaurada.')}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>r.innerHTML='',2800)}
function navigate(v){state.view=v;state.query='';closeModal();render()}
function getTitle(){return (NAV.find(n=>n[0]===state.view)||NAV[0])[2]}

function phasebar(){const ps=[['dashboard','Inicio'],['production','Operación 360'],['companies','CRM'],['obras','Obras'],['quotes','Cotizar'],['materialesTecnicos','Técnico'],['pedidos','Pedidos'],['rfqs','Abastecer'],['purchaseOrders','OC'],['inventario','Stock'],['documentos','Documentos'],['finanzas','Finanzas'],['control','Control'],['audit','Auditoría'],['reportes','Reportes']];return `<div class="phasebar">${ps.map(p=>`<button data-nav="${p[0]}" class="${state.view===p[0]?'active':''}">${p[1]}</button>`).join('')}</div>`}
function head(title,sub,actions=''){return `<div class="page-head"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="actions">${actions}</div></div>`}
function searchBox(ph='Buscar…'){return `<input class="search" data-action="setQuery" value="${esc(state.query)}" placeholder="${ph}">`}
function empty(text='No hay registros.'){return `<div class="empty"><div class="empty-ico">${icon('inbox',26)}</div><p>${text}</p></div>`}
function render(){let c='';try{c=views[state.view]?views[state.view]():views.dashboard()}catch(e){console.error(e);c=`${head('Error de módulo','El módulo no pudo renderizarse.') }<div class="card"><b>Error:</b> ${esc(e.message)}</div>`}layout(c);wire();wireGlobalSearch();if(state.view==='materialesTecnicos'){wireTechSearch();wireTechQuick();}}
let __wired=false;
function wire(){
 if(__wired)return;
 __wired=true;
 document.addEventListener('click',e=>{
   const nav=e.target.closest?.('[data-nav]');
   if(nav){e.preventDefault();if(nav.dataset.nav==='__more'){openMobileMore();return;}navigate(nav.dataset.nav);return;}
   const closer=e.target.closest?.('[data-close]');
   if(closer){e.preventDefault();closeModal();return;}
   const pickerCloser=e.target.closest?.('[data-picker-close]');
   if(pickerCloser){e.preventDefault();pickerCloser.closest('.modal-backdrop')?.remove();return;}
   const av=e.target.closest?.('[data-attachment-view]');if(av){e.preventDefault();previewAttachment(av.dataset.attachmentView,av.dataset.name,av.dataset.type);return;}
   const ad=e.target.closest?.('[data-attachment-download]');if(ad){e.preventDefault();downloadAttachment(ad.dataset.attachmentDownload,ad.dataset.name,ad.dataset.type);return;}
   const btn=e.target.closest?.('[data-action]');
   if(btn){const a=btn.dataset.action;if(a==='setQuery')return;e.preventDefault();dispatch(a,btn,e);return;}
 });
 document.addEventListener('input',e=>{
   const el=e.target.closest?.('[data-action="setQuery"]');
   if(!el)return;
   state.query=el.value;
   clearTimeout(window.__lumoSearchTimer);
   window.__lumoSearchTimer=setTimeout(()=>{
     const active=document.activeElement;
     render();
     const next=document.querySelector('[data-action="setQuery"]');
     if(next){next.focus();try{next.setSelectionRange(next.value.length,next.value.length)}catch(_){} }
   },220);
 });
}

function filterRows(arr,fields){const q=state.query.trim().toLowerCase();if(!q)return arr;return arr.filter(x=>fields.some(f=>String(x[f]??'').toLowerCase().includes(q)))}
function rowsTable(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
function auditRun(){
 const issues=[];const ok=[];const add=(sev,area,msg,ref='')=>issues.push({sev,area,msg,ref});
 const skuMap={};(DATA.products||[]).forEach(p=>{const sku=String(p.sku||p.codigo||'').trim().toUpperCase();if(!sku)return;(skuMap[sku]??=[]).push(p)});
 Object.entries(skuMap).forEach(([sku,ps])=>{if(ps.length>1)add('warning','Productos',`SKU duplicado: ${sku} (${ps.length} registros)`,'products')});
 (DATA.products||[]).forEach(p=>{if(!String(p.nombre||'').trim())add('error','Productos','Producto sin descripción',p.id);if(num(p.stock)<0)add('error','Inventario',`Stock negativo: ${skuDisplay(p.sku)} (${fmtNum(p.stock)})`,p.id);if(num(p.precioVenta)>0&&num(p.costo)>num(p.precioVenta))add('warning','Margen',`Costo superior al precio: ${skuDisplay(p.sku)}`,p.id)});
 (DATA.quotes||[]).forEach(q=>{if(!Array.isArray(q.items)||!q.items.length)add('warning','Cotizaciones',`Cotización ${q.folio||q.id} sin líneas`,q.id);const total=(q.items||[]).reduce((a,i)=>a+num(i.cantidad)*num(i.precio),0);if(Math.abs(num(q.subtotal||q.total)-total)>1&&num(q.total)>0)add('warning','Cotizaciones',`Total no coincide con sus líneas: ${q.folio||q.id}`,q.id);(q.items||[]).forEach(i=>{if(i.technical||i.ventaCalzada){if(!i.sku||!i.nombre)add('error','Técnico',`Línea técnica incompleta en ${q.folio||q.id}`,q.id);}})});
 (DATA.rfqs||[]).forEach(r=>{if(!r.supplierIds?.length)add('error','Compras',`RFQ ${r.folio||r.id} sin proveedor`,r.id);const assigned=new Set(Object.values(r.supplierItems||{}).flat());(r.items||[]).forEach((it,i)=>{if(!assigned.has(i))add('error','Compras',`RFQ ${r.folio||r.id}: línea sin proveedor (${it.nombre||it.sku||'sin descripción'})`,r.id)});(r.offers||[]).forEach(o=>{if(!['neto','bruto'].includes(String(o.base||'').toLowerCase()))add('error','Compras',`Oferta sin base Neto/Bruto en ${r.folio||r.id}`,o.id)})});
 (DATA.purchaseOrders||[]).forEach(po=>{if(!po.supplierId)add('error','Órdenes de compra',`OC ${po.folio||po.id} sin proveedor`,po.id);if(!Array.isArray(po.items)||!po.items.length)add('warning','Órdenes de compra',`OC ${po.folio||po.id} sin líneas`,po.id)});
 const tq=Array.isArray(DATA.technicalQueue)?DATA.technicalQueue:[];tq.forEach(x=>{const mode=String(x.modoCalculo||'UN').toUpperCase();if(x.ventaCalzada!==true)add('error','Cotizador técnico','Línea técnica sin marca Venta calzada',x.id);if(num(x.cantidad)<=0)add('error','Cotizador técnico',`Cantidad inválida en ${x.sku||x.nombre}`,x.id);if(mode==='M'&&num(x.largoM)<=0)add('error','Cotizador técnico',`Largo inválido para cálculo en m: ${x.sku||x.nombre}`,x.id);if(mode==='M2'&&(num(x.largoM)<=0||num(x.anchoM)<=0))add('error','Cotizador técnico',`Largo/ancho inválidos para cálculo en m²: ${x.sku||x.nombre}`,x.id);if(mode==='M3'&&(num(x.largoM)<=0||num(x.anchoM)<=0||num(x.altoM)<=0))add('error','Cotizador técnico',`Dimensiones inválidas para cálculo en m³: ${x.sku||x.nombre}`,x.id);if(num(x.kgM)<=0&&mode!=='KG')add('warning','Cotizador técnico',`Kg/m pendiente en ${x.sku||x.nombre}`,x.id)});
 if(!issues.length)ok.push('No se detectaron inconsistencias críticas en la estructura y relaciones principales.');
 return {issues,ok,at:new Date().toISOString()};
}
function auditView(){const r=auditRun(),errors=r.issues.filter(x=>x.sev==='error'),warnings=r.issues.filter(x=>x.sev==='warning');DATA.auditLog=Array.isArray(DATA.auditLog)?DATA.auditLog:[];DATA.auditLog.unshift({fecha:r.at,errors:errors.length,warnings:warnings.length,total:r.issues.length});DATA.auditLog=DATA.auditLog.slice(0,50);save();const badge=(n,c)=>`<div class="kpi"><small>${c}</small><b>${n}</b></div>`;const rows=r.issues.map(x=>`<tr><td><span class="badge ${x.sev==='error'?'danger':'warn'}">${x.sev==='error'?'ERROR':'AVISO'}</span></td><td>${esc(x.area)}</td><td>${esc(x.msg)}</td><td>${esc(x.ref||'—')}</td></tr>`).join('');return head('Auditoría / Integridad','Fase 9.0 · revisión estructural, comercial, compras, inventario y cotizador técnico · base 1.0',`<button class="btn btn-primary" data-action="auditRun">↻ Ejecutar auditoría</button><button class="btn btn-secondary" data-action="qaRun">QA operativo</button><button class="btn" data-action="export">Exportar respaldo</button>`)+`<div class="grid kpis">${badge(errors.length,'Errores críticos')}${badge(warnings.length,'Avisos')}${badge(DATA.products.length,'Productos revisados')}${badge((DATA.rfqs||[]).length+(DATA.purchaseOrders||[]).length,'Compras / OC')}</div><div class="card" style="margin-top:14px"><div class="notice ${errors.length?'tech20-warning':'tech20-ok'}"><b>${errors.length?'Se requiere revisión':'Integridad estructural OK'}</b> · Auditoría ejecutada ${date(r.at)}. No se modifican datos operativos automáticamente.</div>${r.issues.length?rowsTable(['Nivel','Área','Hallazgo','Referencia'],rows):empty('No se detectaron inconsistencias.')}</div><div class="card" style="margin-top:14px"><h3>Controles incluidos en 9.0</h3><div class="list"><div class="list-item">✓ Duplicidad de SKU y productos sin descripción</div><div class="list-item">✓ Stock negativo y control de margen costo vs. venta</div><div class="list-item">✓ Cotizaciones sin líneas y coherencia básica de totales</div><div class="list-item">✓ Integridad RFQ: proveedor, asignación por línea y base Neto/Bruto</div><div class="list-item">✓ OC: proveedor y líneas</div><div class="list-item">✓ Cotizador técnico: Venta calzada, cantidad, kg/m y modos KG / m / m² / m³ / UN</div></div></div>`}
function qaRun(){
 const tests=[];const pass=(name,ok,detail='')=>tests.push({name,ok:!!ok,detail});
 pass('Decimales Chile: 12.500,50',Math.abs(num('12.500,50')-12500.5)<0.0001);
 pass('Decimales con coma: 12500,50',Math.abs(num('12500,50')-12500.5)<0.0001);
 pass('Decimales con punto: 12500.50',Math.abs(num('12500.50')-12500.5)<0.0001);
 pass('Cotización kg total',Math.abs(quoteKg({items:[{cantidad:2,largoM:6,kgM:10,pesoKgTotal:120} ]})-120)<0.001);
 pass('Modalidad STOCK',quoteModalityLabel({modalidadCotizacion:'stock'}).startsWith('STOCK'));
 pass('Modalidad CALZADA',quoteModalityLabel({modalidadCotizacion:'calzada'}).includes('CALZADA'));
 pass('Modalidad MIXTA',quoteModalityLabel({modalidadCotizacion:'mixta'}).includes('MIXTA'));
 pass('Maestro de productos disponible',Array.isArray(DATA.products));
 pass('Clientes disponible',Array.isArray(DATA.companies));
 pass('Cotizaciones disponible',Array.isArray(DATA.quotes));
 pass('Pedidos disponible',Array.isArray(DATA.pedidos));
 pass('SOL disponible',Array.isArray(DATA.rfqs));
 pass('OC disponible',Array.isArray(DATA.purchaseOrders));
 pass('Auditoría disponible',typeof auditRun==='function');
 return {tests,failed:tests.filter(x=>!x.ok),at:new Date().toISOString()};
}
function qaView(){const r=qaRun(),bad=r.failed.length;const rows=r.tests.map(x=>`<tr><td><span class="badge ${x.ok?'ok':'danger'}">${x.ok?'OK':'FALLA'}</span></td><td>${esc(x.name)}</td><td>${esc(x.detail||'')}</td></tr>`).join('');return head('QA operativo','Pruebas automáticas no destructivas antes de producción',`<button class="btn btn-primary" data-action="qaRun">↻ Ejecutar QA</button><button class="btn" data-action="auditRun">Auditar datos</button>`)+`<div class="grid kpis"><div class="kpi"><small>Pruebas</small><b>${r.tests.length}</b></div><div class="kpi"><small>OK</small><b>${r.tests.length-bad}</b></div><div class="kpi"><small>Fallas</small><b>${bad}</b></div></div><div class="card" style="margin-top:14px"><div class="notice ${bad?'tech20-warning':'tech20-ok'}"><b>${bad?'Se detectaron fallas de prueba':'QA estructural OK'}</b> · ${date(r.at)} · Las pruebas no modifican los datos.</div>${rowsTable(['Estado','Prueba','Detalle'],rows)}</div>`}

 products(){const all=DATA.products||[],a=filterRows(all,['nombre','sku','familia','categoria','linea','subfamilia','tipoProducto']);const fam=[...new Set(all.map(p=>p.familia||p.categoria).filter(Boolean))];const low=all.filter(p=>num(p.stockMinimo)>0&&num(p.stock)<=num(p.stockMinimo)).length;return head('Maestro de productos','Catálogo único para ventas, compras, técnico e inventario',`<button class="btn" data-action="export">Exportar respaldo</button><button class="btn btn-primary" data-action="newProduct">+ Crear producto</button>`)+`<div class="grid kpis"><div class="kpi"><small>Productos</small><b>${all.length}</b></div><div class="kpi"><small>Familias</small><b>${fam.length}</b></div><div class="kpi"><small>Alertas stock</small><b>${low}</b></div><div class="kpi"><small>Valor costo stock</small><b>${money(all.reduce((s,p)=>s+num(p.stock)*num(p.costo),0))}</b></div></div><div class="card" style="margin-top:14px"><div class="toolbar">${searchBox('SKU, descripción, familia, categoría…')}</div></div><div class="product-grid">${a.length?a.slice(0,1000).map(x=>{const isLow=num(x.stockMinimo)>0&&num(x.stock)<=num(x.stockMinimo);return `<div class="product-card"><div class="product-top"><span class="sku-chip">${esc(skuDisplay(x.sku||x.codigo||'—'))}</span><span class="spacer"></span>${isLow?'<span class="badge warn">Bajo</span>':''}</div><b class="product-name">${esc(x.nombre)}</b><span class="muted mini">${esc(x.familia||x.categoria||'Sin familia')}${x.linea?' · '+esc(x.linea):''}</span><div class="product-stats"><div><small>Costo</small><b>${money(x.costo)}</b></div><div><small>Venta</small><b>${money(x.precioVenta)}</b></div><div><small>Stock</small><b>${fmtNum(x.stock)} ${esc(x.unidad||'UN')}</b></div></div><div style="margin-top:10px"><button class="icon-btn act-edit" title="Editar producto" data-action="editProduct" data-id="${x.id}">${icon('edit',15)}</button></div></div>`}).join(''):empty('No hay productos.')}</div>`},
 materialesTecnicos(){const tabs=[['perfiles','Perfiles'],['techumbres','Techumbres'],['paneles','Paneles'],['hormigon','Hormigón'],['hdpe','HDPE / PEAD']];return head('Cotizador Técnico 2.0','Herramienta especializada · venta calzada · costo, precio, dimensiones y peso · sin afectar stock',`<button class="btn btn-secondary" data-action="techQuote">Cotizar cola técnica</button>`)+`<div class="tech-tabs">${tabs.map(t=>`<button data-action="techSection" data-section="${t[0]}" class="${state.techSection===t[0]?'active':''}">${t[1]}</button>`).join('')}</div>${technicalForm()}`},

 purchaseOrders(){const a=filterRows(DATA.purchaseOrders,['folio','estado']);return head('Órdenes de compra','Compras y recepción de mercadería',`<button class="btn btn-primary" data-action="newPO">+ Crear OC</button>`)+`<div class="card"><div class="toolbar">${searchBox('Folio, estado…')}</div></div><div class="doc-grid">${a.length?a.slice().reverse().map(p=>`<div class="doc-card"><div class="doc-top"><b>${esc(p.folio)}</b><span class="badge">${esc(poStatusLabel(p.estado))}</span></div><span class="muted mini">${esc(DATA.suppliers.find(s=>s.id===p.supplierId)?.nombre||'Sin proveedor')} · ${date(p.fecha)}</span><div class="doc-total">${money(p.total)}</div><div class="row-actions"><button class="icon-btn act-view" title="Ver" data-action="viewPO" data-id="${p.id}">${icon('view',15)}</button><button class="icon-btn" title="PDF" data-action="pdfPO" data-id="${p.id}">${icon('file',15)}</button><button class="icon-btn act-whatsapp" title="Compartir" data-action="sharePO" data-id="${p.id}">${icon('whatsapp',15)}</button><button class="icon-btn act-edit" title="Recepcionar" data-action="receive" data-id="${p.id}">${icon('check',15)}</button></div></div>`).join(''):empty(DATA.purchaseOrders.length?'Sin resultados para tu búsqueda.':'Aún no hay órdenes de compra.')}</div>`},

 documentos(){return head('Documentos','Centro documental y trazabilidad de documentos internos',`<button class="btn btn-primary" data-action="quickQuote">+ Cotización</button>`)+`<div class="grid kpis"><div class="kpi"><small>Cotizaciones</small><b>${DATA.quotes.length}</b></div><div class="kpi"><small>Pedidos</small><b>${DATA.pedidos.length}</b></div><div class="kpi"><small>OC</small><b>${DATA.purchaseOrders.length}</b></div><div class="kpi"><small>Facturas/Boletas/Guías</small><b>${DATA.facturas.length+DATA.boletas.length+DATA.guiasDespacho.length}</b></div></div><div class="card" style="margin-top:14px"><div class="notice">Los documentos preparados aquí son para gestión y envío al contador; no se presentan electrónicamente al SII.</div>${DATA.quotes.length?rowsTable(['Documento','Fecha','Cliente','Estado','Total','Acciones'],DATA.quotes.slice().reverse().map(q=>`<tr><td><b>${esc(q.folio)}</b></td><td>${date(q.fecha)}</td><td>${esc(DATA.companies.find(c=>c.id===q.companyId)?.razonSocial||'—')}</td><td><span class="badge">${esc(q.estado||'borrador')}</span></td><td>${money(q.total)}</td><td><div class="row-actions"><button class="icon-btn" title="Ver documento" aria-label="Ver documento" data-action="viewQuote" data-id="${q.id}">${icon('view',16)}</button><button class="icon-btn" title="Descargar PDF" aria-label="Descargar PDF" data-action="pdfQuote" data-id="${q.id}">↓</button><button class="icon-btn" title="Imprimir" aria-label="Imprimir" data-action="printQuote" data-id="${q.id}">🖨</button><button class="icon-btn" title="Compartir: WhatsApp, Telegram, correo u otra aplicación" aria-label="Compartir" data-action="shareQuote" data-id="${q.id}">↗</button><button class="icon-btn" title="Editar" aria-label="Editar" data-action="editQuote" data-id="${q.id}">✎</button></div></td></tr>`).join('')):empty('Todavía no hay cotizaciones guardadas.')}</div>`},
 finanzas(){const sales=DATA.quotes.reduce((s,q)=>s+num(q.total),0),cost=DATA.quotes.reduce((s,q)=>s+num(q.costoTotal),0);return head('Finanzas','Resumen económico interno',`<button class="btn" data-action="export">Exportar datos</button>`)+`<div class="grid kpis"><div class="kpi"><small>Ventas cotizadas</small><b>${money(sales)}</b></div><div class="kpi"><small>Costo asociado</small><b>${money(cost)}</b></div><div class="kpi"><small>Margen estimado</small><b>${money(sales-cost)}</b></div><div class="kpi"><small>IVA referencial</small><b>${money(sales*19/119)}</b></div></div><div class="card" style="margin-top:14px">${empty('Tesorería y documentos financieros pueden conectarse sobre este mismo modelo sin duplicar datos.')}</div>`},

function technicalProfile(p){
 const n=String(p?.nombre||'').toUpperCase();
 const sku=String(p?.sku||p?.codigo||'').toUpperCase();
 const text=n+' '+sku;
 let family='';
 /* Orden validado contra catálogos reales (Cintac / Copronet-MCT / Perfimet / Villalba, sep-2026):
    METALCON se revisa ANTES que COSTANERA/CANAL porque existen productos "Metalcon Costanera" y
    "Metalcon Canal" que son de la línea Metalcon (tabiquería/cielo), no perfiles estructurales sueltos. */
 if(/TUBEST/.test(text))family='TUBEST';
 else if(/METALCON/.test(text))family='METALCON';
 else if(/\bIPE\b|\bIPN\b|\bHEA\b|\bHEB\b/.test(text))family='PERFIL LAMINADO';
 else if(/ANGULO/.test(text)&&/LAMINAD/.test(text))family='PERFIL LAMINADO';
 else if(/COSTANERA/.test(text))family='COSTANERA Z';
 else if(/\bCANAL(ES)?\b/.test(text))family='CANAL';
 else if(/ANGULO/.test(text))family='ÁNGULO';
 else if(/PLETINA|BARRA PLANA/.test(text))family='PLETINA';
 else if(/PV-?4/.test(text))family='PV4';
 else if(/P-?11/.test(text))family='P-11';
 else if(/ISOPOL|KOVERPOL|KOVER POL|KOVER PUR/.test(text))family='PANEL';
 else if(/\bCUADRAD[OA]/.test(text))family='CUADRADO';
 else if(/RECTANGULAR/.test(text))family='RECTANGULAR';
 else if(/\bREDOND[OA]\b/.test(text)||/\bTUBO\b/.test(text))family='REDONDO';
 else if(/HDPE|PEAD|POLIETILENO|PETROFLEX|PETROPIPE|DRENPRO|FLEXADREN|ADS TIGRE/.test(text))family='HDPE / PEAD';
 else if(/FIERRO|HORMIGON|A63/.test(text))family='FIERRO HORMIGÓN';
 return family;
}
function technicalSpec(p){
 const n=String(p?.nombre||'').toUpperCase().replace(/,/g,'.');

 const out={family,raw:n,fields:[],lengthM:0,steelThickness:0,coreThickness:0,density:0};

 if(family==='TUBEST'){
   const m=n.match(/(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)/);
   if(m) out.fields=[['A',+m[1]+' mm'],['B',+m[2]+' mm'],['Espesor alma',+m[3]+' mm'],['Espesor ala',+m[4]+' mm']];

   if(m) out.fields=[['A',+m[1]+' mm'],['B',+m[2]+' mm'],['Labio',+m[3]+' mm'],['Espesor',+m[4]+' mm'],['Largo',m[5]?m[5]+' m':'según producto']];
 }else if(family==='METALCON'){
   const m=n.match(/(\d+(?:\.\d+)?)\s*(?:X|×)\s*(\d+(?:\.\d+)?)\s*(?:X|×)\s*(\d+(?:\.\d+)?)/);
   if(m) out.fields=[['Ancho',+m[1]+' mm'],['Alto',+m[2]+' mm'],['Espesor',+m[3]+' mm']];
   const inch=n.match(/(\d+(?:\.\d+)?)\s*["”]/); if(inch) out.fields.push(['Nomenclatura',inch[1]+' pulgadas']);
 }else if(family==='PERFIL LAMINADO'){
   const m=n.match(/\b(IPE|IPN|HEA|HEB)\s*[- ]?(\d+)\b/); if(m) out.fields=[['Serie',m[1]],['Altura nominal',m[2]+' mm']];
 }else if(family==='ÁNGULO'){
   const m=n.match(/(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)/); if(m) out.fields=[['Ala A',+m[1]+' mm'],['Ala B',+m[2]+' mm'],['Espesor',+m[3]+' mm']];
 }else if(family==='CANAL'){
   const m=n.match(/(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)/);
   if(m) out.fields=[['A',+m[1]+' mm'],['B',+m[2]+' mm'],['Atiesador',+m[3]+' mm'],['Espesor',+m[4]+' mm']];
   else{const m2=n.match(/(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)/); if(m2) out.fields=[['A',+m2[1]+' mm'],['B',+m2[2]+' mm'],['Espesor',+m2[3]+' mm']];}
 }else if(family==='CUADRADO'||family==='RECTANGULAR'){
   const m=n.match(/(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)\s*[X×]\s*(\d+(?:\.\d+)?)/); if(m) out.fields=[['Lado A',+m[1]+' mm'],['Lado B',+m[2]+' mm'],['Espesor',+m[3]+' mm']];

function techCalcMode(p){
 const u=String(p?.unidad||'').toUpperCase();
 const fam=technicalFamilyLabel(p);
 /* LUMO360: el modo de cálculo se decide PRIMERO por la familia técnica detectada (más confiable),
    porque nombres como "Plancha PV4..." activaban antes la regla de texto "PLANCHA" y forzaban m²
    aunque la tarifa de PV4/P-11 esté cargada en metro lineal (ml). Esto causaba que no calculara. */
 if(fam==='PV4'||fam==='P-11')return 'M';
 if(fam==='TUBEST'||fam==='COSTANERA Z'||fam==='CANAL'||fam==='CUADRADO'||fam==='RECTANGULAR'||fam==='REDONDO'||fam==='PERFILES ABIERTOS'||fam==='PERFILES CERRADOS'||fam==='METALCON'||fam==='PERFIL LAMINADO'||fam==='ÁNGULO'||fam==='PLETINA'||fam==='FIERRO HORMIGÓN')return 'KG';
 if(fam==='PANEL')return 'M2';
 const t=`${p?.nombre||''} ${p?.familia||''} ${p?.categoria||''} ${p?.linea||''}`.toUpperCase();
 if(/M2|M²|MT2|MTS2|MTS²/.test(u)||/PANEL|OSB|TERCIADO|PLANCHA|CUBIERTA|AISLAD/.test(t))return 'M2';
 if(/M3|M³/.test(u)||/MADERA|VIGA|CUARTON|TABLA/.test(t))return 'M3';
 if(/KG|KILO/.test(u))return 'KG';
 if(/^M$|ML|MT|METRO/.test(u))return 'M';
 return 'UN';
}
function techUnitLabel(m){return ({UN:'Unidad',M:'Metro lineal (m / ml)',M2:'Metro cuadrado (m²)',M3:'Metro cúbico (m³)',KG:'Kilogramo (kg)'})[m]||m}

function activeOrderForNeed(p){return p && !['cancelado','entregado'].includes(p.estado||'pendiente')}
function calculateOrderNeed(orderId){
 const p=DATA.pedidos.find(x=>x.id===orderId); if(!p)return null;
 const existing=DATA.purchaseNeeds.find(n=>n.sourceOrderId===orderId && ['pendiente','en_proceso'].includes(n.estado));
 if(existing)return existing;
 const activeOthers=DATA.pedidos.filter(o=>o.id!==orderId&&['pendiente','preparando'].includes(o.estado||'pendiente'));
 const lines=(p.items||[]).filter(it=>!isCalzadaLine(it)).map((it,i)=>{
   const prod=it.productId?DATA.products.find(x=>x.id===it.productId):null;
   const required=num(it.cantidad);
   const physical=prod?num(prod.stock):0;
   const otherReserved=prod?activeOthers.reduce((a,o)=>a+(o.items||[]).filter(x=>x.productId===prod.id&&!isCalzadaLine(x)).reduce((z,x)=>z+num(x.cantidad),0),0):0;
   const available=prod?Math.max(0,physical-otherReserved):0;
   const shortage=prod?Math.max(0,required-available):required;
   return {index:i,productId:it.productId||null,sku:it.sku||prod?.sku||'MANUAL',nombre:it.nombre||prod?.nombre||'',unidad:it.unidad||prod?.unidad||'UN',requerido:required,stockFisico:physical,stockComprometido:otherReserved,stockDisponible:available,faltante:shortage,manual:!prod,ventaCalzada:false};
 }).filter(x=>x.faltante>0);
 const n={id:uid('need'),folio:'NEC-'+String(DATA.purchaseNeeds.length+1).padStart(4,'0'),fecha:new Date().toISOString(),sourceOrderId:orderId,sourceOrderFolio:p.folio,estado:lines.length?'pendiente':'sin_faltantes',items:lines,createdAt:new Date().toISOString(),regla:'Stock disponible = físico - comprometido de otros pedidos activos; líneas calzadas excluidas.'};
 DATA.purchaseNeeds.push(n); save(); return n;
}

function editRfq(id){

function openRfq(sourceId){
 const source=sourceId?DATA.pedidos.find(p=>p.id===sourceId)||DATA.quotes.find(q=>q.id===sourceId):null;
 const items=(source?.items||[]).map(x=>({productId:x.productId||null,sku:x.sku||'',nombre:x.nombre||'',cantidad:num(x.cantidad)||1,unidad:x.unidad||'UN',manual:!x.productId}));

function selectedSuppliers(r){
  if(!r)return [];
  const ids=new Set(Array.isArray(r.supplierIds)?r.supplierIds.map(String):[]);
  const routing=r.supplierItems||{};
  Object.keys(routing).forEach(id=>{if(Array.isArray(routing[id])&&routing[id].length)ids.add(String(id));});
  return DATA.suppliers.filter(s=>ids.has(String(s.id)));
}
function rfqItemsForSupplier(r,supplierId){
  if(!r)return [];
  const idxs=Array.isArray(r.supplierItems?.[supplierId])?r.supplierItems[supplierId]:[];
  return idxs.map(i=>r.items?.[i]).filter(Boolean);
}

 const persist=(send)=>{const supplierItems={};const supplierIds=[];DATA.suppliers.forEach(s=>{const ids=[...(window.__rfqRouting[s.id]||[])].filter(i=>i<items.length);if(ids.length){supplierItems[s.id]=ids;supplierIds.push(s.id)}});if(!items.length)return toast('Agrega al menos un producto.');const uncovered=items.map((_,i)=>i).filter(i=>!supplierIds.some(sid=>supplierItems[sid].includes(i)));if(uncovered.length)return toast(`Hay ${uncovered.length} línea(s) sin proveedor.`);const existing=source?.id?DATA.rfqs.find(x=>x.id===source.id):null;const folio=existing?.folio||nextFolio(DATA.settings.folioPrefijoSolicitud||'SOL','nextRfqFolio');const r=existing||{id:uid('rfq'),folio,fecha:new Date().toISOString(),offers:[],envios:[]};Object.assign(r,{folio,estado:send?'enviada':'borrador',supplierIds,supplierId:supplierIds[0],supplierItems,referencia:val('rfq-ref'),fechaLimite:val('rfq-deadline'),notas:val('rfq-notes'),items:clone(items),sourceNeedId,sourceOrderId});if(!existing)DATA.rfqs.push(r);if(sourceNeedId){const n=DATA.purchaseNeeds.find(x=>x.id===sourceNeedId);if(n){n.estado='en_proceso';n.rfqId=r.id;n.rfqFolio=folio;n.updatedAt=new Date().toISOString()}}save();window.__rfqRouting=null;if(send){closeModal();render();sendRfq(r.id)}else{closeModal();render();toast(`${folio} guardada.`)}};

function sendRfq(id){const r=DATA.rfqs.find(x=>x.id===id);if(!r)return;const ss=selectedSuppliers(r);if(!ss.length)return toast('La solicitud no tiene proveedores.');const groups=ss.map(s=>({s,items:rfqItemsForSupplier(r,s.id),email:s.correoPago||s.email||''})).filter(x=>x.items.length);r.envios=Array.isArray(r.envios)?r.envios:[];r.envios.push({fecha:new Date().toISOString(),canal:'preparado',proveedores:groups.map(x=>x.s.id),detalle:groups.map(x=>({supplierId:x.s.id,itemCount:x.items.length}))});r.estado='enviada';save();const same=groups.length>1&&groups.every(x=>JSON.stringify(x.items.map(i=>i.sku||i.nombre))===JSON.stringify(groups[0].items.map(i=>i.sku||i.nombre)));if(same&&groups.every(x=>x.email)){const subject=encodeURIComponent(`Solicitud de cotización ${r.folio} · LUMOBRAL`),body=encodeURIComponent(rfqMessage(r,groups[0].s.id)),bcc=encodeURIComponent(groups.map(x=>x.email).join(','));window.location.href=`mailto:?bcc=${bcc}&subject=${subject}&body=${body}`;return}openModal(`Enviar ${esc(r.folio)}`,`<div class="notice"><b>Envío segmentado.</b> Cada proveedor verá exclusivamente las líneas que le fueron asignadas. Cuando los listados son distintos, Lumo360 prepara mensajes individuales para evitar filtrar información de otros proveedores.</div>${groups.map(x=>`<div class="rfq-supplier-card"><b>${esc(x.s.nombre)}</b><div class="mini">${x.items.length} línea(s): ${esc(x.items.map(i=>i.sku||i.nombre).join(' · '))}</div><div class="rfq-actions" style="margin-top:6px">${x.email?`<button class="btn" data-rfq-mail="${x.s.id}">✉ Email</button>`:''}<button class="btn" data-rfq-share="${x.s.id}">↗ Compartir</button></div></div>`).join('')}`,`<button class="btn" data-close>Cerrar</button>`);document.querySelectorAll('[data-rfq-mail]').forEach(b=>b.addEventListener('click',()=>{const sid=b.dataset.rfqMail,s=DATA.suppliers.find(x=>x.id===sid),em=s?.correoPago||s?.email;if(em)window.location.href=`mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent('Solicitud de cotización '+r.folio+' · LUMOBRAL')}&body=${encodeURIComponent(rfqMessage(r,sid))}` }));document.querySelectorAll('[data-rfq-share]').forEach(b=>b.addEventListener('click',async()=>{const sid=b.dataset.rfqShare;const s=DATA.suppliers.find(x=>x.id===sid);try{if(navigator.share)await navigator.share({title:`LUMOBRAL ${r.folio}`,text:rfqMessage(r,sid)});else navigator.clipboard?.writeText(rfqMessage(r,sid));toast(`Solicitud preparada para ${s?.nombre||'proveedor'}.`)}catch(e){}}))}
function showRfq(id){const r=DATA.rfqs.find(x=>x.id===id);if(!r)return toast('Solicitud no encontrada.');const ss=selectedSuppliers(r);const rows=(r.items||[]).map((i,idx)=>{const assigned=ss.filter(s=>(r.supplierItems?.[s.id]||[]).includes(idx)).map(s=>s.nombre);return `<tr><td><b>${esc(i.sku&&i.sku!=='MANUAL'?skuDisplay(i.sku):'MANUAL')}</b><br>${esc(i.nombre)}</td><td>${fmtNum(i.cantidad)}</td><td>${esc(i.unidad||'UN')}</td><td>${esc(assigned.join(', ')||'Sin asignar')}</td></tr>`}).join('');const offers=(r.offers||[]).map(o=>{const s=DATA.suppliers.find(x=>x.id===o.supplierId);return `<tr><td>${esc(s?.nombre||o.supplierName||'—')}</td><td>${esc(skuDisplay(o.sku))}</td><td>${esc(o.nombre||'')}</td><td>${money(o.precio)}<br><small>${offerBasisLabel(o)}</small></td><td>${money(offerNet(o))}</td><td>${money(offerGross(o))}</td><td>${esc(o.stock||'')}</td><td>${esc(o.plazo||'')}</td><td>${esc(o.canal||'')}</td></tr>`}).join('');const body=`<div class="notice"><b>${esc(r.folio)}</b> · <span class="badge">${esc(r.estado||'borrador')}</span> · ${date(r.fecha)}</div><div class="form-grid"><div><b>Proveedores</b><div>${esc(ss.map(s=>s.nombre).join(', ')||'—')}</div></div><div><b>Referencia</b><div>${esc(r.referencia||'—')}</div></div></div><h3 style="margin-top:14px">Productos y destinatarios</h3>${rowsTable(['Producto','Cantidad','Unidad','Proveedor(es)'],rows)}<h3 style="margin-top:14px">Ofertas recibidas</h3>${offers?rowsTable(['Proveedor','SKU','Producto','Precio recibido','Neto comp.','Bruto','Stock','Plazo','Canal'],offers):empty('Aún no hay ofertas registradas.')}<div class="rfq-actions" style="margin-top:12px"><button class="btn" data-action="editRfq" data-id="${r.id}">✎ Editar solicitud</button><button class="btn btn-primary" data-action="addOffer" data-id="${r.id}">+ Oferta estructurada</button><button class="btn btn-secondary" data-action="captureOffer" data-id="${r.id}">✉ Captura mensaje/correo/foto</button><button class="btn" data-action="compareRfq" data-id="${r.id}">⇄ Comparar</button><button class="btn btn-secondary" data-action="adjudicateRfq" data-id="${r.id}">✓ Adjudicar</button><button class="btn" data-action="sendRfq" data-id="${r.id}">↗ Enviar</button></div>`;openModal(`Solicitud ${esc(r.folio)}`,body,'<button class="btn" data-close>Cerrar</button>')}
function parseOfferText(text,r){const lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);return lines.map(line=>{const lower=line.toLowerCase();let idx=-1;(r.items||[]).some((it,i)=>{const keys=[it.sku,it.nombre].filter(Boolean).map(k=>String(k).toLowerCase());if(keys.some(k=>k&&lower.includes(k))){idx=i;return true}return false});const nums=[...line.matchAll(/(?:\$|clp\s*)?\s*([0-9]{1,3}(?:[.][0-9]{3})+(?:[,][0-9]+)?|[0-9]+(?:[,][0-9]+)?)/gi)].map(m=>num(String(m[1]).replace(/\./g,'').replace(',','.')));const price=nums.length?nums[nums.length-1]:0;const stockM=lower.match(/(?:stock|disponib(?:le|ilidad)|disp)\s*[:=]?\s*([0-9]+)/i);const leadM=lower.match(/([0-9]+)\s*(?:d[ií]as?|hrs?|horas?)/i);return {line,idx,precio:price,stock:stockM?stockM[1]:'',plazo:leadM?leadM[1]+' días':'',match:idx>=0}})}

function loadExternalScript(src,test){return new Promise((resolve,reject)=>{if(test()){resolve();return}const sc=document.createElement('script');sc.src=src;sc.onload=()=>test()?resolve():reject(new Error('Biblioteca no disponible'));sc.onerror=()=>reject(new Error('No se pudo cargar la biblioteca'));document.head.appendChild(sc)})}
function masterMatchLine(line){const q=String(line||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let best=null,score=0;(DATA.products||[]).forEach(p=>{const fields=[p.sku,p.codigo,p.nombre,p.familia,p.subfamilia].filter(Boolean).map(x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let sc=0;fields.forEach((f,i)=>{if(f&&q.includes(f))sc+=i<2?10:4});const nums=(String(p.nombre||'').match(/\d+(?:[.,]\d+)?/g)||[]);const qnums=(String(line||'').match(/\d+(?:[.,]\d+)?/g)||[]);sc+=qnums.filter(n=>nums.includes(n)).length*2;if(sc>score){score=sc;best=p}});return {product:best,score}}
const ATT_DB='lumo360-attachments-v1';
function attachmentDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB no disponible'));const r=indexedDB.open(ATT_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveAttachmentBlob(id,file){try{const db=await attachmentDB();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id,blob:file,fecha:new Date().toISOString()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();return true}catch(e){console.warn(e);return false}}
async function getAttachmentBlob(id){const db=await attachmentDB();return await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(id);r.onsuccess=()=>{db.close();res(r.result?.blob||null)};r.onerror=()=>{db.close();rej(r.error)}})}
async function downloadAttachment(id,name,type){try{const b=await getAttachmentBlob(id);if(!b)return toast('El archivo no está disponible en este dispositivo.');const u=URL.createObjectURL(new Blob([b],{type:type||b.type}));const a=document.createElement('a');a.href=u;a.download=name||'archivo';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){toast('No se pudo abrir el archivo.')}}
async function previewAttachment(id,name,type){try{const b=await getAttachmentBlob(id);if(!b)return toast('El archivo no está disponible.');const u=URL.createObjectURL(new Blob([b],{type:type||b.type}));if((type||'').startsWith('image/')){openModal('Vista previa',`<div style="text-align:center"><img src="${u}" style="max-width:100%;max-height:70vh;border-radius:10px"></div>`,`<button class="btn" data-close>Cerrar</button><button class="btn btn-primary" data-attachment-download="${id}" data-name="${esc(name)}" data-type="${esc(type||'')}">↓ Descargar</button>`)}else{const w=window.open(u,'_blank');if(!w)downloadAttachment(id,name,type)} }catch(e){toast('No se pudo visualizar el archivo.')}}

function applyRfqPricesToProducts(id){

function offerNet(o){const rate=(num(DATA.settings.ivaRate)||19)/100;const p=num(o.precio);if(!p)return 0;return String(o.base||o.precioBase||'').toLowerCase()==='bruto'?Math.round(p/(1+rate)):Math.round(p)}
function offerGross(o){const rate=(num(DATA.settings.ivaRate)||19)/100;const p=num(o.precio);if(!p)return 0;return String(o.base||o.precioBase||'').toLowerCase()==='bruto'?Math.round(p):Math.round(p*(1+rate))}

function stockRank(v){const s=String(v||'').toLowerCase();const m=s.match(/\d+(?:[.,]\d+)?/);if(m)return Number(m[0].replace(',','.'));if(/sin|agot/.test(s))return 0;return 1}
function leadDays(v){const m=String(v||'').match(/\d+(?:[.,]\d+)?/);return m?Number(m[0].replace(',','.')):9999}
function rfqScore(o,criterion){const price=offerNet(o),stock=stockRank(o.stock),lead=leadDays(o.plazo);if(criterion==='precio')return price;if(criterion==='stock')return -stock;if(criterion==='plazo')return lead;return (price?100000000/price:0)+(stock*1000)+(lead<9999?100/(1+lead):0)}

function shareFiscal(id,type){const arr=type==='factura'?DATA.facturas:type==='boleta'?DATA.boletas:type==='guia'?DATA.guiasDespacho:DATA.notasCredito||[];const d=arr.find(x=>x.id===id);if(!d)return;if(!navigator.share)return toast('Tu navegador no admite compartir.');try{const C=window.jspdf?.jsPDF;if(C){const doc=new C({unit:'mm',format:'a4'});doc.setFontSize(18);doc.text('LUMOBRAL',15,18);doc.setFontSize(13);doc.text(`${docLabel(type)} ${d.folio}`,15,27);doc.text(`Total ${money(d.total)}`,15,35);const blob=doc.output('blob');const f=new File([blob],`${d.folio}.pdf`,{type:'application/pdf'});if(navigator.canShare?.({files:[f]}))return navigator.share({title:`LUMOBRAL ${d.folio}`,text:`${docLabel(type)} ${d.folio}`,files:[f]}).catch(()=>{})}navigator.share({title:`LUMOBRAL ${d.folio}`,text:`${docLabel(type)} ${d.folio} · ${money(d.total)}`}).catch(()=>{})}catch(e){toast('No fue posible compartir.')}}

const moneyN=v=>money(Math.round(num(v)));
function landedOffer(o){const basis=(o.basis||o.base||'neto').toLowerCase();let net=num(o.netoComparable);if(!net){const raw=num(o.precio??o.price);net=/brut|iva incluido|con iva/.test(basis)?raw/(1+num(DATA.settings.ivaRate)/100):raw}const discount=num(o.descuento)||0;const freight=num(o.flete)||0;return Math.max(0,net-discount)+freight}
function rfqOfferScore(o,weights={price:60,stock:20,lead:15,payment:5},max={price:1,stock:1,lead:1,payment:1}){const price=1-(landedOffer(o)/(max.price||1));const stock=Math.min(1,num(o.stock)/(max.stock||1));const lead=1-Math.min(1,num(o.plazoDias)/(max.lead||1));const payment=Math.min(1,num(o.diasPago)/(max.payment||1));return Math.max(0,price)*weights.price/100+stock*weights.stock/100+Math.max(0,lead)*weights.lead/100+payment*weights.payment/100}
function openAdjudication(rfqId){ensure7();const r=DATA.rfqs.find(x=>x.id===rfqId);if(!r)return toast('Solicitud no encontrada.');const offers=r.offers||[];if(!offers.length)return toast('Esta solicitud aún no tiene ofertas registradas.');const by={};(r.items||[]).forEach((it,i)=>by[i]=offers.filter(o=>String(o.itemIndex??o.lineIndex??o.i)===String(i)||(!o.itemIndex&&o.sku&&o.sku===it.sku)));const rows=(r.items||[]).map((it,i)=>{const os=by[i]||[];if(!os.length)return `<tr><td><b>${esc(it.sku&&it.sku!=='MANUAL'?skuDisplay(it.sku):'MANUAL')}</b><br>${esc(it.nombre||'')}</td><td>${fmtNum(it.cantidad)}</td><td colspan="3"><span class="badge warn">Sin oferta</span></td></tr>`;const ranked=os.map(o=>({...o,landed:landedOffer(o)})).sort((a,b)=>a.landed-b.landed);const best=ranked[0];return `<tr><td><b>${esc(it.sku&&it.sku!=='MANUAL'?skuDisplay(it.sku):'MANUAL')}</b><br>${esc(it.nombre||'')}</td><td>${fmtNum(it.cantidad)}</td><td><select class="adj-pick" data-i="${i}">${ranked.map(o=>`<option value="${esc(o.id)}">${esc(o.proveedorNombre||o.supplierNombre||DATA.suppliers.find(s=>s.id===o.supplierId)?.nombre||'Proveedor')} · ${moneyN(o.landed)} neto comp. · ${esc(offerBasisLabel(o))}</option>`).join('')}</select></td><td>${moneyN(best.landed)}</td><td>${fmtNum(best.stock)} · ${esc(best.plazo||best.plazoDias||'—')}</td></tr>`}).join('');const total=r.items.reduce((s,it,i)=>{const os=by[i]||[];return s+(os.length?Math.min(...os.map(landedOffer))*num(it.cantidad):0)},0);openModal(`Adjudicación ${esc(r.folio)}`,`<div class="notice"><b>Comparación normalizada.</b> Neto y Bruto se convierten a una misma base neta. Se suman descuentos y flete cuando fueron informados. Si una oferta no permite determinar su base, debe revisarse antes de adjudicar.</div><div class="cmp-summary"><div class="cmp-card"><small>Líneas</small><b>${r.items.length}</b></div><div class="cmp-card"><small>Ofertas</small><b>${offers.length}</b></div><div class="cmp-card"><small>Mejor costo puesto estimado</small><b>${moneyN(total)}</b></div></div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Proveedor / oferta elegida</th><th>Mejor costo puesto</th><th>Stock / plazo</th></tr></thead><tbody>${rows}</tbody></table></div>`,`<button class="btn" data-close>Cerrar</button><button class="btn btn-secondary" id="adj-save">Guardar adjudicación</button><button class="btn btn-primary" id="adj-po">Guardar y generar OC</button>`);const collect=()=>[...document.querySelectorAll('.adj-pick')].map(x=>({lineIndex:+x.dataset.i,offerId:x.value}));const saveAdj=(makePO)=>{const selections=collect();if(!selections.length)return toast('No hay líneas adjudicables.');const a={id:uid('adj'),rfqId,fecha:new Date().toISOString(),selections,criterio:'costo puesto + stock + plazo + condición de pago',weights:{price:60,stock:20,lead:15,payment:5}};DATA.adjudications.push(a);r.adjudicacionId=a.id;r.estado='adjudicada';save();closeModal();render();toast(`Adjudicación ${r.folio} guardada.`);if(makePO)setTimeout(()=>generatePOsFromAdj(a.id),0)};document.getElementById('adj-save')?.addEventListener('click',()=>saveAdj(false));document.getElementById('adj-po')?.addEventListener('click',()=>saveAdj(true))}
function generatePOsFromAdj(adjId){const a=DATA.adjudications.find(x=>x.id===adjId),r=DATA.rfqs.find(x=>x.id===a?.rfqId);if(!a||!r)return;const groups={};a.selections.forEach(sel=>{const o=(r.offers||[]).find(x=>x.id===sel.offerId),it=r.items?.[sel.lineIndex];if(!o||!it)return;const sid=o.supplierId||o.proveedorId||o.supplier;if(!sid)return;const unit=num(o.netoComparable||offerNet(o));groups[sid]=groups[sid]||[];groups[sid].push({...it,precio:unit,costoUnit:unit,precioRecibido:num(o.precio??o.price),basePrecio:offerBasisLabel(o),flete:num(o.flete),offerId:o.id,subtotal:unit*num(it.cantidad)})});let created=0;Object.entries(groups).forEach(([sid,items])=>{const sup=DATA.suppliers.find(x=>x.id===sid);if(!sup)return;const total=items.reduce((s,x)=>s+num(x.subtotal),0);DATA.purchaseOrders.push({id:uid('po'),folio:nextFolio(DATA.settings.folioPrefijoOC||'OC','nextPoFolio'),fecha:new Date().toISOString(),estado:'borrador',supplierId:sid,supplierNombre:sup.nombre,items,total,sourceRfqId:r.id,sourceNeedId:r.sourceNeedId||null,sourceOrderId:r.sourceOrderId||null,sourceOrderFolio:r.sourceOrderFolio||DATA.pedidos.find(o=>o.id===r.sourceOrderId)?.folio||'',sourceAdjudicationId:adjId,receivedItems:{},receipts:[],historialEstados:[],observacion:'Generada desde adjudicación; costos internos normalizados a Neto.'});created++});save();render();toast(`${created} OC creadas desde la adjudicación.`)}

function stockState(p){
  const physical=num(p?.stock);
  const reserved=DATA.pedidos.filter(o=>['pendiente','preparando'].includes(o.estado||'pendiente')).reduce((sum,o)=>sum+(o.items||[]).filter(x=>x.productId===p.id&&!isCalzadaLine(x)).reduce((a,x)=>a+num(x.cantidad),0),0);
  return {physical,reserved,available:physical-reserved,min:num(p?.stockMin??p?.stockMinimo)};
}
function allStockMoves(p){
  const a=Array.isArray(p?.movimientosStock)?p.movimientosStock.map((m,i)=>({...m,productId:p.id,_i:i})):[];
  return a.sort((x,y)=>new Date(y.fecha||0)-new Date(x.fecha||0));
}
function openKardex(id){
  const p=DATA.products.find(x=>x.id===id); if(!p)return toast('Producto no encontrado.');
  const st=stockState(p), moves=allStockMoves(p);
  const rows=moves.map(m=>`<tr><td>${date(m.fecha)}</td><td>${m.delta>0?'Entrada':'Salida'}</td><td>${m.delta>0?'+':''}${fmtNum(m.delta)}</td><td>${fmtNum(m.saldo)}</td><td>${esc(m.motivo||'—')}</td></tr>`).join('');
  const body=`<div class="cmp-summary"><div class="cmp-card"><small>SKU</small><b>${esc(p.sku||p.codigo||'—')}</b></div><div class="cmp-card"><small>Stock físico</small><b>${fmtNum(st.physical)}</b></div><div class="cmp-card"><small>Comprometido</small><b>${fmtNum(st.reserved)}</b></div><div class="cmp-card"><small>Disponible</small><b>${fmtNum(st.available)}</b></div></div><div class="notice" style="margin-top:12px"><b>${esc(p.nombre)}</b><br>El Kardex registra únicamente movimientos reales de inventario. La venta calzada no genera stock.</div><div class="table-wrap" style="margin-top:12px">${rowsTable(['Fecha','Tipo','Cantidad','Saldo','Motivo'],rows||'<tr><td colspan="5">Sin movimientos registrados.</td></tr>')}</div>`;

   Perfiles negros (abiertos/cerrados), Tubest, Metalcon y PV4 0,4/0,5mm — lo que más se cotiza.
   El resto (P-11, Paneles, otros espesores PV4, Costanera/Canal/Ángulo como filas propias, Fierro,

function technicalRateFamily(p){

  if(['ÁNGULO','COSTANERA Z','CANAL'].includes(base)){

   Permite escribir varias líneas ("59 PV4 de 0,5 prepintado de 6m", "Costanera 100x50x15x2 6m")
   y calcular el precio de cada una sin pasar por el configurador detallado.
   Los perfiles (Ángulo/Costanera/Canal/Cuadrado/Rectangular/Redondo/Tubest/Pletina) se calculan con
   la fórmula real de peso de acero (área de la sección × densidad 7,85 kg/dm³), el mismo método que
   usan los fabricantes para el "peso teórico" — así no depende de tener cada medida en una tabla. */
const STEEL_DENSITY_KGM=0.00785; // kg por mm² de sección, por metro de longitud
function theoreticalKgM(family,dims){
 dims=(dims||[]).filter(x=>x>0);
 const d=STEEL_DENSITY_KGM;
 if(family==='TUBEST'||family==='CUADRADO'||family==='RECTANGULAR'){
  let A,B,e;
  if(dims.length>=4){A=dims[0];B=dims[1];e=(dims[2]+dims[3])/2;}
  else if(dims.length===3){A=dims[0];B=dims[1];e=dims[2];}
  else if(dims.length===2&&family==='CUADRADO'){A=dims[0];B=dims[0];e=dims[1];}
  else return 0;
  if(!A||!B||!e)return 0;

 }

  let A,B,e;
  if(dims.length>=3){A=dims[0];B=dims[1];e=dims[2];}
  else if(dims.length===2){A=dims[0];B=dims[0];e=dims[1];}

  let A,B,C=0,e;
  if(dims.length>=4){A=dims[0];B=dims[1];C=dims[2];e=dims[3];}
  else if(dims.length===3){A=dims[0];B=dims[1];e=dims[2];}
  else return 0;
  if(!A||!B||!e)return 0;
  const perim=A+2*B+2*C;
  return Math.round(perim*e*d*1000)/1000;
 }
 if(family==='PLETINA'){
  let A,e;
  if(dims.length>=2){A=dims[0];e=dims[1];}else return 0;
  if(!A||!e)return 0;
  return Math.round(A*e*d*1000)/1000;

}

icitud',s.folioPrefijoSolicitud)}${inp('ped','Prefijo pedido',s.folioPrefijoPedido)}${inp('oc','Prefijo OC',s.folioPrefijoOC)}${inp('fac','Prefijo factura',s.folioPrefijoFactura)}${inp('bol','Prefijo boleta',s.folioPrefijoBoleta)}${inp('gd','Prefijo guía',s.folioPrefijoGuia)}${inp('nc','Prefijo nota crédito',s.folioPrefijoNC)}</div></div><div class=\"card\"><h3>5. Cotizador técnico</h3><p class=\"muted mini\">Los valores base por familia se administran en la tabla del propio Cotizador Técnico.</p><button class=\"btn btn-secondary\" data-nav=\"materialesTecnicos\">Abrir valores técnicos</button></div><div class=\"card\"><h3>6. Interfaz</h3><div class=\"field\"><label>Tema</label><select id=\"set-theme\"><option value=\"light\" ${s.uiTheme!=='dark'?'selected':''}>Claro</option><option value=\"dark\" ${s.uiTheme==='dark'?'selected':''}>Oscuro</option></select></div>${inp('theme-color','Color principal',s.temaColor)}${inp('backup-days','Recordatorio respaldo (días)',s.backupReminderDays)}${inp('notif-days','Seguimiento comercial (días)',s.notifSeguimientoDias)}</div><div class=\"card\"><h3>7. Automatización y control</h3><div class=\"form-grid\"><div class=\"field\"><label>Notificaciones</label><select id=\"set-notif\"><option value=\"0\" ${!s.notificacionesPush?'selected':''}>Desactivadas</option><option value=\"1\" ${s.notificacionesPush?'selected':''}>Activadas</option></select></div>${inp('tax-email','Correo contador 1',s.correoContador1)}${inp('tax-email2','Correo contador 2',s.correoContador2)}${inp('catalog-version','Versión catálogo',s.catalogTaxonomyVersion)}</div></div></div><div style=\"margin-top:14px\"><button class=\"btn btn-primary\" data-action=\"saveSettingsV20\">Guardar configuración</button><button class=\"btn btn-danger\" data-action=\"reset\">Restaurar base inicial</button></div>`}
function saveSettingsV20(){const g=id=>document.getElementById('set-'+id),s=DATA.settings||{};s.razonSocial=g('name')?.value.trim()||s.razonSocial;s.rut=g('rut')?.value.trim()||s.rut;s.correo=g('email')?.value.trim()||s.correo;s.direccion=g('address')?.value.trim()||s.direccion;s.instagram=g('instagram')?.value.trim()||s.instagram;s.whatsapp=g('whatsapp')?.value.trim()||s.whatsapp;s.giro=g('giro')?.value.trim()||'';s.sitioWeb=g('website')?.value.trim()||'';s.bancoTransferencia=g('bank')?.value.trim()||'';s.tipoCuentaTransferencia=g('accountType')?.value.trim()||'';s.numeroCuentaTransferencia=g('accountNumber')?.value.trim()||'';s.titularCuentaTransferencia=g('accountHolder')?.value.trim()||'';s.rutTitularCuentaTransferencia=g('accountRut')?.value.trim()||'';s.ivaRate=Math.max(0,num(g('iva')?.value)||19);s.diasPlazoPagoCliente=Math.max(0,num(g('client-days')?.value)||30);s.diasPlazoPagoProveedor=Math.max(0,num(g('supplier-days')?.value)||30);s.anticipoMinimoPct=Math.max(0,num(g('anticipo')?.value));s.moneda=g('currency')?.value.trim()||'CLP';s.validezCotizacionDias=Math.max(1,num(g('quote-validity')?.value)||15);['cot','sol','ped','oc','fac','bol','gd','nc'].forEach(x=>{const v=g(x)?.value.trim();if(v)s['folioPrefijo'+({cot:'Cotizacion',sol:'Solicitud',ped:'Pedido',oc:'OC',fac:'Factura',bol:'Boleta',gd:'Guia',nc:'NC'}[x])]=v});s.temaColor=g('theme-color')?.value.trim()||'#FF5F00';s.backupReminderDays=Math.max(1,num(g('backup-days')?.value)||7);s.notifSeguimientoDias=Math.max(0,num(g('notif-days')?.value));s.uiTheme=document.getElementById('set-theme')?.value||'light';s.notificacionesPush=document.getElementById('set-notif')?.value==='1';ensureTechPricing();save();document.body.classList.toggle('dark',s.uiTheme==='dark');render();toast('Configuración guardada correctamente.')}
function saveTechRates(){ensureTechPricing();document.querySelectorAll('.tech-rate').forEach(el=>{const fam=el.dataset.family,key=el.dataset.key;if(DATA.settings.techPricing[fam])DATA.settings.techPricing[fam][key]=Math.max(0,num(el.value));});save();toast('Valores técnicos guardados.');render()}

const __technicalKgM20=technicalKgM;
technicalKgM=function(p,manual){
  const master=num(p?.pesoKgM)||num(p?.kgM)||0;if(master)return {value:master,source:'Maestro'};
  const family=technicalFamilyLabel(p),cfg=ensureTechPricing()[family];
  if(cfg&&num(cfg.kgM)>0)return {value:num(cfg.kgM),source:'Configuración familia '+family};
  const spec=technicalSpec(p),m=String(spec.raw).match(/\b(IPE|IPN|HEA|HEB)\s*[- ]?(\d+)\b/);
  if(m){const std=standardKgM(m[1],m[2]);if(std)return {value:std,source:'Tabla estándar '+m[1]+' '+m[2]};}
  if(manual>0)return {value:manual,source:'Ingresado manualmente'};
  return {value:0,source:'Sin kg/m configurado'};
};
