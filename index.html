.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.person-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.person-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.person-top{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.person-avatar{width:42px;height:42px;border-radius:10px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.company-avatar{background:var(--slate)}
.person-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.person-info b{font-size:14.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px;margin-top:14px}
.product-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow);position:relative;transition:transform .15s,box-shadow .15s}
.product-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.product-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sku-chip{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--slate)}
.product-name{display:block;font-size:13.5px;margin-bottom:2px;line-height:1.3}
.product-stats{display:flex;justify-content:space-between;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.product-stats div{text-align:left}
.product-stats small{display:block;color:var(--muted);font-size:10px}
.product-stats b{font-size:12.5px;color:var(--navy)}
.product-card{padding:12px 13px 11px;min-height:0}
.product-top{position:relative;min-height:30px;margin-bottom:7px;padding-right:40px}
.product-edit{position:absolute;right:0;top:0;width:32px;height:32px;border-radius:10px;padding:0;background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
.product-edit:hover{background:var(--orange-light);border-color:rgba(255,90,0,.18);color:var(--orange-dark);box-shadow:none;transform:none}
.product-edit:active{transform:scale(.96)}
.product-name{padding-right:2px;font-size:13.5px;line-height:1.3;margin-bottom:3px}
.product-meta-line{display:block;line-height:1.25;min-height:16px}
.product-stats{margin-top:9px;padding-top:8px;gap:8px}
.product-stats div{min-width:0;flex:1}
.product-stats small{font-size:9.5px}
.product-stats b{font-size:12.5px;white-space:nowrap}
.product-unit{margin-top:6px;font-size:10px}

.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.doc-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:4px}
.doc-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.doc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc-top b{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:13px;color:var(--navy)}
.doc-total{font-size:19px;font-weight:800;color:var(--orange-dark);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:6px 0 8px}
.kpi:nth-child(4n+1) .kpi-ico{background:var(--blue-light);color:var(--blue)}
.kpi:nth-child(4n+2) .kpi-ico{background:var(--gold-light);color:var(--gold-dark)}
.kpi:nth-child(4n+3) .kpi-ico{background:var(--purple-light);color:var(--purple)}
.kpi:nth-child(4n+0) .kpi-ico{background:#DCF3EA;color:var(--teal)}
.kpi .kpi-ico svg{width:19px;height:19px}
.kpi small,.muted{color:var(--muted)}
.kpi b{display:block;font-size:25px;margin-top:5px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.01em;color:var(--text);font-weight:700}
.card{padding:16px;border-radius:var(--radius)}
h3{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15.5px;margin:0 0 12px;color:var(--navy);letter-spacing:-.005em}

/* LUMO360 FINAL UI · visual system / responsive polish */
:root{
  --brand:#ff5a00;--brand-2:#e94f00;--brand-soft:#fff2e9;
  --ink:#101828;--navy:#0b1220;--muted:#667085;--line:#dfe5ec;
  --surface:#fff;--surface-2:#f6f8fa;--bg:#f4f6f8;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 7px 22px rgba(16,24,40,.055);
}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,#f8fafc 0%,#f3f5f7 100%);color:var(--ink);overflow-x:hidden}
button,input,select,textarea{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,90,0,.18);outline-offset:1px}
.app{grid-template-columns:248px minmax(0,1fr)}
.sidebar{background:#0d1624;border-right:1px solid #1d2a3d;box-shadow:8px 0 30px rgba(2,8,23,.06)}
.brand{height:74px;padding:14px 16px;background:linear-gradient(180deg,#121f32,#0d1726)}
.brand-mark{width:38px;height:38px;border-radius:10px}
.nav{padding:10px 9px}
.nav-group{margin-bottom:6px}
.nav-group-label{padding:11px 12px 5px;color:#73839a;font-size:8.5px}
.nav button{min-height:40px;padding:8px 10px;border-radius:9px;font-size:12px}
.nav button.active{background:linear-gradient(90deg,rgba(255,90,0,.18),rgba(255,90,0,.045));box-shadow:inset 3px 0 0 var(--brand)}
.nav .ico{width:28px;height:28px}
.topbar{height:64px;padding:0 20px;background:rgba(255,255,255,.9);border-bottom-color:#e2e7ed;box-shadow:0 1px 14px rgba(16,24,40,.045)}
.topbar .title{font-size:14px}
.gsearch-wrap{flex-basis:360px;max-width:360px}
.gsearch-input{height:38px;border-radius:10px;background:#f7f9fb}
.btn,.icon-btn{border-radius:9px;min-height:38px}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 14px rgba(255,90,0,.17)}
.content{padding:22px 24px 32px;max-width:1640px}
.page-head{margin-bottom:16px}
.page-head h1{font-size:24px}
.card,.kpi{border-radius:12px;border-color:#e0e6ed;box-shadow:var(--shadow);background:rgba(255,255,255,.96)}
.card{padding:14px}
.kpi{padding:14px}
h3{font-size:13.5px}
.table-wrap{border-radius:10px}
.table{min-width:720px}
.table th{background:#f5f7f9;color:#475467;padding:9px 10px}
.table td{padding:9px 10px}
.badge{padding:4px 8px;border-radius:7px}
.list-item{border-radius:10px}
.modal-backdrop{padding:16px;background:rgba(4,10,20,.58)}
.modal{border-radius:15px}
.modal-head{padding:15px 17px}
.modal-body{padding:17px 17px 24px}
.modal-foot{padding:12px 15px}
.quick-tile{border-radius:11px;min-height:66px}
.quick-tile .ico{border-radius:9px}
.empty{padding:36px 18px}

function docFileName(tipo,folio,entidad){
 const nombre=String(entidad?.nombreFantasia||entidad?.razonSocial||entidad?.nombre||'').trim();
 const corto=nombre?nombre.replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'').split(' ').filter(Boolean).slice(0,3).join(' ').toUpperCase():'';
 const num=String(folio||'').replace(/^[A-Z]+-?0*/,'')||String(folio||'');
 return `${tipo.toUpperCase()} ${num}${corto?' - '+corto:''}`.replace(/\s+/g,' ').trim()+'.pdf';
}

function icon(key,size=18,badge){
 const glyph=`<svg viewBox="0 0 24 24" width="${badge?Math.round(size*0.62):size}" height="${badge?Math.round(size*0.62):size}" fill="none" stroke="${badge?'#fff':'currentColor'}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||ICONS.dot}</svg>`;
 if(!badge)return glyph;
 const bg=iconBadgeColor(key);
 return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:${Math.round(size*0.32)}px;background:${bg};flex:0 0 auto">${glyph}</span>`;
}

/* ===== LUMO360: gráficos SVG reales (sin librerías externas) ===== */
function svgDonutChart(segments,size=160){
 const total=segments.reduce((s,x)=>s+Math.max(0,x.value),0);
 if(!total)return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#ECE7DC" stroke-width="14"/></svg>`;
 const r=40,cx=50,cy=50,circ=2*Math.PI*r;
 let offset=0,arcs='';
 segments.filter(x=>x.value>0).forEach(seg=>{
  const frac=seg.value/total,len=frac*circ;
  arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="14" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  offset+=len;
 });
 return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${arcs}<circle cx="50" cy="50" r="30" fill="#fff"/></svg>`;
}
function svgLineChart(points,opts={}){
 const w=opts.width||520,h=opts.height||160,pad=28;
 if(!points.length)return `<svg width="${w}" height="${h}"></svg>`;
 const max=Math.max(1,...points.map(p=>p.value)),min=0;
 const stepX=(w-pad*2)/Math.max(1,points.length-1);
 const y=v=>h-pad-((v-min)/(max-min||1))*(h-pad*2);
 const coords=points.map((p,i)=>[pad+i*stepX,y(p.value)]);
 const path=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
 const area=path+` L${coords[coords.length-1][0].toFixed(1)} ${h-pad} L${coords[0][0].toFixed(1)} ${h-pad} Z`;
 const dots=coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.4" fill="var(--orange)"><title>${esc(points[i].label)}: ${money(points[i].value)}</title></circle>`).join('');
 const labels=points.map((p,i)=>`<text x="${coords[i][0].toFixed(1)}" y="${h-8}" font-size="9" fill="var(--muted)" text-anchor="middle">${esc(p.label)}</text>`).join('');
 return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><path d="${area}" fill="rgba(255,90,0,.12)"/><path d="${path}" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function buildMonthlySales(quotes,months=6){
 const now=new Date(),out=[];
 for(let i=months-1;i>=0;i--){
  const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const label=d.toLocaleDateString('es-CL',{month:'short'}).replace('.','');
  const total=quotes.filter(q=>{
   if(!['aceptada','convertida_pedido'].includes(q.estado)||!q.fecha)return false;
   const qd=new Date(q.fecha);
   return qd.getFullYear()===d.getFullYear()&&qd.getMonth()===d.getMonth();
  }).reduce((s,q)=>s+num(q.total),0);
  out.push({label,value:total});
 }
 return out;
}
/* ===== LUMO360: búsqueda inteligente y transversal ===== */
function searchNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9*\s.-]/g,' ').replace(/\s+/g,' ').trim()}
function entitySearchText(x,fields=[]){
 const vals=[];
 fields.forEach(f=>{const v=typeof f==='function'?f(x):x?.[f];if(v!=null)vals.push(v)});
 ['razonSocial','nombreFantasia','nombre','title','folio','rut','codigo','sku','email','correo','correoPago','telefono','whatsapp','cargo','rol','estado','ciudad','comuna','direccion','familia','categoria','subfamilia','linea','tipoProducto','marca','unidad','notas','referencia','condicionPago'].forEach(k=>{if(x?.[k]!=null)vals.push(x[k])});
 if(x?.companyId){const c=DATA.companies.find(z=>z.id===x.companyId);if(c)vals.push(c.razonSocial,c.nombreFantasia,c.rut,c.email,c.telefono,c.ciudad,c.comuna,c.direccion);}
 if(x?.customerCompanyId){const c=DATA.companies.find(z=>z.id===x.customerCompanyId);if(c)vals.push(c.razonSocial,c.nombreFantasia,c.rut,c.email,c.telefono);}
 if(x?.supplierId){const s=DATA.suppliers.find(z=>z.id===x.supplierId);if(s)vals.push(s.nombre,s.razonSocial,s.rut,s.email,s.correoPago,s.telefono);}
 if(x?.productId){const p=DATA.products.find(z=>z.id===x.productId);if(p)vals.push(p.nombre,p.sku,p.codigo,p.familia,p.categoria,p.marca);}
 if(x?.obraId){const o=DATA.obras.find(z=>z.id===x.obraId);if(o)vals.push(o.nombre,o.direccion,o.comuna);}
 return searchNorm(vals.join(' '));
}
function wildcardRegex(token){const source=token.split('*').map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.*');return new RegExp(source)}
function smartMatch(text,qraw){
 const q=searchNorm(qraw);if(!q)return true;const hay=searchNorm(text);
 return q.split(/\s+/).filter(Boolean).every(t=>t.includes('*')?wildcardRegex(t).test(hay):hay.includes(t));
}
function globalSearchResults(qraw){
 const q=searchNorm(qraw); if(q.length<2)return []; const out=[];
 (DATA.companies||[]).forEach(c=>{if(smartMatch(entitySearchText(c),q))out.push({icon:'building',label:c.razonSocial||c.nombreFantasia||'Empresa',sub:'Empresa · '+(c.rut||'Sin RUT'),action:'viewCompany',id:c.id});});
 (DATA.contacts||[]).forEach(c=>{if(smartMatch(entitySearchText(c),q))out.push({icon:'users',label:c.nombre||'Contacto',sub:'Contacto · '+(DATA.companies.find(x=>x.id===c.companyId)?.razonSocial||c.cargo||''),action:'editContact',id:c.id});});
 (DATA.products||[]).forEach(p=>{if(smartMatch(entitySearchText(p),q))out.push({icon:'box',label:p.nombre||'Producto',sub:'Producto · '+(p.sku||p.codigo||''),action:'editProduct',id:p.id});});
 (DATA.quotes||[]).forEach(qt=>{if(smartMatch(entitySearchText(qt),q))out.push({icon:'file',label:qt.folio||'Cotización',sub:'Cotización · '+(DATA.companies.find(x=>x.id===qt.companyId)?.razonSocial||'')+' · '+money(qt.total),action:'viewQuote',id:qt.id});});
 (DATA.suppliers||[]).forEach(s=>{if(smartMatch(entitySearchText(s),q))out.push({icon:'truck',label:s.nombre||s.razonSocial||'Proveedor',sub:'Proveedor · '+(s.rut||''),action:'editSupplier',id:s.id});});
 (DATA.obras||[]).forEach(o=>{if(smartMatch(entitySearchText(o),q))out.push({icon:'site',label:o.nombre||'Obra',sub:'Obra · '+(DATA.companies.find(x=>x.id===o.companyId)?.razonSocial||''),action:'viewObra',id:o.id});});
 (DATA.pedidos||[]).forEach(o=>{if(smartMatch(entitySearchText(o),q))out.push({icon:'clipboard',label:o.folio||'Pedido',sub:'Pedido · '+(DATA.companies.find(x=>x.id===o.companyId)?.razonSocial||''),action:'viewOrder',id:o.id});});
 return out.slice(0,20);
}

/* ===== LUMO360: sincronización real con Google Drive (API oficial, Google Identity Services) =====
   Requiere que el usuario configure su propio "Client ID" de Google Cloud (gratuito) en
   Configuración → Sincronización. El token de acceso vive solo en memoria de la sesión (no se guarda
   permanentemente por seguridad); al recargar la página hay que reconectar con un clic. */
let gDriveToken=null,gDriveFileId=null,gDriveSyncing=false;
function driveClientId(){return DATA.settings?.googleClientId||'';}
function driveIsConnected(){return !!gDriveToken;}
function ensureGoogleGIS(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2)return resolve();loadExternalScript('https://accounts.google.com/gsi/client',()=>!!window.google?.accounts?.oauth2).then(resolve).catch(reject)})}
function connectDrive(){
 const cid=driveClientId().trim();
 if(!cid)return toast('Primero pega tu Client ID de Google en Configuración → Sincronización.');
 if(!window.google?.accounts?.oauth2){ensureGoogleGIS().then(()=>connectDrive()).catch(()=>toast('No se pudo cargar Google Identity Services. Se necesita internet para conectar Drive.'));return;}
 try{
  const client=google.accounts.oauth2.initTokenClient({
   client_id:cid,
   scope:'https://www.googleapis.com/auth/drive.file',
   callback:(resp)=>{
    if(resp.error){toast('No se pudo conectar con Google Drive: '+resp.error);return;}
    gDriveToken=resp.access_token;
    toast('Google Drive conectado. Sincronizando...');
    driveSyncNow().then(()=>render());
   }
  });
  client.requestAccessToken();
 }catch(e){console.error(e);toast('No se pudo iniciar la conexión con Google. Revisa el Client ID.');}
}
function disconnectDrive(){gDriveToken=null;gDriveFileId=null;toast('Google Drive desconectado en este dispositivo.');render();}
async function driveFindFile(){
 const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='lumo360-data.json' and trashed=false")}&fields=files(id,modifiedTime)`,{headers:{Authorization:`Bearer ${gDriveToken}`}});
 if(!res.ok)throw new Error('drive_find_failed');
 const data=await res.json();
 return data.files?.[0]||null;
}
async function driveSyncNow(){
 if(!gDriveToken||gDriveSyncing)return;
 gDriveSyncing=true;
 try{
  const existing=await driveFindFile();
  const content=JSON.stringify(DATA);
  if(existing){
   gDriveFileId=existing.id;
   await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{Authorization:`Bearer ${gDriveToken}`,'Content-Type':'application/json'},body:content});
  }else{
   const metadata={name:'lumo360-data.json',mimeType:'application/json'};
   const form=new FormData();
   form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
   form.append('file',new Blob([content],{type:'application/json'}));
   const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:`Bearer ${gDriveToken}`},body:form});
   const data=await res.json();
   gDriveFileId=data.id;
  }
  DATA.settings.driveLastSync=new Date().toISOString();
 }catch(e){console.error(e);toast('No se pudo sincronizar con Google Drive (token vencido, reconecta).');gDriveToken=null;}
 finally{gDriveSyncing=false;}
}
async function driveLoadLatest(){
 if(!gDriveToken)return null;
 try{
  const existing=await driveFindFile();
  if(!existing)return null;
  const res=await fetch(`https://www.googleapis.com/drive/v3/files/${existing.id}?alt=media`,{headers:{Authorization:`Bearer ${gDriveToken}`}});
  if(!res.ok)return null;
  return await res.json();
 }catch(e){return null;}
}
async function driveRestoreFromCloud(){
 if(!driveIsConnected())return toast('Conecta Google Drive primero.');
 const remote=await driveLoadLatest();
 if(!remote)return toast('No se encontró un respaldo en tu Google Drive.');
 if(!confirm('Esto reemplazará los datos de este dispositivo con la última versión guardada en Google Drive. ¿Continuar?'))return;
 DATA=normalize(remote);save();render();toast('Datos restaurados desde Google Drive.');
}
let __driveSyncTimer=null;
function driveScheduleSync(){
 if(!driveIsConnected())return;
 clearTimeout(__driveSyncTimer);
 __driveSyncTimer=setTimeout(()=>driveSyncNow(),1500);
}

/* ===== LUMO360: utilidades RUT chileno (algoritmo módulo 11 estándar) ===== */
function limpiarRut(rutRaw){return String(rutRaw||'').replace(/[^0-9kK]/g,'').toUpperCase();}
function validarRut(rutRaw){
 const rut=limpiarRut(rutRaw);
 if(rut.length<2)return false;
 const cuerpo=rut.slice(0,-1),dv=rut.slice(-1);
 if(!/^\d+$/.test(cuerpo))return false;
 let suma=0,multiplo=2;
 for(let i=cuerpo.length-1;i>=0;i--){suma+=parseInt(cuerpo[i],10)*multiplo;multiplo=multiplo===7?2:multiplo+1;}
 const resto=11-(suma%11);
 const dvEsperado=resto===11?'0':resto===10?'K':String(resto);
 return dv===dvEsperado;
}
function formatearRut(rutRaw){
 const rut=limpiarRut(rutRaw);
 if(rut.length<2)return rutRaw||'';
 const cuerpo=rut.slice(0,-1),dv=rut.slice(-1);
 let out='';
 for(let i=cuerpo.length-1,c=0;i>=0;i--,c++){out=cuerpo[i]+out;if(c%3===2&&i!==0)out='.'+out;}
 return out+'-'+dv;
}
function wireRutInput(inputId){
 const el=document.getElementById(inputId);
 if(!el)return;
 const hint=document.createElement('div');
 hint.className='rut-hint mini';
 el.insertAdjacentElement('afterend',hint);
 const check=()=>{
  const v=el.value.trim();
  if(!v){hint.textContent='';hint.className='rut-hint mini';return;}
  if(validarRut(v)){hint.textContent='RUT válido';hint.className='rut-hint mini rut-ok';}
  else{hint.textContent='RUT inválido — verifica el dígito verificador';hint.className='rut-hint mini rut-bad';}
 };
 el.addEventListener('input',check);
 el.addEventListener('blur',()=>{if(validarRut(el.value))el.value=formatearRut(el.value);check();});
 check();
}

function num(v){if(v===null||v===undefined||v==='')return 0;let s=String(v).trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(',')){s=s.replace(',','.')}const n=Number(s);return Number.isFinite(n)?n:0}

function normalize(d){const x=clone(d||{});const arr=['companies','contacts','obras','deals','products','quotes','activities','suppliers','rfqs','pedidos','purchaseOrders','purchaseNeeds','facturas','boletas','guiasDespacho','inboxSolicitudes','auditLog','auditTrail','users','notasCredito','bankAccounts','tesoreria','files','adjudications'];arr.forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
 /* Migración única: LUMOBRAL no utiliza el prefijo LB- en los SKU. Se limpia la base existente y todos los documentos relacionados al cargarla. */
 const skuArrays=['products','quotes','pedidos','rfqs','purchaseOrders','purchaseNeeds','inboxSolicitudes'];skuArrays.forEach(k=>{(x[k]||[]).forEach(r=>{if(r&&r.sku)r.sku=cleanSku(r.sku);if(r&&Array.isArray(r.items))r.items.forEach(i=>{if(i&&i.sku)i.sku=cleanSku(i.sku)});});});
 x.settings=x.settings||{}; x.settings.ivaRate=num(x.settings.ivaRate)||19; x.nextFolio=num(x.nextFolio)||1; x.nextRfqFolio=num(x.nextRfqFolio)||1; x.nextPedidoFolio=num(x.nextPedidoFolio)||1; x.nextPoFolio=num(x.nextPoFolio)||1; x.purchaseNeeds=Array.isArray(x.purchaseNeeds)?x.purchaseNeeds:[]; x.nextFacturaFolio=num(x.nextFacturaFolio)||1; x.nextBoletaFolio=num(x.nextBoletaFolio)||1; x.nextGuiaFolio=num(x.nextGuiaFolio)||1; x.nextNcFolio=num(x.nextNcFolio)||1; return x}

function wire(){
 if(__wired)return;
 __wired=true;
 document.addEventListener('click',e=>{closeSmartSelects(e);
   const nav=e.target.closest?.('[data-nav]');
   if(nav){e.preventDefault();if(nav.dataset.nav==='__more'){openMobileMore();return;}navigate(nav.dataset.nav);return;}
   const closer=e.target.closest?.('[data-close]');
   if(closer){e.preventDefault();closeModal();return;}

function smartSelectLabel(sel){const o=sel?.options?.[sel.selectedIndex];return o?o.textContent.trim():''}
function smartOptionSearchText(sel,o){
 const id=String(sel?.id||'').toLowerCase(),v=String(o?.value||'');
 let x=null;
 if(/company|client/.test(id))x=DATA.companies.find(z=>z.id===v);
 else if(/contact/.test(id))x=DATA.contacts.find(z=>z.id===v);
 else if(/supplier/.test(id))x=DATA.suppliers.find(z=>z.id===v);
 else if(/obra/.test(id))x=DATA.obras.find(z=>z.id===v);
 else if(/product|item/.test(id))x=DATA.products.find(z=>z.id===v);
 else if(id==='nc-source')x=[...(DATA.facturas||[]),...(DATA.boletas||[]),...(DATA.guiasDespacho||[])].find(z=>z.id===v);
 return entitySearchText(x||{},[])+ ' ' + searchNorm(o?.textContent||'');
}
function enhanceSmartSelects(root=document){
 root.querySelectorAll('select').forEach(sel=>{
  if(sel.dataset.smartReady==='1'||sel.multiple||sel.disabled)return;
  if(sel.dataset.action==='switchLocalUser')return;
  const opts=[...sel.options]; const sid=String(sel.id||'').toLowerCase();
  const relevant=/company|client|contact|supplier|product|item|obra|source/.test(sid);
  if(opts.length<4&&!relevant)return;
  sel.dataset.smartReady='1';
  const wrap=document.createElement('div');wrap.className='smart-select';
  const input=document.createElement('input');input.type='text';input.className='smart-select-input';input.autocomplete='off';input.setAttribute('role','combobox');input.setAttribute('aria-expanded','false');input.placeholder=sel.getAttribute('data-search-placeholder')||'Escribe nombre, RUT, SKU o descripción…';input.value=smartSelectLabel(sel);
  const menu=document.createElement('div');menu.className='smart-select-menu';menu.setAttribute('role','listbox');
  sel.parentNode.insertBefore(wrap,sel);wrap.append(input,menu);wrap.appendChild(sel);sel.style.display='none';
  const paint=(focusInput=false)=>{
   const q=input.value.trim();
   const matches=opts.filter(o=>smartMatch(smartOptionSearchText(sel,o),q));
   menu.innerHTML=matches.length?matches.map(o=>`<button type="button" class="smart-select-option ${String(o.value)===String(sel.value)?'active':''}" data-value="${esc(o.value)}">${esc(o.textContent.trim())}</button>`).join(''):'<div class="smart-select-empty">Sin coincidencias.</div>';
   wrap.classList.add('open');input.setAttribute('aria-expanded','true');if(focusInput)input.focus();
  };
  input.addEventListener('focus',()=>{input.select();paint(true)});input.addEventListener('click',()=>{paint(true)});
  input.addEventListener('input',()=>paint(false));
  input.addEventListener('keydown',e=>{if(e.key==='Escape'){wrap.classList.remove('open');input.setAttribute('aria-expanded','false')}if(e.key==='Enter'){const first=menu.querySelector('.smart-select-option');if(first){e.preventDefault();first.click()}}});
  menu.addEventListener('mousedown',e=>e.preventDefault());
  menu.addEventListener('click',e=>{const b=e.target.closest('.smart-select-option');if(!b)return;sel.value=b.dataset.value;input.value=smartSelectLabel(sel);wrap.classList.remove('open');input.setAttribute('aria-expanded','false');sel.dispatchEvent(new Event('change',{bubbles:true}));});
  sel.addEventListener('change',()=>{input.value=smartSelectLabel(sel)});
  paint(false);wrap.classList.remove('open');input.setAttribute('aria-expanded','false');
 });
}
function closeSmartSelects(e){document.querySelectorAll('.smart-select.open').forEach(w=>{if(!w.contains(e.target))w.classList.remove('open')})}
function workflowHint(title,body='',foot=''){const t=String(title||'').toLowerCase();if(/cotizaci[oó]n/.test(t))return 'Revisa los productos y totales → guarda → visualiza el documento → envía al cliente → registra aceptación y convierte a pedido.';if(/empresa/.test(t))return 'Guarda la empresa → registra contacto/obra si corresponde → continúa con una cotización.';if(/contacto/.test(t))return 'Guarda el contacto → registra seguimiento → continúa con la obra o cotización asociada.';if(/obra/.test(t))return 'Guarda la obra → asóciala al cliente → continúa con la cotización.';if(/producto/.test(t))return 'Guarda el producto → queda disponible en el maestro → úsalo en cotizaciones o solicitudes.';if(/oferta|comparador|adjudic/.test(t))return 'Analiza → revisa Neto/Bruto → guarda → compara → adjudica → genera la OC.';if(/orden de compra|oc/.test(t))return 'Guarda → revisa → emite → controla recepción → registra documentos y pago.';if(/captura|archivo|adjunt/.test(t))return 'Adjunta → procesa → revisa la información → guarda los vínculos → continúa con el documento o cotización.';if(/factura|boleta|gu[ií]a|nota de cr[eé]dito/.test(t))return 'Completa → guarda/emite → adjunta respaldo → registra el pago o la siguiente operación.';return 'Completa la información → guarda → revisa el registro → continúa con la siguiente etapa.'}

function productMarginFromValues(cost,price){cost=num(cost);price=num(price);return price>0?((price-cost)/price*100):0}
function productPriceFromMargin(cost,margin){cost=num(cost);margin=num(margin);if(cost<=0)return 0;if(margin>=100)return cost;if(margin<0)return cost*(1-margin/100);return cost/(1-margin/100)}

function selectedSuppliers(r){

function rfqItemsForSupplier(r,supplierId){

function parseOfferText(text,r){const lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);return lines.map(line=>{const lower=line.toLowerCase();let idx=-1;(r.items||[]).some((it,i)=>{const keys=[it.sku,it.nombre].filter(Boolean).map(k=>String(k).toLowerCase());if(keys.some(k=>k&&lower.includes(k))){idx=i;return true}return false});const nums=[...line.matchAll(/(?:\$|clp\s*)?\s*([0-9]{1,3}(?:[.][0-9]{3})+(?:[,][0-9]+)?|[0-9]+(?:[,][0-9]+)?)/gi)].map(m=>num(String(m[1]).replace(/\./g,'').replace(',','.')));const price=nums.length?nums[nums.length-1]:0;const stockM=lower.match(/(?:stock|disponib(?:le|ilidad)|disp)\s*[:=]?\s*([0-9]+)/i);const leadM=lower.match(/([0-9]+)\s*(?:d[ií]as?|hrs?|horas?)/i);return {line,idx,precio:price,stock:stockM?stockM[1]:'',plazo:leadM?leadM[1]+' días':'',match:idx>=0}})}

function masterMatchLine(line){const q=String(line||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let best=null,score=0;(DATA.products||[]).forEach(p=>{const fields=[p.sku,p.codigo,p.nombre,p.familia,p.subfamilia].filter(Boolean).map(x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let sc=0;fields.forEach((f,i)=>{if(f&&q.includes(f))sc+=i<2?10:4});const nums=(String(p.nombre||'').match(/\d+(?:[.,]\d+)?/g)||[]);const qnums=(String(line||'').match(/\d+(?:[.,]\d+)?/g)||[]);sc+=qnums.filter(n=>nums.includes(n)).length*2;if(sc>score){score=sc;best=p}});return {product:best,score}}

async function readInboundFile(file){const meta={name:file.name,type:file.type||'',size:file.size,processed:'adjunto'};try{if(/\.csv$/i.test(file.name)||/excel|spreadsheet/.test(file.type)){if(!window.XLSX)await loadExternalScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',()=>!!window.XLSX);const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const text=wb.SheetNames.map(n=>`HOJA: ${n}\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');return {text,meta:{...meta,processed:'Excel/CSV'}}}if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(!window.pdfjsLib)await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>!!window.pdfjsLib);const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();text+=`\nPÁGINA ${i}\n`+c.items.map(x=>x.str).join(' ')}return {text,meta:{...meta,processed:`PDF · ${pdf.numPages} pág.`}}}if(file.type.startsWith('image/')){if(!window.Tesseract)await loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>!!window.Tesseract);const o=await Tesseract.recognize(file,'spa');return {text:o?.data?.text||'',meta:{...meta,processed:'Imagen · OCR'}}}if(file.type.startsWith('text/'))return {text:await file.text(),meta:{...meta,processed:'Texto'}};return {text:'',meta}}catch(e){return {text:'',meta:{...meta,error:e.message||'No se pudo procesar'}}}}
async function readInboundFiles(inputId,previewId,existingText=''){const files=[...(document.getElementById(inputId)?.files||[])],out=[],meta=[];for(const f of files){const id=uid('att');const r=await readInboundFile(f);await saveAttachmentBlob(id,f);if(r.text)out.push(`[ARCHIVO: ${f.name}]\n${r.text}`);meta.push({...r.meta,id,downloadName:f.name})}const el=document.getElementById(previewId);if(el)el.innerHTML=meta.map(m=>`<div class="capture-file"><span> ${esc(m.name)}</span><small>${esc(m.processed||'adjunto')}${m.error?' · '+esc(m.error):''}</small></div>`).join('');return {text:[existingText,...out].filter(Boolean).join('\n\n'),attachments:meta}}
function customerParsed(text){const raw=String(text||'').split(/\r?\n|;+/).map(x=>x.trim()).filter(Boolean),map=new Map(),un=[];raw.forEach(line=>{const m=masterMatchLine(line),qm=line.match(/(?:cantidad|cant|qty|x)\s*[:=]?\s*([0-9]+(?:[.,][0-9]+)?)/i),qty=qm?num(qm[1]):1;if(m.product&&m.score>=3){const k=m.product.id;if(map.has(k)){map.get(k).cantidad+=qty;map.get(k).origen+=' | '+line}else map.set(k,{line,origen:line,product:m.product,score:m.score,cantidad:qty})}else un.push({line,origen:line,product:null,score:m.score,cantidad:qty})});return [...map.values(),...un]}

function adjudicateRfq(id){const r=DATA.rfqs.find(x=>x.id===id);if(!r)return toast('Solicitud no encontrada.');const rec=(r.items||[]).map((it,idx)=>({it,idx,os:(r.offers||[]).filter(o=>o.itemIndex===idx&&num(o.precio)>0)}));if(!rec.some(x=>x.os.length))return toast('Registra al menos una oferta para adjudicar.');const body=`<div class="notice"><b>Adjudicación inteligente</b><br>Compara por <b>costo neto comparable</b> y agrega variables de viabilidad. Puedes modificar manualmente cada elección antes de generar las OC.</div><div class="form-grid"><div class="field"><label>Peso precio (%)</label><input id="aw-price" type="number" min="0" max="100" value="60"></div><div class="field"><label>Peso stock (%)</label><input id="aw-stock" type="number" min="0" max="100" value="20"></div><div class="field"><label>Peso plazo (%)</label><input id="aw-lead" type="number" min="0" max="100" value="15"></div><div class="field"><label>Peso pago (%)</label><input id="aw-pay" type="number" min="0" max="100" value="5"></div><div class="field"><label>Flete global estimado</label><input id="aw-freight" type="number" min="0" value="0"></div><div class="field"><label>Tolerancia precio (%)</label><input id="aw-tol" type="number" min="0" value="10"></div></div><div id="award-results"></div>`;openModal(`Adjudicar · ${esc(r.folio)}`,body,'<button class="btn" data-close>Cerrar</button><button class="btn btn-primary" id="aw-save">Guardar adjudicación y generar OC</button>');const paint=()=>{let wp=num(val('aw-price')),ws=num(val('aw-stock')),wl=num(val('aw-lead')),wpa=num(val('aw-pay'));const totalW=wp+ws+wl+wpa||1;wp/=totalW;ws/=totalW;wl/=totalW;wpa/=totalW;const blocks=rec.map(({it,idx,os})=>{if(!os.length)return `<div class="award-card"><b>${esc(it.nombre)}</b><div class="notice">Sin oferta.</div></div>`;const prices=os.map(o=>offerNet(o)),maxP=Math.max(...prices),minP=Math.min(...prices),stocks=os.map(o=>stockRank(o.stock)),maxS=Math.max(...stocks,1),leads=os.map(o=>leadDays(o.plazo)),maxL=Math.max(...leads.filter(x=>x<9999),1),payScore=o=>/30|45|60|90/.test(String(o.condicion||''))?1:.5;const scored=os.map(o=>{const ps=minP===maxP?1:(maxP-offerNet(o))/(maxP-minP);const ss=stockRank(o.stock)/maxS;const ld=leadDays(o.plazo);const ls=ld>=9999?0:(maxL-ld)/maxL;return {o,score:ps*wp+ss*ws+ls*wl+payScore(o)*wpa}}).sort((a,b)=>b.score-a.score);const best=scored[0];return `<div class="award-card ${best?'award-best':''}"><b>${esc(it.sku&&it.sku!=='MANUAL'?skuDisplay(it.sku):'MANUAL')} · ${esc(it.nombre)}</b><div class="cmp-muted">Cantidad: ${fmtNum(it.cantidad)} ${esc(it.unidad||'UN')}</div><div class="award-actions">${scored.map((z,n)=>`<label class="list-item" style="display:flex;gap:8px;align-items:center"><input type="radio" name="award-${idx}" value="${esc(z.o.id)}" ${n===0?'checked':''}><span><b>${esc(DATA.suppliers.find(s=>s.id===z.o.supplierId)?.nombre||z.o.supplierName||'—')}</b><br>Neto ${money(offerNet(z.o))} · Stock ${esc(z.o.stock||'—')} · Plazo ${esc(z.o.plazo||'—')} · Puntaje ${Math.round(z.score*100)}</span></label>`).join('')}</div></div>`}).join('');document.getElementById('award-results').innerHTML=`<div class="award-grid">${blocks}</div>`};['aw-price','aw-stock','aw-lead','aw-pay','aw-freight','aw-tol'].forEach(id=>document.getElementById(id)?.addEventListener('input',paint));document.getElementById('aw-save').addEventListener('click',()=>{const picks=[...document.querySelectorAll('input[name^="award-"]:checked')].map(x=>r.offers.find(o=>o.id===x.value)).filter(Boolean);if(!picks.length)return toast('No hay alternativas seleccionadas.');const freight=num(val('aw-freight'));r.adjudicacion={fecha:new Date().toISOString(),criterios:{precio:num(val('aw-price')),stock:num(val('aw-stock')),plazo:num(val('aw-lead')),pago:num(val('aw-pay')),tolerancia:num(val('aw-tol'))},fleteEstimado:freight,selecciones:picks.map(o=>({offerId:o.id,itemIndex:o.itemIndex,supplierId:o.supplierId,neto:offerNet(o)}))};r.estado='adjudicada';save();closeModal();render( function compareRfq(id){const r=DATA.rfqs.find(x=>x.id===id);if(!r)return;const rec=(r.items||[]).map((it,idx)=>({it,idx,os:(r.offers||[]).filter(o=>o.itemIndex===idx&&num(o.precio)>0)}));const shell=`<div class="notice"><b>Comparador de ofertas</b><br>Todos los precios se convierten a <b>Neto comparable</b> usando el IVA configurado (${num(DATA.settings.ivaRate)||19}%). Se conserva además el precio original Neto/Bruto. Stock, plazo y pago se consideran como variables de viabilidad.</div><div class="cmp-toolbar"><div class="field"><label>Criterio</label><select id="cmp-criterion"><option value="precio">Menor precio neto</option><option value="viable">Mejor equilibrio</option><option value="stock">Mayor stock</option><option value="plazo">Menor plazo</option></select></div><div class="field"><label>Tolerancia sobre mejor precio (%)</label><input id="cmp-tolerance" type="number" value="10" min="0" step="1"></div></div><div id="cmp-summary" class="cmp-summary"></div><div id="cmp-results"></div><div class="notice">Puedes cambiar manualmente la alternativa seleccionada por cada línea. La adjudicación puede generar una o varias OC, una por proveedor.</div>`;openModal(`Comparador · ${esc(r.folio)}`,shell,`<button class="btn" data-close>Cerrar</button><button class="btn btn-secondary" data-action="applyRfqPrices" data-id="${id}">${icon('box',15)} Aplicar precios a productos</button><button class="btn btn-primary" id="cmp-create-po">Crear OC con selección</button>`);const paint=()=>{const criterion=val('cmp-criterion')||'precio',tol=num(val('cmp-tolerance')),el=document.getElementById('cmp-results'),sum=document.getElementById('cmp-summary');if(!el)return;let selectedTotal=0,cheapestTotal=0,covered=0;const blocks=rec.map(({it,idx,os})=>{const ranked=[...os].sort((a,b)=>{const pa=offerNet(a),pb=offerNet(b);if(criterion==='precio')return pa-pb;if(criterion==='stock')return stockRank(b.stock)-stockRank(a.stock)||pa-pb;if(criterion==='plazo')return leadDays(a.plazo)-leadDays(b.plazo)||pa-pb;return rfqScore(b,'viable')-rfqScore(a,'viable')});const best=ranked[0];if(best){cheapestTotal+=offerNet(best)*(num(it.cantidad)||1);covered++;}const rows=ranked.map((o,n)=>{const sup=DATA.suppliers.find(x=>x.id===o.supplierId);const near=best&&offerNet(o)<=offerNet(best)*(1+tol/100);return `<tr><td><label style="display:flex;gap:6px;align-items:center"><input type="radio" name="cmp-pick-${idx}" value="${esc(o.id)}" ${best&&o.id===best.id?'checked':''}> ${esc(sup?.nombre||o.supplierName||'—')}</label></td><td><b>${money(o.precio)}</b><br><span class="cmp-muted ${offerBasisLabel(o)==='Neto'?'price-net':'price-gross'}">${offerBasisLabel(o)}</span></td><td><b>${money(offerNet(o))}</b></td><td>${money(offerGross(o))}</td><td>${esc(o.stock||'—')}</td><td>${esc(o.plazo||'—')}</td><td>${esc(o.validez||'—')}</td><td>${o.precioKg?money(o.precioKg):'—'}</td><td>${esc(o.modalidadEntrega||'—')}</td><td>${esc(o.condicion||'—')}</td><td>${criterion==='precio'?(near?'✓ Dentro de tolerancia':'Fuera de tolerancia'):criterion==='viable'?''+String(Math.round(rfqScore(o,'viable'))):criterion==='stock'?fmtNum(stockRank(o.stock)):leadDays(o.plazo)>=9999?'—':fmtNum(leadDays(o.plazo))+' d'}</td></tr>`}).join('');return `<div class="cmp-card ${best?'cmp-best':''}"><b>${esc(it.sku&&it.sku!=='MANUAL'?skuDisplay(it.sku):'MANUAL')} · ${esc(it.nombre)}</b><div class="cmp-muted">Cantidad: ${fmtNum(it.cantidad)} ${esc(it.unidad||'UN')}</div>${best?`<div class="notice" style="margin-top:8px">Recomendado: <b>${esc(DATA.suppliers.find(x=>x.id===best.supplierId)?.nombre||best.supplierName||'—')}</b> · Neto ${money(offerNet(best))} · ${esc(best.plazo||'plazo no informado')} · ${esc(best.stock||'stock no informado')}</div>`:''}${rows?rowsTable(['Proveedor','Recibido','Neto comp.','Bruto calc.','Stock','Plazo','Vigencia','$/kg','Entrega','Pago','Evaluación'],rows):empty('Sin ofertas para este producto.')}</div>`}).join('');const checked=document.querySelectorAll('input[name^="cmp-pick-"]:checked');checked.forEach(x=>{const o=r.offers.find(y=>y.id===x.value);const idx=Number(x.name.replace('cmp-pick-',''));selectedTotal+=offerNet(o)*(num(r.items[idx]?.cantidad)||1)});if(sum)sum.innerHTML=`<div class="kpi"><small>Líneas comparables</small><b>${covered}/${rec.length}</b></div><div class="kpi"><small>Total mejor precio</small><b>${money(cheapestTotal)}</b></div><div class="kpi"><small>Total selección actual</small><b>${money(selectedTotal)}</b></div><div class="kpi"><small>Diferencia</small><b>${money(selectedTotal-cheapestTotal)}</b></div>`;el.innerHTML=blocks};document.getElementById('cmp-criterion').addEventListener('change',paint);document.getElementById('cmp-tolerance').addEventListener('input',paint);document.getElementById('cmp-create-po').addEventListener('click',()=>createPOFromRfq(id));paint();document.getElementById('cmp-results')?.addEventListener('change',e=>{if(e.target.matches('input[type=radio][name^="cmp-pick-"]')){let t=0;document.querySelectorAll('input[name^="cmp-pick-"]:checked').forEach(x=>{const o=r.offers.find(y=>y.id===x.value),idx=Number(x.name.replace('cmp-pick-',''));t+=offerNet(o)*(num(r.items[idx]?.cantidad)||1)});const sum=document.getElementById('cmp-summary');if(sum){const b=sum.querySelectorAll('.kpi')[2]?.querySelector('b');if(b)b.textContent=money(t);const d=sum.querySelectorAll('.kpi')[3]?.querySelector('b');if(d){let cheapest=0;rec.forEach(({it,os})=>{const best=[...os].sort((a,b)=>offerNet(a)-offerNet(b))[0];if(best)cheapest+=offerNet(best)*(num(it.cantidad)||1)});d.textContent=money(t-cheapest)}}}})}
function applyRfqPricesToProducts(id){
 const r=DATA.rfqs.find(x=>x.id===id);if(!r)return;
 const updates=[];
 (r.items||[]).forEach((it,idx)=>{
  const rid=document.querySelector(`input[name="cmp-pick-${idx}"]:checked`)?.value;
  if(!rid)return;
  const o=(r.offers||[]).find(x=>x.id===rid);
  if(!o)return;
  let p=it.productId?DATA.products.find(x=>x.id===it.productId):null;
  if(!p&&it.sku&&it.sku!=='MANUAL')p=DATA.products.find(x=>x.sku===it.sku||x.codigo===it.sku);
  if(!p)return;
  const nuevoCosto=Math.round(offerNet(o));
  const costoAnterior=num(p.costo);
  const supplierName=DATA.suppliers.find(s=>s.id===o.supplierId)?.nombre||o.supplierName||'—';
  p.costo=nuevoCosto;
  p.proveedorId=o.supplierId||p.proveedorId;
  p.ultimaCompra={fecha:new Date().toISOString(),costo:nuevoCosto,proveedor:supplierName,origenRfq:r.folio};
  updates.push({producto:p.nombre,anterior:costoAnterior,nuevo:nuevoCosto,proveedor:supplierName});
 });
 if(!updates.length)return toast('Selecciona al menos una alternativa con producto asociado en el maestro.');
 save();
 const rows=updates.map(u=>`<tr><td>${esc(u.producto)}</td><td>${money(u.anterior)}</td><td><b>${money(u.nuevo)}</b></td><td>${esc(u.proveedor)}</td></tr>`).join('');
 openModal('Costos actualizados',`<div class="notice"><b>${updates.length} producto(s) actualizado(s)</b> con el precio elegido en el comparador. Ya puedes generar una cotización a cliente usando estos costos.</div>${rowsTable(['Producto','Costo anterior','Costo nuevo','Proveedor'],rows)}`,'<button class="btn" data-close>Cerrar</button><button class="btn btn-primary" data-action="quickQuote">+ Crear cotización a cliente</button>');
}
function createPOFromRfq(id){const r=DATA.rfqs.find(x=>x.id===id);if(!r)return;const selected=[];(r.items||[]).forEach((it,idx)=>{const rid=document.querySelector(`input[name="cmp-pick-${idx}"]:checked`)?.value;if(rid){const o=(r.offers||[]).find(x=>x.id===rid);if(o)selected.push({productId:it.productId||null,sku:it.sku||o.sku||'',nombre:it.nombre,cantidad:num(it.cantidad)||1,precio:offerNet(o),precioNeto:offerNet(o),precioBruto:offerGross(o),base:'neto',precioRecibido:num(o.precio),baseRecibida:offerBasisLabel(o),subtotal:(num(it.cantidad)||1)*offerNet(o),subtotalNeto:(num(it.cantidad)||1)*offerNet(o),supplierId:o.supplierId})}});if(!selected.length)return toast('Selecciona al menos una alternativa.');const groups={};selected.forEach(x=>(groups[x.supplierId]??=[]).push(x));const ids=Object.keys(groups);if(ids.length===1){closeModal();openPOFromRfq(r,ids[0],groups[ids[0]]);return}openModal('Seleccionar proveedor para la OC',`<div class="notice">Has seleccionado alternativas de más de un proveedor. Una OC debe quedar asociada a un solo proveedor.</div>${ids.map(id=>{const s=DATA.suppliers.find(x=>x.id===id),lines=groups[id];return `<div class="rfq-supplier-card"><b>${esc(s?.nombre||'Proveedor')}</b><div class="mini">${lines.length} línea(s) · ${money(lines.reduce((a,x)=>a+x.subtotal,0))}</div><button class="btn btn-primary" data-po-rfq-supplier="${id}">Crear OC con este proveedor</button></div>`}).join('')}`,'<button class="btn" data-close>Cancelar</button>');document.querySelectorAll('[data-po-rfq-supplier]').forEach(b=>b.addEventListener('click',()=>{const sid=b.dataset.poRfqSupplier;closeModal();openPOFromRfq(r,sid,groups[sid])}))}
function openPOFromRfq(r,supplierId,items){const body=`<div class="notice"><b>Origen:</b> ${esc(r.folio)} · proveedor seleccionado: ${esc(DATA.suppliers.find(s=>s.id===supplierId)?.nombre||'')}</div><div class="table-wrap">${rowsTable(['SKU','Producto','Cantidad','Costo elegido','Subtotal'],items.map(x=>`<tr><td>${esc(skuDisplay(x.sku))}</td><td>${esc(x.nombre)}</td><td>${fmtNum(x.cantidad)}</td><td>${money(x.precio)}</td><td>${money(x.subtotal)}</td></tr>`).join(''))}</div><div class="notice">Puedes revisar y modificar la OC antes de guardarla.</div>`;openModal('Preparar OC desde comparador',body,'<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="rfq-po-confirm">Continuar a OC</button>');document.getElementById('rfq-po-confirm').addEventListener('click',()=>{closeModal();openPOFromItems(items,supplierId,r.id)})}
function openPOFromItems(items,supplierId,sourceRfqId){const mapped=items.map(x=>({...x}));const options=sortedProducts().map(p=>`<option value="${p.id}">${esc(skuDisplay(p.sku||p.codigo))} · ${esc(p.nombre)}</option>`).join('');let lines=mapped;const renderLines=()=>{const el=document.getElementById('po-lines');if(!el)return;el.innerHTML=lines.map((x,i)=>`<div class="line-row"><div class="line-main"><b>${esc(skuDisplay(x.sku))}</b><span>${esc(x.nombre)}</span></div><input class="line-qty" data-i="${i}" type="number" min="0.01" step="0.01" value="${x.cantidad}"><input class="line-price" data-i="${i}" type="number" min="0" step="1" value="${x.precio}"><b>${money(x.cantidad*x.precio)}</b><button class="icon-btn" data-po-remove="${i}">${icon('trash',15)}</button></div>`).join('');document.getElementById('po-total').value=Math.round(lines.reduce((a,x)=>a+x.cantidad*x.precio,0));el.querySelectorAll('.line-qty,.line-price').forEach(inp=>inp.addEventListener('change',()=>{const i=+inp.dataset.i;lines[i].cantidad=num(el.querySelector(`.line-qty[data-i="${i}"]`).value);lines[i].precio=num(el.querySelector(`.line-price[data-i="${i}"]`).value);lines[i].subtotal=lines[i].cantidad*lines[i].precio;renderLines()}));el.querySelectorAll('[data-po-remove]').forEach(b=>b.addEventListener('click',()=>{lines.splice(+b.dataset.poRemove,1);renderLines()}))};const body=`<div class="form-grid"><div class="field"><label>Proveedor</label><select id="po-supplier"><option value="${esc(supplierId)}">${esc(DATA.suppliers.find(s=>s.id===supplierId)?.nombre||'')}</option></select></div><div class="field full"><label>Productos seleccionados del comparador</label><div id="po-lines" class="quote-lines"></div></div><div class="field"><label>Total</label><input id="po-total" readonly></div><div class="field full"><label>Notas</label><textarea id="po-notes">Origen RFQ ${esc(sourceRfqId)}</textarea></div></div>`;openModal('Crear OC desde comparación',body,'<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="po-save-rfq">Guardar OC</button>');document.getElementById('po-save-rfq').addEventListener('click',()=>{if(!lines.length)return toast('No hay líneas.');const folio=nextFolio(DATA.settings.folioPrefijoOC||'OC','nextPoFolio');DATA.purchaseOrders.push({id:uid('po'),folio,fecha:new Date().toISOString(),estado:'borrador',supplierId,items:clone(lines),total:Math.round(lines.reduce((a,x)=>a+num(x.subtotal??(x.cantidad*x.precio)),0)),notas:val('po-notes'),recibos:[],sourceRfqId});const rStatus=DATA.rfqs.find(x=>x.id===sourceRfqId);if(rStatus){rStatus.estado='adjudicada';rStatus.adjudicadaAt=new Date().toISOString();rStatus.selectedOffers=lines.map(x=>({sku:x.sku,productId:x.productId,supplierId,precio:x.precio}))}save();closeModal();render();toast(`${folio} creada desde comparación.`)});renderLines()}

function offerNet(o){const rate=(num(DATA.settings.ivaRate)||19)/100;const p=num(o.precio);if(!p)return 0;return String(o.base||o.precioBase||'').toLowerCase()==='bruto'?Math.round(p/(1+rate)):Math.round(p)}
function offerGross(o){const rate=(num(DATA.settings.ivaRate)||19)/100;const p=num(o.precio);if(!p)return 0;return String(o.base||o.precioBase||'').toLowerCase()==='bruto'?Math.round(p):Math.round(p*(1+rate))}
function offerBasisLabel(o){return String(o.base||o.precioBase||'').toLowerCase()==='bruto'?'Bruto':'Neto'}
function stockRank(v){const s=String(v||'').toLowerCase();const m=s.match(/\d+(?:[.,]\d+)?/);if(m)return Number(m[0].replace(',','.'));if(/sin|agot/.test(s))return 0;return 1}
function leadDays(v){const m=String(v||'').match(/\d+(?:[.,]\d+)?/);return m?Number(m[0].replace(',','.')):9999}
function rfqScore(o,criterion){const price=offerNet(o),stock=stockRank(o.stock),lead=leadDays(o.plazo);if(criterion==='precio')return price;if(criterion==='stock')return -stock;if(criterion==='plazo')return lead;return (price?100000000/price:0)+(stock*1000)+(lead<9999?100/(1+lead):0)}

function shareQuote(id){const q=DATA.quotes.find(x=>x.id===id);if(!q)return toast('Cotización no encontrada.');if(!navigator.share){toast('Tu navegador no admite compartir. Descarga el PDF y compártelo desde tu teléfono.');return}const doc=buildQuotePDF(q);if(!doc){toast('No se pudo preparar el PDF. Usa Imprimir y selecciona Guardar como PDF.');return}try{const blob=doc.output('blob');const file=new File([blob],docFileName('cotizacion',q.folio,DATA.companies.find(x=>x.id===q.companyId)),{type:'application/pdf'});if(navigator.canShare?.({files:[file]})){navigator.share({title:`LUMOBRAL ${q.folio}`,text:`Cotización ${q.folio} · Total ${money(q.total)}`,files:[file]}).catch(e=>{if(e?.name!=='AbortError')toast('No fue posible abrir el menú de compartir.')})}else{navigator.share({title:`LUMOBRAL ${q.folio}`,text:`Cotización ${q.folio} · Total ${money(q.total)}`}).catch(e=>{if(e?.name!=='AbortError')toast('No fue posible abrir el menú de compartir.')})}}catch(e){toast('No fue posible preparar el documento para compartir.')}}

 const renderLines=()=>{const sid=val('nc-source'),inv=(DATA.facturas||[]).find(x=>x.id===sid),el=document.getElementById('nc-lines');if(!el)return;if(!inv){el.innerHTML=empty('Selecciona una factura de origen para proponer líneas. También puedes registrar una NC manual sin líneas.');return;}el.innerHTML=rowsTable(['SKU','Producto','Original','Acreditar','Precio'],(inv.items||[]).map((it,i)=>`<tr><td>${esc(skuDisplay(it.sku))}</td><td>${esc(it.nombre||'')}</td><td>${fmtNum(it.cantidad)}</td><td><input class="nc-qty" data-i="${i}" type="number" min="0" max="${num(it.cantidad)}" step="0.001" value="${num(it.cantidad)}"></td><td>${money(it.precio)}</td></tr>`).join(''));};
 document.getElementById('nc-source')?.addEventListener('change',()=>{const inv=(DATA.facturas||[]).find(x=>x.id===val('nc-source'));if(inv){const c=document.getElementById('nc-client');if(c){c.value=inv.companyId;c.dispatchEvent(new Event('change'));}const r=document.getElementById('nc-ref');if(r)r.value=inv.folio;}renderLines();});

function managementMetrics(){
  ensureFinance();
  const qs=DATA.quotes||[], won=qs.filter(q=>['aceptada','convertida_pedido'].includes(q.estado));
  const sent=qs.filter(q=>q.estado==='enviada'), rejected=qs.filter(q=>q.estado==='rechazada');
  const sales=won.reduce((s,q)=>s+num(q.total),0), quoted=qs.reduce((s,q)=>s+num(q.total),0);
  const cost=won.reduce((s,q)=>s+(q.items||[]).reduce((a,it)=>a+num(it.costoUnit??it.costo)*num(it.cantidad),0),0);
  const freight=won.reduce((s,q)=>s+quoteDelivery(q).cost,0), gross=sales-cost-freight;
  const conversion=qs.length?won.length/qs.length*100:0;
  const avgTicket=won.length?sales/won.length:0;
  const orders=DATA.pedidos||[], delivered=orders.filter(o=>o.estado==='entregado'), dispatched=orders.filter(o=>o.estado==='despachado');
  return {qs,won,sent,rejected,sales,quoted,cost,freight,gross,conversion,avgTicket,orders,delivered,dispatched};
}

}

function importJSON(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text());const incoming=raw?.data&&typeof raw.data==='object'?raw.data:raw;if(!incoming||typeof incoming!=='object')throw new Error('Archivo JSON no válido.');if(!confirm('Esto reemplazará los datos actuales por el respaldo seleccionado. ¿Continuar?'))return;DATA=normalize(incoming);ensureCore();migrateLegacyData();save();render();toast('Respaldo JSON restaurado correctamente.')}catch(e){toast('No se pudo importar el respaldo: '+(e.message||'archivo inválido'))}};input.click();
}
function excelHeaders(rows){const set=new Set();(rows||[]).forEach(r=>Object.keys(r||{}).forEach(k=>set.add(k)));return [...set]}
function rowsFromData(rows,headers){return (rows||[]).map(r=>headers.map(h=>{const v=r?.[h];return v==null?'':Array.isArray(v)||typeof v==='object'?JSON.stringify(v):v}))}
function exportExcelMaster(){
 try{
  if(!window.XLSX){loadExternalScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',()=>!!window.XLSX).then(()=>exportExcelMaster()).catch(e=>toast('No se pudo cargar el motor Excel: '+e.message));return;}
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>{const clean=Array.isArray(rows)?rows:[];const h=excelHeaders(clean);const data=h.length?[h,...rowsFromData(clean,h)]:[['(sin registros)']];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),name.slice(0,31));};
  const map={PRODUCTOS:DATA.products,CLIENTES:DATA.companies,CONTACTOS:DATA.contacts,OBRAS:DATA.obras,PROVEEDORES:DATA.suppliers,COTIZACIONES:DATA.quotes,COTIZACION_ITEMS:(DATA.quotes||[]).flatMap(q=>(q.items||[]).map(it=>({...it,quoteId:it.quoteId||q.id}))),ACTIVIDADES:DATA.activities,SOLICITUDES:DATA.rfqs,PEDIDOS:DATA.pedidos,ORDENES_COMPRA:DATA.purchaseOrders,NECESIDADES_COMPRA:DATA.purchaseNeeds,OPORTUNIDADES:DATA.deals,FACTURAS:DATA.facturas,BOLETAS:DATA.boletas,GUIAS_DESPACHO:DATA.guiasDespacho,NOTAS_CREDITO:DATA.notasCredito,BANDEJA:DATA.inboxSolicitudes,USUARIOS:DATA.users,CUENTAS_BANCARIAS:DATA.bankAccounts,TESORERIA:DATA.tesoreria,ADJUDICACIONES:DATA.adjudications,ARCHIVOS:DATA.files,AUDITORIA:DATA.auditTrail};
  Object.entries(map).forEach(([name,rows])=>add(name,rows));
  const cfg=Object.entries(DATA.settings||{}).map(([campo,valor])=>[campo,typeof valor==='object'?JSON.stringify(valor):valor]);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['campo','valor'],...cfg]),'CONFIGURACION');
  const counters=['nextFolio','nextRfqFolio','nextPedidoFolio','nextPoFolio','nextFacturaFolio','nextBoletaFolio','nextGuiaFolio','nextNcFolio'].map(c=>[c,num(DATA[c])]);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['campo','valor'],...counters]),'CONTADORES');
  XLSX.writeFile(wb,`LUMOBRAL_MASTER_DATOS_EXPORT_${new Date().toISOString().slice(0,10)}.xlsx`);toast('Excel maestro completo exportado.');
 }catch(e){toast('No se pudo exportar Excel: '+(e.message||'error inesperado'))}
}
function importExcelMaster(){
 const input=document.createElement('input');input.type='file';input.accept='.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv';
 input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{
   if(!window.XLSX)await loadExternalScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',()=>!!window.XLSX);
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
   const sheetMap={
    'CLIENTES':'companies','EMPRESAS':'companies','CONTACTOS':'contacts','OBRAS':'obras','PRODUCTOS':'products','PROVEEDORES':'suppliers','COTIZACIONES':'quotes','ACTIVIDADES':'activities','SOLICITUDES':'rfqs','PEDIDOS':'pedidos','ORDENES_COMPRA':'purchaseOrders','NECESIDADES_COMPRA':'purchaseNeeds','OPORTUNIDADES':'deals','FACTURAS':'facturas','BOLETAS':'boletas','GUIAS_DESPACHO':'guiasDespacho','NOTAS_CREDITO':'notasCredito','BANDEJA':'inboxSolicitudes','USUARIOS':'users','CUENTAS_BANCARIAS':'bankAccounts','TESORERIA':'tesoreria','ADJUDICACIONES':'adjudications','ARCHIVOS':'files','AUDITORIA':'auditTrail'
   };
   const normalizeName=x=>String(x||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Ñ/g,'N').replace(/\s+/g,'_');
   const sheetByKey={};wb.SheetNames.forEach(n=>sheetByKey[normalizeName(n)]=n);
   const readRows=sheet=>XLSX.utils.sheet_to_json(wb.Sheets[sheet],{defval:'',raw:true});
   const clean=v=>v==null?'':typeof v==='string'?v.trim():v;
   const ensureIds=(rows,prefix)=>rows.map(r=>{const x={};Object.keys(r||{}).forEach(k=>x[k]=clean(r[k]));if(!x.id)x.id=uid(prefix);return x});
   const counts=[],incoming={};
   Object.entries(sheetMap).forEach(([logical,key])=>{const sheet=sheetByKey[logical];if(!sheet)return;const rows=readRows(sheet);const nonempty=rows.filter(r=>Object.values(r||{}).some(v=>v!==''&&v!=null));if(!nonempty.length)return;incoming[key]=ensureIds(nonempty,key==='companies'?'cli':key==='contacts'?'con':key==='products'?'prod':key==='suppliers'?'sup':'row');counts.push([logical,key,nonempty.length]);});
   if(incoming.products){
     incoming.products=incoming.products.map(p=>{const raw=String(p.sku||p.codigo||'').trim().toUpperCase().replace(/^LB-/i,'');const sp=skuParts(raw);p.sku=raw;p.codigo=raw;p.codigoFamilia=(String(p.codigoFamilia||sp?.family||'').toUpperCase());p.codigoCategoria=(String(p.codigoCategoria||sp?.category||'').toUpperCase());p.familia=String(p.familia||LUMO_TAXONOMY[p.codigoFamilia]?.name||'').trim();p.categoria=String(p.categoria||LUMO_TAXONOMY[p.codigoFamilia]?.cats?.[p.codigoCategoria]||'').trim();p.nombre=String(p.nombre||p.producto||p.descripcion||'').trim();p.unidad=String(p.unidad||'UN').trim();p.costo=num(p.costo);p.precioVenta=num(p.precioVenta);p.margenPct=productMarginFromValues(p.costo,p.precioVenta);delete p.stock;delete p.stockMinimo;delete p.movimientosStock;return p});
     const seen=new Set(),bad=[];for(const p of incoming.products){const sp=skuParts(p.sku);if(!p.nombre||!skuValid(p.sku)||!sp||!LUMO_TAXONOMY[sp.family]?.cats?.[sp.category]||p.codigoFamilia!==sp.family||p.codigoCategoria!==sp.category)bad.push(p.sku||p.nombre);const k=String(p.sku||'').toUpperCase();if(k&&seen.has(k))bad.push(k);seen.add(k)}if(bad.length)throw new Error(`Excel rechazado: ${bad.length} inconsistencia(s) en PRODUCTOS/SKU. No se modificaron datos.`);
   }
   const cfgSheet=sheetByKey['CONFIGURACION'];if(cfgSheet){const cfgRows=readRows(cfgSheet);const cfg={...DATA.settings};cfgRows.forEach(r=>{const k=clean(r.campo||r.CAMPO);if(k)cfg[k]=clean(r.valor??r.VALOR)});if(cfg.ivaRate!==undefined)cfg.ivaRate=num(cfg.ivaRate)||19;incoming.__settings=cfg;counts.push(['CONFIGURACION','settings',cfgRows.length]);}
   const counterSheet=sheetByKey['CONTADORES'];if(counterSheet){const c={};readRows(counterSheet).forEach(r=>{const k=clean(r.campo||r.CAMPO);if(k)c[k]=num(r.valor??r.VALOR)});incoming.__counters=c;counts.push(['CONTADORES','counters',Object.keys(c).length]);}
   const itemSheet=sheetByKey['COTIZACION_ITEMS'];if(itemSheet){const items=readRows(itemSheet).filter(r=>Object.values(r||{}).some(v=>v!==''&&v!=null));if(items.length){incoming.__quoteItems=items;counts.push(['COTIZACION_ITEMS','quoteItems',items.length]);}}
   if(!counts.length)throw new Error('El archivo no contiene hojas de datos reconocibles con registros.');
   const summary=counts.map(x=>`${x[0]}: ${x[2]}`).join('\n');
   if(!confirm(`Datos encontrados para importar:\n\n${summary}\n\nLas hojas con registros reemplazarán sus respectivos módulos. Las hojas vacías o ausentes NO modificarán los datos actuales. ¿Continuar?`))return;
   const candidate=clone(DATA);
   Object.entries(incoming).forEach(([key,rows])=>{if(key.startsWith('__'))return;candidate[key]=rows});
   if(incoming.__settings)candidate.settings=incoming.__settings;
   if(incoming.__counters)Object.assign(candidate,incoming.__counters);
   if(incoming.__quoteItems){const byQuote={};incoming.__quoteItems.forEach(it=>{const qid=it.quoteId||it.cotizacionId||it.quoteID;if(qid)(byQuote[qid]??=[]).push(it)});(candidate.quotes||[]).forEach(q=>{const rows=byQuote[q.id]||byQuote[q.folio];if(rows)q.items=rows});}
   DATA=normalize(candidate);ensureCore();ensureDataModules();migrateLegacyData();save();render();
   toast(`Importación completa: ${counts.reduce((s,x)=>s+x[2],0)} registros en ${counts.length} hojas.`);
 }catch(e){console.error('LUMO360 Excel import',e);toast('No se pudo importar el Excel: '+(e.message||'archivo inválido'))}};input.click();
}

function dashboardView(){const qs=DATA.quotes||[],won=qs.filter(q=>['aceptada','convertida_pedido'].includes(q.estado)),open=qs.filter(q=>!['aceptada','rechazada','convertida_pedido'].includes(q.estado)),pipeline=qs.filter(q=>q.estado==='enviada').reduce((s,q)=>s+num(q.total),0),receiving=(DATA.purchaseOrders||[]).filter(o=>o.estado==='recibiendo'||o.estado==='parcial').length,sales=won.reduce((s,q)=>s+num(q.total),0),activeOrders=(DATA.pedidos||[]).filter(o=>!['entregado','cancelado'].includes(o.estado)).length,nc=(DATA.notasCredito||[]).length;return head('Inicio','Centro ejecutivo · visión comercial, abastecimiento, operación y finanzas',`<button class="btn" data-action="executiveReport">${icon('chart',15)} Resumen ejecutivo</button><button class="btn btn-primary" data-action="quickQuote">${icon('plus',15)} Nueva cotización</button>`)+`<div class="bento-row"><div class="card hero-kpi"><div class="hero-kpi-top"><div><small style="font-weight:800;color:var(--muted)">VENTA GANADA</small><b class="hero-num">${money(sales)}</b><span class="muted">${won.length} operaciones cerradas</span></div><span class="badge ok">● En control</span></div><div class="hero-spark">${svgLineChart(buildMonthlySales(qs),{width:620,height:92})}</div><div class="mini-kpi-row" style="margin-top:10px"><div class="mini-kpi"><div class="kpi-ico">${icon('funnel')}</div><div><small>Pipeline enviado</small><b>${money(pipeline)}</b></div></div><div class="mini-kpi"><div class="kpi-ico">${icon('cart')}</div><div><small>Pedidos activos</small><b>${activeOrders}</b></div></div><div class="mini-kpi"><div class="kpi-ico">${icon('wallet')}</div><div><small>Por cobrar</small><b>${money(financeMetrics().saldoCobrar)}</b></div></div></div></div><div class="card donut-card"><div style="width:100%;display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin:0">Pipeline comercial</h3><div class="muted mini">Valor acumulado por etapa</div></div><span class="badge">${open.length} abiertas</span></div>${(()=>{const stages=[['prospecto','var(--blue)'],['contactado','var(--purple)'],['cotizada','var(--gold)'],['negociacion','var(--orange)'],['aceptada','var(--success)']];const segs=stages.map(([k,c])=>({value:qs.filter(q=>q.estado===k).reduce((s,q)=>s+num(q.total),0),color:c,label:k}));return segs.some(s=>s.value>0)?svgDonutChart(segs,145):`<div class="dashboard-empty-chart"><div class="empty-ring"></div><b>Sin oportunidades valorizadas</b><span class="muted mini">El pipeline aparecerá aquí al registrar cotizaciones.</span></div>`;})()}<div class="muted mini" style="text-align:center">Seguimiento comercial en tiempo real</div></div></div><div class="split" style="margin-top:13px"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><h3 style="margin:0">Centro de mando</h3><div class="muted mini">Accesos rápidos al flujo principal</div></div></div><div class="quick-tiles"><button class="quick-tile" data-nav="quotes"><span class="ico">${icon('file')}</span><b>Comercial</b><span class="muted mini">Cotizaciones y pedidos</span></button><button class="quick-tile" data-nav="purchaseOrders"><span class="ico">${icon('cart')}</span><b>Abastecimiento</b><span class="muted mini">Solicitudes y OC</span></button><button class="quick-tile" data-nav="documentos"><span class="ico">${icon('folder')}</span><b>Documentos</b><span class="muted mini">Facturas, guías y NC</span></button><button class="quick-tile" data-nav="finanzas"><span class="ico">${icon('wallet')}</span><b>Finanzas</b><span class="muted mini">Cobros y pagos</span></button><button class="quick-tile" data-nav="control"><span class="ico">${icon('gauge')}</span><b>Control</b><span class="muted mini">Margen y desempeño</span></button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><h3 style="margin:0">Alertas operativas</h3><div class="muted mini">Lo que requiere at ensureCore();

migrateLegacyData();
if(DATA.settings?.uiTheme==='dark')document.body.classList.add('dark');

window.LUMO360={version:APP_VERSION,get data(){return DATA},navigate,render,openQuote,openEntity,save,exportJSON,importJSON,importExcelMaster,exportExcelMaster};
